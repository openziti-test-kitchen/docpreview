    return;
  }
  delete sel.dataset.pending;

  if (sel.dataset.sig !== sig) {
    sel.dataset.sig = sig;
    sel.innerHTML = g.list.map(p =>
      `<option value="${esc(p.preview_id)}">` +
      `${esc(p.branch)} · #${p.number} · ${esc(state(p.state).label)} · ${ago(p.updated_at)} ago` +
      `</option>`).join("");
  }
  sel.value = g.current.preview_id;
  sel.disabled = g.list.length < 2;
}

function clearFilters() {
  ui.state = null; ui.project = ""; ui.query = "";
  document.getElementById("search").value = "";
  render();
}

/* ── Log ──────────────────────────────────────────────────────────────── */

const term = () => document.querySelector(".item.open .term");

// banner labels the log pane: what you are looking at, and whether it is moving.
function banner(kind, text) {
  ui.banner = {kind, text};
  const el = document.querySelector(".item.open .logstate");
  if (el) {
    el.className = "logstate " + kind;
    el.textContent = text;
  }
}

// explainEmptyPane puts the reason there is nothing to read where the log would be.
//
// The alternative, which is what this replaces, is a banner in 0.72rem grey above an
// empty black terminal — and for a skipped build that is every signal except the useful
// one. The daemon already knows why it skipped; it tells the pull request. This shows the
// same sentence to whoever is looking at the dashboard instead.
//
// Also called for a log retention pruned, which is a different fact and says so: the
// build happened, its output is simply not kept any more.
function explainEmptyPane(previewID, commit, kind) {
  const t = term();
  if (!t) return;

  // The reason travels on the activity entry for that commit, and on the preview row
  // for its newest build. Prefer the entry: it is the one the reader clicked.
  const ev = (ui.events || []).find(e =>
    e.preview_id === previewID && e.commit === commit && e.message);
  const p = (ui.previews || []).find(x => x.preview_id === previewID);
  const why = ev?.message || (p && p.commit === commit ? p.reason : "") || "";

  const heads = {
    skipped: "This build was skipped, so there is no log.",
    queued: "Queued. Nothing has run yet.",
    building: "Building. Output will appear here as it is written.",
  };
  const head = heads[kind] || `No build log was kept for ${commit}.`;
  const tail = heads[kind]
    ? ""
    : `<span class="why">Logs are kept for <code>build.keep_logs</code>, which is shorter
       than the history in the activity rail — so an entry can outlive what it produced.</span>`;

  t.className = "term empty";
  // The reason is its own block. Concatenated onto the heading it read as one run-on
  // sentence: "This build was skipped, so there is no log.no documentation changes".
  t.innerHTML = `<strong>${esc(head)}</strong>` +
    (why ? `<div class="reason">${esc(why)}</div>` : "") + tail;
  ui.buffer = "";
}

// resetPane puts the terminal back to being a terminal.
function resetPane() {
  const t = term();
  if (!t) return;
  t.className = "term" + (ui.tall ? " tall" : "");
  t.innerHTML = "";
}

function toggle(name) {
  if (ui.open === name) {
    // Collapsing releases the pin, so reopening later lands on whatever is
    // newest then rather than on a preview chosen minutes ago.
    delete ui.pick[name];
    closeLog();
    ui.open = null;
    render();
    return;
  }
  closeLog();
  ui.open = name;
  ui.follow = true;
  render();
}

function closeLog() {
  if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
  ui.logFor = null;
  ui.buffer = "";
}

// Exactly one stream is open at a time — the one behind the expanded row.
// Nothing is fetched for a collapsed project. Several at once would mean N
// server-sent-event connections from one tab, and browsers cap concurrent
// connections per origin, so the sixth would hang with no visible reason.
// showBuild renders one stored build's log, in place of the live stream.
//
// A download rather than a stream: a finished build is a file, and the stream
// endpoint always replays whichever build is current. Following is turned off
// because a reader who deliberately went back to an earlier build does not want
// the live one scrolling in over it.
async function showBuild(previewID, buildID) {
  if (!buildID) { openLog(previewID); return; }

  if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
  ui.logFor = previewID;
  setFollow(false);
  banner("past", `build ${buildID} — not live`);

  const t = term();
  if (t) t.innerHTML = "";
  ui.buffer = "";

  try {
    const res = await fetch(
      `/logs/${encodeURIComponent(previewID)}/download/${encodeURIComponent(buildID)}`);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const text = await res.text();
    for (const line of text.split("\n")) appendLog(line);
  } catch (e) {
    banner("none", `could not read build ${buildID}: ${e.message}`);
  }
}

// loadBuilds fetches the build list for a preview and repopulates the picker.
//
// Fetched on demand rather than folded into /status, because a status payload
// carrying every build of every preview would grow without bound on a busy
// repository and be re-sent on every state change.
async function loadBuilds(previewID) {
  try {
    const res = await fetch(`/logs/${encodeURIComponent(previewID)}`);
    if (!res.ok) return;
    const d = await res.json();
    ui.builds[previewID] = d.logs || [];
    updateBuildPicker(previewID);
  } catch { /* the picker stays as it was */ }
}

// updateBuildPicker rewrites the build dropdown for a preview.
function updateBuildPicker(previewID) {
  const sel = document.querySelector('.item.open [data-role="build"]');
  if (!sel) return;

  const builds = ui.builds[previewID] || [];
  // Deferred while open, for the same reason the preview picker is: rewriting a
  // select that is open closes it with no visible cause.
  if (document.activeElement === sel) return;

  // Shown from the first build, not the second.
  //
  // It was hidden below two entries on the reasoning that a one-item picker is
  // useless. That was wrong: the entry carries the outcome and the age, so with
  // one build it is not a picker at all, it is the only place the dashboard says
  // whether that build succeeded. Hiding it left a failed build with no visible
  // result beside the row.
  sel.hidden = builds.length === 0;
  if (builds.length === 0) return;

  // No separate "latest" row. The newest build *is* the latest, so a synthetic
  // entry above it said the same thing twice and made the list one longer than
  // the number of builds.
  //
  // It keeps the empty value, which is what means "follow the live stream" rather
  // than "download this file" — the newest build's log is still being written
  // while it runs, so reading it as a file would show a truncated copy that never
  // updates.
  const current = ui.build[previewID] || "";
  // How long each build took, beside its outcome. The relative age answers "when", and
  // "how long" is the other half of the question anybody asks after watching a package
  // install for four minutes — and it is the number that shows a cache going cold.
  sel.innerHTML = builds.map((b, i) =>
    `<option value="${i === 0 ? "" : esc(b.build_id)}">` +
    `${buildIcon(b)} ${esc(buildLabel(b))} · ${esc(b.build_id)} · ${ago(b.mod_time)} ago` +
    `${b.seconds ? ` · took ${esc(secs(b.seconds))}` : ""}` +
    `</option>`).join("");
  sel.value = current;

  updateOpenBuild(previewID, current);
}

// updateOpenBuild points the second Open at the selected build's own share.
//
// Greyed rather than hidden when that build has none. Hidden, the control would
// come and go as the picker moved and read as a rendering fault; greyed with a
// reason reads as the fact it is. A build has no share of its own when it failed,
// when it predates per-build publishing, or when creating the share did not work —
// the branch share is the contract and this one is best effort.
function updateOpenBuild(previewID, buildID) {
  const a = document.querySelector('.item.open [data-role="open-build"]');
  if (!a) return;

  const builds = ui.builds[previewID] || [];
  // The empty value means "the newest build", which is what the picker uses for it
  // so the live stream stays selectable.
  const b = buildID ? builds.find(x => x.build_id === buildID) : builds[0];
  const url = safeURL(b && b.url);

  if (url) {
    a.href = url;
    a.title = url;
  } else {
    a.removeAttribute("href");
    a.title = b
      ? "this build has no URL of its own — open the branch instead"
      : "no build selected";
  }
}

// buildIcon and buildLabel describe how a build ended.
//
// The icons match the row states so one glance means the same thing in both
// places, and the word is there too — an emoji alone is unreadable to a screen
// reader and ambiguous at a glance between "failed" and "cancelled".
//
// A build with no recorded state predates the builds table or had its row pruned
// before its log. The log is still readable, so it is listed as unknown rather
// than hidden.
function buildIcon(b) {
  switch (b.state) {
    case "ready":    return "✅";
    case "failed":   return "❌";
    case "building": return "🔨";
    case "queued":   return "⏳";
    case "skipped":  return "⏭️";
    default:         return "•";
  }
}

function buildLabel(b) {
  switch (b.state) {
    case "ready":    return "succeeded";
    case "failed":   return "failed";
    case "building": return "running";
    case "queued":   return "queued";
    case "skipped":  return "skipped";
    default:         return "unknown";
  }
}

function openLog(previewID) {
  if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
  ui.logFor = previewID;
  ui.buffer = "";
  banner("none", "connecting…");

  // Back to being a terminal. Without this, opening a preview that has output after one
  // that had none leaves the pane in its prose styling and the first lines arrive in the
  // wrong font on the wrong background.
  resetPane();

  const src = new EventSource(`/logs/${encodeURIComponent(previewID)}/stream`);
  ui.logSource = src;

  // The server says up front whether this is a live build or a replay, and
  // which build the replay is. Without it a queued row showed a completed log
  // with nothing marking it as the previous build's — so the row said Queued
  // and the pane looked like it had already done the work.
  src.addEventListener("start", e => {
    let d = {};
    try { d = JSON.parse(e.data) || {}; } catch {}
    if (d.live) {
      banner("live", "streaming this build");
    } else {
      banner("past", `previous build${d.build_id ? " · " + d.build_id : ""} — nothing is running`);
    }
  });

  src.addEventListener("line", e => appendLog(e.data));
  src.addEventListener("done", e => {
    let d = {};
    try { d = JSON.parse(e.data) || {}; } catch {}

    if (d.reason) {
      // "no build log" and "log unreadable" arrive with no start event, so the banner is
      // still whatever the last preview left. Both the banner and the pane say it: the
      // banner is 0.72rem grey, and on its own above an empty black terminal it reads as
      // a page that failed to load rather than as an answer.
      banner("none", d.reason);
      const p = (ui.previews || []).find(x => x.preview_id === previewID);
      explainEmptyPane(previewID, p?.commit || "", p?.state === "skipped" ? "skipped" : "");
    } else if (!d.live) {
      appendLog("\n— end of log —");
    } else {
      // A build that finished while being watched. The banner said "live" a
      // moment ago and would keep saying it.
      banner("past", "this build finished");
      appendLog("\n— end of log —");
    }

    src.close();
    if (ui.logSource === src) ui.logSource = null;
  });
  // EventSource retries on its own; closing here stops it reconnecting to a
  // log that has already ended.
  src.onerror = () => { src.close(); if (ui.logSource === src) ui.logSource = null; };
}

// Only three cases, all structural rather than interpreting the tool's own
// output: the command being run, something that looks like an error, and a
// redaction — highlighted deliberately, so redaction is visibly happening
// rather than silently assumed.
function logLine(text) {
  const safe = esc(text);
  if (/^\$ /.test(text)) return `<span class="cmd">${safe}</span>`;
  if (/(^|\s)(ERR!|ERROR|error:|failed|FAIL)/.test(text)) return `<span class="err">${safe}</span>`;
  return safe.replace(/\*{5}/g, '<span class="mask">*****</span>');
}

// 40px of slack: a scroll position is fractional and a bottom test that demands
// equality is false as often as it is true.
function atBottom() {
  const t = term();
  return !t || t.scrollHeight - t.scrollTop - t.clientHeight < 40;
}

function setFollow(on) {
  ui.follow = on;
  const b = document.querySelector('.item.open [data-role="follow"]');
  if (b) {
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "Following" : "Paused";
  }
  const t = term();
  if (on && t) t.scrollTop = t.scrollHeight;
}

function setTall(on) {
  ui.tall = on;
  const b = document.querySelector('.item.open [data-role="tall"]');
  const t = term();
  if (b) {
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "Shrink" : "Expand";
  }
  if (t) {
    t.classList.toggle("tall", on);
    if (ui.follow) t.scrollTop = t.scrollHeight;
  }
}

function appendLog(text) {
  const html = logLine(text) + "\n";
  ui.buffer += html;

  const t = term();
  if (!t) return;
  // A line arriving into a pane that is currently an explanation — a build that was
  // skipped and is now being rebuilt — turns it back into a terminal first, or the output
  // lands under prose in the wrong font.
  if (t.classList.contains("empty")) {
    resetPane();
    ui.buffer = html;
  }
  t.insertAdjacentHTML("beforeend", html);

  if (!ui.follow) return;
  // Guard the scroll handler against our own write, which would otherwise read
  // as the reader scrolling and flip Following off mid-stream.
  ui.autoScrolling = true;
  t.scrollTop = t.scrollHeight;
  requestAnimationFrame(() => { ui.autoScrolling = false; });
}

/* ── Activity rail ────────────────────────────────────────────────────── */

// Only the kinds actually present get a button, and each carries its count.
// A row of five filters where four are always empty is four things to read and
// discount every time you look at the rail.
function renderFeedFilters(events) {
  const counts = new Map();
  for (const e of events) counts.set(e.kind, (counts.get(e.kind) || 0) + 1);

  const kinds = ORDER.filter(k => counts.has(k))
    .concat([...counts.keys()].filter(k => !ORDER.includes(k)).sort());

  const el = document.getElementById("feed-filters");
  const sig = kinds.map(k => `${k}:${counts.get(k)}`).join("|") + `|${ui.kind}`;
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;

  if (kinds.length === 0) { el.innerHTML = ""; return; }

  el.innerHTML =
    `<button data-k="" aria-pressed="${ui.kind === null}">All <span class="c">${events.length}</span></button>` +
    kinds.map(k => {
      const s = state(k);
      return `<button data-k="${esc(k)}" aria-pressed="${ui.kind === k}">` +
             `<span class="dot" style="--edge:${s.color}"></span>${esc(s.label)} ` +
             `<span class="c">${counts.get(k)}</span></button>`;
    }).join("");

  for (const b of el.querySelectorAll("button")) {
    b.onclick = () => {
      const k = b.dataset.k || null;
      ui.kind = (ui.kind === k) ? null : k;
      renderEvents();
    };
  }
}

// collapse drops the queued and building entries of an attempt that has finished.
//
// The feed records every state transition, so one build leaves "queued",
// "building" and "ready" behind. That reads wrong: a row saying **Queued** four
// minutes ago, with the same word and the same coloured dot a live queued row
// uses, looks like a job that is stuck. It is a fact about the past written in
// the present tense.
//
// So an attempt's non-terminal entries are dropped once that attempt reached a
// terminal state, and kept while it has not — a build actually queued or building
// right now still has its row, which is when that row is worth anything.
//
// Grouped by preview *and* commit, not by preview: two attempts of one pull
// request are two builds, and collapsing them together would hide the older one's
// outcome. Dropped rather than merged into one row with a duration, because the
// timestamps are the history and a synthesised row has no honest one.
//
// The kind filter bypasses this. Picking "queued" is asking for exactly what was
// hidden, and answering with nothing would be a filter that lies.
//
// One pass, newest first, which is the order the daemon sends. A non-terminal entry
// is dropped only when a *newer* terminal entry for the same attempt has already
// been seen. Collecting every terminal key up front instead — the first version of
// this — dropped a queued entry whose terminal entry was older, so re-running a
// commit that had already finished lost the row saying the new attempt was waiting.
// That row is the one thing somebody watching a rebuild is looking for.
function collapse(events) {
  const terminal = new Set(["ready", "failed", "skipped", "torn-down"]);

  const settled = new Set();
  const out = [];
  for (const e of events) {
    const key = `${e.preview_id}|${e.commit}`;
    if (terminal.has(e.kind)) {
      settled.add(key);
      out.push(e);
      continue;
    }
    if (!settled.has(key)) out.push(e);
  }
  return out;
}

function renderEvents() {
  const el = document.getElementById("events");

  // The top counters deliberately do not apply here. The feed is a history, and
  // narrowing it to "ready" would hide the queued and building rows that led
  // there — so it gets its own kind filter. The project filter and the search
  // box do apply, and expanding a project narrows the feed to it, which is what
  // makes the rail worth its width instead of scrolling past unrelated noise.
  const only = ui.open || ui.project;
  const scoped = (ui.events || []).filter(e => {
    if (only && project(e) !== only) return false;
    if (!ui.query) return true;
    return `${project(e)} ${e.branch} #${e.number}`.toLowerCase().includes(ui.query);
  });

  document.getElementById("feed-scope").textContent = only ? only : "all projects";
  renderFeedFilters(scoped);

  const shown = ui.kind ? scoped.filter(e => e.kind === ui.kind) : collapse(scoped);

  if (shown.length === 0) {
    el.innerHTML = `<div class="empty">Nothing yet.</div>`;
    return;
  }

  // An entry is a button only while there is something left to show, and inert
  // text once there is not. A link that looks live and goes nowhere is worse than
  // one that never offered.
  //
  // The server decides. It used to be "does the preview still exist", checked here,
  // which was the right question only while a preview had exactly one build: now
  // retention prunes older builds, so an entry can name a live preview and a build
  // that is gone. Only the daemon knows what is still on disk — see markOpenable.
  //
  // The preview check stays as well, because an entry whose preview has been torn
  // down cannot be revealed no matter what the server says about its build.
  const reachable = e =>
    e.openable && e.preview_id && ui.previews.some(p => p.preview_id === e.preview_id);


  el.innerHTML = shown.map(e => {
    const s = state(e.kind);
    const go = reachable(e);

    // The commit, because it is what distinguishes one entry from the next.
    // Without it a branch built eight times produced eight rows reading
    // "docpreview#3 / next-fixes-3 — ready", identical apart from the clock, and
    // the one thing a reader wants — which push was this — was the one thing the
    // feed had and did not show.
    //
    // And the message is dropped when it only repeats the label: the daemon sends
    // "ready" for a ready event, so the row said Ready twice and spent its second
    // line saying nothing. A message that carries more than that — "ready in 24s",
    // a skip reason, a failure — is kept.
    const echo = e.message && e.message.toLowerCase() !== s.label.toLowerCase();
    const detail = [
      e.branch ? `<code>${esc(e.branch)}</code>` : "",
      // The copy control sits on the commit rather than the row, because the commit
      // is what anybody wants out of here — a sha to paste into a terminal or a
      // message. Copying the whole row would give them the clock and the branch too
      // and make them edit it back down.
      e.commit
        ? `<code>${esc(e.commit)}</code><button class="evcopy" data-copy="${esc(e.commit)}"
             type="button" title="Copy ${esc(e.commit)}"
             aria-label="Copy commit ${esc(e.commit)}">${ICON_COPY}</button>`
        : "",
    ].filter(Boolean).join(" · ") + (echo ? ` — ${esc(e.message)}` : "");

    const inner = `
      <div class="t">${clock(e.at)}</div>
      <div>
        <div class="l1">
          <span class="dot"></span>
          <span class="k">${esc(s.label)}</span>
          <span class="l2">${esc(project(e))}#${e.number}</span>
        </div>
        <div class="l2">${detail}</div>
      </div>`;

    const sel = ui.evPick === e.at ? " sel" : "";

    // A div with role=button, not a <button>.
    //
    // Two things a real button made impossible. Text inside one cannot be selected,
    // so the commit on screen could be read and not copied — and the commit is the
    // one string anybody wants out of this rail, to paste into a terminal or a
    // message. And a button cannot contain a button, so there was nowhere to put a
    // copy control.
    //
    // The cost is doing by hand what the element gave for free: role, tabindex, and
    // Enter/Space in the keydown handler below. Worth it for a rail whose whole
    // purpose is telling you which commit did what.
    if (!go) {
      return `<div class="ev${sel}" style="--edge:${s.color}"
                   title="nothing left to open — this build has been cleaned up">${inner}</div>`;
    }
    return `<div class="ev linked${sel}" role="button" tabindex="0"
                 style="--edge:${s.color}" data-id="${esc(e.preview_id)}"
                 data-commit="${esc(e.commit || "")}" data-at="${esc(e.at)}"
                 data-kind="${esc(e.kind)}" ${sel ? 'aria-current="true"' : ""}
                 title="Show this build's log">${inner}</div>`;
  }).join("");

  for (const b of el.querySelectorAll(".ev.linked")) {
    const open = () => reveal(b.dataset.id, b.dataset.commit, b.dataset.at, b.dataset.kind);
    b.onclick = ev => {
      // A click that landed on the copy button, or on a selection the reader is
      // making, is not a request to open anything.
      if (ev.target.closest(".evcopy")) return;
      if (!window.getSelection().isCollapsed) return;
      open();
    };
    // What role=button costs: the keyboard behaviour a real button had for free.
    b.onkeydown = ev => {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      ev.preventDefault();
      open();
    };
  }

  for (const c of el.querySelectorAll(".evcopy")) {
    c.innerHTML = ICON_COPY;
    c.onclick = async ev => {
      // Or the row underneath opens as well, which is not what reaching for a copy
      // button means.
      ev.stopPropagation();
      try {
        await navigator.clipboard.writeText(c.dataset.copy);
        c.innerHTML = ICON_CHECK;
        c.title = "Copied";
      } catch {
        // clipboard needs a secure context; http://127.0.0.1 qualifies but a
        // tunnelled http:// origin does not. Selecting the text still works, which
        // is why the row is no longer a button.
        c.title = "could not copy — select the text instead";
      }
      setTimeout(() => { c.innerHTML = ICON_COPY; c.title = `Copy ${c.dataset.copy}`; }, 1500);
    };
  }
}

// reveal opens the build an activity entry names.
//
// Clearing the filters first is the point of the whole thing: the entry you
// clicked may well be hidden by the state filter or the search box you set
// three minutes ago, and expanding a row that is not on screen looks like
// nothing happened at all.
//
// The commit matters as much as the preview, and used to be ignored. Every
// preview of one repository lands in a single group, so clicking an entry only
// changed which preview was picked inside a row that was usually already open —
// and clicking an entry for the preview already showing did nothing at all,
// while the button's own tooltip promised to open that build. Selecting the
// build the entry names is what the tooltip always said this did.
function reveal(previewID, commit, at, kind) {
  const p = ui.previews.find(x => x.preview_id === previewID);
  if (!p) return;

  const name = project(p);

  // Set before render, so the feed draws the mark in the same pass.
  ui.evPick = at || null;

  ui.state = null;
  ui.query = "";
  document.getElementById("search").value = "";
  // The project filter is left alone when it already admits this project, so
  // clicking within a project you deliberately narrowed to does not widen it.
  if (ui.project && ui.project !== name) ui.project = "";

  if (ui.open !== name) {
    closeLog();
    ui.open = name;
    ui.follow = true;
  }
  // Pin the preview the entry named, not whichever is newest.
  ui.pick[name] = previewID;

  render();

  const item = document.querySelector(`.item[data-project="${CSS.escape(name)}"]`);
  if (item) {
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    item.scrollIntoView({block: "nearest", behavior: still ? "auto" : "smooth"});
    // Always something visible, even when the click changed no state — the row was
    // already open on this preview and this build. Silence is indistinguishable
    // from a broken button.
    flash(item);
  }

  if (commit) selectBuildForCommit(previewID, commit, kind);
}

// selectBuildForCommit points the build picker at the build an activity entry names.
//
// Matched on the build id's suffix, because a build id is
// "<date>-<time>-<short sha>" and the event carries only the sha. The newest build
// takes the empty value rather than its own id: empty means "follow the live
// stream", and the newest build's log is still being written while it runs, so
// selecting it by id would read a truncated file that never updates.
//
// The list may not have arrived yet — it is fetched per preview — so this loads it
// rather than silently doing nothing on the first click of a row for a preview
// nobody has opened yet.
//
// Two ways there is no build to select, and they must not be treated alike.
//
// A build that is queued or running has no log file yet, and the live stream *is*
// that build — so that falls through to the stream, and clicking a building row
// shows the build running. Anything else with no log file has none to show: a
// skipped build never writes one, and an old one may have been pruned. Falling
// through there silently swapped in the newest build's log, so the picker moved
// while the pane did not change — which is precisely how this was reported. Say so
// instead.
async function selectBuildForCommit(previewID, commit, kind) {
  if (!ui.builds[previewID]) await loadBuilds(previewID);

  const builds = ui.builds[previewID] || [];
  const i = builds.findIndex(b => b.build_id.endsWith("-" + commit));

  if (i < 0) {
    if (kind === "queued" || kind === "building") {
      ui.build[previewID] = "";
      updateBuildPicker(previewID);
      showBuild(previewID, "");
      return;
    }
    // Nothing to show, and the pane must not keep implying otherwise. Cleared
    // rather than left alone: leaving the previous build on screen under a banner
    // about a different one is the most confusing of the three options.
    if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
    // The explanation goes in the pane, not only in the banner above an empty black
    // rectangle 15rem tall. For a skipped build the banner said "no build log", which is
    // true and is not the fact anybody wants.
    explainEmptyPane(previewID, commit, kind);
    banner("none", kind === "skipped" ? "skipped — nothing was built"
      : `no log kept for ${commit}`);
    return;
  }

  // The newest build takes the picker's empty value rather than its own id: empty
  // means "follow the live stream", and its log is still being written while it
  // runs, so selecting it by id would read a truncated file that never updates.
  const buildID = i === 0 ? "" : builds[i].build_id;
  ui.build[previewID] = buildID;
  updateBuildPicker(previewID);
  showBuild(previewID, buildID);
}

// flash marks an element as just-acted-on.
//
// The class is removed on animation end rather than by a timer, so a second click
// during the animation restarts it instead of being swallowed.
function flash(el) {
  el.classList.remove("flash");
  // Forces a reflow, without which removing and re-adding in one frame is a no-op
  // and a repeated click produces no animation at all.
  void el.offsetWidth;
  el.classList.add("flash");
  el.addEventListener("animationend", () => el.classList.remove("flash"), {once: true});
}

/* ── Setup panel ──────────────────────────────────────────────────────────
   The credential surface. It exists because the alternative was three terminal
   commands in the right order, and getting them wrong leaves a daemon that
   starts and cannot open its own vault.

   It never displays a value. The server has no endpoint that returns one. */

const setupEl = () => document.getElementById("setup");

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? {"Content-Type": "application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch {}
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

async function loadSetup() {
  try {
    renderSetup(await api("GET", "/api/secrets"));
  } catch (e) {
    document.getElementById("setup-body").innerHTML =
      `<div class="notice bad">${esc(e.message)}</div>`;
  }
}

function renderSetup(s) {
  document.getElementById("setup-head").title = s.vault_path || "";
  const el = document.getElementById("setup-body");

  if (!s.available) {
    // Refused, and it says why rather than hiding. An operator who cannot find
    // the feature assumes it is broken.
    el.innerHTML = `<div class="notice bad">
      <strong>Not available on this daemon.</strong> ${esc(s.reason)}
      <p>Credentials on a reachable listener need authentication this does not have yet.
      Use <code>docpreview vault set &lt;key&gt;</code> on the host instead.</p></div>`;
    return;
  }

  if (s.locked) { renderUnlock(el, s); return; }

  // Read-only for anyone who is not on this machine. The rows still render, with
  // the fields and buttons gone: seeing that two credentials are set is useful
  // from a colleague's browser, and hiding the panel entirely would read as a
  // missing feature rather than a deliberate boundary. The server refuses these
  // calls regardless — this only stops the page offering something it knows will
  // be refused.
  const ro = !s.can_write;

  const rows = s.entries.map(e => {
    const flag = e.set
      ? `<span class="flag on">set</span>`
      : e.required ? `<span class="flag off">missing</span>`
                   : `<span class="flag opt">not needed</span>`;
    // A private key is multi-line; everything else is one line and masked.
    const multi = e.key.includes("private_key");
    const field = ro ? "" : multi
      ? `<textarea data-k="${esc(e.key)}" rows="3"
           placeholder="-----BEGIN RSA PRIVATE KEY-----&#10;…"></textarea>`
      : `<input type="password" data-k="${esc(e.key)}" placeholder="paste to replace">`;

    const acts = ro ? "" : `
        <button class="btn" data-save="${esc(e.key)}">Save</button>
        ${multi ? "" : `<button class="btn" data-gen="${esc(e.key)}"
             title="Mint a random value and show it once">Generate</button>`}
        ${e.set ? `<button class="btn" data-del="${esc(e.key)}">Delete</button>` : ""}`;

    // A chip, not a sentence. The rule is the same for every build variable and stating
    // it per row cost three wrapped lines each — the list stopped being a list. It is
    // stated once, in the notice above.
    const injected = e.env_var
      ? `<span class="flag on" title="Injected into every build as ${esc(e.env_var)}, and
           redacted from every log. A project can override it.">build var</span>`
      : "";

    return `<div class="sec">
      <div>
        <div class="name">${esc(e.label)} ${flag} ${injected}</div>
        <div class="key">${esc(e.key)}</div>
        ${e.hint ? `<div class="hint">${esc(e.hint)}</div>` : ""}
      </div>
      <div>${field}</div>
      <div class="act">${acts}</div>
    </div>`;
  }).join("");

  // A minted value, shown exactly once. It is rendered above everything else
  // and consumed on render, so the next redraw loses it — which is the point:
  // there is no way to ask for it again, and a box that persisted would imply
  // otherwise.
  let once = "";
  if (ui.shownOnce) {
    const {key, value} = ui.shownOnce;
    ui.shownOnce = null;
    once = `<div class="notice warn" id="once">
      <strong>Copy this now — it will not be shown again.</strong>
      Stored as <code>${esc(key)}</code>. Paste it into the matching field on GitHub.
      <p><input type="text" id="once-val" readonly value="${esc(value)}"
           style="width:100%;font:12.5px/1.5 ui-monospace,Consolas,monospace;
                  background:var(--raised);color:var(--ink);
                  border:1px solid var(--ring);border-radius:6px;padding:0.4rem 0.5rem">
      <button class="btn" id="once-copy" style="margin-top:0.4rem">Copy</button></p></div>`;
  }

  const banner = ro
    ? `<div class="notice warn"><strong>Read-only from here.</strong> ${esc(s.read_only_why || "")}
       <p>Open the dashboard on the machine running docpreview, or use
       <code>docpreview vault set &lt;key&gt;</code> there.</p></div>`
    : `<div class="notice ok">Values are written to the age-encrypted vault. Nothing here reads one
       back — the only time a secret is visible is the moment you generate it. Changing a build
       secret re-arms the log redactor immediately.
       <p>An entry marked <span class="flag on">build var</span> is injected into every build
       as that variable and redacted from every log; a project can override it with its own.
       That is what an <code>UPPER_CASE</code> name means here.</p></div>`;

  el.innerHTML = `
    ${once}
    ${banner}
    ${rows}
    ${ro ? "" : `<div class="sec">
      <div><div class="name">Add another</div>
        <!-- What the name decides, since it decides everything here: a shell-shaped name
             is injected into every build under that name, and anything else is a key only
             the daemon's own config can reach. That rule used to be invisible, and six
             tokens were stored in the belief that storing them was enough. -->
        <div class="hint">An <code>UPPER_CASE</code> name is injected into every build as
          that variable. Anything else is only read if <code>build.secrets</code> names
          it.</div></div>
      <div>
        <!-- No placeholder. A greyed-out example in the *name* box reads as a value
             already filled in, and this is the field where getting it wrong is silent:
             the build looks for a variable that is not there and falls back to whatever
             its script does without one. -->
        <input type="text" id="new-key" autocomplete="off" spellcheck="false"
               aria-label="Name" style="width:100%;margin-bottom:0.35rem">
        <input type="password" id="new-val" autocomplete="off" aria-label="Value">
      </div>
      <div class="act"><button class="btn" id="new-save">Save</button></div>
    </div>`}`;

  const copy = document.getElementById("once-copy");
  if (copy) {
    const field = document.getElementById("once-val");
    field.focus();
    field.select();
    copy.onclick = async () => {
      field.select();
      // navigator.clipboard needs a secure context, and http://127.0.0.1 counts
      // as one — but not every browser agrees, so the selection above is the
      // fallback that always works.
      try { await navigator.clipboard.writeText(field.value); copy.textContent = "Copied"; }
      catch { copy.textContent = "Press Ctrl+C"; }
    };
  }

  for (const b of el.querySelectorAll("[data-save]")) {
    b.onclick = () => save(b.dataset.save, el.querySelector(`[data-k="${CSS.escape(b.dataset.save)}"]`), b);
  }
  for (const b of el.querySelectorAll("[data-gen]")) {
    b.onclick = async () => {
      const key = b.dataset.gen;
      const entry = s.entries.find(x => x.key === key);
      if (entry && entry.set &&
          !confirm(`${key} is already set. Replace it with a new random value?`)) return;
      await run(b, async () => {
        const out = await api("POST", `/api/secrets/${encodeURIComponent(key)}/generate`);
        // Stash it so the re-render can show it. This is the only moment the
        // value exists outside the vault; there is no endpoint to ask again.
        ui.shownOnce = {key, value: out.shown_once};
        return out;
      });
    };
  }

  for (const b of el.querySelectorAll("[data-del]")) {
    b.onclick = async () => {
      if (!confirm(`Delete ${b.dataset.del} from the vault?`)) return;
      await run(b, () => api("DELETE", `/api/secrets/${encodeURIComponent(b.dataset.del)}`));
    };
  }
  // Absent when read-only. The querySelectorAll loops above degrade to no-ops on
  // their own; this one is a direct lookup and would throw.
  const newSave = document.getElementById("new-save");
  if (newSave) {
    newSave.onclick = async e => {
      const k = document.getElementById("new-key").value.trim();
      const v = document.getElementById("new-val").value;
      if (!k || !v) return;
      await run(e.target, () => api("PUT", `/api/secrets/${encodeURIComponent(k)}`, {value: v}));
    };
  }
}

function renderUnlock(el, s) {
  // Unlocking is a mutating call, and a passphrase box offered to a remote
  // browser is a prompt to type the one secret that opens everything into a form
  // whose POST the server will refuse. Say the state and stop.
  if (!s.can_write) {
    el.innerHTML = `<div class="notice warn">
      <strong>${s.has_vault ? "The vault is locked." : "No vault yet."}</strong>
      Nothing can arrive until it is unlocked, and that has to happen on the machine
      running docpreview. ${esc(s.read_only_why || "")}</div>`;
    return;
  }

  // Two doors. An existing vault needs its key; a new one is created by
  // choosing a key, and the wording has to make clear which is happening —
  // typing a new passphrase at an existing vault just fails to open it.
  el.innerHTML = `
    <div class="notice warn">
      <strong>${s.has_vault ? "The vault is locked." : "No vault yet."}</strong>
      ${s.has_vault
        ? `Enter the master key or passphrase it was created with.`
        : `Choose a passphrase. It encrypts the vault, it is never stored, and
           <strong>losing it means losing the contents</strong> — there is no recovery.
           Put it in a password manager now.`}
      <p>Set <code>vault.key_source</code> in the config to skip this on every restart.</p>
    </div>
    <div class="sec">
      <div><div class="name">${s.has_vault ? "Master key" : "New passphrase"}</div>
        <div class="hint">an age secret key, or any passphrase</div></div>
      <div>
        <input type="password" id="unlock-key" placeholder="AGE-SECRET-KEY-1… or a passphrase">
        ${s.has_vault ? "" : `<div class="hint" id="strength">&nbsp;</div>`}
      </div>
      <div class="act"><button class="btn" id="unlock-go">${s.has_vault ? "Unlock" : "Create"}</button></div>
    </div>`;

  const go = document.getElementById("unlock-go");
  const field = document.getElementById("unlock-key");
  go.onclick = () => run(go, () => api("POST", "/api/secrets/unlock", {key: field.value}));
  field.onkeydown = e => { if (e.key === "Enter") go.click(); };

  // Advice, not a gate. A rule that refuses a passphrase teaches people to
  // append "1!" and call it done; saying what would be stronger, and then
  // accepting whatever they choose, is the honest version. It is also their
  // vault on their loopback interface — refusing them entry to it would be
  // absurd.
  const meter = document.getElementById("strength");
  if (meter) {
    field.oninput = () => {
      const v = field.value;
      if (!v) { meter.innerHTML = "&nbsp;"; return; }
      const s = rate(v);
      meter.innerHTML = `<span style="color:${s.color};font-weight:600">${esc(s.word)}</span> — ${esc(s.advice)}`;
    };
  }
  field.focus();
}

// rate is a rough passphrase estimate. Length dominates, because it does:
// four unrelated words beat eight characters of punctuation, and a meter that
// rewards symbols over length teaches the wrong lesson.
function rate(v) {
  if (v.toUpperCase().startsWith("AGE-SECRET-KEY-1")) {
    return {word: "age key", color: "var(--good)", advice: "a generated key — nothing to improve"};
  }

  const classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter(re => re.test(v)).length;
  const words = v.trim().split(/\s+/).filter(w => w.length > 2).length;

  // Rough bits: log2(alphabet) per character, with a bonus for multi-word.
  const alphabet = [26, 26, 52, 62, 95][Math.min(classes, 4)];
  const bits = Math.round(v.length * Math.log2(alphabet)) + (words >= 3 ? 12 : 0);

  if (bits < 45) {
    return {word: "weak", color: "var(--critical)",
            advice: "aim for four or more unrelated words, or 16+ characters"};
  }
  if (bits < 70) {
    return {word: "fair", color: "var(--warning)",
            advice: "longer is worth more than adding symbols"};
  }
  return {word: "strong", color: "var(--good)",
          advice: "save it now — there is no recovery"};
}

function save(key, field, btn) {
  const value = field.value;
  if (!value.trim()) return;
  return run(btn, async () => {
    const s = await api("PUT", `/api/secrets/${encodeURIComponent(key)}`, {value});
    field.value = "";     // never leave a credential sitting in the DOM
    return s;
  });
}

// run performs an action, renders whatever state comes back, and reports a
// failure next to the button rather than in a console nobody has open.
//
// The renderer and the place errors land are arguments because two pages share this.
// They used to be hardcoded to the secrets panel, so a failed project save rendered
// project state through the credential renderer and then printed the resulting
// exception into an element that is hidden on /projects — an action that silently did
// nothing and said nothing.
async function run(btn, fn, opts) {
  const render = opts?.render || renderSetup;
  const bodyID = opts?.body || "setup-body";
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    render(await fn());
  } catch (e) {
    btn.disabled = false;
    btn.textContent = label;
    const n = document.createElement("div");
    n.className = "notice bad";
    n.textContent = e.message;
    document.getElementById(bodyID).prepend(n);
  }
}

// runProject is run, aimed at the projects page.
const runProject = (btn, fn) =>
  run(btn, fn, {render: renderProjectsPage, body: "projects-body"});

// The Secrets control is an ordinary link now, so there is no click handler.
// Which of the two pages this document is depends on the path it was served at.
const currentPath = location.pathname.replace(/\/+$/, "");
const isSetupPage = currentPath === "/secrets";
const isProjectsPage = currentPath === "/projects";

/* ── Projects ─────────────────────────────────────────────────────────────
   A project is a repository docpreview will build, and how. The row lives in
   sqlite and wins over the repository's own .docpreview.yml, because that file
   arrives in the pull request — so on any repository where opening one is not a
   privilege, its author would otherwise choose the command that runs.

   Every build field may be blank, meaning "defer to the repository". A row that
   only names a repository is valid and is the common case: it says the repository
   is allowed, not that the operator wants to restate its config. */

async function loadProjects() {
  const body = document.getElementById("projects-body");
  try {
    renderProjectsPage(await api("GET", "/api/projects"));
  } catch (e) {
    body.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`;
  }
}

/* Which project's detail is open, and which panel of it. One at a time: the page
   is a list to scan, and a dozen expanded cards is the same wall of fields the
   permanently-open form used to be. Kept outside render so a refresh after a save
   comes back to where you were. */
let projOpen = {key: null, tab: null};

/* Whether the open form has edits nobody has saved.

   Every way out of this page throws the form away without a word: closing the panel,
   opening a different project's, the back link, the browser's own navigation. Eleven
   fields of typing lost to a misplaced click, with no undo, because a project form has
   no draft state anywhere.

   Set by an input listener rather than by comparing values, which sounds sloppier and is
   not: a comparison has to know which fields belong to which project and what "unchanged"
   means for a select whose default moved, and it silently answers "clean" when it gets
   that wrong. Typing into a form is the signal. */
let formDirty = false;

/* A one-shot message for the render that follows an action.

   Consumed by the next renderProjectsPage and cleared as it is read, so a render five
   seconds later — a second save, another panel opening — does not replay it. The element
   removes *itself* on a timer rather than being cleared by a re-render, because a
   re-render at an arbitrary moment would throw away whatever somebody had started typing
   in another panel. */
let projFlash = "";

/* toast says something happened, over the page rather than in it.

   An inline notice was the first attempt and it was too easy to miss: it landed where the
   form had been, which is where the form no longer is, so the eye had already moved. This
   sits in a fixed corner, outside the document flow, so nothing below it shifts — a banner
   that pushes a list down is its own small confusion.

   Detached from any render. The element removes itself on a timer, because clearing it by
   re-rendering would throw away whatever somebody had started typing in another panel. */
function toast(text) {
  let host = document.getElementById("toasts");
  if (!host) {
    host = document.createElement("div");
    host.id = "toasts";
    document.body.appendChild(host);
  }
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  host.appendChild(t);
  // Long enough to read a sentence, and it does not block anything while it is there.
  setTimeout(() => t.remove(), 5000);
}

// confirmDiscard asks before throwing away unsaved edits, and returns whether to go on.
function confirmDiscard() {
  if (!formDirty) return true;
  if (!confirm("You have unsaved changes to this project. Discard them?")) return false;
  formDirty = false;
  return true;
}

// The browser's own guard, for the back link, a bookmark, or a closed tab. The wording is
// the browser's — every one of them ignores a custom message — so preventDefault plus
// returnValue is the whole of the API.
window.addEventListener("beforeunload", e => {
  if (!formDirty) return;
  e.preventDefault();
  e.returnValue = "";
});

function renderProjectsPage(s) {
  const el = document.getElementById("projects-body");
  const ro = !s.can_write;

  const banner = ro
    ? `<div class="notice warn"><strong>Read-only from here.</strong> ${esc(s.read_only_why || "")}
       <p>A project decides what command runs on the build host, so it can only be changed on
       that machine.</p></div>`
    : "";

  const rows = s.projects.length ? s.projects.map(p => projectCard(p, s, ro)).join("") :
    `<div class="notice">No projects yet. Every repository the App is installed on still builds
     using its own <code>.docpreview.yml</code> — adding a project is how you take the build
     command out of the branch.</div>`;

  // The add form is a card like any other, and it is closed until asked for. It used
  // to sit open at the bottom with eleven inputs in it, outweighing the projects it
  // was there to add — and Edit filled *that* form, far below the row it belonged to,
  // with nothing connecting the two.
  const adder = ro ? "" : (projOpen.key === NEW
    ? `<div class="proj">${projectForm(s, null)}</div>`
    : `<div class="act"><button class="btn" id="p-new">New project</button></div>`);

  el.innerHTML = `${banner}${rows}${adder}`;

  // Read once and cleared, so it cannot reappear on an unrelated render.
  if (projFlash) {
    toast(projFlash);
    projFlash = "";
  }

  // Wired unconditionally: with no write access there are no buttons to wire, and a
  // read-only page that skipped this would still have to know that.
  wireProjectHandlers(s);
}

// NEW is the pseudo-key the add form opens under, so one piece of state covers both
// "editing this project" and "adding one".
const NEW = "␀new";

// A leading space in NEW, so it can never collide with a real `platform/owner/repo`
// — projectFromRequest rejects a space in any of the three.

function projectCard(p, s, ro) {
  const key = projectKey(p);
  const open = projOpen.key === key ? projOpen.tab : null;
  const dockered = p.driver === "docker" || (!p.driver && s.defaults.driver === "docker");

  return `<div class="pcard${p.enabled ? "" : " pcard-off"}" data-card="${esc(key)}">
    <div class="pcard-head">
      ${avatarHTML(p)}
      <span class="name">${esc(projectLabel(p))}</span>
      ${p.display_name ? `<span class="sub">${esc(p.owner)}/${esc(p.repo)}</span>` : ""}
      <span class="flag opt">${esc(platformLabel(p.platform))}</span>
      <span class="flag ${p.enabled ? "on" : "off"}">${p.enabled ? "enabled" : "disabled"}</span>
      <span class="flag ${dockered ? "on" : "opt"}">${esc(p.driver || s.defaults.driver)}${
        p.driver ? "" : " (default)"}</span>
      <span class="grow"></span>
      ${ro ? "" : `<button class="btn" data-tab="build" data-key="${esc(key)}"
          aria-pressed="${open === "build"}">Edit</button>
        <button class="btn" data-tab="secrets" data-key="${esc(key)}"
          aria-pressed="${open === "secrets"}">Secrets${
            p.secrets.length ? ` (${p.secrets.length})` : ""}</button>
        <!-- Queues a build for every open pull request on this repository, which is the
             same thing adding a project does. It exists because the answer to "I changed
             the image, now what" was to wait for somebody to push. -->
        <button class="btn" data-build="${esc(key)}"
          title="Queue a build for every open pull request">Build now</button>
        <button class="btn" data-del-project="${esc(key)}">Delete</button>`}
    </div>
    ${projectFacts(p)}
    ${p.notes ? `<div class="hint pcard-notes">${esc(p.notes)}</div>` : ""}
    ${open === "build" ? `<div class="panel">${projectForm(s, p)}</div>` : ""}
    ${open === "secrets" ? `<div class="panel">${secretsPanel(p, s)}</div>` : ""}
  </div>`;
}

// projectLabel is what to call a project on screen.
const projectLabel = p => p.display_name || p.repo;

// platformLabel renames one platform for the page without renaming it in the data.
//
// `local` is the git simulator: bare repositories in a directory on this machine. The
// stored value is the primary key of every project, preview and build row and is what
// a webhook delivery is matched against, so it stays `local`; what an operator reads
// says what it actually is.
const platformLabel = p => p === "local" ? "filesystem" : p;

// avatarHTML draws the project's badge.
//
// A monogram and a colour derived from the name when nothing is set, so a list of ten
// projects is scannable with no configuration at all — the point is telling rows
// apart, and that should not require an afternoon of choosing emoji. An operator who
// wants a specific one sets it and it wins.
//
// Deliberately not an image URL. The dashboard is served by a loopback daemon with no
// outbound dependency, and a remote avatar would announce every project on the page to
// whoever hosts the image, every time anyone opened it.
function avatarHTML(p) {
  // An inlined image, for a project with a real logo. Rendered through <img src>, where
  // an SVG cannot run script — and only ever a data: URI, because a remote src would
  // announce every project on this page to whoever hosts the image. The server refuses
  // anything else; this refuses it again rather than trusting that.
  if (String(p.avatar || "").startsWith("data:image/")) {
    return `<span class="ava ava-img"><img src="${esc(p.avatar)}"
      alt="" width="22" height="22"></span>`;
  }

  const label = p.avatar || monogram(projectLabel(p));
  // A hue from the name, so the colour is stable across restarts without being stored,
  // and two projects next to each other are very unlikely to share one. Fixed
  // saturation and lightness, because the text on top has to stay readable.
  let h = 0;
  for (const ch of `${p.platform}/${p.owner}/${p.repo}`) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<span class="ava" style="background:hsl(${h} 62% 88%);border-color:hsl(${h} 40% 74%)"
    aria-hidden="true">${esc(label)}</span>`;
}

// imagePicker is the container image field: a text box that is also a search box, over a
// list of the images known to work here.
//
// A <datalist> was the first attempt and it is not this. Its dropdown is the browser's,
// which means no descriptions, no styling, no way to say which one is the default, and on
// some browsers no way to see the list at all without typing a character that matches. The
// list is short and opinionated, and the interesting part is *why* one entry differs from
// another — which needs a row you can put a sentence in.
//
// Free text is preserved on purpose: the value is whatever the operator types, and a
// private registry mirror is the normal answer in an enterprise. The list is a shortcut,
// never a constraint.
function imagePicker(elID, value, s) {
  const images = s.defaults.images || [];
  return `<span class="picker imgpick">
    <input class="control" id="${elID}" value="${value}"
      placeholder="${esc(s.defaults.image)}" autocomplete="off" spellcheck="false"
      aria-expanded="false" aria-haspopup="listbox">
    <div class="pick-panel" id="${elID}-panel" hidden>
      <div class="pick-list" role="listbox">
        ${images.map(i => `<button type="button" class="pick-row" data-image="${esc(i)}"
          role="option">
          <span>${esc(i)}</span>
          ${i === s.defaults.image ? `<span class="count">default</span>` : ""}
          ${imageNote(i) ? `<span class="count">${esc(imageNote(i))}</span>` : ""}
        </button>`).join("")}
      </div>
    </div>
    <div class="imgcheck" id="${elID}-check"></div>
  </span>`;
}

// imageNote is the one thing worth knowing about an image beyond its name.
function imageNote(image) {
  if (image.includes("-slim")) return "no git";
  if (image.includes("alpine")) return "musl";
  return "";
}

// avatarField is a short input for two characters and a textarea for an inlined image.
//
// Two controls rather than one, because a 2.4 KB data URI in a 5rem input is a field
// nobody can see the contents of, and a textarea for two characters is absurd. Which
// one appears follows the value already there, and the placeholder says how to get the
// other.
function avatarField(p, elID) {
  const cur = p ? (p.avatar || "") : "";
  const isImg = cur.startsWith("data:image/");
  // The value itself is hidden once it is an image: 1.4 KB of percent-encoded SVG in a
  // text field is not something anybody reads or edits, and showing it made the field
  // look broken. What is shown is the image, a picker, and a way to clear it.
  return `<span class="avafield">
    <input type="${isImg ? "hidden" : "text"}" class="control" id="${elID}"
      style="max-width:9rem" value="${esc(cur)}"
      placeholder="${esc(monogram(p ? projectLabel(p) : "?"))}">
    ${isImg ? `<span class="ava ava-img"><img src="${esc(cur)}" alt="" width="22" height="22"></span>` : ""}
    <input type="file" id="${elID}-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
    <button type="button" class="btn" data-pick="${elID}">${isImg ? "Replace" : "Upload"}</button>
    ${isImg ? `<button type="button" class="btn" data-clearava="${elID}">Clear</button>` : ""}
  </span>`;
}

// monogram takes the first character of the first two words, or the first two
// characters of one word. `unified-doc` gives UD; `docpreview` gives DO.
function monogram(name) {
  const parts = String(name || "?").split(/[^A-Za-z0-9]+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

// projectFacts renders only what the project actually states, as one property per
// line. Every field is optional and a blank one means "defer to the repository", so
// listing the empty ones would fill the card with the word "default".
function projectFacts(p) {
  const fields = [
    ["directory", p.build_dir],
    ["command", p.build_command],
    ["output", p.build_output],
    ["base URL", p.base_url],
    ["ignore script", p.detect_script],
    ["image", p.image],
  ].filter(([, v]) => v);

  const env = (p.secrets || []).length
    ? [["env", `${p.secrets.length} variable${p.secrets.length === 1 ? "" : "s"}`]] : [];

  if (!fields.length && !env.length) {
    return `<dl class="facts"><div><dt>build</dt>
      <dd class="inherit">entirely from the repository's .docpreview.yml</dd></div></dl>`;
  }
  return `<dl class="facts">${fields.concat(env).map(([k, v]) =>
    `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
}

// secretsPanel lists this project's environment variables and lets one be added.
//
// Names only, never values — the same rule as the credential page, and for the same
// reason: this payload is readable from anywhere the dashboard is, while writing it
// is loopback-only.
function secretsPanel(p, s) {
  if (!s.secrets_available) {
    return `<div class="notice">This daemon has no credential store wired, so a project
      cannot have environment variables of its own.</div>`;
  }
  if (s.vault_locked) {
    return `<div class="notice warn">The vault is locked, so nothing here can be read or
      written. <a href="/secrets">Unlock it</a> and come back.</div>`;
  }

  const key = projectKey(p);
  const mine = (p.secrets || []).map(env =>
    `<span class="env">${esc(env)}<button title="Remove ${esc(env)}"
      data-del-secret="${esc(env)}" data-key="${esc(key)}">✕</button></span>`).join("");

  // Inherited names are shown greyed rather than omitted, because "this project has
  // no variables" and "this project has none of its own" look identical otherwise
  // and only one of them means a build is about to fail for a missing token.
  const inherited = (s.global_secrets || []).filter(g => !(p.secrets || []).includes(g)).map(g =>
    `<span class="env inherited" title="from the server config, every project gets it">${
      esc(g)}</span>`).join("");

  return `<h3>Environment variables for this project</h3>
    <div class="hint">Injected into every build of this repository and redacted from every
      build log. This is how a build clones another private repository — the value is a
      token, the name is whatever the build script looks for.</div>
    ${mine || inherited ? `<div class="envs">${mine}${inherited}</div>`
      : `<div class="hint">None yet.</div>`}
    <div class="grid-form" style="margin-top:0.6rem">
      <div class="field">
        <label for="s-env-${esc(key)}">Name</label>
        <!-- No placeholder. A greyed-out BB_REPO_TOKEN_ONPREM in the box read as a
             value already entered, and the field it names is the one where getting it
             wrong is silent: the build looks for a variable that is not there. -->
        <input class="control" id="s-env-${esc(key)}" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="s-val-${esc(key)}">Value</label>
        <input class="control" id="s-val-${esc(key)}" type="password" autocomplete="off">
        <div class="why">Masked here, never returned by the API, and replaced with
          asterisks in every build log. Nothing can read it back — removing it means
          finding the token again wherever it came from.</div>
      </div>
    </div>
    <div class="act" style="margin-top:0.5rem">
      <button class="btn" data-add-secret="${esc(key)}">Add variable</button>
    </div>`;
}

function projectKey(p) { return `${p.platform}/${p.owner}/${p.repo}`; }

// driverSelect offers only what this daemon will actually accept.
//
// An option that saves and then fails the build is worse than no option: the operator
// learns the answer from a red build an hour later instead of from the form. So docker
// is disabled when the startup probe did not find it, local is disabled unless
// build.allow_local_driver is set, and each says which it is in its own label.
function driverSelect(s, p, elID) {
  const d = s.defaults;
  // A blank value means "follow the server default", and the server default is always
  // one of the two concrete drivers — so offering it as a third option listed the same
  // driver twice, "docker — server default" above "docker — build in a container",
  // which is a distinction nobody outside this file can act on.
  //
  // So: two options, and saving pins the choice. Pinning is also the better default
  // semantic. A project's build environment should not change because somebody moved a
  // server-wide setting, and the one move that matters — flipping the server default to
  // local — is exactly the one you would not want applied silently to every project.
  // An existing row with a blank driver arrives at the server default preselected.
  const cur = (p && p.driver) || d.driver;
  const opt = (value, label, disabled) =>
    `<option value="${value}"${value === cur ? " selected" : ""}${
      disabled && value !== cur ? " disabled" : ""}>${label}${
      value === d.driver ? " · server default" : ""}</option>`;

  return `<select class="control" id="${elID}">
    ${opt("docker", d.docker_available
      ? "docker — build in a container"
      : `docker — not available: ${esc(d.docker_detail || "no docker")}`, !d.docker_available)}
    ${opt("local", d.allow_local_driver
      ? "local — build on this host"
      : "local — not enabled on this daemon", !d.allow_local_driver)}
  </select>`;
}

// driverWhy states the consequence of the choice rather than restating the names.
function driverWhy(s) {
  if (!s.defaults.allow_local_driver) {
    return "The container is the only thing between a pull request's build scripts and " +
      "this host, so <code>local</code> is off until <code>build.allow_local_driver</code> " +
      "says otherwise.";
  }
  return "<strong>local runs the pull request's own build scripts on this machine</strong> " +
    "as the daemon's user — every dependency's install script included. It is enabled on " +
    "this daemon.";
}

// parseRepoURL pulls a platform, owner and repository out of a pasted URL.
//
// It accepts what somebody actually has on a clipboard: the browser address bar, the
// green Code button's HTTPS URL, an SSH remote, and any of those with a trailing
// path from a deep link. The platform comes from the host rather than from a guess,
// and an unrecognised host returns nothing so the fields stay as typed rather than
// being filled with something wrong.
function parseRepoURL(raw) {
  const s = String(raw || "").trim();
  if (!s) return null;

  let host = "", path = "";
  const ssh = s.match(/^(?:ssh:\/\/)?git@([^:/]+)[:/](.+)$/);
  if (ssh) {
    host = ssh[1];
    path = ssh[2];
  } else {
    try {
      const u = new URL(s.includes("://") ? s : `https://${s}`);
      host = u.hostname;
      path = u.pathname;
    } catch {
      return null;
    }
  }

  const platform =
    /(^|\.)github\.com$/i.test(host) ? "github" :
    /(^|\.)bitbucket\.org$/i.test(host) ? "bitbucket" : "";
  if (!platform) return null;

  const parts = path.replace(/^\/+/, "").replace(/\.git$/i, "").split("/").filter(Boolean);
  if (parts.length < 2) return null;
  // Only the first two segments. A deep link carries /pull/4 or /src/main/docs after
  // them, and Bitbucket's own URLs are /workspace/repo/... as well.
  return {platform, owner: parts[0], repo: parts[1]};
}

// projectForm is both "add" and "edit": a PUT is an upsert, so they are one request,
// and two UIs for one operation drift. When p is given the fields are filled and the
// identity is fixed — changing owner or repo would silently create a second project
// rather than rename this one, so those inputs are read-only in edit.
function projectForm(s, p) {
  const v = f => esc(p ? (p[f] || "") : "");
  const id = f => p ? `p-${f}-${projectKey(p)}` : `p-${f}`;
  const field = (f, label, control, why) => `<div class="field">
    <label for="${id(f)}">${label}</label>${control}
    ${why ? `<div class="why">${why}</div>` : ""}</div>`;
  const text = (f, placeholder) => `<input class="control" id="${id(f)}"
    value="${v(f === "dir" ? "build_dir" : f === "command" ? "build_command"
      : f === "output" ? "build_output" : f === "baseurl" ? "base_url"
      : f === "detect" ? "detect_script" : f)}" placeholder="${placeholder}">`;

  return `<h3>${p ? `Settings for ${esc(projectLabel(p))}` : "New project"}</h3>
    <div class="grid-form">
      <div class="field-head">Identity</div>
      ${p ? "" : `
        ${field("url", "Repository URL",
          `<input class="control" id="p-url" placeholder="https://github.com/acme/docs">`,
          "Paste one and the three fields below fill themselves. They are what a " +
          "webhook is matched against, so they can also be typed.")}
        ${field("platform", "Platform", `<select class="control" id="p-platform">
          <option value="github">github</option>
          <option value="bitbucket">bitbucket</option>
          <option value="local">filesystem — a bare repository on this machine</option>
        </select>`)}
        ${field("owner", "Owner",
          `<input class="control" id="p-owner" placeholder="acme">`,
          "The organisation or workspace. For filesystem, whatever you file it under.")}
        ${field("repo", "Repository",
          `<input class="control" id="p-repo" placeholder="docs">`)}`}
      ${field("name", "Name",
        `<input class="control" id="${id("name")}" maxlength="120"
          value="${v("display_name")}" placeholder="${p ? esc(p.repo) : "the repository name"}">`,
        "What to call it on this page. Blank uses the repository name.")}
      ${field("avatar", "Badge", avatarField(p, id("avatar")),
        "One or two characters, or an emoji. Blank derives initials and a colour from " +
        "the name. A <code>data:</code> URI renders as an image — inlined, never " +
        "fetched, because this page asks the internet for nothing.")}

      <div class="field-head">Build <span class="field-note">— blank means the
        repository decides</span></div>
      ${field("driver", "Driver", driverSelect(s, p, id("driver")), driverWhy(s))}
      ${field("image", "Container image", imagePicker(id("image"), v("image"), s),
        "Pick one or type your own — a private mirror is a normal answer. Needs node and " +
        "<code>git</code> if the build clones other repositories, which the " +
        "<code>-slim</code> images do not have; alpine's musl breaks dependencies that " +
        "ship prebuilt binaries.")}
      ${field("dir", "Build directory", text("dir", "www"),
        "Where <code>package.json</code> lives, relative to the repository root. Blank " +
        "means the root.")}
      ${field("command", "Build command", text("command", esc(s.defaults.build_command || "npm run build")),
        "Run by <code>sh -lc</code> inside the image, so pipes and <code>&amp;&amp;</code> " +
        "work and <code>bash</code>, <code>node</code> or <code>python</code> work if the " +
        "image has them.")}
      ${field("output", "Output directory", text("output", "build"),
        "Relative to the build directory.")}
      ${field("baseurl", "Base URL", text("baseurl", "/"),
        "Must start and end with a slash. Docusaurus bakes it in at build time, so " +
        "getting it wrong 404s every asset.")}
      ${field("detect", "Ignore-build script", text("detect", "ci/needs-build.sh"),
        "Executed directly, so its shebang decides the interpreter. Gets the changed " +
        "paths on stdin; exit 0 to build, 78 to skip. Blank uses path matching.")}

      <div class="field-head">Notes</div>
      ${field("notes", "Notes", `<textarea class="control" id="${id("notes")}"
        maxlength="5000" placeholder="Why this project is set up the way it is. Nothing
        reads this but the next person.">${v("notes")}</textarea>`)}
    </div>
    <div class="act formact">
      <!-- Primary, so which button commits is not a reading exercise. Cancel is beside
           it and says what it discards, because "Cancel" alone on a form somebody has
           been typing into for two minutes is not a promise anyone should have to
           guess at. -->
      <button class="btn primary" data-save="${p ? esc(projectKey(p)) : NEW}">${
        p ? "Save changes" : "Create project"}</button>
      <button class="btn" data-close-panel="1">Cancel${p ? " — discard edits" : ""}</button>
      ${p ? `<span class="grow"></span>
        <button class="btn" data-toggle-enabled="${esc(projectKey(p))}">${
          p.enabled ? "Disable" : "Enable"}</button>` : ""}
    </div>`;
}

// projectPath builds the API path for a project key, encoding each segment. The key
// is `platform/owner/repo` and every segment is validated server-side too, because a
// stray slash there produces a row no webhook delivery can ever match.
function projectPath(key) {
  const [platform, owner, repo] = key.split("/");
  return `/api/projects/${encodeURIComponent(platform)}` +
    `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
}

// AVATAR_MAX is the server's cap on an inlined badge, mirrored here so a file that will
// not fit is shrunk before it is sent rather than refused after.
const AVATAR_MAX = 16 * 1024;

// wireAvatarPickers turns the file input into a badge.
//
// The image is stored in the project row as a data: URI rather than as a file on disk.
// One binary in one sqlite row travels with the database, survives a restore, and needs
// no static route, no MIME sniffing on the way out, and no orphaned file when a project
// is deleted. The cost is a size cap, which is why anything large is rasterized first.
//
// SVG is kept as-is when it fits, because it is already small and stays sharp. Anything
// else — and any oversized SVG — is drawn onto a 64px canvas and exported as PNG, which
// takes a 2 MB photo to a few kilobytes. 64 is twice the rendered size, for a retina
// display, and nothing here is ever shown larger than a favicon.
function wireAvatarPickers(root) {
  for (const b of root.querySelectorAll("[data-pick]")) {
    const target = b.dataset.pick;
    const file = document.getElementById(`${target}-file`);
    b.onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files?.[0];
      if (!f) return;
      try {
        const value = await readAvatar(f);
        const input = document.getElementById(target);
        input.value = value;
        // The field was a text input until now if the project had no image. Re-render so
        // it becomes the image-plus-buttons form, with the new value in it.
        input.type = "hidden";
        b.textContent = "Replace";
        let shown = b.parentElement.querySelector(".ava-img img");
        if (!shown) {
          const span = document.createElement("span");
          span.className = "ava ava-img";
          span.innerHTML = `<img alt="" width="22" height="22">`;
          b.parentElement.insertBefore(span, b);
          shown = span.querySelector("img");
        }
        shown.src = value;
      } catch (e) {
        alert(`That image could not be used: ${e.message}`);
      }
    };
  }
  for (const b of root.querySelectorAll("[data-clearava]")) {
    b.onclick = () => {
      const input = document.getElementById(b.dataset.clearava);
      input.value = "";
      input.type = "text";
      b.parentElement.querySelector(".ava-img")?.remove();
      b.remove();
    };
  }
}

// readAvatar returns a data: URI small enough for the row.
function readAvatar(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("the file could not be read"));
    fr.onload = async () => {
      const raw = String(fr.result);
      if (file.type === "image/svg+xml" && raw.length <= AVATAR_MAX) {
        resolve(raw);
        return;
      }
      try {
        resolve(await rasterize(raw));
      } catch (e) {
        reject(e);
      }
    };
    fr.readAsDataURL(file);
  });
}

// rasterize draws a data URI onto a 64px canvas and returns a PNG data URI.
//
// Contain rather than cover, so a wide logo is letterboxed instead of cropped through
// the middle. Quality is stepped down only if the PNG is still too large, which for a
// 64px image effectively never happens.
function rasterize(dataURI) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error("that file is not an image this browser can draw"));
    img.onload = () => {
      const size = 64;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const scale = Math.min(size / img.width, size / img.height);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      ctx.drawImage(img, Math.round((size - w) / 2), Math.round((size - h) / 2), w, h);

      let out = c.toDataURL("image/png");
      if (out.length > AVATAR_MAX) out = c.toDataURL("image/jpeg", 0.8);
      if (out.length > AVATAR_MAX) {
        reject(new Error(`still ${Math.round(out.length / 1024)} KB after shrinking`));
        return;
      }
      resolve(out);
    };
    img.src = dataURI;
  });
}

// imageState is the last answer per image field, so save can refuse what the operator
// has already been told is wrong. Keyed by element id, because two forms can be open
// (a card's Build panel, and the add form) and each has its own field.
const imageState = {};

// wireImageCheck asks the daemon whether an image can be resolved, as it is typed.
//
// Debounced, because the registry round trip is a second or two and every keystroke of
// `node:24-bookworm-slim` would be a request. On blur as well as after the pause, since
// somebody who types and immediately clicks Save should not race the timer.
//
// A negative answer blocks the save. A build with an unresolvable image fails after the
// clone, minutes later, with docker's own "manifest unknown" in the middle of a log —
// and the operator's attention is here now.
function wireImageCheck(root) {
  for (const input of root.querySelectorAll(`[id$="image"], [id*="image-"]`)) {
    if (input.tagName !== "INPUT") continue;
    const out = document.getElementById(`${input.id}-check`);
    if (!out) continue;

    let timer = null;
    const check = async () => {
      const image = input.value.trim();
      delete imageState[input.id];
      if (!image) {
        // Blank is legal: it means the server default, which the daemon chose.
        out.className = "imgcheck";
        out.textContent = "";
        return;
      }
      out.className = "imgcheck";
      out.textContent = "checking…";
      try {
        const r = await api("POST", "/api/images/inspect", {image});
        imageState[input.id] = r;
        if (!r.checked) {
          out.className = "imgcheck";
          out.textContent = r.detail;
        } else if (r.found) {
          out.className = "imgcheck ok";
          out.textContent = r.local ? "found, already pulled" : "found in the registry";
        } else {
          out.className = "imgcheck bad";
          out.textContent = r.detail || "not found";
        }
      } catch (e) {
        // A failed check is not a failed image. Say so rather than blocking on it.
        imageState[input.id] = {checked: false};
        out.className = "imgcheck";
        out.textContent = `could not check: ${e.message}`;
      }
    };

    // The input is also the filter over the known-image list, which is why the panel
    // opens on focus rather than behind a separate control: there is one field, and
    // typing in it both narrows the list and sets the value.
    const panel = document.getElementById(`${input.id}-panel`);
    const showPanel = on => {
      if (!panel) return;
      panel.hidden = !on;
      input.setAttribute("aria-expanded", String(on));
    };
    const filterImages = () => {
      if (!panel) return;
      const needle = input.value.trim().toLowerCase();
      let shown = 0;
      for (const row of panel.querySelectorAll("[data-image]")) {
        const hit = !needle || row.dataset.image.toLowerCase().includes(needle);
        row.hidden = !hit;
        if (hit) shown++;
      }
      // Nothing matching is not an error here — the value is free text and a private
      // mirror will match nothing. The panel simply gets out of the way.
      showPanel(shown > 0);
    };

    input.onfocus = () => filterImages();
    input.oninput = () => {
      filterImages();
      clearTimeout(timer);
      timer = setTimeout(check, 600);
    };
    input.onchange = () => { clearTimeout(timer); check(); };
    input.onblur = () => {
      clearTimeout(timer);
      check();
      // Late enough for a click on a row to land first. A panel that closes on blur
      // closes before the click it was opened for.
      setTimeout(() => showPanel(false), 150);
    };
    input.onkeydown = e => {
      if (e.key === "Escape") showPanel(false);
      if (e.key === "Enter" && panel && !panel.hidden) {
        const first = [...panel.querySelectorAll("[data-image]")].find(r => !r.hidden);
        if (first) {
          e.preventDefault();
          first.click();
        }
      }
    };

    for (const row of panel?.querySelectorAll("[data-image]") || []) {
      row.onclick = () => {
        input.value = row.dataset.image;
        formDirty = true;
        showPanel(false);
        clearTimeout(timer);
        check();
      };
    }

    if (input.value.trim()) check();
  }
}

function wireProjectHandlers(s) {
  const el = document.getElementById("projects-body");
  const val = id => (document.getElementById(id)?.value || "").trim();

  // Any typing in an open panel makes it dirty. One listener on the container rather
  // than one per field, so a field added later is covered without anybody remembering.
