<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docpreview</title>
<style>
/* Surfaces, ink and the status palette come from a validated set. Dark mode is
   stepped deliberately rather than inverted, because an inverted palette puts
   saturated hues on a dark surface where they vibrate. */
:root {
  --plane:    #f9f9f7;
  --surface:  #fcfcfb;
  --raised:   #ffffff;
  --ink:      #0b0b0b;
  --ink-2:    #52514e;
  --muted:    #898781;
  --hairline: #e1e0d9;
  --ring:     rgba(11,11,11,0.10);

  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --idle:     #898781;

  --term-bg:  #14140f;
  --term-fg:  #d8d6cc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --plane:    #0d0d0d;
    --surface:  #1a1a19;
    --raised:   #222220;
    --ink:      #ffffff;
    --ink-2:    #c3c2b7;
    --hairline: #2c2c2a;
    --ring:     rgba(255,255,255,0.10);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 0 3rem;
  background: var(--plane); color: var(--ink);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
h1 { font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; font-weight: 650; }
h2 {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted); margin: 0 0 0.6rem; font-weight: 600;
}
h2 span { color: var(--ink-2); text-transform: none; letter-spacing: 0 }

/* ── Top bar ──────────────────────────────────────────────────────────────
   One horizontal strip instead of a grid of tiles. The counts are the same
   numbers; they just stop claiming a quarter of the first screen. */
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hairline);
}
.topbar .row {
  max-width: 96rem; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: 0.7rem 1.25rem;
}
.brand { display: flex; align-items: baseline; gap: 0.6rem; }
.brand .sub { color: var(--muted); font-size: 0.78rem; }
.grow { flex: 1 }

/* Segmented counters. A shared border and one radius on the ends reads as a
   single control — which it is: picking one deselects the others. */
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 0.8rem; line-height: 1;
  background: var(--surface); color: var(--ink-2);
  border: 0; border-left: 1px solid var(--ring);
  padding: 0.45rem 0.75rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.42rem; white-space: nowrap;
}
.seg button:first-child { border-left: 0 }
.seg button:hover { background: var(--raised) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--plane) }
.seg button[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px color-mix(in srgb, var(--plane) 35%, transparent) }
.seg .n { font-variant-numeric: tabular-nums; font-weight: 650 }
.seg .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--edge, var(--idle)); flex: none }
/* The Building counter turns while anything is building, so the fact that work
   is happening is visible without reading a number or finding the row. */
.seg .dot.work, .counts .dot.work {
  width: 10px; height: 10px; box-sizing: border-box; background: none;
  border: 2px solid transparent;
  border-top-color: var(--edge, var(--idle));
  border-right-color: var(--edge, var(--idle));
  animation: spin 0.7s linear infinite;
}
/* Reduced motion slows the spin rather than stopping it.
   Stopping it left a static ring that is indistinguishable from a decorative
   dot, so the one thing the spinner exists to say — work is happening right
   now — was silently dropped for anyone with the setting on, including anyone
   who has it on without knowing. A 10px ring at two and a half seconds is a
   long way from the fast rotation the guidance is aimed at, and the state is
   also carried by a word and a colour for anyone who needs no motion at all. */
@media (prefers-reduced-motion: reduce) {
  .seg .dot.work, .counts .dot.work { animation-duration: 2.4s }
}

.control {
  font: inherit; font-size: 0.82rem;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 8px;
  padding: 0.42rem 0.6rem;
}
.control:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
/* Secrets is a link to /secrets rather than a toggle, and an anchor is inline and
   underlined by default — both of which make it sit wrong beside the inputs. */
a.control { display: inline-block; text-decoration: none; line-height: normal }
/* A select rather than a chip per project: at three projects chips are nicer,
   at three hundred they are a wall. The search box beside it covers the case
   where you know the branch but not the project. */
select.control { max-width: 15rem }
input.control { width: 13rem }
input.control::placeholder { color: var(--muted) }

/* The admin links, present only on a local request — see showAdminLinks. Kept
   visually quieter than the filters beside them: they leave this page, and
   nothing on an operations screen should draw the eye toward a form for pasting
   a private key. */
.admin-nav { display: inline-flex; gap: 0.4rem }
.admin-nav .control { color: var(--muted); background: transparent; cursor: pointer }
.admin-nav .control:hover { color: var(--ink); background: var(--raised) }
.admin-nav .control:disabled { cursor: default; opacity: 0.6 }

/* ── Setup panel ────────────────────────────────────────────────────────── */
.setup { border-bottom: 1px solid var(--hairline); background: var(--surface) }
.setup-inner { max-width: 96rem; margin: 0 auto; padding: 1rem 1.25rem 1.25rem }

.sec {
  display: grid; grid-template-columns: minmax(0, 18rem) minmax(0, 1fr) auto;
  gap: 0.6rem; align-items: start;
  padding: 0.6rem 0; border-top: 1px solid var(--hairline);
}
.sec:first-of-type { border-top: 0 }
.sec .name { font-weight: 600; font-size: 0.85rem }
.sec .key { font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: var(--muted) }
.sec .hint { font-size: 0.76rem; color: var(--muted); margin-top: 0.15rem }
.sec textarea, .sec input[type=password] {
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  width: 100%; background: var(--raised); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 6px; padding: 0.4rem 0.5rem;
  resize: vertical;
}
.sec textarea { min-height: 2.4rem }
.sec .act { display: flex; gap: 0.35rem; align-items: center }

/* Set or missing, at a glance. A setup screen is a checklist. */
.flag {
  font-size: 0.7rem; font-weight: 600; white-space: nowrap;
  border: 1px solid var(--ring); border-radius: 999px; padding: 0.08rem 0.45rem;
}
.flag.on  { color: var(--good) }
.flag.off { color: var(--critical) }
.flag.opt { color: var(--muted) }

.notice {
  font-size: 0.8rem; border: 1px solid var(--ring); border-left: 3px solid var(--edge, var(--muted));
  border-radius: 6px; padding: 0.6rem 0.75rem; margin-bottom: 0.9rem; color: var(--ink-2);
}
.notice.bad  { --edge: var(--critical) }
.notice.warn { --edge: var(--warning) }
.notice.ok   { --edge: var(--good) }
.notice code { font: 12px/1.5 ui-monospace, Consolas, monospace }
.notice p { margin: 0.4rem 0 0 }

/* ── Project switcher ───────────────────────────────────────────────────────
   A trigger and a panel, rather than a <select>: a select shows one line, cannot be
   typed into, and cannot carry a badge, so a dozen near-identical repository names
   become a scrolling menu nobody can aim at. */
.picker { position: relative }
.pick-trigger {
  display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer;
  max-width: 16rem;
}
.pick-trigger .pick-label {
  display: inline-flex; align-items: center; gap: 0.35rem; min-width: 0;
}
.pick-trigger .pick-label > span {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pick-trigger .pick-caret { color: var(--muted); flex: none }
.pick-trigger .ava { width: 1.1rem; height: 1.1rem; border-radius: 4px; font-size: 0.6rem }

.pick-panel {
  position: absolute; z-index: 40; top: calc(100% + 0.3rem); left: 0;
  width: 20rem; max-width: 90vw;
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  box-shadow: 0 12px 32px rgb(0 0 0 / 0.14);
  overflow: hidden;
}
.pick-search { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--hairline) }
.pick-search input {
  flex: 1; min-width: 0; font: inherit; font-size: 0.85rem;
  background: transparent; color: var(--ink); border: 0; outline: none;
}
.pick-search kbd {
  font: 10px/1.6 ui-monospace, Consolas, monospace; color: var(--muted);
  border: 1px solid var(--ring); border-radius: 4px; padding: 0 0.25rem;
}
/* Bounded, because the list is as long as somebody's project count and the panel
   floats over the page. */
.pick-list { max-height: 18rem; overflow: auto; padding: 0.25rem }
.pick-row {
  display: flex; align-items: center; gap: 0.5rem; width: 100%;
  padding: 0.4rem 0.45rem; border: 0; border-radius: 6px;
  background: transparent; color: var(--ink); font: inherit; font-size: 0.85rem;
  text-align: left; cursor: pointer; text-decoration: none;
}
.pick-row:hover, .pick-row.here { background: var(--raised) }
.pick-row.here { font-weight: 600 }
.pick-row .count { margin-left: auto; color: var(--muted); font-size: 0.75rem }
.pick-row.add { border-top: 1px solid var(--hairline); border-radius: 0; margin-top: 0.25rem;
  padding-top: 0.5rem; color: var(--ink-2) }
.pick-empty { padding: 0.7rem 0.5rem; color: var(--muted); font-size: 0.8rem }

/* The image field is the same panel, anchored under a text box that is also the filter.
   Full width of the field rather than a fixed 20rem, because image references are long
   and truncating the thing you are choosing between defeats the point. */
.imgpick { display: block }
.imgpick .pick-panel { width: 100%; top: calc(100% - 1.4rem) }
.imgpick .pick-row { font: 12px/1.5 ui-monospace, Consolas, monospace }
.imgpick .pick-row .count { font-family: inherit; font-size: 11px }

/* ── Projects ───────────────────────────────────────────────────────────── */

/* One card per project, because a project is a block of related facts and the
   three-column .sec grid squeezed them into a column narrow enough that a
   `·`-joined line wrapped mid-value — `output:` ending one line and `build`
   starting the next, which reads as a field called build. */
/* `pcard`, not `proj`, and that is not a style preference. `.proj` is already the
   project name inside a previews row (`renderRow`), so a `.proj` rule here put a
   bordered, padded box around the project name on the operations dashboard — a page
   this CSS was not written for and nobody was looking at while writing it.

   Second time this stylesheet has been bitten by a generic class name; see the note on
   `.row .go` above. One document, one namespace, no scoping by accident. */
.pcard {
  border: 1px solid var(--ring); border-radius: 8px; background: var(--surface);
  padding: 0.7rem 0.85rem; margin-bottom: 0.6rem;
}
.pcard-head { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap }
.pcard-head .name { font-weight: 600; font-size: 0.9rem }
.pcard-head .sub { font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: var(--muted) }
.pcard-head .grow { flex: 1 }
.pcard-off { opacity: 0.6 }

/* A badge, not a fetched image. Two characters or an emoji, on a colour derived from
   the name so it is stable without being stored. */
.ava {
  flex: none; width: 1.9rem; height: 1.9rem; border-radius: 7px;
  display: grid; place-items: center;
  font-size: 0.95rem; line-height: 1; font-weight: 600;
  border: 1px solid var(--ring); color: var(--ink);
}
/* An inlined logo gets no tinted background: it brings its own, and a derived hue
   behind it fights whatever the icon was designed against. */
.ava-img { background: none !important; border-color: var(--hairline) !important; overflow: hidden }
.ava-img img { display: block; width: 22px; height: 22px; object-fit: contain }

/* One property per line: label in a fixed left column, value beside it. Read down,
   not across.

   Three arrangements have been tried here. A `·`-joined line wrapped mid-value, so
   `output:` ended one line and `build` started the next and read as a field called
   build. Label-over-value in auto-filled columns fixed that and produced a row of
   four headings that reads as a table of one row. This is the third: a column of
   properties, which is what a card of settings is. */
.facts { margin: 0.5rem 0 0 }
.facts > div {
  display: grid; grid-template-columns: 9.5rem minmax(0, 1fr);
  gap: 0.5rem; padding: 0.12rem 0;
}
.facts dt { font-size: 0.74rem; color: var(--muted) }
.facts dd {
  margin: 0; font: 12px/1.45 ui-monospace, Consolas, monospace;
  color: var(--ink); overflow-wrap: anywhere;
}
.facts dd.inherit { font-family: inherit; font-size: 0.78rem; color: var(--muted) }
@media (max-width: 34rem) {
  /* Two columns of 9.5rem do not fit a phone, and a squeezed value column is the
     wrapping problem again. */
  .facts > div { grid-template-columns: minmax(0, 1fr) }
  .facts dt { margin-top: 0.3rem }
}

/* An environment variable is a name, a state and a way to remove it. Chips,
   because the set is small and the names are long. */
.envs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem }
.env {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font: 11.5px/1.6 ui-monospace, Consolas, monospace;
  border: 1px solid var(--ring); border-radius: 999px; padding: 0.05rem 0.2rem 0.05rem 0.5rem;
}
.env.inherited { color: var(--muted); padding-right: 0.5rem }
.env button {
  border: 0; background: none; color: var(--muted); cursor: pointer;
  font: inherit; padding: 0 0.25rem; border-radius: 999px;
}
.env button:hover { color: var(--critical) }

.panel { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--hairline) }
.panel h3 {
  margin: 0 0 0.4rem; font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); font-weight: 600;
}
/* A form is filled top to bottom, so it is one column of rows: label on the left,
   control on the right, capped at a readable width. Eleven fields across the full
   width of a monitor put seven of them on one line and turned a form into a
   spreadsheet — and the eye has to travel the whole screen between a label and the
   thing it labels. */
.grid-form { max-width: 52rem }
/* Wider where there is room. A build command is a shell line and a container image is a
   registry path — both routinely longer than 52rem shows, and a field you have to
   scroll horizontally to read is a field you cannot check. */
@media (min-width: 1000px) { .grid-form { max-width: 72rem } }
@media (min-width: 1400px) { .grid-form { max-width: 88rem } }
.field {
  display: grid; grid-template-columns: 10.5rem minmax(0, 1fr);
  gap: 0.6rem; align-items: center; padding: 0.22rem 0;
}
.field-note { text-transform: none; letter-spacing: 0; font-weight: 400 }
.backlink { margin: 0 0 0.5rem; font-size: 0.82rem }
.avafield { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap }

/* The form's own actions, set apart from the fields above them so the row that commits
   is not just more controls in a column of controls. */
.formact {
  margin-top: 0.8rem; padding-top: 0.7rem; border-top: 1px solid var(--hairline);
  max-width: 52rem;
}
.btn.primary {
  background: var(--ink); color: var(--plane); border-color: var(--ink); font-weight: 600;
}
.btn.primary:hover { opacity: 0.9 }
/* Destructive, and it borrows the failed colour rather than inventing one: red on this
   page already means a build that is not going to finish, which is what this makes. */
.btn.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, var(--ring)) }
.btn.danger:hover { border-color: var(--critical) }
/* Toasts. Fixed, so nothing in the document moves when one appears — a banner that pushes
   a list down is its own small confusion, and the list is what somebody is reading. */
#toasts {
  position: fixed; z-index: 60; top: 0.9rem; right: 0.9rem;
  display: flex; flex-direction: column; gap: 0.4rem; pointer-events: none;
}
.toast {
  background: var(--ink); color: var(--plane);
  font-size: 0.82rem; font-weight: 500;
  padding: 0.5rem 0.75rem; border-radius: 8px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
  max-width: 22rem;
  animation: toastin 140ms ease-out, fadeout 5s ease-in forwards;
}
@keyframes toastin { from { opacity: 0; transform: translateY(-0.4rem) } to { opacity: 1 } }
@keyframes fadeout { 0%, 82% { opacity: 1 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none } }
/* Column 2, like .why. Without this it was a third child of a two-column grid, so it
   wrapped into the *label* column of the next row — docker's error rendered where a
   field name belongs, in 0.74rem, which is how "errors:" ended up looking like a
   label. */
.imgcheck { grid-column: 2; font-size: 0.78rem; margin-top: 0.3rem; color: var(--muted) }
.imgcheck.ok  { color: var(--good) }
/* A wrong image fails the build minutes later with docker's message buried in a log.
   It gets a box, because this is the one moment somebody is looking. */
.imgcheck.bad {
  color: var(--critical); font-weight: 600;
  border: 1px solid var(--critical); border-radius: 6px;
  padding: 0.3rem 0.45rem; background: color-mix(in srgb, var(--critical) 7%, transparent);
}
.field > label { font-size: 0.78rem; color: var(--ink-2) }
.field .why { grid-column: 2; font-size: 0.72rem; color: var(--muted); margin-top: -0.1rem }
.field textarea {
  font: inherit; font-size: 0.82rem; width: 100%; min-height: 4.5rem; resize: vertical;
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 6px; padding: 0.4rem 0.5rem;
}
.field-head {
  margin: 0.8rem 0 0.3rem; font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); font-weight: 600;
}
.field-head:first-child { margin-top: 0 }
@media (max-width: 40rem) {
  .field { grid-template-columns: minmax(0, 1fr); gap: 0.15rem }
  .field .why { grid-column: 1 }
}

/* ── Layout ─────────────────────────────────────────────────────────────── */
.wrap {
  max-width: 96rem; margin: 0 auto; padding: 1.25rem;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem;
}
@media (min-width: 68rem) {
  .wrap { grid-template-columns: minmax(0, 1fr) 21rem; align-items: start; }
}

/* ── Accordion ──────────────────────────────────────────────────────────── */
.list {
  border: 1px solid var(--ring); border-radius: 10px;
  background: var(--surface); overflow: hidden;
}
.item { border-top: 1px solid var(--hairline) }
.item:first-child { border-top: 0 }

/* The row is the toggle plus the preview link, side by side. Separate elements
   because an anchor inside a button is invalid markup and would both navigate
   and toggle. */
.row { display: flex; align-items: stretch }
.row .head { flex: 1; min-width: 0 }

/* Scoped to .row on purpose. Unscoped, `.go:not([href])` also matched the
   activity rail's entry buttons — which have no href because they are buttons —
   and greyed the whole panel out at 0.3 opacity with pointer-events: none. A
   generic class name in a single stylesheet is a collision waiting for its
   second user. */
.row .go {
  display: flex; align-items: center; white-space: nowrap;
  font-size: 0.75rem; font-weight: 600; text-decoration: none;
  color: var(--ink-2); padding: 0 0.9rem 0 0.6rem;
  border-left: 1px solid var(--hairline);
}
.row .go[href]:hover { color: var(--ink); text-decoration: underline }
/* The pull request link borrows Open's look — same border-left, same padding — because
   they are the same kind of thing in the same strip. Quieter, because Open is what
   somebody reaches for from a list of previews and this is the secondary destination. */
.row .go.pr {
  color: var(--muted); font-weight: 500;
  /* Fixed width, sized for five digits, so Open starts at the same x on every row. Sized
     rather than shrink-to-fit because the content is a pull request number: #4 and #145
     differ by two characters, which moved Open two characters left on one row and made a
     column of them look ragged. Five digits covers a repository with 99999 pull requests;
     beyond that it grows rather than truncating, because a wrong number is worse than a
     misaligned one. */
  min-width: 5.6rem;
  justify-content: center;
  gap: 0.3rem;
  font-variant-numeric: tabular-nums;
}
.row .go.pr svg { flex: none; opacity: 0.75 }
.row .go.pr:hover svg { opacity: 1 }
.row .go.pr:hover { color: var(--ink-2) }
/* An anchor with no href is not a link, which is the wanted state before a
   build has produced anything. Styling follows from that fact rather than from
   a `disabled` attribute anchors ignore. */
.row .go:not([href]) { opacity: 0.3; cursor: default; pointer-events: none }

.head {
  width: 100%; font: inherit; color: inherit; text-align: left;
  background: transparent; border: 0; cursor: pointer;
  display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto auto auto;
  align-items: center; gap: 0.75rem;
  padding: 0.62rem 0.9rem;
  border-left: 3px solid var(--edge, var(--idle));
}

/* Per-state counts for the project, on the row itself. Colour plus number,
   with the state named in the tooltip — a bare coloured number is a quiz. */
.counts { display: flex; gap: 0.3rem; align-items: center }
.counts .chip {
  display: inline-flex; align-items: center; gap: 0.25rem;
  font-size: 0.72rem; font-variant-numeric: tabular-nums; color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 5px; padding: 0.05rem 0.32rem;
}
.counts .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--edge, var(--idle)) }
@media (max-width: 52rem) { .counts { display: none } }

/* ── Under 1000px ───────────────────────────────────────────────────────────
   The layout already stacks at 68rem and the header and toolbar already wrap, so
   nothing here is structural. What remains is everything sized for a mouse and a
   wide viewport: controls that assumed room beside each other, fixed-height panes
   that eat a phone screen, and a copy button positioned for a desktop scrollbar. */
@media (max-width: 62.5rem) {
  .wrap { padding: 0.75rem; gap: 0.75rem }
  .topbar .row { gap: 0.6rem; padding: 0.6rem 0.75rem }

  /* Full width, each on its own line. Side by side at this width they were two
     truncated controls instead of one usable one. */
  #projpick, .pick-trigger, input#search { width: 100%; max-width: none }
  /* The panel is anchored to the trigger, which is now full width, so it can be too. */
  .pick-panel { width: 100% }

  /* The counters scroll rather than wrap. Wrapping reflowed the header every time
     a build changed state, which moved everything under it while being read. */
  .seg {
    display: flex; width: 100%;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none }
  .seg button { flex: 1 0 auto; padding: 0.45rem 0.6rem }

  /* A phone gets a taller log because there is nothing beside it competing for
     the screen, and Expand becomes nearly the whole viewport. */
  pre.term { height: 20rem; font-size: 12px }
  pre.term.tall { height: 75vh }

  /* Touch has no hover, so the copy button would never appear. Show it always,
     make it a touch target, and move it clear of a narrow scrollbar. */
  .termwrap .copy {
    opacity: 1; pointer-events: auto;
    width: 2.25rem; height: 2.25rem;
    top: 0.4rem; right: 0.4rem;
  }
  .termwrap .copy svg { width: 1.1rem; height: 1.1rem }

  /* Selects take the row; the buttons share the next one. */
  .logbar select.control.sm { flex: 1 1 100%; max-width: none }
  .logbar .grow, .logfoot .grow { display: none }
  .logbar .btn, .logfoot .btn { flex: 1 1 auto; text-align: center }

  /* The go-to-preview link stops being a narrow column beside the row title and
     becomes a full-width tap target under it. */
  .row { flex-wrap: wrap }
  .row .head { flex: 1 1 100% }
  .row .go {
    flex: 1 1 100%; justify-content: center;
    border-left: 0; border-top: 1px solid var(--hairline);
    padding: 0.55rem 0.9rem;
  }
}
.head:hover { background: var(--raised) }
.head:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px }
.item.open .row { background: var(--raised) }

.caret { color: var(--muted); transition: transform 0.12s ease; font-size: 0.7rem }
.item.open .caret { transform: rotate(90deg) }
@media (prefers-reduced-motion: reduce) { .caret { transition: none } }

.who { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0 }
.who .proj { font-weight: 600 }
.who .num { color: var(--muted); font-weight: 400 }
.who .branch {
  font: 12.5px/1.4 ui-monospace, Consolas, monospace; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.when { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums }

.pill {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.72rem; font-weight: 600; color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 999px;
  padding: 0.12rem 0.5rem 0.12rem 0.4rem; white-space: nowrap;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--edge, var(--idle)); flex: none }
/* Building gets a real spinner rather than a pulsing dot. A dot that fades is
   ambiguous — it reads as "stale" as easily as "working" — where rotation only
   means one thing. Queued keeps the pulse: it is waiting, not working, and the
   two states should not look identical.

   Drawn with a border rather than an SVG or a font: one element, no request,
   and it inherits the state colour it is already being given. */
.pill.spin .dot { animation: pulse 1.1s ease-in-out infinite }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.2 } }

.pill.work .dot {
  width: 11px; height: 11px; box-sizing: border-box;
  background: none;
  /* A transparent track and two lit sides: a 180° arc, which reads as motion
     at this size where a single lit side reads as a flicker.
     Deliberately not color-mix() for the track. --edge is set inline and its
     value is itself a var(), and color-mix does not reliably resolve that
     second indirection — when it fails the whole border declaration is
     dropped, leaving an 11px transparent box and no spinner at all. That is
     the bug this replaced. */
  border: 2px solid transparent;
  border-top-color: var(--edge, var(--idle));
  border-right-color: var(--edge, var(--idle));
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* Reduced motion keeps the distinction without the movement: the ring stays,
   it just stops turning. */
@media (prefers-reduced-motion: reduce) {
  .pill.spin .dot { animation: none }
  .pill.work .dot { animation-duration: 2.4s }
}

.body { padding: 0 0.9rem 0.9rem 1.55rem }
.reason {
  font-size: 0.78rem; color: var(--critical);
  padding: 0 0.9rem 0.6rem 1.55rem; overflow-wrap: anywhere;
}

.logbar {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  padding: 0 0 0.5rem;
}
.logbar .grow { flex: 1 }

/* The view controls, under the pane they act on. Separated from the row's Open
   button, which is the control anybody reaches for most and used to sit a few
   pixels away — see the markup for why that mattered. */
.logfoot {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  padding: 0.5rem 0 0;
}
.logfoot .grow { flex: 1 }
select.control.sm {
  font-size: 0.75rem; padding: 0.2rem 0.4rem; max-width: 24rem;
}
select.control.sm:disabled { opacity: 0.6 }
.btn {
  font: inherit; font-size: 0.75rem;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 6px;
  padding: 0.22rem 0.55rem; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--muted) }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink) }
a.btn:not([href]) { opacity: 0.45; cursor: default; pointer-events: none }

/* What the pane is showing, above the pane. A log with no label is assumed to
   belong to the row it is under, which is wrong for every state except
   building. */
.logstate {
  font-size: 0.72rem; padding: 0 0 0.4rem; color: var(--muted);
  display: flex; align-items: center; gap: 0.4rem;
}
.logstate:empty { display: none }
.logstate::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex: none;
}
.logstate.live { color: var(--good) }
.logstate.past { color: var(--muted) }
.logstate.none { color: var(--muted) }

/* The log is a fixed, modest height by default. The old page gave it 30rem
   whether or not anything was in it, which pushed everything else off screen.
   Tall is one click away for when you actually need it. */
pre.term {
  margin: 0; padding: 0.7rem 0.8rem;
  background: var(--term-bg); color: var(--term-fg);
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  border-radius: 8px;
  height: 15rem; overflow: auto;
  white-space: pre-wrap; word-break: break-word;
}
pre.term.tall { height: 34rem }

/* A pane with nothing to show does not get a 15rem black rectangle.

   A skipped build is the common case and the one that looked broken: the row said
   Skipped, a 0.72rem grey line said "no build log", and below it sat an empty terminal
   the size of the screen. Three signals, none of them the one that matters — *why* it was
   skipped, which the daemon knew all along and put in the pull request comment.

   Auto height and a light background, because this is prose rather than output. */
pre.term.empty {
  height: auto; min-height: 0; padding: 1.1rem 1rem;
  background: var(--raised); color: var(--ink-2);
  font: inherit; font-size: 0.84rem; white-space: normal;
  border: 1px solid var(--hairline);
}
pre.term.empty strong { color: var(--ink); display: block; margin-bottom: 0.25rem }
pre.term.empty .reason { color: var(--ink-2) }
pre.term.empty .why { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.45rem }

/* The copy button floats over the log rather than sitting in the toolbar.
   Reaching for it happens while reading the scrollback, so that is where it
   should be — and a log pane has no spare horizontal room in the bar above it.

   Hidden until the pointer is in the pane, or the button itself has keyboard
   focus. Permanently visible, it covers the first line of output. */
.termwrap { position: relative }
.termwrap .copy {
  position: absolute; top: 0.5rem;
  /* Clear of the scrollbar. At 0.75rem the button straddled the scrollbar gutter
     and looked like it belonged to the page rather than to the log. */
  right: 1.6rem;
  opacity: 0; pointer-events: none;
  transition: opacity 120ms ease;
  display: grid; place-items: center;
  width: 1.75rem; height: 1.75rem;
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 6px;
  padding: 0; cursor: pointer;
}
.termwrap .copy svg { width: 0.95rem; height: 0.95rem; display: block }
/* focus-within rather than :focus, so tabbing to it reveals it. */
.termwrap:hover .copy,
.termwrap:focus-within .copy { opacity: 1; pointer-events: auto }
.termwrap .copy:hover { border-color: var(--ink) }
pre.term .cmd { color: #9fd2ff }
pre.term .err { color: #ff9a8c }
pre.term .mask { color: var(--warning); font-weight: 700 }

/* ── Right rail ─────────────────────────────────────────────────────────── */
.rail { position: sticky; top: 4rem }
.rail .card {
  border: 1px solid var(--ring); border-radius: 10px;
  background: var(--surface); padding: 0.85rem;
}
/* Kind filters for the feed. Its own control rather than reusing the top
   counters: those count previews as they are now, these narrow a history, and
   a single filter driving both would mean picking Failed emptied the feed of
   the queued and building rows that led to the failure. */
.feed-filters {
  display: flex; gap: 0.3rem; flex-wrap: wrap;
  padding-bottom: 0.6rem; margin-bottom: 0.5rem;
  border-bottom: 1px solid var(--hairline);
}
.feed-filters button {
  font: inherit; font-size: 0.7rem; line-height: 1;
  display: inline-flex; align-items: center; gap: 0.28rem;
  background: var(--raised); color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 999px;
  padding: 0.22rem 0.5rem; cursor: pointer;
}
.feed-filters button:hover { border-color: var(--muted) }
.feed-filters button[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink) }
.feed-filters .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--edge, var(--idle)) }
.feed-filters .c { opacity: 0.6; font-variant-numeric: tabular-nums }

.feed { max-height: 30rem; overflow: auto; margin: -0.2rem -0.3rem 0; padding: 0 0.3rem }
.ev {
  display: grid; grid-template-columns: 3.6rem minmax(0, 1fr);
  gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--hairline);
  font-size: 0.79rem; align-items: baseline;
}
.ev:last-child { border-bottom: 0 }

/* Feedback for a click that changed nothing else. Every preview of one repository
   shares a project row, so clicking an activity entry for the preview already
   showing leaves the page identical — and silence is indistinguishable from a dead
   button. The outline is on the row rather than the entry because the row is what
   the click was about. */
@keyframes flash {
  from { box-shadow: inset 0 0 0 2px var(--ink) }
  to   { box-shadow: inset 0 0 0 2px transparent }
}
.item.flash { animation: flash 0.6s ease-out }
/* An animation is the whole mechanism here, so with motion suppressed the feedback
   has to be something static that still ends — a border that never clears would
   leave the row looking permanently selected. */
@media (prefers-reduced-motion: reduce) {
  .item.flash { animation: flash 0.6s steps(2, jump-none) }
}

/* An entry with something left to open. The affordance is the hover rather than a
   different shape, because a rail of twenty buttons reads as a menu rather than as
   a history. */
.ev.linked {
  cursor: pointer;
  margin: 0 -0.3rem; padding: 0.4rem 0.3rem; width: calc(100% + 0.6rem);
}
.ev.linked:hover { background: var(--raised) }
.ev.linked:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px }
.ev.linked:hover .k { text-decoration: underline }

/* Copy the commit. Hidden until the row is hovered or the button itself is
   focused: one of these per row, always visible, turns the rail into a column of
   icons and buries the history it exists to show. Kept reachable by keyboard —
   :focus-within covers tabbing to it. */
.evcopy {
  border: 0; background: none; padding: 0 0.15rem; margin-left: 0.1rem;
  color: var(--muted); cursor: pointer; vertical-align: -0.15em;
  opacity: 0; transition: opacity 0.1s;
}
.ev:hover .evcopy, .ev:focus-within .evcopy { opacity: 1 }
.evcopy:hover { color: var(--ink) }
.evcopy svg { width: 12px; height: 12px; display: block }
@media (hover: none) {
  /* No hover to reveal it on a touch screen. */
  .evcopy { opacity: 1 }
}

/* The entry whose build is on screen. Some clicks change nothing else — an entry
   naming the build already showing leaves the page identical — so this is the only
   confirmation those clicks can give. It also answers "which of these am I looking
   at", which the feed could not say before.

   A left bar in the entry's own state colour, rather than a background: the rail is
   dense, and a filled row at this size reads as a different kind of entry instead of
   as the selected one. */
.ev.sel { box-shadow: inset 3px 0 0 var(--edge, var(--ink)) }
.ev.sel .k { color: var(--ink) }
button.ev.sel { background: var(--raised) }

/* An entry with nothing left to open. Dimmed rather than removed: the history is
   the point of the rail, and a build that ran is worth knowing about after its
   artifacts have been pruned. Dimmed rather than merely non-clickable, because a
   row that looks identical to its clickable neighbours and does nothing is the
   thing this whole rail was reported for twice. */
div.ev { opacity: 0.55 }
div.ev .k { font-weight: 500 }
.ev .t {
  color: var(--muted); font: 11px/1.5 ui-monospace, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.ev .l1 { display: flex; align-items: baseline; gap: 0.35rem; min-width: 0 }
.ev .l1 .k { font-weight: 600; color: var(--ink-2); white-space: nowrap }
.ev .l1 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--edge, var(--idle)); flex: none }
.ev .l2 { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ev code { font: 11px/1.4 ui-monospace, Consolas, monospace }

.empty { padding: 2rem 1rem; text-align: center; color: var(--muted); font-size: 0.86rem }
.empty code { font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--ink-2) }

footer {
  max-width: 96rem; margin: 1.5rem auto 0; padding: 0 1.25rem;
  color: var(--muted); font-size: 0.75rem;
}
.live { color: var(--good) } .stale { color: var(--critical) }

/* Last in the sheet, and !important, because `[hidden]` loses to any author rule
   that sets display — and .wrap sets grid. So `el.hidden = true` on it did nothing,
   and the previews and activity sections rendered under both admin pages with
   nothing in them: half a page of empty operations chrome below a form, which was
   most of why /projects read as noise.

   !important alone is enough in a browser. Last as well, because the DOM used by
   tools/dashboardtest/projects.mjs resolves the cascade by document order and would
   otherwise disagree with every real browser about whether this page is correct. */
[hidden] { display: none !important }
</style>
</head>
<body>

<div class="topbar">
  <div class="row">
    <div class="brand">
      <h1>docpreview</h1>
      <span class="sub" id="exposer">&nbsp;</span>
    </div>
    <div class="seg" id="counters"></div>
    <span class="grow"></span>
    <!-- The project scope is a searchable list, not a <select>.

         A select shows one line at a time, cannot be typed into, and cannot carry a
         badge — so at a dozen projects it becomes a scrolling menu of near-identical
         repository names. This is the shape Vercel uses for the same problem: a trigger
         showing the current scope, and a panel with a filter, the projects with their
         badges, and a way to add one. -->
    <div class="picker" id="projpick">
      <button class="control pick-trigger" id="projpick-btn" aria-haspopup="listbox"
        aria-expanded="false">
        <span class="pick-label">All projects</span>
        <span class="pick-caret" aria-hidden="true">⌄</span>
      </button>
      <div class="pick-panel" id="projpick-panel" hidden>
        <div class="pick-search">
          <input type="search" id="projpick-find" placeholder="Find project…"
            aria-label="Find project" autocomplete="off">
          <kbd>Esc</kbd>
        </div>
        <div class="pick-list" id="projpick-list" role="listbox"></div>
      </div>
    </div>
    <input class="control" id="search" type="search" placeholder="branch, PR, project…" aria-label="Filter">
    <!-- The admin links appear only for a request the daemon accepts writes from,
         and it answers that question itself: /api/admin is gated by the same
         isLocalRequest the write endpoints use, and is absent from the
         dashboard-only proxy's allowlist, so a tunnelled page's fetch 404s.

         Hiding a link is not a security boundary and is not doing any work as
         one — the gate is on the server, and typing /secrets from a tunnel still
         gets nowhere. This is about not offering an operator a control that will
         answer 403. -->
    <span class="admin-nav" id="admin-nav" hidden></span>

  </div>
</div>

<!-- The secrets panel lives on /secrets, not here. A credential form permanently
     occupying the top of an operations dashboard invites pasting into it by
     reflex, and a separate address is something a proxy or an authentication
     layer can gate — a panel inside "/" is not.

     Same document either way, switched on pathname below. -->
<div class="setup" id="setup" hidden>
  <div class="setup-inner">
    <!-- The vault's path is a detail of where the daemon keeps its files, not
         something anyone acts on from here. It stays as a tooltip: findable
         when you are debugging, absent when you are not. -->
    <!-- The way out goes above the content, not below it. Below, it is past a form
         eleven fields long and past however many project cards exist, so on any real
         page it is off screen — a page with no visible way back reads as a dead end. -->
    <p class="backlink"><a href="/">← back to previews</a></p>
    <h2 id="setup-head">Secrets</h2>
    <div id="setup-body"></div>
  </div>
</div>

<!-- Projects, on /projects. Same arrangement as the secrets panel: one document,
     switched on pathname, so the styles and the fetch helper exist once. -->
<div class="setup" id="projects" hidden>
  <div class="setup-inner">
    <p class="backlink"><a href="/">← back to previews</a></p>
    <h2>Projects</h2>
    <div id="projects-body"></div>
  </div>
</div>

<div class="wrap">
  <div>
    <h2 id="list-heading">Previews</h2>
    <div class="list" id="list"></div>
  </div>

  <aside class="rail">
    <h2>Activity · <span id="feed-scope">all projects</span></h2>
    <div class="card">
      <div class="feed-filters" id="feed-filters"></div>
      <div class="feed" id="events"></div>
    </div>
  </aside>
</div>

<footer>
  <span id="conn" class="live">connecting…</span> ·
  <a href="/status">/status</a> · <a href="/pr">/pr</a>
</footer>

<script>
"use strict";

const STATE = {
  ready:       {label: "Ready",    color: "var(--good)"},
  // work spins, spin pulses. Building is doing something; queued is waiting for
  // a worker, and the two must not look the same.
  building:    {label: "Building", color: "var(--warning)", work: true},
  queued:      {label: "Queued",   color: "var(--idle)",    spin: true},
  skipped:     {label: "Skipped",  color: "var(--idle)"},
  failed:      {label: "Failed",   color: "var(--critical)"},
  "torn-down": {label: "Removed",  color: "var(--idle)"},
  log:         {label: "Log",      color: "var(--idle)"},
};
const state = k => STATE[k] || {label: k || "unknown", color: "var(--idle)"};

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Escaping closes attribute breakout but not scheme abuse: `javascript:` and
// `data:` survive it intact. Preview URLs come from the exposer rather than
// from a pull request, so this is not reachable today — but the rule belongs
// with the render, not with an assumption about who writes the value.
const safeURL = u => /^https?:\/\//i.test(String(u ?? "")) ? String(u) : "";

const ago = iso => {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60)    return Math.floor(s) + "s";
  if (s < 3600)  return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
};
const clock = iso => new Date(iso).toLocaleTimeString([], {hour12: false});

/* secs renders a duration. Minutes and seconds rather than a bare count, because the
   numbers that matter here are a warm install at 40s and a cold one at 6m20s, and "380s"
   makes the reader do the division. */
const secs = n => {
  n = Math.max(0, Math.round(Number(n) || 0));
  if (n < 60) return `${n}s`;
  const m = Math.floor(n / 60);
  const s = n % 60;
  return s ? `${m}m${s}s` : `${m}m`;
};

const project = p => String(p.repo || "").split("/").pop() || "unknown";


const ui = {
  state: null,        // null means every state
  kind: null,         // activity-feed filter; null means every kind
  project: "",        // "" means every project
  query: "",          // free-text filter
  open: null,         // project name whose row is expanded
  pick: {},           // project -> preview id being looked at, when not the newest
  // preview id -> build id being read, when not the current one. Keyed by preview
  // rather than by project so switching previews and switching back does not
  // silently drop you onto a different build than the one you were reading.
  build: {},
  builds: {},         // preview id -> the build list last fetched for it
  // The timestamp of the activity entry that was clicked.
  //
  // Marked in the feed because there are clicks that change nothing else: every
  // preview of one repository shares a project row, so an entry naming the build
  // already showing leaves the page identical. Without a mark, those clicks are
  // indistinguishable from a dead button — which is how they were reported.
  //
  // Keyed on the timestamp, which is unique per entry, rather than on preview and
  // commit. An attempt that is still running has two entries — queued and building
  // — and keying on the attempt marked both, so clicking between them changed
  // nothing again. One entry marked means every click moves the mark.
  evPick: null,
  follow: true,
  tall: false,
  autoScrolling: false,
  shownOnce: null,      // a just-minted secret, rendered once and then dropped
  buffer: "",         // rendered log html, so a redraw need not replay the stream
  previews: [],
  events: [],
  status: {},
  logSource: null,
  logFor: null,       // preview id the open stream belongs to
  // The preview timestamp a reconnect was last done for, so it happens once per transition.
  // See updateBody.
  reconnectedAt: null,
};

// Inline SVG rather than an icon font or an emoji. A font is a network request
// for two glyphs, and 📋 renders as a different picture on every platform and at
// a size nothing here controls.
//
// stroke=currentColor so both follow the button's colour in light and dark mode.
const ICON_COPY =
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
     <rect x="9" y="9" width="11" height="11" rx="2"></rect>
     <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
   </svg>`;

const ICON_CHECK =
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
     <path d="M20 6 9 17l-5-5"></path>
   </svg>`;

const ORDER = ["failed", "building", "queued", "ready"];

function matches(p) {
  if (ui.state && p.state !== ui.state) return false;
  if (ui.project && project(p) !== ui.project) return false;
  if (!ui.query) return true;
  const hay = `${project(p)} ${p.branch} #${p.number} ${p.name || ""}`.toLowerCase();
  return hay.includes(ui.query);
}

// One row per project rather than one per preview.
//
// A project with a dozen open pull requests produced a dozen rows that all said
// the same project name, and the list stopped being scannable at exactly the
// point it started being useful. The row now carries the project's newest
// preview and a count of everything else it has; the older ones are a dropdown
// inside, so they are one click away instead of permanently in the way.
//
// "Newest" is by state first, then time: a failure nobody has looked at is more
// interesting than a build that went green a minute later, and a project whose
// row says Ready while one of its branches is broken is a lie of omission.
function groups() {
  const by = new Map();
  for (const p of ui.previews.filter(matches)) {
    const k = project(p);
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(p);
  }

  const rank = p => {
    const i = ORDER.indexOf(p.state);
    return i < 0 ? ORDER.length : i;
  };

  const out = [];
  for (const [name, list] of by) {
    list.sort((a, b) =>
      rank(a) - rank(b) || new Date(b.updated_at) - new Date(a.updated_at));

    const counts = {};
    for (const p of list) counts[p.state] = (counts[p.state] || 0) + 1;

    const picked = list.find(p => p.preview_id === ui.pick[name]) || list[0];
    out.push({name, list, counts, current: picked});
  }
  out.sort((a, b) => rank(a.current) - rank(b.current) || a.name.localeCompare(b.name));
  return out;
}

/* ── Counters ─────────────────────────────────────────────────────────── */

function renderCounters() {
  const by = k => ui.previews.filter(p => p.state === k).length;
  const cells = [
    {label: "All",      n: ui.previews.length, key: null},
    {label: "Ready",    n: by("ready"),        key: "ready",    color: "var(--good)"},
    {label: "Building", n: by("building"),     key: "building", color: "var(--warning)"},
    {label: "Queued",   n: by("queued"),       key: "queued",   color: "var(--idle)"},
    {label: "Failed",   n: by("failed"),       key: "failed",   color: "var(--critical)"},
  ];

  const el = document.getElementById("counters");
  const sig = cells.map(c => `${c.key}:${c.n}:${ui.state === c.key}`).join("|");
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;

  el.innerHTML = cells.map((c, i) => `
    <button data-i="${i}" aria-pressed="${ui.state === c.key}" title="${esc(c.label)}">
      ${c.color ? `<span class="dot${c.key === "building" && c.n > 0 ? " work" : ""}"
                          style="--edge:${c.color}"></span>` : ""}
      <span class="n">${c.n}</span><span>${esc(c.label)}</span>
    </button>`).join("");

  for (const b of el.querySelectorAll("button")) {
    const c = cells[Number(b.dataset.i)];
    b.onclick = () => { ui.state = (ui.state === c.key) ? null : c.key; render(); };
  }
}

/* ── Project switcher ─────────────────────────────────────────────────────
   A trigger plus a filtered list, which is the shape this problem has: at a dozen
   projects a <select> is a scrolling menu of near-identical repository names, with no
   room for a badge and no way to type at it.

   Two sources join here. The previews say which projects have activity and how much;
   the status payload's `projects` say what each is called and what badge it carries. A
   project with no previews yet still appears, because "I added it and it is not in the
   list" is the question this page was answering wrongly an hour ago. */

// projectMeta maps a project name to its label and badge, from status.projects.
function projectMeta() {
  const out = new Map();
  for (const p of (ui.status?.projects || [])) {
    // The key is `<platform>:<owner>/<repo>`; the previews group by the repository name
    // alone, which is what `project()` returns.
    const repo = String(p.key || "").split("/").pop();
    if (repo) out.set(repo, p);
  }
  return out;
}

function renderProjects() {
  const counts = new Map();
  for (const p of ui.previews) {
    const k = project(p);
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const meta = projectMeta();
  // Every configured project, not only those with previews.
  for (const k of meta.keys()) if (!counts.has(k)) counts.set(k, 0);

  const names = [...counts.keys()].sort();
  const label = document.querySelector("#projpick-btn .pick-label");
  const current = names.includes(ui.project) ? ui.project : "";

  // The trigger shows the scope, with its badge when it has one.
  const m = current ? meta.get(current) : null;
  label.innerHTML = current
    ? `${m ? badgeHTML(m, current) : ""}<span>${esc(m?.label || current)}</span>`
    : `<span>All projects (${ui.previews.length})</span>`;
  label.classList.toggle("with-ava", Boolean(m));

  // The list is rebuilt only when something in it changed, so an open panel keeps its
  // filter text and its scroll position across a status tick.
  const sig = names.map(n => `${n}:${counts.get(n)}:${meta.get(n)?.avatar ? 1 : 0}`)
    .join("|") + `|${current}|${ui.previews.length}`;
  const list = document.getElementById("projpick-list");
  if (list.dataset.sig === sig) return;
  list.dataset.sig = sig;
  list.dataset.names = JSON.stringify(names);

  const rows = [
    `<button class="pick-row${current === "" ? " here" : ""}" data-pick-project=""
      role="option" aria-selected="${current === ""}">
      <span>All projects</span><span class="count">${ui.previews.length}</span></button>`,
  ];
  for (const n of names) {
    const pm = meta.get(n);
    rows.push(`<button class="pick-row${current === n ? " here" : ""}"
      data-pick-project="${esc(n)}" role="option" aria-selected="${current === n}">
      ${badgeHTML(pm, n)}<span>${esc(pm?.label || n)}</span>
      <span class="count">${counts.get(n) || ""}</span></button>`);
  }
  // The way to add one, where Vercel puts it and for the same reason: the moment you
  // discover a project is missing is while looking for it.
  rows.push(`<a class="pick-row add" href="/projects">+ New project</a>`);

  list.innerHTML = rows.join("");
  for (const b of list.querySelectorAll("[data-pick-project]")) {
    b.onclick = () => {
      ui.project = b.dataset.pickProject;
      closePicker();
      render();
    };
  }
}

// badgeHTML draws a project's badge for the switcher: the uploaded image when there is
// one, otherwise initials on a hue derived from the name — the same derivation the
// projects page uses, so a project looks the same in both places.
function badgeHTML(meta, name) {
  const avatar = meta?.avatar || "";
  if (avatar.startsWith("data:image/")) {
    return `<span class="ava ava-img"><img src="${esc(avatar)}" alt="" width="14" height="14"></span>`;
  }
  const label = avatar || monogram(meta?.label || name);
  let h = 0;
  for (const ch of (meta?.key || name)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<span class="ava" style="background:hsl(${h} 62% 88%);border-color:hsl(${h} 40% 74%)"
    aria-hidden="true">${esc(label)}</span>`;
}

function openPicker() {
  document.getElementById("projpick-panel").hidden = false;
  document.getElementById("projpick-btn").setAttribute("aria-expanded", "true");
  const find = document.getElementById("projpick-find");
  find.value = "";
  filterPicker("");
  find.focus();
}

function closePicker() {
  document.getElementById("projpick-panel").hidden = true;
  document.getElementById("projpick-btn").setAttribute("aria-expanded", "false");
}

// filterPicker hides rows that do not match, matching on both the label and the
// repository name — somebody typing "customer" should find a project called "Customer
// Connect" and somebody typing the repository name should find it too.
function filterPicker(q) {
  const needle = q.trim().toLowerCase();
  const list = document.getElementById("projpick-list");
  let shown = 0;
  for (const row of list.querySelectorAll("[data-pick-project]")) {
    const hay = `${row.textContent} ${row.dataset.pickProject}`.toLowerCase();
    const hit = !needle || hay.includes(needle);
    row.hidden = !hit;
    if (hit) shown++;
  }
  // "All projects" is not a match anybody means when they have typed something. Only
  // decremented when it was actually counted: unconditionally, a filter matching nothing
  // took the count to -1, which is truthy, so the "no match" message never appeared.
  const all = list.querySelector('[data-pick-project=""]');
  if (needle && all && !all.hidden) {
    all.hidden = true;
    shown--;
  }

  let empty = list.querySelector(".pick-empty");
  if (!shown) {
    if (!empty) {
      empty = document.createElement("div");
      empty.className = "pick-empty";
      list.prepend(empty);
    }
    empty.textContent = `No project matches “${q.trim()}”.`;
  } else if (empty) {
    empty.remove();
  }
}

/* ── Accordion ────────────────────────────────────────────────────────────
   Updated by key, not rebuilt.

   Setting innerHTML on the list every status tick destroyed and recreated the
   open log pane, which is what the flicker was: a few hundred lines of log
   thrown away and re-inserted twice a second. It also dropped hover and focus,
   and it meant the pane's event handlers had to be re-attached on a schedule
   rather than once. Rows are now created on first sight and mutated in place;
   the log pane is created once per opened preview and left alone. */

function renderList() {
  const gs = groups();
  const el = document.getElementById("list");

  document.getElementById("list-heading").textContent =
    ui.state || ui.project || ui.query
      ? `Projects (${gs.length}) — ${ui.previews.filter(matches).length} of ${ui.previews.length} previews`
      : `Projects (${gs.length})`;

  const empty = el.querySelector(".empty");
  if (gs.length === 0) {
    if (!empty) {
      const filtered = ui.state || ui.project || ui.query;
      el.innerHTML = `<div class="empty">
        ${filtered
          ? `Nothing matches.<br><br><button class="btn" id="clear">Clear filters</button>`
          : `No previews yet.<br><br>Push a branch to a repo made by <code>docpreview sim init</code>.`}
      </div>`;
      const c = document.getElementById("clear");
      if (c) c.onclick = clearFilters;
    }
    return;
  }
  if (empty) el.innerHTML = "";

  const wanted = new Set(gs.map(g => g.name));
  for (const item of [...el.children]) {
    if (!wanted.has(item.dataset.project)) item.remove();
  }

  let prev = null;
  for (const g of gs) {
    let item = el.querySelector(`.item[data-project="${CSS.escape(g.name)}"]`);
    if (!item) {
      item = document.createElement("div");
      item.className = "item";
      item.dataset.project = g.name;
      // The link is a sibling of the button, not inside it: an anchor nested in
      // a button is invalid, and clicking it would toggle the row as well as
      // follow the href.
      // Three siblings, not nested: an anchor inside a button is invalid markup, and
      // clicking one would both follow the href and toggle the row. The pull request link
      // sits between the head — whose last cell is the relative time — and Open, so the
      // reading order is what happened, when, where to discuss it, where to look at it.
      item.innerHTML = `<div class="row"><button class="head"></button>` +
        `<a class="go pr" data-role="row-pr"></a><a class="go"></a></div>`;
      item.querySelector(".head").onclick = () => toggle(g.name);
    }

    // Reordering is suspended while a row is expanded or the list has focus.
    //
    // groups() sorts by state, so a project that starts building climbs to the
    // top — under a reader who was mid-sentence in an expanded log. Moving a
    // DOM node also closes any <select> open inside it and drops focus, so a
    // background wave arriving while somebody had the preview dropdown open
    // shut it with no explanation.
    //
    // The sort is right when you arrive at the page and wrong the moment you
    // start using it. New rows are still appended, so nothing is hidden; the
    // order just stops rearranging itself under your hands.
    if (!frozen(el)) {
      const next = prev ? prev.nextSibling : el.firstChild;
      if (item !== next) el.insertBefore(item, next);
    } else if (!item.isConnected) {
      el.appendChild(item);
    }
    prev = item;

    // Set outside updateHead, and unconditionally.
    //
    // It used to live at the end of updateHead, past two early returns — and
    // one of them fires exactly when this matters. Clicking the row makes the
    // button the active element, the focus guard then skipped the whole
    // function, and the class never went on. `term()` selects `.item.open
    // .term`, so it found nothing, and the first expand of any row showed an
    // empty log until some other click moved focus and let the next render
    // through.
    //
    // A class that other code queries by is state, not markup. It does not
    // belong behind a repaint optimisation.
    item.classList.toggle("open", ui.open === g.name);
    // Same argument: a screen reader announcing "collapsed" on a row that just
    // expanded is a correctness bug, not a repaint.
    item.querySelector(".head").setAttribute("aria-expanded", String(ui.open === g.name));

    updateHead(item, g);
    updateBody(item, g);
  }
}

// frozen reports whether the list is being interacted with, and so must not be
// rearranged or have its markup replaced underneath.
//
// Two signals. Focus inside the list covers the open dropdown, the mid-tab
// keyboard user, and text selection. An expanded row covers the commonest case
// of all: reading a build log while the rest of the world keeps moving.
function frozen(el) {
  return ui.open !== null || el.contains(document.activeElement);
}

function updateHead(item, g) {
  const p = g.current;
  const s = state(p.state);

  const chips = ORDER
    .filter(k => g.counts[k])
    .map(k => `<span class="chip" style="--edge:${state(k).color}" title="${g.counts[k]} ${state(k).label.toLowerCase()}">
                 <span class="dot${k === "building" ? " work" : ""}"></span>${g.counts[k]}</span>`)
    .join("");

  // p.url is in the signature because the row now carries the link: a republish
  // that moves the URL without changing the state would otherwise leave the
  // anchor pointing at the old one.
  const sig = [p.preview_id, p.state, p.url, p.branch, p.number, ago(p.updated_at),
               ui.open === g.name, JSON.stringify(g.counts)].join("|");

  const head = item.querySelector(".head");
  if (head.dataset.sig === sig) return;

  // Replacing the markup of the element that currently has focus takes the
  // focus with it, which drops a keyboard user back to the top of the page
  // mid-navigation. The counts and the timestamp can wait until they look away.
  if (head === document.activeElement) return;

  head.dataset.sig = sig;

  head.style.setProperty("--edge", s.color);
  head.innerHTML = `
    <span class="caret">▶</span>
    <span class="who">
      <span class="proj">${esc(g.name)}</span>
      <span class="branch">${esc(p.branch)}</span><span class="num">#${p.number}</span>
    </span>
    <span class="counts">${chips}</span>
    <span class="pill${s.work ? " work" : s.spin ? " spin" : ""}" style="--edge:${s.color}">
      <span class="dot"></span>${esc(s.label)}
    </span>
    <span class="when">${ago(p.updated_at)}</span>`;

  updateRowPR(item.querySelector('[data-role="row-pr"]'), p);
  // The Open link is the *last* .go, since the pull request link shares the class to
  // share the look.
  const gos = item.querySelectorAll(".go");
  updateGoLink(gos[gos.length - 1], p);
}

// updateRowPR points the row's pull request link at the pull request.
//
// Hidden when there is none rather than greyed: the local platform has no web interface at
// all, which is not a state anybody can act on, and a permanently dead control between two
// live ones is worse than a gap.
function updateRowPR(a, p) {
  const url = safeURL(p.pr_url);
  if (!url) {
    a.hidden = true;
    return;
  }
  const platform = String(p.repo).split(":")[0];
  a.hidden = false;
  a.href = url;
  a.target = "_blank";
  a.rel = "noreferrer";
  // The platform's own mark, so which host a pull request is on is readable without
  // parsing the URL — which matters the moment one dashboard watches both.
  a.innerHTML = `${platformIcon(platform)}<span>#${p.number}</span>`;
  a.title = `Open pull request #${p.number} on ${platform}`;
}

/* Inline SVG, one path each, currentColor.

   Not an icon font and not an image: this page fetches nothing from the internet, and a
   remote logo would announce every open dashboard to whoever hosts it. Both marks are the
   official simple-icons paths, which are the shapes people recognise at 14px — a generic
   "link" glyph would carry none of the information this is for. */
const ICON_GITHUB = `<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"
  fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7 0-.7 0-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a12.4 12.4 0 0 1 6 0C16.4 3 17.4 3.3 17.4 3.3c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>`;
const ICON_BITBUCKET = `<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"
  fill="currentColor"><path d="M.8 1.1A.8.8 0 0 0 0 2l3.3 19.8c.1.5.5.8 1 .8h15.7c.4 0 .7-.3.8-.7l3.2-19.9a.8.8 0 0 0-.8-.9zm13.6 14.3H9.7L8.4 8.6h7.2z"/></svg>`;

function platformIcon(platform) {
  if (platform === "github") return ICON_GITHUB;
  if (platform === "bitbucket") return ICON_BITBUCKET;
  return "";
}

// The preview link belongs on the row, not inside the expanded panel: opening
// the site is the commonest thing anyone wants from a list of previews, and
// burying it behind a click to reveal a build log inverts that.
//
// It is only a link while the state is `ready`. Queued, building and failed
// have no URL at all, and a torn-down one has a URL that no longer answers —
// rendering either as live sends the reader to an error page. An anchor with no
// href is not a link, which is exactly the state wanted, and the tooltip says
// why.
// updateGoLink points a row's Open button at the preview.
//
// A URL, not a state, decides whether this is clickable. It used to require
// state === "ready", which greyed the button on every rebuild — but a rebuild does
// not withdraw anything: the previous build is still published and still serving,
// which is the whole point of building the new one beside it rather than in place.
// The button went grey exactly when somebody was most likely to be watching a
// build and wanting to look at what is live.
//
// A preview with no URL is a different case and still greys: nothing has ever been
// published for it, or it has been withdrawn.
function updateGoLink(a, p) {
  const url = safeURL(p.url);
  a.textContent = "Open ↗";
  if (url) {
    a.href = url;
    a.target = "_blank";
    a.rel = "noreferrer";
    // Says which build is behind the link when that is not the one on screen,
    // so a stale-looking page is explained rather than confusing.
    a.title = p.state === "ready"
      ? url
      : `${url} — still serving the last successful build while this one ${state(p.state).label.toLowerCase()}`;
  } else {
    a.removeAttribute("href");
    a.title = p.state === "ready"
      ? "this preview has no URL"
      : `nothing published yet — this preview is ${state(p.state).label.toLowerCase()}`;
  }
}

function updateBody(item, g) {
  const open = ui.open === g.name;
  let body = item.querySelector(".body");

  if (!open) {
    if (body) body.remove();
    return;
  }

  const fresh = !body;
  if (!body) {
    body = document.createElement("div");
    body.className = "body";
    body.innerHTML = `
      <!-- Above the log: what you are looking at. Below it: how you are looking at
           it. They used to share one bar, which put Following, Expand and Download
           a few pixels from the row's Open button — the one control here anybody
           reaches for often — so the cost of a misclick was landing on a different
           preview or losing your place in a live log.

           The selects stay on top because they are navigation and belong with the
           row's own controls. The view toggles move under the pane they act on,
           where nothing destructive is adjacent to them.

           No cache control in either: it was per row, which put the same button on
           every open row and made a rare repair look like part of reading a log. It
           lives once, in the top bar. -->
      <div class="logbar">
        <select class="control sm" data-role="pick" aria-label="Preview"></select>
        <select class="control sm" data-role="build" aria-label="Build"></select>
        <!-- The second Open. The row's Open goes to the branch share, which follows
             whatever built last; this one goes to the selected build's own share,
             pinned to its commit. One button could never be honest about both, which
             is why the log pane could say "build 85912e2 — not live" beside a button
             that went somewhere else entirely.

             Beside the build picker rather than in the footer, because it belongs to
             the selection immediately above it. -->
        <a class="btn" data-role="open-build" target="_blank" rel="noreferrer">Open build ↗</a>
        <span class="grow"></span>
      </div>
      <div class="logstate"></div>
      <div class="termwrap">
        <button class="copy" data-role="copy" type="button"
                title="Copy the whole log" aria-label="Copy the whole log"></button>
        <pre class="term"></pre>
      </div>
      <div class="logfoot">
        <button class="btn" data-role="follow" aria-pressed="true">Following</button>
        <button class="btn" data-role="tall" aria-pressed="false">Expand</button>
        <span class="grow"></span>
        <!-- Only while something is running. A permanently greyed Cancel is furniture,
             and one next to Download on a finished build is a misclick waiting to
             happen. Shown beside Download rather than in the top bar because it acts on
             the build whose log is on screen. -->
        <!-- Rebuild and Cancel are the same slot in two states, because the question
             "is something running" has one answer and each button is useless in the
             other case. -->
        <button class="btn" data-role="rebuild" hidden>Rebuild</button>
        <button class="btn danger" data-role="cancel" hidden>Cancel build</button>
        <a class="btn" data-role="download" download>Download</a>
      </div>`;
    item.appendChild(body);

    const copyBtn = body.querySelector('[data-role="copy"]');
    copyBtn.innerHTML = ICON_COPY;

    // Copies the log's text, not its HTML. The pane renders spans for command
    // lines, errors and redaction masks, so innerHTML would paste markup and
    // innerText is what somebody pasting into an issue actually wants — masks
    // included, since ***** is the truth about that line.
    copyBtn.onclick = async e => {
      const t = term();
      if (!t) return;
      const btn = e.currentTarget;
      try {
        await navigator.clipboard.writeText(t.innerText);
        btn.innerHTML = ICON_CHECK;
        btn.title = "Copied";
      } catch {
        // clipboard needs a secure context. http://127.0.0.1 qualifies, but not
        // every browser agrees and the dashboard is also reachable over a tunnel
        // — so fall back to selecting the pane and saying so in the tooltip,
        // since there is no room for words in an icon button.
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(t);
        sel.removeAllRanges();
        sel.addRange(range);
        btn.title = "Selected — press Ctrl+C";
      }
      setTimeout(() => {
        btn.innerHTML = ICON_COPY;
        btn.title = "Copy the whole log";
      }, 1500);
    };

    body.querySelector('[data-role="follow"]').onclick = () => setFollow(!ui.follow);
    body.querySelector('[data-role="tall"]').onclick = () => setTall(!ui.tall);
    const pick = body.querySelector('[data-role="pick"]');
    pick.onchange = e => {
      ui.pick[g.name] = e.target.value;
      openLog(e.target.value);
      render();
    };
    // Whatever arrived while the dropdown was open gets applied once it is not.
    pick.onblur = () => { if (pick.dataset.pending) render(); };

    // Choosing a build stops following. A reader who has deliberately gone back
    // to an earlier build does not want the live one scrolling in over it.
    body.querySelector('[data-role="build"]').onchange = e => {
      const buildID = e.target.value;
      ui.build[g.current.preview_id] = buildID;
      showBuild(g.current.preview_id, buildID);
      updateOpenBuild(g.current.preview_id, buildID);
    };
    body.querySelector(".term").addEventListener("scroll", () => {
      if (ui.autoScrolling) return;
      setFollow(atBottom());
    });
  }

  // Pin the selection on expand.
  //
  // Without this the picker had no stored choice and groups() re-derived it as
  // list[0] on every render — and that list is sorted by state, so a build
  // starting anywhere in the project made the new preview "first" and swapped
  // it into the dropdown under a reader who was part-way through a different
  // log. Opening a row is a choice; it should stick until the reader makes
  // another one, or closes the row.
  // Re-pinned rather than merely set, so a pin left pointing at a preview that
  // has since been torn down does not leave the selection floating again.
  // groups() already falls back to the newest when the pinned id is gone;
  // this makes that fallback stick.
  if (!g.list.some(p => p.preview_id === ui.pick[g.name])) {
    ui.pick[g.name] = g.current.preview_id;
  }

  updatePicker(body.querySelector('[data-role="pick"]'), g);

  // The build list changes when a build finishes, so refresh it on the render
  // that follows — cheap, and the alternative is a picker that never learns
  // about the build you are watching complete.
  loadBuilds(g.current.preview_id);

  const p = g.current;
  body.querySelector('[data-role="download"]').href =
    `/logs/${encodeURIComponent(p.preview_id)}/download`;

  // Cancel, only while this preview is actually building. The state comes from the same
  // status payload the row is drawn from, so the button appears and disappears with the
  // row's own pill rather than on its own schedule.
  // Reconnect when this preview starts building under a pane showing something else.
  //
  // The server does the load-bearing half: a stream opened while a build is queued waits
  // and announces it (Ingress.awaitLive), which is the Rebuild case and is deterministic.
  // This covers the other one — a *push* arriving while somebody has a finished build's
  // log open, where the stream closed at connect because nothing was coming yet.
  //
  // Guarded by the preview's own updated_at so it fires once per transition rather than on
  // every status tick: openLog's start event may arrive after the next tick, and a
  // condition that stayed true would reconnect in a loop.
  if (p.state === "building" && ui.logFor === p.preview_id && !ui.build[p.preview_id] &&
      ui.banner?.kind !== "live" && ui.reconnectedAt !== p.updated_at) {
    ui.reconnectedAt = p.updated_at;
    openLog(p.preview_id);
  }
  //
  // Queued counts as cancellable. A queued build has no context to cancel, so the daemon
  // takes it out of the queue instead — and a queue that cannot be emptied is the case
  // that matters most, since a build waiting behind a slow one is the reason somebody
  // wants to stop it.
  const building = p.state === "building" || p.state === "queued";
  const cancel = body.querySelector('[data-role="cancel"]');
  cancel.hidden = !building;
  cancel.textContent = p.state === "queued" ? "Cancel queued build" : "Cancel build";

  // Rebuild, when nothing is running. It queues the commit already on the row rather than
  // the branch tip: pushing is what builds the tip, and this is for the case a push cannot
  // fix — a bad cache entry, a timeout, an image since corrected, a project setting changed
  // under a preview nobody is pushing to.
  const rebuild = body.querySelector('[data-role="rebuild"]');
  rebuild.hidden = building;
  rebuild.title = p.commit
    ? `Build ${p.commit.slice(0, 7)} again`
    : "Build this preview's recorded commit again";
  rebuild.onclick = async () => {
    const label = rebuild.textContent;
    rebuild.disabled = true;
    rebuild.textContent = "…";
    try {
      await api("POST", `/api/builds/${encodeURIComponent(p.preview_id)}/rebuild`);
      // No alert on success: the row's own pill goes to Queued within a second, which is
      // better confirmation than a dialog to dismiss.

      // Move the pane to the live stream, and follow it.
      //
      // The selection is deliberately sticky — a reader part-way through an older build's
      // log must not be yanked to a newer one by a background event. But this is not a
      // background event: it is the reader asking for a build. Leaving the pin alone meant
      // Rebuild started a build that ran to completion while the pane showed a *different*
      // build's stored log and appeared to do nothing, which is exactly what it looked
      // like. An empty build id is the picker's value for "follow the live stream".
      ui.build[p.preview_id] = "";
      ui.pick[g.name] = p.preview_id;
      setFollow(true);
      openLog(p.preview_id);
      render();
    } catch (e) {
      alert(`Could not rebuild: ${e.message}`);
    } finally {
      rebuild.disabled = false;
      rebuild.textContent = label;
    }
  };
  cancel.onclick = async () => {
    const what = p.state === "queued" ? "queued build" : "build";
    if (!confirm(`Cancel the ${what} of ${p.branch} #${p.number}?\n\n` +
      `It will be reported as failed on the pull request. Pushing again rebuilds it.`)) return;
    const label = cancel.textContent;
    cancel.disabled = true;
    cancel.textContent = "…";
    try {
      const r = await api("POST", `/api/builds/${encodeURIComponent(p.preview_id)}/cancel`);
      // Not an error when nothing was running: this page can be a second out of date, and
      // a build that finished between the render and the click is not a failure.
      if (!r.cancelled) alert("That build had already finished.");
    } catch (e) {
      alert(`Could not cancel: ${e.message}`);
    } finally {
      cancel.disabled = false;
      cancel.textContent = label;
    }
  };

  // The pull request link lives on the row, not here — see updateRowPR.


  // The preview link lives on the row, not here. See updateGoLink.

  // Three cases, and the middle one is the bug this replaced.
  //
  // A filter that hides a project removes its row; clearing the filter builds a
  // fresh one, so the <pre> is new and empty. `ui.logFor` still names the same
  // preview, so the old test — reopen only when the preview changed — did
  // nothing, and the pane sat blank until you collapsed and reopened it. That
  // is what "no logs show" was.
  if (ui.logFor !== p.preview_id) {
    openLog(p.preview_id);
  } else if (fresh) {
    // Same preview, new element. Repaint from the buffer rather than
    // reconnecting, which would replay the whole log from the top.
    const t = body.querySelector(".term");
    t.innerHTML = ui.buffer;
    if (ui.follow) t.scrollTop = t.scrollHeight;

    // The banner is part of the pane and goes with it.
    if (ui.banner) banner(ui.banner.kind, ui.banner.text);

    // A stream that has already ended leaves nothing to reconnect to, but an
    // empty buffer with no stream means the log was never read.
    if (!ui.logSource && !ui.buffer) openLog(p.preview_id);
  }
}

function updatePicker(sel, g) {
  const sig = g.list.map(p => `${p.preview_id}:${p.state}:${ago(p.updated_at)}`).join("|");

  // A <select> being rewritten while its dropdown is open closes it, with no
  // visible cause — you reach for an older preview, a build finishes somewhere
  // else, and the list vanishes out from under the pointer. There is no DOM
  // event for "the dropdown is open", but focus is a good enough proxy: a
  // select only opens when focused. Defer instead, and apply on the way out.
  if (document.activeElement === sel) {
    sel.dataset.pending = sig;
