  el.replaceWith(next);

  btn.textContent = wasArea ? "⤢" : "⤡";
  btn.title = wasArea
    ? "Expand for a multi-line value. Note that an expanded box is not masked."
    : "Collapse, and mask it again";
  next.focus();
}

// wireExpanders is called by both pages: the control is the same on each, and the value
// fields it applies to are rendered by three different functions.
function wireExpanders(root) {
  for (const b of root.querySelectorAll("[data-expand]")) {
    b.onclick = () => toggleExpand(b.dataset.expand, b);
  }
}

async function loadSetup() {
  try {
    renderSetup(await api("GET", "/api/secrets"));
  } catch (e) {
    document.getElementById("setup-body").innerHTML =
      `<div class="notice bad">${esc(e.message)}</div>`;
  }
}

function renderSetup(s) {
  document.getElementById("setup-head").title = s.vault_path || "";
  const el = document.getElementById("setup-body");

  if (!s.available) {
    // Refused, and it says why rather than hiding. An operator who cannot find
    // the feature assumes it is broken.
    el.innerHTML = `<div class="notice bad">
      <strong>Not available on this daemon.</strong> ${esc(s.reason)}
      <p>Credentials on a reachable listener need authentication this does not have yet.
      Use <code>docpreview vault set &lt;key&gt;</code> on the host instead.</p></div>`;
    return;
  }

  if (s.locked) { renderUnlock(el, s); return; }

  // Read-only for anyone who is not on this machine. The rows still render, with
  // the fields and buttons gone: seeing that two credentials are set is useful
  // from a colleague's browser, and hiding the panel entirely would read as a
  // missing feature rather than a deliberate boundary. The server refuses these
  // calls regardless — this only stops the page offering something it knows will
  // be refused.
  const ro = !s.can_write;

  const oneRow = e => {
    // Three states, because they are three different instructions. `missing` means the
    // daemon will not work until this is filled in. `optional` means it would be used if
    // it were there and nothing is broken without it — a Bitbucket token that a project
    // may carry instead. `not needed` means this key does nothing on this daemon at all,
    // like a Frontdoor token under the zrok exposer.
    const flag = e.set
      ? `<span class="flag on">set</span>`
      : e.required ? `<span class="flag off">missing</span>`
      : e.optional ? `<span class="flag opt">optional</span>`
                   : `<span class="flag opt">not needed</span>`;
    // A private key is multi-line; everything else is one line and masked.
    const multi = e.key.includes("private_key");
    const field = ro ? "" : multi
      ? `<textarea data-k="${esc(e.key)}" rows="3"
           placeholder="-----BEGIN RSA PRIVATE KEY-----&#10;…"></textarea>`
      : `<input type="password" data-k="${esc(e.key)}" placeholder="paste to replace">`;

    const acts = ro ? "" : `
        <button class="btn" data-save="${esc(e.key)}">Save</button>
        ${multi ? "" : `<button class="btn" data-gen="${esc(e.key)}"
             title="Mint a random value and show it once">Generate</button>`}
        ${e.set ? `<button class="btn" data-del="${esc(e.key)}">Delete</button>` : ""}`;

    // A chip, not a sentence. The rule is the same for every build variable and stating
    // it per row cost three wrapped lines each — the list stopped being a list. It is
    // stated once, in the notice above.
    const injected = e.env_var
      ? `<span class="flag on" title="Injected into every build as ${esc(e.env_var)}, and
           redacted from every log. A project can override it.">build var</span>`
      : "";

    // The vault key, only when it says something the label does not.
    //
    // A known credential has both — "GitHub App private key" over `github.private_key` —
    // and the key is what `docpreview vault set` takes, so it is worth the line. A build
    // variable's label *is* its key, and rendering both printed
    // GH_ZITI_CI_REPO_ACCESS_PAT twice, one line under the other, on every row.
    const key = e.label === e.key ? "" : `<div class="key">${esc(e.key)}</div>`;

    // data-key regardless, so the harness can assert which group a key landed in without
    // depending on whether that key is currently displayed.
    // The hint is a row of its own spanning every column, not the tail of the first cell.
    //
    // In the label column it wrapped to three lines inside 18rem while the space under the
    // input — most of the width — sat empty, so each entry was as tall as its longest
    // sentence. Spanning the grid puts it on one or two lines under everything.
    return `<div class="sec" data-key="${esc(e.key)}">
      <div>
        <div class="name">${esc(e.label)} ${flag} ${injected}</div>
        ${key}
      </div>
      <div>${field}</div>
      <div class="act">${acts}</div>
      ${e.hint ? `<div class="hint wide">${esc(e.hint)}</div>` : ""}
    </div>`;
  };

  /* Two lists, not one, and the split is a security boundary rather than a tidiness
     preference.

     The daemon's own credentials — a GitHub App private key, a Bitbucket access token,
     a webhook secret — are never given to a build. Everything in the second group is
     handed to every build as an environment variable, where the pull request's own
     script decides what to do with it. One flat list put those two kinds of thing three
     rows apart with nothing to say which was which.

     A group with no entries renders nothing at all: an empty "Build variables" heading
     on a fresh install is a section somebody looks for content in. */
  /* Which sections are open, remembered across renders.
     The panel rebuilds its innerHTML on every save, so a <details open> attribute is
     reset by any action taken inside it — collapse a section, save a token two sections
     down, and it springs open again. Holding the state outside the markup is what makes
     the control stick. */
  const GROUPS = [
    ["daemon", "Platform and exposer credentials",
     "Used by docpreview itself to verify webhooks, clone, and comment. " +
     "Never given to a build."],
    ["build", "Build variables",
     "Injected into every build as environment variables and redacted from every log. " +
     "A project can override any of them with its own value."],
    ["unused", "Nothing reads these",
     "Stored, but no build and no part of this daemon looks at them."],
  ];

  /* Adding a value goes inside Build variables, as its last row.
     It used to sit below the card under its own heading, which put the form for creating
     a build variable outside the section that lists them — and made the page's last
     control belong to nothing. Its name field decides which group the result lands in,
     so the section that explains that rule is where it belongs.

     Rendered even when that group is empty, which is a fresh install: a group that
     vanished for having no entries would leave nowhere to add the first one. */
  const addRow = ro ? "" : `
    <div class="sec">
      <div><div class="name">New entry</div></div>
      <div class="newline">
        <!-- Labels beside the boxes, not above them, and both boxes on one line.
             Stacked with a label over each, one entry was four lines tall and the Save
             button in the next grid cell sat level with the first label rather than with
             anything it acts on. Inline labels put everything on one baseline.

             Labelled rather than explained: the paragraph that used to be here said what
             an UPPER_CASE name does and what happens to anything else — true, and already
             stated under the group heading two lines above.

             No placeholder on the name. A greyed-out example there reads as a value
             already filled in, and this is the field where getting it wrong is silent:
             the build looks for a variable that is not there. -->
        <label class="lab" for="new-key">Name</label>
        <input class="nm" type="text" id="new-key" autocomplete="off" spellcheck="false">
        <label class="lab" for="new-val">Value</label>
        <span class="valwrap">
          <input type="password" id="new-val" autocomplete="off">
          <button class="btn icon" data-expand="new-val"
            title="Expand for a multi-line value — a PEM will not fit on one line. Note that an expanded box is not masked.">⤢</button>
        </span>
      </div>
      <div class="act"><button class="btn" id="new-save">Save</button></div>
    </div>`;

  const rows = GROUPS.map(([group, title, why]) => {
    // Anything the server did not label lands in the daemon group, which is the
    // conservative default: a mislabelled build variable shown under credentials is
    // confusing, and a credential shown under build variables is misleading.
    const mine = s.entries.filter(e => (e.group || "daemon") === group);
    const extra = group === "build" ? addRow : "";
    if (!mine.length && !extra) return "";

    // The summary carries what a collapsed section is hiding, which is what makes
    // collapsed-by-default safe: a missing credential is the one fact this page exists to
    // show, so the count of them is in the heading and visible without opening anything.
    const missing = mine.filter(e => !e.set && e.required).length;
    const badge = missing
      ? `<span class="flag off">${missing} missing</span>`
      : `<span class="secgroup-n">${mine.length}</span>`;

    const open = secOpen === group;
    return `<details class="secgroup-box" data-group="${esc(group)}"${open ? " open" : ""}>
      <summary><span class="secgroup">${esc(title)}</span> ${badge}</summary>
      <div class="secgroup-why">${esc(why)}</div>
      ${mine.map(oneRow).join("")}
      ${extra}
    </details>`;
  }).join("");

  // One bordered card holding the three sections, like the previews list holds its rows.
  // Without it the group stripes float against the page background and the two lists stop
  // looking like the same control.
  const groups = rows ? `<div class="secbox">${rows}</div>` : "";

  // A minted value, shown exactly once. It is rendered above everything else
  // and consumed on render, so the next redraw loses it — which is the point:
  // there is no way to ask for it again, and a box that persisted would imply
  // otherwise.
  let once = "";
  if (ui.shownOnce) {
    const {key, value} = ui.shownOnce;
    ui.shownOnce = null;
    once = `<div class="notice warn" id="once">
      <strong>Copy this now — it will not be shown again.</strong>
      Stored as <code>${esc(key)}</code>. Paste it into the matching field on GitHub.
      <p><input type="text" id="once-val" readonly value="${esc(value)}"
           style="width:100%;font:12.5px/1.5 ui-monospace,Consolas,monospace;
                  background:var(--raised);color:var(--ink);
                  border:1px solid var(--ring);border-radius:6px;padding:0.4rem 0.5rem">
      <button class="btn" id="once-copy" style="margin-top:0.4rem">Copy</button></p></div>`;
  }

  const banner = ro
    ? `<div class="notice warn"><strong>Read-only from here.</strong> ${esc(s.read_only_why || "")}
       <p>Open the dashboard on the machine running docpreview, or use
       <code>docpreview vault set &lt;key&gt;</code> there.</p></div>`
    // Shorter than it was: what each group is for now sits under its own heading, so
    // repeating it here made the same paragraph appear twice on one screen.
    : `<div class="notice ok">Values are written to the age-encrypted vault. Nothing here reads one
       back — the only time a secret is visible is the moment you generate it. Changing a build
       variable re-arms the log redactor immediately.</div>`;

  el.innerHTML = `
    ${once}
    ${banner}
    ${groups}`;

  const copy = document.getElementById("once-copy");
  if (copy) {
    const field = document.getElementById("once-val");
    field.focus();
    field.select();
    copy.onclick = async () => {
      field.select();
      // navigator.clipboard needs a secure context, and http://127.0.0.1 counts
      // as one — but not every browser agrees, so the selection above is the
      // fallback that always works.
      try { await navigator.clipboard.writeText(field.value); copy.textContent = "Copied"; }
      catch { copy.textContent = "Press Ctrl+C"; }
    };
  }

  // Accordion: opening one closes the rest, and the choice is remembered.
  //
  // Closing the siblings directly rather than re-rendering, because a re-render inside a
  // toggle handler would replace the element that fired it — and would throw away
  // whatever had been typed into a field in another section.
  wireExpanders(el);

  for (const d of el.querySelectorAll(".secgroup-box")) {
    d.ontoggle = () => {
      if (!d.open) {
        // Only clear the remembered group if this is still the open one. A close
        // triggered by the loop below arrives after the new group was recorded, and
        // clearing then would collapse the section that was just opened.
        if (secOpen === d.dataset.group) secOpen = null;
        return;
      }
      secOpen = d.dataset.group;
      for (const other of el.querySelectorAll(".secgroup-box")) {
        if (other !== d) other.open = false;
      }
    };
  }

  for (const b of el.querySelectorAll("[data-save]")) {
    b.onclick = () => save(b.dataset.save, el.querySelector(`[data-k="${CSS.escape(b.dataset.save)}"]`), b);
  }
  for (const b of el.querySelectorAll("[data-gen]")) {
    b.onclick = async () => {
      const key = b.dataset.gen;
      const entry = s.entries.find(x => x.key === key);
      if (entry && entry.set &&
          !confirm(`${key} is already set. Replace it with a new random value?`)) return;
      await run(b, async () => {
        const out = await api("POST", `/api/secrets/${encodeURIComponent(key)}/generate`);
        // Stash it so the re-render can show it. This is the only moment the
        // value exists outside the vault; there is no endpoint to ask again.
        ui.shownOnce = {key, value: out.shown_once};
        return out;
      });
    };
  }

  for (const b of el.querySelectorAll("[data-del]")) {
    b.onclick = async () => {
      if (!confirm(`Delete ${b.dataset.del} from the vault?`)) return;
      await run(b, () => api("DELETE", `/api/secrets/${encodeURIComponent(b.dataset.del)}`));
    };
  }
  // Absent when read-only. The querySelectorAll loops above degrade to no-ops on
  // their own; this one is a direct lookup and would throw.
  const newSave = document.getElementById("new-save");
  if (newSave) {
    newSave.onclick = async e => {
      const k = document.getElementById("new-key").value.trim();
      const v = document.getElementById("new-val").value;
      if (!k || !v) return;
      await run(e.target, () => api("PUT", `/api/secrets/${encodeURIComponent(k)}`, {value: v}));
    };
  }
}

function renderUnlock(el, s) {
  // Unlocking is a mutating call, and a passphrase box offered to a remote
  // browser is a prompt to type the one secret that opens everything into a form
  // whose POST the server will refuse. Say the state and stop.
  if (!s.can_write) {
    el.innerHTML = `<div class="notice warn">
      <strong>${s.has_vault ? "The vault is locked." : "No vault yet."}</strong>
      Nothing can arrive until it is unlocked, and that has to happen on the machine
      running docpreview. ${esc(s.read_only_why || "")}</div>`;
    return;
  }

  // Two doors. An existing vault needs its key; a new one is created by
  // choosing a key, and the wording has to make clear which is happening —
  // typing a new passphrase at an existing vault just fails to open it.
  el.innerHTML = `
    <div class="notice warn">
      <strong>${s.has_vault ? "The vault is locked." : "No vault yet."}</strong>
      ${s.has_vault
        ? `Enter the master key or passphrase it was created with.`
        : `Choose a passphrase. It encrypts the vault, it is never stored, and
           <strong>losing it means losing the contents</strong> — there is no recovery.
           Put it in a password manager now.`}
      <p>Set <code>vault.key_source</code> in the config to skip this on every restart.</p>
    </div>
    <div class="sec">
      <div><div class="name">${s.has_vault ? "Master key" : "New passphrase"}</div>
        <div class="hint">an age secret key, or any passphrase</div></div>
      <div>
        <input type="password" id="unlock-key" placeholder="AGE-SECRET-KEY-1… or a passphrase">
        ${s.has_vault ? "" : `<div class="hint" id="strength">&nbsp;</div>`}
      </div>
      <div class="act"><button class="btn" id="unlock-go">${s.has_vault ? "Unlock" : "Create"}</button></div>
    </div>`;

  const go = document.getElementById("unlock-go");
  const field = document.getElementById("unlock-key");
  go.onclick = () => run(go, () => api("POST", "/api/secrets/unlock", {key: field.value}));
  field.onkeydown = e => { if (e.key === "Enter") go.click(); };

  // Advice, not a gate. A rule that refuses a passphrase teaches people to
  // append "1!" and call it done; saying what would be stronger, and then
  // accepting whatever they choose, is the honest version. It is also their
  // vault on their loopback interface — refusing them entry to it would be
  // absurd.
  const meter = document.getElementById("strength");
  if (meter) {
    field.oninput = () => {
      const v = field.value;
      if (!v) { meter.innerHTML = "&nbsp;"; return; }
      const s = rate(v);
      meter.innerHTML = `<span style="color:${s.color};font-weight:600">${esc(s.word)}</span> — ${esc(s.advice)}`;
    };
  }
  field.focus();
}

// rate is a rough passphrase estimate. Length dominates, because it does:
// four unrelated words beat eight characters of punctuation, and a meter that
// rewards symbols over length teaches the wrong lesson.
function rate(v) {
  if (v.toUpperCase().startsWith("AGE-SECRET-KEY-1")) {
    return {word: "age key", color: "var(--good)", advice: "a generated key — nothing to improve"};
  }

  const classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter(re => re.test(v)).length;
  const words = v.trim().split(/\s+/).filter(w => w.length > 2).length;

  // Rough bits: log2(alphabet) per character, with a bonus for multi-word.
  const alphabet = [26, 26, 52, 62, 95][Math.min(classes, 4)];
  const bits = Math.round(v.length * Math.log2(alphabet)) + (words >= 3 ? 12 : 0);

  if (bits < 45) {
    return {word: "weak", color: "var(--critical)",
            advice: "aim for four or more unrelated words, or 16+ characters"};
  }
  if (bits < 70) {
    return {word: "fair", color: "var(--warning)",
            advice: "longer is worth more than adding symbols"};
  }
  return {word: "strong", color: "var(--good)",
          advice: "save it now — there is no recovery"};
}

function save(key, field, btn) {
  const value = field.value;
  if (!value.trim()) return;
  return run(btn, async () => {
    const s = await api("PUT", `/api/secrets/${encodeURIComponent(key)}`, {value});
    field.value = "";     // never leave a credential sitting in the DOM
    return s;
  });
}

// run performs an action, renders whatever state comes back, and reports a
// failure next to the button rather than in a console nobody has open.
//
// The renderer and the place errors land are arguments because two pages share this.
// They used to be hardcoded to the secrets panel, so a failed project save rendered
// project state through the credential renderer and then printed the resulting
// exception into an element that is hidden on /projects — an action that silently did
// nothing and said nothing.
async function run(btn, fn, opts) {
  const render = opts?.render || renderSetup;
  const bodyID = opts?.body || "setup-body";
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    render(await fn());
  } catch (e) {
    btn.disabled = false;
    btn.textContent = label;
    // A toast, not a notice prepended into the panel.
    //
    // Prepending was the original, and every rejected save added another one: ten
    // attempts at a base URL left ten identical red boxes stacked above the form,
    // pushing the fields somebody was correcting off the screen. A failure is an
    // event, and an event that accumulates in the document is a leak. This one
    // expires on its own and never moves the form.
    toast(e.message, "bad");
  }
}

// runProject is run, aimed at the projects page.
const runProject = (btn, fn) =>
  run(btn, fn, {render: renderProjectsPage, body: "projects-body"});

// The Secrets control is an ordinary link now, so there is no click handler.
// Which of the two pages this document is depends on the path it was served at.
const currentPath = location.pathname.replace(/\/+$/, "");
const isSetupPage = currentPath === "/secrets";
const isProjectsPage = currentPath === "/projects";

/* ── Projects ─────────────────────────────────────────────────────────────
   A project is a repository docpreview will build, and how. The row lives in
   sqlite and wins over the repository's own .docpreview.yml, because that file
   arrives in the pull request — so on any repository where opening one is not a
   privilege, its author would otherwise choose the command that runs.

   Every build field may be blank, meaning "defer to the repository". A row that
   only names a repository is valid and is the common case: it says the repository
   is allowed, not that the operator wants to restate its config. */

async function loadProjects() {
  const body = document.getElementById("projects-body");
  try {
    renderProjectsPage(await api("GET", "/api/projects"));
  } catch (e) {
    body.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`;
  }
}

/* Which project's detail is open, and which panel of it. One at a time: the page
   is a list to scan, and a dozen expanded cards is the same wall of fields the
   permanently-open form used to be. Kept outside render so a refresh after a save
   comes back to where you were. */
let projOpen = {key: null, tab: null};

/* Whether the open form has edits nobody has saved.

   Every way out of this page throws the form away without a word: closing the panel,
   opening a different project's, the back link, the browser's own navigation. Eleven
   fields of typing lost to a misplaced click, with no undo, because a project form has
   no draft state anywhere.

   Set by an input listener rather than by comparing values, which sounds sloppier and is
   not: a comparison has to know which fields belong to which project and what "unchanged"
   means for a select whose default moved, and it silently answers "clean" when it gets
   that wrong. Typing into a form is the signal. */
let formDirty = false;

/* A one-shot message for the render that follows an action.

   Consumed by the next renderProjectsPage and cleared as it is read, so a render five
   seconds later — a second save, another panel opening — does not replay it. The element
   removes *itself* on a timer rather than being cleared by a re-render, because a
   re-render at an arbitrary moment would throw away whatever somebody had started typing
   in another panel. */
let projFlash = "";

/* toast says something happened, over the page rather than in it.

   An inline notice was the first attempt and it was too easy to miss: it landed where the
   form had been, which is where the form no longer is, so the eye had already moved. This
   sits in a fixed corner, outside the document flow, so nothing below it shifts — a banner
   that pushes a list down is its own small confusion.

   Detached from any render. The element removes itself on a timer, because clearing it by
   re-rendering would throw away whatever somebody had started typing in another panel. */
function toast(text, kind, detail) {
  let host = document.getElementById("toasts");
  if (!host) {
    host = document.createElement("div");
    host.id = "toasts";
    document.body.appendChild(host);
  }
  const t = document.createElement("div");
  t.className = kind ? `toast ${kind}` : "toast";
  t.textContent = text;
  // The long form, on hover. A success needs one line; the five facts behind it are worth
  // keeping and not worth reading every time.
  if (detail) t.title = detail;

  // Click to copy, for a failure. A platform error names a missing scope or an address that
  // is about to be pasted into a search or a ticket, and selecting text inside something
  // that disappears on a timer is a race nobody should have to win.
  if (kind === "bad") {
    t.title = "Click to copy";
    t.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        // No clipboard permission, or an insecure context. Selecting the text is the
        // fallback that always works, so say so rather than failing silently.
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(t);
        sel.removeAllRanges();
        sel.addRange(range);
        return;
      }
      if (t.querySelector(".copied")) return;
      const note = document.createElement("span");
      note.className = "copied";
      note.textContent = "copied";
      t.appendChild(note);
    };
  }

  host.appendChild(t);
  // Long enough to read a sentence, and it does not block anything while it is there.
  // A failure is left up longer: it is usually a sentence about what to type instead,
  // and it appears at the moment somebody's attention is on the form they just broke.
  setTimeout(() => t.remove(), kind === "bad" ? 9000 : 5000);
}

/* ask puts a question in a dialog and resolves to what the reader chose.

   It replaces `confirm()` for anything destructive, and the reason is not that the browser's
   dialog is ugly. It cannot show the answer. What somebody wants before pressing Unlink is
   two lists — what goes and what comes back — and `confirm()` renders that as a paragraph of
   plain text that reads as a warning to be clicked past. Here it is a comparison they can
   read in one pass, so the dialog answers the question instead of asking them to trust it.

   Returns a promise, so a caller reads as it did with confirm:

       if (!await ask({...})) return;

   Cancel is what has focus and what Escape, the backdrop and ✕ all do. A dialog that opens
   with an irreversible action focused turns a stray Return into that action. */
function ask(o) {
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    // `.modal ask`, not `.modal` alone: the boot report is also a .modal and is in the
    // document from the start, so a selector of `.modal` finds that one and anything
    // reasoning about "the dialog" reads the wrong element. The harness did.
    wrap.className = "modal ask";
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-modal", "true");
    wrap.innerHTML = `
      <div class="modal-card">
        <div class="modal-body">
          <div class="modal-x-row">
            <button class="modal-x" data-ask="no" title="Cancel" aria-label="Cancel">✕</button>
          </div>
          <h3>${esc(o.kind)}</h3>
          <p class="ask-what">${o.what}</p>
          <p class="ask-lede">${o.lede}</p>
          <div class="ask-cols">
            <div class="ask-col" style="--edge:var(--critical)">
              <h4>Removed now</h4>
              <ul>${(o.goes || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
            </div>
            <div class="ask-col keeps" style="--edge:var(--good)">
              <h4>Unaffected, or comes back</h4>
              <ul>${(o.keeps || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
            </div>
          </div>
          ${o.note ? `<p class="ask-note">${o.note}</p>` : ""}
          <div class="ask-acts">
            <button class="btn" data-ask="no">Cancel</button>
            <button class="btn solid-danger" data-ask="yes">${esc(o.confirm)}</button>
          </div>
        </div>
      </div>`;

    // The element goes away exactly once, whichever of the four exits was taken —
    // otherwise the keydown listener outlives the dialog and eats the next Escape.
    let done = false;
    const finish = answer => {
      if (done) return;
      done = true;
      document.removeEventListener("keydown", onKey);
      wrap.remove();
      resolve(answer);
    };
    const onKey = e => {
      if (e.key === "Escape") finish(false);
    };

    wrap.addEventListener("click", e => {
      // The backdrop cancels. Clicking the card must not, which is what the closest check
      // distinguishes — a drag that ends outside the card is otherwise a cancel.
      if (e.target === wrap) return finish(false);
      const btn = e.target.closest("[data-ask]");
      if (btn) finish(btn.dataset.ask === "yes");
    });
    document.addEventListener("keydown", onKey);

    document.body.appendChild(wrap);
    wrap.querySelector('.ask-acts [data-ask="no"]').focus();
  });
}

// confirmDiscard asks before throwing away unsaved edits, and returns whether to go on.
function confirmDiscard() {
  if (!formDirty) return true;
  if (!confirm("You have unsaved changes to this project. Discard them?")) return false;
  formDirty = false;
  return true;
}

// The browser's own guard, for the back link, a bookmark, or a closed tab. The wording is
// the browser's — every one of them ignores a custom message — so preventDefault plus
// returnValue is the whole of the API.
window.addEventListener("beforeunload", e => {
  if (!formDirty) return;
  e.preventDefault();
  e.returnValue = "";
});

function renderProjectsPage(s) {
  const el = document.getElementById("projects-body");
  const ro = !s.can_write;

  const banner = ro
    ? `<div class="notice warn"><strong>Read-only from here.</strong> ${esc(s.read_only_why || "")}
       <p>A project decides what command runs on the build host, so it can only be changed on
       that machine.</p></div>`
    : "";

  const rows = s.projects.length ? s.projects.map(p => projectCard(p, s, ro)).join("") :
    `<div class="notice">No projects yet. Every repository the App is installed on still builds
     using its own <code>.docpreview.yml</code> — adding a project is how you take the build
     command out of the branch.</div>`;

  /* The button goes above the list and the form it opens is a dialog.

     Both were below everything, which is fine for three projects and wrong for thirty:
     adding one meant scrolling past every project that already existed, and the form then
     appeared where the button had been — the bottom of a long page — so the fields to fill
     in were somewhere the eye had never been. A dialog has no position to get wrong.

     Edit stays inline, in the card, because that form belongs to a row and being beside it
     is the thing that says which. */
  const adder = ro ? ""
    : `<div class="act projadd">
         <button class="btn primary" id="p-new">New project</button>
         <span class="grow"></span>
         ${prefixField(s)}
       </div>`;

  const dialog = (!ro && projOpen.key === NEW)
    ? `<div class="modal" id="p-new-modal">
         <div class="modal-card wide" role="dialog" aria-modal="true" aria-label="New project">
           <div class="modal-body">
             <!-- Pinned, not merely at the top: the body scrolls, and a close control that
                  scrolled away with the first field left the only way out at the bottom of
                  nineteen of them. Sticky keeps it where it was found.

                  Same handler as the Cancel button below, so it goes through the same
                  discard guard — a form with this many fields must not vanish on one
                  click. -->
             <div class="modal-x-row">
               <button class="modal-x" data-close-panel="1" title="Close" aria-label="Close">✕</button>
             </div>
             ${projectForm(s, null)}
           </div>
         </div>
       </div>`
    : "";

  el.innerHTML = `${banner}${adder}${rows}${dialog}`;

  // Read once and cleared, so it cannot reappear on an unrelated render.
  if (projFlash) {
    toast(projFlash);
    projFlash = "";
  }

  // Something the server did alongside the request that did not work — today only a
  // default-branch preview it could not start when a project was created. The save itself
  // succeeded, so this is a toast rather than an error: the project is saved, and the one
  // thing that did not happen is still said out loud instead of being swallowed.
  if (s.note) toast(s.note, "bad", s.note);

  // Wired unconditionally: with no write access there are no buttons to wire, and a
  // read-only page that skipped this would still have to know that.
  wireProjectHandlers(s);
}

// NEW is the pseudo-key the add form opens under, so one piece of state covers both
// "editing this project" and "adding one".
const NEW = "␀new";

// A leading space in NEW, so it can never collide with a real `platform/owner/repo`
// — projectFromRequest rejects a space in any of the three.

function projectCard(p, s, ro) {
  const key = projectKey(p);
  const open = projOpen.key === key ? projOpen.tab : null;
  const dockered = p.driver === "docker" || (!p.driver && s.defaults.driver === "docker");

  return `<div class="pcard${p.enabled ? "" : " pcard-off"}" data-card="${esc(key)}">
    <div class="pcard-head">
      ${avatarHTML(p)}
      <span class="name">${esc(projectLabel(p))}</span>
      ${p.display_name ? `<span class="sub">${esc(p.owner)}/${esc(p.repo)}</span>` : ""}
      <span class="flag opt">${esc(platformLabel(p.platform))}</span>
      <span class="flag ${p.enabled ? "on" : "off"}">${p.enabled ? "enabled" : "disabled"}</span>
      <span class="flag ${dockered ? "on" : "opt"}">${esc(p.driver || s.defaults.driver)}${
        p.driver ? "" : " (default)"}</span>
      <span class="grow"></span>
      ${ro ? "" : `<button class="btn" data-tab="build" data-key="${esc(key)}"
          aria-pressed="${open === "build"}">Edit</button>
        <!-- No "Build open PRs" here. It queued one build per open pull request, which is
             what adding a project already does, and on a repository with several it read as
             having picked one at random. The scan still runs when a project is added; the
             button that invited it by hand did not earn its place on every card. -->
        <button class="btn" data-del-project="${esc(key)}">Delete</button>`}
    </div>
    ${branchStrip(p, ro)}
    ${projectFacts(p)}
    ${credentialWanted(p, s)}
    ${unlinkedSection(p, ro)}
    ${p.notes ? `<div class="hint pcard-notes">${esc(p.notes)}</div>` : ""}
    ${open === "build" ? `<div class="panel">${projectForm(s, p)}</div>` : ""}
    ${secretsSection(p, s)}
  </div>`;
}

// projectLabel is what to call a project on screen.
const projectLabel = p => p.display_name || p.repo;

// platformLabel renames one platform for the page without renaming it in the data.
//
// `local` is the git simulator: bare repositories in a directory on this machine. The
// stored value is the primary key of every project, preview and build row and is what
// a webhook delivery is matched against, so it stays `local`; what an operator reads
// says what it actually is.
const platformLabel = p => p === "local" ? "filesystem" : p;

// avatarHTML draws the project's badge.
//
// A monogram and a colour derived from the name when nothing is set, so a list of ten
// projects is scannable with no configuration at all — the point is telling rows
// apart, and that should not require an afternoon of choosing emoji. An operator who
// wants a specific one sets it and it wins.
//
// Deliberately not an image URL. The dashboard is served by a loopback daemon with no
// outbound dependency, and a remote avatar would announce every project on the page to
// whoever hosts the image, every time anyone opened it.
function avatarHTML(p) {
  // An inlined image, for a project with a real logo. Rendered through <img src>, where
  // an SVG cannot run script — and only ever a data: URI, because a remote src would
  // announce every project on this page to whoever hosts the image. The server refuses
  // anything else; this refuses it again rather than trusting that.
  if (String(p.avatar || "").startsWith("data:image/")) {
    return `<span class="ava ava-img"><img src="${esc(p.avatar)}"
      alt="" width="22" height="22"></span>`;
  }

  const label = p.avatar || monogram(projectLabel(p));
  // A hue from the name, so the colour is stable across restarts without being stored,
  // and two projects next to each other are very unlikely to share one. Fixed
  // saturation and lightness, because the text on top has to stay readable.
  let h = 0;
  for (const ch of `${p.platform}/${p.owner}/${p.repo}`) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<span class="ava" style="background:hsl(${h} 62% 88%);border-color:hsl(${h} 40% 74%)"
    aria-hidden="true">${esc(label)}</span>`;
}

// imagePicker is the container image field: a text box that is also a search box, over a
// list of the images known to work here.
//
// A <datalist> was the first attempt and it is not this. Its dropdown is the browser's,
// which means no descriptions, no styling, no way to say which one is the default, and on
// some browsers no way to see the list at all without typing a character that matches. The
// list is short and opinionated, and the interesting part is *why* one entry differs from
// another — which needs a row you can put a sentence in.
//
// Free text is preserved on purpose: the value is whatever the operator types, and a
// private registry mirror is the normal answer in an enterprise. The list is a shortcut,
// never a constraint.
function imagePicker(elID, value, s) {
  const images = s.defaults.images || [];
  return `<span class="picker imgpick">
    <input class="control" id="${elID}" value="${value}"
      placeholder="${esc(s.defaults.image)}" autocomplete="off" spellcheck="false"
      aria-expanded="false" aria-haspopup="listbox">
    <div class="pick-panel" id="${elID}-panel" hidden>
      <div class="pick-list" role="listbox">
        ${images.map(i => `<button type="button" class="pick-row" data-image="${esc(i)}"
          role="option">
          <span>${esc(i)}</span>
          ${i === s.defaults.image ? `<span class="count">default</span>` : ""}
          ${imageNote(i) ? `<span class="count">${esc(imageNote(i))}</span>` : ""}
        </button>`).join("")}
      </div>
    </div>
    <div class="imgcheck" id="${elID}-check"></div>
  </span>`;
}

// imageNote is the one thing worth knowing about an image beyond its name.
function imageNote(image) {
  if (image.includes("-slim")) return "no git";
  if (image.includes("alpine")) return "musl";
  return "";
}

// avatarField is a short input for two characters and a textarea for an inlined image.
//
// Two controls rather than one, because a 2.4 KB data URI in a 5rem input is a field
// nobody can see the contents of, and a textarea for two characters is absurd. Which
// one appears follows the value already there, and the placeholder says how to get the
// other.
function avatarField(p, elID) {
  const cur = p ? (p.avatar || "") : "";
  const isImg = cur.startsWith("data:image/");
  // The value itself is hidden once it is an image: 1.4 KB of percent-encoded SVG in a
  // text field is not something anybody reads or edits, and showing it made the field
  // look broken. What is shown is the image, a picker, and a way to clear it.
  return `<span class="avafield">
    <input type="${isImg ? "hidden" : "text"}" class="control" id="${elID}"
      style="max-width:9rem" value="${esc(cur)}"
      placeholder="${esc(monogram(p ? projectLabel(p) : "?"))}">
    ${isImg ? `<span class="ava ava-img"><img src="${esc(cur)}" alt="" width="22" height="22"></span>` : ""}
    <input type="file" id="${elID}-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
    <button type="button" class="btn" data-pick="${elID}">${isImg ? "Replace" : "Upload"}</button>
    ${isImg ? `<button type="button" class="btn" data-clearava="${elID}">Clear</button>` : ""}
  </span>`;
}

// monogram takes the first character of the first two words, or the first two
// characters of one word. `unified-doc` gives UD; `docpreview` gives DO.
function monogram(name) {
  const parts = String(name || "?").split(/[^A-Za-z0-9]+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

// projectFacts renders only what the project actually states, as one property per
// line. Every field is optional and a blank one means "defer to the repository", so
// listing the empty ones would fill the card with the word "default".
function projectFacts(p) {
  const fields = [
    ["directory", p.build_dir],
    ["command", p.build_command],
    ["output", p.build_output],
    ["base URL", p.base_url],
    ["ignore script", p.detect_script],
    ["image", p.image],
    // Listed because a project with a raised timeout is the one whose builds look
    // hung, and the card is where somebody checks what it was set to.
    ["timeout", p.timeout],
  ].filter(([, v]) => v);

  const env = (p.secrets || []).length
    ? [["env", `${p.secrets.length} variable${p.secrets.length === 1 ? "" : "s"}`]] : [];

  if (!fields.length && !env.length) {
    return `<dl class="facts"><div><dt>build</dt>
      <dd class="inherit">entirely from the repository's .docpreview.yml</dd></div></dl>`;
  }
  return `<dl class="facts">${fields.concat(env).map(([k, v]) =>
    `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
}

// secretsPanel lists this project's environment variables and lets one be added.
//
// Names only, never values — the same rule as the credential page, and for the same
// reason: this payload is readable from anywhere the dashboard is, while writing it
// is loopback-only.
/* Which projects have their variables expanded, by key.

   A set rather than a single value: this is a list of projects, and collapsing the one
   you were reading in order to look at another one's tokens is a worse trade here than on
   the credential page, where the three sections are three views of the same thing.

   Outside the render because the page rebuilds its markup on every save — the same reason
   the credential page holds its accordion state outside the DOM. */
const projSecretsOpen = new Set();

/* secretsSection is the project's own environment variables, as an accordion.

   It was a `Secrets` button beside `Edit`, which made a project's tokens a *mode* the
   card had to be switched into — and the two modes were mutually exclusive, so checking
   a variable meant leaving the form. Same styling as the credential page's groups, and
   the same green stripe, because these are the same kind of thing: values injected into
   a build. A reader who has seen one page knows what this is. */
function secretsSection(p, s) {
  const key = projectKey(p);
  const own = (p.secrets || []).length;
  const inherited = (s.global_secrets || []).filter(g => !(p.secrets || []).includes(g)).length;

  // What the collapsed summary has to carry: a project with none of its own but several
  // inherited is not the same as a project with nothing, and only one of those means a
  // build is about to fail for a missing token.
  const count = own
    ? `${own} of its own${inherited ? `, ${inherited} inherited` : ""}`
    : inherited ? `${inherited} inherited` : "none";

  return `<div class="secbox pcard-secrets">
    <details class="secgroup-box" data-group="build" data-secrets="${esc(key)}"${
      projSecretsOpen.has(key) ? " open" : ""}>
      <summary>
        <span class="secgroup">Environment variables</span>
        <span class="secgroup-n">${esc(count)}</span>
      </summary>
      <div class="secgroup-why">Injected into every build of this repository and redacted
        from every build log. This is how a build clones another private repository — the
        value is a token, the name is whatever the build script looks for.${
          p.platform === "bitbucket" ? `
        <br>This repository's <em>own</em> clone credential does not go here: it is under
        <strong>Edit → Bitbucket credential</strong>, where the daemon can use it and a
        build cannot read it.` : ""}</div>
      <div class="pcard-secrets-body">${secretsPanel(p, s)}</div>
    </details>
  </div>`;
}

function secretsPanel(p, s) {
  if (!s.secrets_available) {
    return `<div class="notice">This daemon has no credential store wired, so a project
      cannot have environment variables of its own.</div>`;
  }
  if (s.vault_locked) {
    return `<div class="notice warn">The vault is locked, so nothing here can be read or
      written. <a href="/secrets">Unlock it</a> and come back.</div>`;
  }

  const key = projectKey(p);

  /* One row per variable, in the credential page's shape: name and chips on the left, a
     masked field in the middle, its actions on the right.

     This was a row of chips with an ✕ and a two-field form below it, which meant the only
     thing you could do to an existing variable was delete it — replacing a rotated token
     was delete-then-retype-the-name. The row layout gets replace, delete and the name in
     one line each, and matches /secrets so the two pages are one control.

     No value is ever rendered. The field is always empty and always a password input:
     nothing can read a value back, so a box that showed one would be lying. */
  const row = (env, own) => {
    const id = `pv-${key}-${env}`;
    const chips = own
      ? `<span class="flag on">set</span><span class="flag on">build var</span>`
      // Inherited names are listed rather than omitted, because "this project has no
      // variables" and "this project has none of its own" look identical otherwise and
      // only one of them means a build is about to fail for a missing token.
      : `<span class="flag opt">inherited</span>`;

    return `<div class="sec" data-secret="${esc(env)}"${own ? "" : ` data-inherited="1"`}>
      <div>
        <div class="name">${esc(env)} ${chips}</div>
      </div>
      <div class="valwrap">
        <input type="password" id="${esc(id)}" autocomplete="off"
          placeholder="${own ? "paste to replace" : "paste to override"}">
        <button class="btn icon" data-expand="${esc(id)}"
          title="Expand for a multi-line value. Note that an expanded box is not masked.">⤢</button>
      </div>
      <div class="act">
        <button class="btn" data-set-secret="${esc(env)}" data-key="${esc(key)}"
          data-field="${esc(id)}">Save</button>
        ${own ? `<button class="btn" data-del-secret="${esc(env)}"
          data-key="${esc(key)}">Delete</button>` : ""}
      </div>
      ${own ? "" : `<div class="hint wide">From the server config, so every project gets it.
        Saving a value here overrides it for this project only.</div>`}
    </div>`;
  };

  const own = (p.secrets || []).map(env => row(env, true)).join("");
  const inherited = (s.global_secrets || [])
    .filter(g => !(p.secrets || []).includes(g))
    .map(g => row(g, false)).join("");

  // No heading and no lead paragraph: the accordion summary above is the heading, and
  // the sentence explaining what these are lives beside it. Both were here first, and
  // together they repeated themselves twice inside one card.
  return `${own}${inherited}
    <div class="sec">
      <div><div class="name">New entry</div></div>
      <div class="newline">
        <!-- One line, inline labels, matching the credential page. What these are for is
             stated once, in the accordion summary above.

             No placeholder on the name: a greyed-out BB_REPO_TOKEN_ONPREM read as a value
             already entered, and this is the field where getting it wrong is silent — the
             build looks for a variable that is not there. -->
        <label class="lab" for="s-env-${esc(key)}">Name</label>
        <input class="nm" id="s-env-${esc(key)}" autocomplete="off" spellcheck="false">
        <label class="lab" for="s-val-${esc(key)}">Value</label>
        <span class="valwrap">
          <input id="s-val-${esc(key)}" type="password" autocomplete="off">
          <button class="btn icon" data-expand="s-val-${esc(key)}"
            title="Expand for a multi-line value — a PEM will not fit on one line. Note that an expanded box is not masked.">⤢</button>
        </span>
      </div>
      <div class="act">
        <button class="btn" data-add-secret="${esc(key)}">Add variable</button>
      </div>
    </div>`;
}

/* scmCredentialFields is the project's own source-control credential, on the project form.

   Only for Bitbucket, and that is not a platform check for its own sake. A GitHub App is
   *installed on* repositories, so the installation is the grant and there is nothing per
   project to paste. A Bitbucket access token is scoped at creation to one repository —
   unless a workspace administrator permits the wider kinds, which many do not — so on a
   real workspace there is no single token that reaches every repository and the credential
   has to live beside the project row.

   On the form rather than in the variables accordion, because it is asked for when the
   project is created: a project added without it cannot clone, and discovering that from a
   failed build twenty seconds later is the experience this avoids.

   Never rendered with a value. `stored` says whether one is there, which is the only thing
   that can be shown — a box that displayed a token would be the one place in this system
   that reads a secret back. */
function scmCredentialFields(s, p, id) {
  // An existing project knows its platform, so the block is simply absent for GitHub.
  // A new one does not yet — the platform is whatever the select or a pasted URL ends up
  // saying — so the block is rendered hidden and revealed by syncSCMFields below. It
  // cannot be decided here: this runs while the form is being built, before the select it
  // would have to read exists.
  if (p && p.platform !== "bitbucket") return "";
  const hidden = p ? "" : " hidden";

  const stored = new Set((p && p.scm) || []);
  const global = new Set((s.defaults && s.defaults.scm_global) || []);
  // Whether a blank field means "inherit" or "nothing will work". Both branches below need
  // it, so it is computed before either.
  const inherits = global.has("bitbucket.access_token") || global.has("bitbucket.api_token");

  /* A new project gets the question and not the boxes.

     Pasting a token into a form for a project that does not exist yet means the token has
     nowhere to be stored until the row is written, so the save became two requests where
     the second could fail on its own — and did, reporting "failed to fetch" about a project
     that had been created. It also put three credential fields in front of somebody whose
     next click is Create.

     So: say whether it is private, create it, and then paste the token into the row that
     now exists. The card says which credential is missing until one is there. */
  if (!p) {
    return `
      <div id="scm-fields"${hidden}>
      <div class="field-head">Bitbucket credential</div>
      <div class="credbox">
        <div class="field">
          <label for="${id("private")}">Private repository</label>
          <div>
            <label class="inline"><input type="checkbox" id="${id("private")}"
              data-privtoggle="1"> Needs a credential to clone</label>
          </div>
          <div class="why">${inherits
            ? `A workspace-wide credential is stored on <a href="/secrets">/secrets</a>, so
               this repository can already be cloned. Give it its own token later only to
               override that.`
            : `Create the project first, then open it and paste an access token — the card
               will say so until you do. Nothing can be stored against a project that does
               not exist yet.`}</div>
        </div>
      </div>
      </div>`;
  }

  // What a blank field will actually do, stated once at the top of the section.
  const inheritLine = stored.size
    ? `This repository uses its own credential below${
        inherits ? ", overriding the workspace-wide one" : ""}.`
    : inherits
      ? `Blank fields inherit the workspace-wide credential from
         <a href="/secrets">/secrets</a>. Fill one in to override it for this repository only.`
      : `No workspace-wide credential is stored, so a private repository needs its own
         token here. <a href="/secrets">/secrets</a> holds the shared one if you have one.`;

  /* One credential per row, in the same shape /secrets uses for a secret: name and its
     state on the left, a masked box with an expand control in the middle, its own Save on
     the right. These *are* secrets — they go to the vault, not to the project row — and
     rendering them as ordinary form fields said otherwise.

     Saved immediately rather than with the form, for an existing project. A credential is
     not a setting: it is pasted once, and having to press the form's Save to commit it
     means an operator who pastes a token and then presses Test is testing the old one.
     A new project has nothing to save against yet, so there the boxes travel with the
     form. */
  const secretRow = (name, label, elID, hint) => `
    <div class="sec" data-scmrow="${esc(name)}">
      <div>
        <div class="name">${esc(label)} ${stored.has(name)
          ? `<span class="flag on">set</span>`
          : `<span class="flag opt">not set</span>`}</div>
      </div>
      <!-- Masked like the tokens, including the email. An address is not itself a secret,
           but it is half of an Authorization header and half of a clone URL, it is stored
           in the same vault as its other half, and a form where one half of a credential
           looks like a setting and the other looks like a secret invites treating them
           differently. The expand control reveals it when reading it back matters. -->
      <div class="valwrap">
        <input type="password" id="${elID}" autocomplete="off"
          placeholder="${stored.has(name) ? "paste to replace" : "paste to set"}">
        <button class="btn icon" data-expand="${elID}"
          title="Expand for a multi-line value. Note that an expanded box is not masked.">⤢</button>
      </div>
      <div class="act">${p ? `
        <button class="btn" data-set-scm="${esc(name)}" data-key="${esc(projectKey(p))}"
          data-field="${elID}">Save</button>
        ${stored.has(name) ? `<button class="btn" data-clear-scm="${esc(name)}"
          data-key="${esc(projectKey(p))}">Delete</button>` : ""}` : ""}</div>
      ${hint ? `<div class="hint wide">${hint}</div>` : ""}
    </div>`;

  return `
    <div id="scm-fields"${hidden}>
    <div class="field-head">Bitbucket credential
      <!-- Empty unless the repository is marked private. A public repository clones with no
           credential, so a red "missing" beside one is the page inventing a problem — and
           the chip is recomputed by updateSCMFlag when the checkbox moves. -->
      <span id="scm-flag">${p && p.private ? scmFlag(s, p) : ""}</span></div>
    <!-- A bordered block, because these fields belong together and to a question asked
         above them. Loose in the column they read as three more build settings, and which
         of them was required depended on a checkbox two rows up. -->
    <div class="credbox">
      <div class="field">
        <label for="${id("private")}">Private repository</label>
        <div>
          <!-- Asked, not assumed. A public repository clones with no credential at all, so
               without this the form must either warn every project about a token it may not
               need, or stay quiet and let a private repository be added with no way to
               clone it. One question makes the warning mean something. -->
          <label class="inline"><input type="checkbox" id="${id("private")}"
            data-privtoggle="1"${p && p.private ? " checked" : ""}>
            Needs a credential to clone</label>
        </div>
        <div class="why">${inheritLine}</div>
      </div>
      <!-- One field, because one is all a Bitbucket access token needs.
           This offered a choice between an access token and an account email plus API
           token, which put an email field in front of every operator — and an access token
           needs no email: the clone username is the literal x-token-auth, and the API call
           is a bearer header. The account-token mode still exists as a server-wide setting
           (bitbucket.auth) for anyone who has to use one; it is not a per-project question,
           and presenting it as one made the simple case look complicated.

           No backticks in this comment. It sits inside a JavaScript template literal, so
           one would end the string — which is exactly what happened, and the whole page
           stopped parsing. -->
      ${secretRow("scm.access_token", "Access token", id("scmtoken"),
        // A link, not a trail of menu names. Bitbucket's path is predictable from the
        // repository this project already names, so telling somebody to go and find
        // Repository settings → Security → Access tokens is making them navigate to a URL
        // this page could have handed them.
        `Create or rotate one at <a href="https://bitbucket.org/${esc(p.owner)}/${
          esc(p.repo)}/admin/access-tokens" target="_blank" rel="noreferrer">bitbucket.org/${
          esc(p.owner)}/${esc(p.repo)}/admin/access-tokens</a>. Scopes: ` +
        "<strong>Repositories: Read</strong> to clone and " +
        "<strong>Pull requests: Write</strong> to comment. Sent as " +
        "<code>x-token-auth:&lt;token&gt;</code> for the clone and as a bearer header for " +
        "the API — no email, no username. Nothing reads it back.")}

      <!-- Leftovers from the account-credential form, as one line with one button.
           They had a row each, which put three "set" credentials in a panel where only one
           is wanted and left it unclear which mattered. They still have to be *visible*:
           they are resolved before the access token, so a stale pair silently wins — but
           seeing them is all that is needed, and the only useful action is removing both. -->
      ${stored.has("scm.email") || stored.has("scm.api_token") ? `
        <div class="sec">
          <div><div class="name">Account credential
            <span class="flag off">stale</span></div></div>
          <div class="hint">An email-and-API-token pair is stored and is used
            <em>instead of</em> the access token above. It authenticates as a person over
            basic auth — remove it unless that is deliberate.</div>
          <div class="act">
            <button class="btn" data-clear-scm="scm.email,scm.api_token"
              data-key="${esc(projectKey(p))}">Delete both</button>
          </div>
        </div>` : ""}
      ${p ? `<div class="field">
        <label></label>
        <div class="act">
          <!-- Only for a saved project: the check asks the platform about this repository,
               so there has to be a row for it to ask about. -->
          <button class="btn" data-test-scm="${esc(projectKey(p))}">Test credential</button>
          <span class="hint">Confirms the token can read the repository and its pull
            requests. Write cannot be checked without writing something.</span>
        </div>
      </div>` : ""}
    </div>
    </div>`;
}

/* prefixField is the installation's name prefix, beside New project.

   Not on a project card, because it is not a project's: it starts every hostname this daemon
   publishes. It is here rather than in config.yml because the moment somebody needs it is the
   moment they are standing up a second installation against the same exposer account — and
   that is not a moment when they want to hand-edit YAML on a host they have just built.

   Names are scoped to the exposer *account* while shares are scoped to the environment, so
   two daemons on one account do not reap each other's shares — they collide on names, and
   this is what separates them.

   The example is live rather than described. "a" is an abstraction; `a-docs-main` is the
   thing that will be in a URL, and it is the only way to make the trailing-hyphen question
   answer itself. */
function prefixField(s) {
  const cur = (s.defaults && s.defaults.prefix) || "";
  const sample = cur ? `${esc(cur)}-docs-main` : "docs-main";
  return `<label class="hint" for="p-prefix">Hostname prefix</label>
    <input id="p-prefix" class="prefixbox" value="${esc(cur)}" placeholder="none"
      maxlength="12" spellcheck="false" aria-label="hostname prefix">
    <span class="took" id="p-prefix-eg">${sample}</span>
    <button class="btn" data-save-prefix="1">Save</button>`;
}

/* branchStrip is the project's permanent preview of its default branch.

   First thing on the card, above the settings, because it is the link somebody actually came
   for: every other preview is about a pull request that will be merged and forgotten, and this
   one is the current state of the documentation. It is created when the project is and is not
   torn down by anything short of deleting the project.

   Three states, and the absent one is why this is not simply a link. A project added before
   the daemon could reach the platform has no branch preview at all, and an empty space there
   is indistinguishable from a feature that is not working — so it says so and offers to start
   one. */
function branchStrip(p, ro) {
  const b = p.branch;
  const key = projectKey(p);
  if (!b) {
    if (ro) return "";
    return `<div class="pcard-branch none">
      <span class="hint">No preview of the default branch yet.</span>
      <span class="grow"></span>
      <button class="btn" data-branch="${esc(key)}"
        title="Build this repository's default branch and keep it published">Build the default branch</button>
    </div>`;
  }

  const st = state(b.state);
  const live = safeURL(b.url);
  return `<div class="pcard-branch" style="--edge:${st.color}">
    <span class="dot${st.work ? " work" : ""}" style="--edge:${st.color}"></span>
    <span class="bname">${esc(b.name)}</span>
    <span class="hint">${esc(st.label.toLowerCase())}</span>
    ${b.commit ? `<span class="took">${esc(b.commit.slice(0, 7))}</span>` : ""}
    <span class="grow"></span>
    ${live
      // Only when there is one. A branch preview whose first build failed has a row and no
      // URL, and a link to nothing is worse than the button beside it.
      ? `<a class="btn" href="${esc(live)}" target="_blank" rel="noreferrer">Open ↗</a>`
      : `<span class="hint">no URL yet</span>`}
    ${ro ? "" : `<button class="btn" data-branch="${esc(key)}"
      title="Build ${esc(b.name)} again at its current tip">Rebuild</button>`}
  </div>`;
}

/* unlinkedSection says this project is skipping pull requests, and opens the picker.

   Nothing at all when nothing is unlinked, which is the ordinary state of every project.
   The first version said "Every open pull request on this repository is built" on every
   card — true, unasked, and one more line to read past on all of them. A strip that appears
   only when there is something to say is also a signal by its presence.

   The count and not the numbers: which pull requests, when each was unlinked and what branch
   it was on is four facts per row, and a card is not where four-by-N belongs. The picker is.
   Also gone is the free-number box that used to sit here — building an arbitrary pull
   request by typing its number is still an API call, but it was a control nobody reached
   for beside one they do. */
function unlinkedSection(p, ro) {
  if (ro) return "";
  const key = projectKey(p);
  const n = (p.ignored || []).length;
  if (!n) return "";

  return `<div class="pcard-links">
    <span class="hint">Skipping <strong>${n}</strong> pull request${n === 1 ? "" : "s"} —
      ${n === 1 ? "it is" : "they are"} not built by a push, a delivery or a scan.</span>
    <span class="grow"></span>
    <button class="btn" data-relink="${esc(key)}">Link an unlinked PR…</button>
  </div>`;
}

/* relinkPicker is the dialog behind that button: one row per unlinked pull request.

   A dialog rather than the card, because this is the only place the four facts about each
   one are worth showing — the number, the branch it was on, when it was unlinked, and a
   control to bring it back. Choosing is the whole interaction, so nothing else is in it.

   Resolves to the chosen number, or null. The list is passed in rather than re-fetched: it
   came with the page state, and a picker that fetched would open empty for a moment. */
function relinkPicker(p) {
  const ignored = p.ignored || [];
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    // Distinguished from every other .modal for the same reason ask's is — see there.
    wrap.className = "modal pick";
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-modal", "true");
    wrap.innerHTML = `
      <div class="modal-card">
        <div class="modal-body">
          <div class="modal-x-row">
            <button class="modal-x" data-pick="" title="Close" aria-label="Close">✕</button>
          </div>
          <h3>Link an unlinked pull request</h3>
          <p class="ask-what">${esc(projectLabel(p))}
            <span class="mono">${esc(p.owner)}/${esc(p.repo)}</span></p>
          <p class="ask-lede">Linking one builds it now and stops it being skipped. Its
            preview comes back at the same URL, with a fresh comment on the pull request.</p>
          <div class="picklist">
            ${ignored.map(ig => `
              <button class="pickrow" data-pick="${ig.number}">
                <span class="mono num">#${ig.number}</span>
                <span class="branch">${esc(ig.branch || "branch unrecorded")}</span>
                <span class="grow"></span>
                <span class="took">unlinked ${esc(stamp(ig.created_at))}</span>
                <span class="btn">Link</span>
              </button>`).join("")}
          </div>
          <div class="ask-acts">
            <button class="btn" data-pick="">Cancel</button>
          </div>
        </div>
      </div>`;

    let done = false;
    const finish = n => {
      if (done) return;
      done = true;
      document.removeEventListener("keydown", onKey);
      wrap.remove();
      resolve(n);
    };
    const onKey = e => {
      if (e.key === "Escape") finish(null);
    };

    wrap.addEventListener("click", e => {
      if (e.target === wrap) return finish(null);
      const el = e.target.closest("[data-pick]");
      if (!el) return;
      finish(el.dataset.pick ? parseInt(el.dataset.pick, 10) : null);
    });
    document.addEventListener("keydown", onKey);

    document.body.appendChild(wrap);
    // The first pull request, not Cancel. Nothing here is destructive — the worst outcome
    // of a stray Return is a build somebody wanted anyway.
    const first = wrap.querySelector(".pickrow");
    (first || wrap.querySelector('.ask-acts [data-pick]')).focus();
  });
}

/* credentialWanted is the line on a project card naming the credential it still needs.

   On the card rather than only in a toast after saving, because a toast is gone in five
   seconds and this state can last days: a private repository with no token builds nothing,
   and the only other symptom is a failed clone in a log nobody opened.

   Nothing for a public repository, for a project whose own token is stored, or for one that
   inherits a workspace-wide credential — all three are working states, and a warning on a
   working state is one nobody reads twice. */
function credentialWanted(p, s) {
  if (p.platform !== "bitbucket" || !p.private) return "";
  const stored = new Set(p.scm || []);
  if (stored.has("scm.access_token") || stored.has("scm.api_token")) return "";
  const global = new Set((s.defaults && s.defaults.scm_global) || []);
  if (global.has("bitbucket.access_token") || global.has("bitbucket.api_token")) return "";

  return `<div class="notice warn pcard-wants">
    <strong>Needs a Bitbucket access token.</strong> This repository is private and has no
    credential — its own or workspace-wide — so a build cannot clone it.
    <button class="btn" data-tab="build" data-key="${esc(projectKey(p))}">Add one</button>
    </div>`;
}

/* scmFlag is the credential's state on one project, as a chip.

   Three states and the middle one is why this is not simply "set or missing": with a
   workspace-wide token stored, a project with none of its own is not missing anything, it
   inherits. Calling that missing tells an operator to fix something that already works. */
function scmFlag(s, p) {
  const stored = new Set((p && p.scm) || []);
  if (stored.has("scm.access_token") || stored.has("scm.api_token")) {
    return `<span class="flag on">set</span>`;
  }
  const global = new Set((s.defaults && s.defaults.scm_global) || []);
  if (global.has("bitbucket.access_token") || global.has("bitbucket.api_token")) {
    return `<span class="flag opt">inherited</span>`;
  }
  return `<span class="flag off">missing</span>`;
}

/* updateSCMFlag recomputes that chip when the private checkbox moves.

   Empty for a public repository: it clones with no credential at all, so a red "missing"
   beside one is the page inventing a problem. This is the whole reason the question is
   asked. */
function updateSCMFlag(s) {
  const box = document.getElementById("scm-flag");
  const priv = document.querySelector("[data-privtoggle]");
  if (!box || !priv) return;
  if (!priv.checked) {
    box.innerHTML = "";
    return;
  }
  // The form's field ids carry the project key, which is how the chip finds the row it
  // belongs to without the render passing it through a global.
  const prefix = "p-private-";
  const key = priv.id.startsWith(prefix) ? priv.id.slice(prefix.length) : "";
  const p = key ? (s.projects || []).find(x => projectKey(x) === key) : null;
  box.innerHTML = scmFlag(s, p);
}

/* scmCredentialAvailable reports whether a clone of this project could authenticate:
   something stored on the project, something typed into the form right now, or a
   workspace-wide credential to inherit.

   The typed-but-unsaved case is the one worth spelling out. Somebody filling in the form
   for the first time has a token in the box and nothing stored yet, and warning them that
   no credential is available while they are looking at the one they just pasted would be
   the page arguing with itself. */
function scmCredentialAvailable(s, p, id) {
  const typed = (elID) => {
    const el = document.getElementById(elID);
    return !!(el && el.value.trim());
  };
  if (typed(id("scmtoken"))) return true;

  const stored = new Set((p && p.scm) || []);
  if (stored.has("scm.access_token") || stored.has("scm.api_token")) return true;

  const global = new Set((s.defaults && s.defaults.scm_global) || []);
  return global.has("bitbucket.access_token") || global.has("bitbucket.api_token");
}

/* syncSCMFields shows the Bitbucket credential block when the new-project form is on
   Bitbucket, and hides it otherwise.

   Two triggers, because the platform can be set two ways: the select directly, and a
   pasted repository URL, which sets the select's value from script — and a programmatic
   assignment fires no change event, so the URL handler calls this itself. */
function syncSCMFields() {
  const box = document.getElementById("scm-fields");
  const plat = document.getElementById("p-platform");
  if (!box || !plat) return;
  box.hidden = plat.value !== "bitbucket";
}

function projectKey(p) { return `${p.platform}/${p.owner}/${p.repo}`; }

/* frameworkSelect is the preset dropdown.

   The table comes from the server, which is the same table the build applies — a copy in
   this file would drift, and the way it would drift is a form promising one build command
   and the build running another. */
function frameworkSelect(s, p, elID) {
  const list = s.defaults.frameworks || [];
  // A new project starts on the server's default preset; an existing one shows what it
  // stored, including blank, which means the repository decides.
  const cur = p ? (p.framework || "") : (s.defaults.framework || "");
  if (!list.length) {
    // An older daemon serving a newer page, or the other way round. A select with nothing
    // in it is worse than none.
    return `<input class="control" id="${elID}" value="${esc(cur)}" placeholder="none">`;
  }
  return `<select class="control" id="${elID}" data-framework="1">${
    list.map(f => `<option value="${esc(f.id)}"${f.id === cur ? " selected" : ""}
      data-build="${esc(f.build_command || "")}" data-output="${esc(f.output || "")}"
      data-tool="${esc(f.needs_tool || "")}">${esc(f.label)}</option>`).join("")}</select>`;
}

/* syncFramework moves the preset's values into the placeholders of the fields it fills,
   and warns when the preset needs a tool the chosen image will not have.

   Placeholders rather than values: typing into the box is what overriding means, so the
   preset must not put text there — a prefilled field is indistinguishable from one
   somebody set deliberately, and it would then be stored as an explicit value that stops
   tracking the preset. */
function syncFramework() {
  const sel = document.querySelector("[data-framework]");
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  if (!opt) return;

  const put = (attr, key, fallback) => {
    const box = document.querySelector(`[data-preset="${key}"]`);
    if (box) box.placeholder = opt.dataset[attr] || fallback;
  };
  put("dir", "dir", "www");
  put("build", "build_command", "npm run build");
  put("output", "output", "build");

  // MkDocs on a Node image fails with "mkdocs: not found" twenty seconds into a build.
  // The image field is right there, so the answer can be given before that.
  const warn = document.getElementById("framework-tool");
  if (!warn) return;
  const tool = opt.dataset.tool || "";
  warn.hidden = !tool;
  if (tool) {
    warn.textContent = `${opt.textContent.trim()} needs ${tool} in the container image. ` +
      `The node images above do not have it — name one that does.`;
  }
}

// driverSelect offers only what this daemon will actually accept.
//
// An option that saves and then fails the build is worse than no option: the operator
// learns the answer from a red build an hour later instead of from the form. So docker
// is disabled when the startup probe did not find it, local is disabled unless
// build.allow_local_driver is set, and each says which it is in its own label.
function driverSelect(s, p, elID) {
  const d = s.defaults;
  // A blank value means "follow the server default", and the server default is always
  // one of the two concrete drivers — so offering it as a third option listed the same
  // driver twice, "docker — server default" above "docker — build in a container",
  // which is a distinction nobody outside this file can act on.
  //
  // So: two options, and saving pins the choice. Pinning is also the better default
  // semantic. A project's build environment should not change because somebody moved a
  // server-wide setting, and the one move that matters — flipping the server default to
  // local — is exactly the one you would not want applied silently to every project.
  // An existing row with a blank driver arrives at the server default preselected.
  const cur = (p && p.driver) || d.driver;
  const opt = (value, label, disabled) =>
    `<option value="${value}"${value === cur ? " selected" : ""}${
      disabled && value !== cur ? " disabled" : ""}>${label}${
      value === d.driver ? " · server default" : ""}</option>`;

  return `<select class="control" id="${elID}">
    ${opt("docker", d.docker_available
      ? "docker — build in a container"
      : `docker — not available: ${esc(d.docker_detail || "no docker")}`, !d.docker_available)}
    ${opt("local", d.allow_local_driver
      ? "local — build on this host"
      : "local — not enabled on this daemon", !d.allow_local_driver)}
  </select>`;
}

// driverWhy states the consequence of the choice rather than restating the names.
function driverWhy(s) {
  if (!s.defaults.allow_local_driver) {
    return "The container is the only thing between a pull request's build scripts and " +
      "this host, so <code>local</code> is off until <code>build.allow_local_driver</code> " +
      "says otherwise.";
  }
  return "<strong>local runs the pull request's own build scripts on this machine</strong> " +
    "as the daemon's user — every dependency's install script included. It is enabled on " +
    "this daemon.";
}

// parseRepoURL pulls a platform, owner and repository out of a pasted URL.
//
// It accepts what somebody actually has on a clipboard: the browser address bar, the
// green Code button's HTTPS URL, an SSH remote, and any of those with a trailing
// path from a deep link. The platform comes from the host rather than from a guess,
// and an unrecognised host returns nothing so the fields stay as typed rather than
// being filled with something wrong.
function parseRepoURL(raw) {
  const s = String(raw || "").trim();
  if (!s) return null;

  let host = "", path = "";
  const ssh = s.match(/^(?:ssh:\/\/)?git@([^:/]+)[:/](.+)$/);
  if (ssh) {
    host = ssh[1];
    path = ssh[2];
  } else {
    try {
      const u = new URL(s.includes("://") ? s : `https://${s}`);
      host = u.hostname;
      path = u.pathname;
    } catch {
      return null;
    }
  }

  const platform =
    /(^|\.)github\.com$/i.test(host) ? "github" :
    /(^|\.)bitbucket\.org$/i.test(host) ? "bitbucket" : "";
  if (!platform) return null;

  const parts = path.replace(/^\/+/, "").replace(/\.git$/i, "").split("/").filter(Boolean);
  if (parts.length < 2) return null;
  // Only the first two segments. A deep link carries /pull/4 or /src/main/docs after
  // them, and Bitbucket's own URLs are /workspace/repo/... as well.
  return {platform, owner: parts[0], repo: parts[1]};
}

// projectForm is both "add" and "edit": a PUT is an upsert, so they are one request,
// and two UIs for one operation drift. When p is given the fields are filled and the
// identity is fixed — changing owner or repo would silently create a second project
// rather than rename this one, so those inputs are read-only in edit.
function projectForm(s, p) {
  const v = f => esc(p ? (p[f] || "") : "");
  const id = f => p ? `p-${f}-${projectKey(p)}` : `p-${f}`;
  const field = (f, label, control, why) => `<div class="field">
    <label for="${id(f)}">${label}</label>${control}
    ${why ? `<div class="why">${why}</div>` : ""}</div>`;
  const text = (f, placeholder) => `<input class="control" id="${id(f)}"
    value="${v(f === "dir" ? "build_dir" : f === "command" ? "build_command"
      : f === "output" ? "build_output" : f === "baseurl" ? "base_url"
      : f === "detect" ? "detect_script" : f)}" placeholder="${placeholder}"
    ${f === "dir" ? `data-preset="dir"` : ""}
    ${f === "command" ? `data-preset="build_command"` : ""}
    ${f === "output" ? `data-preset="output"` : ""}>`;

  // The chosen preset's values, as the placeholders of the fields it fills. A blank box
  // over a greyed `npm run build` says what will happen; a blank box over nothing does
