  el.addEventListener("input", e => {
    if (e.target.closest(".panel, .pcard [data-save]")) formDirty = true;
  });

  const newBtn = document.getElementById("p-new");
  if (newBtn) {
    newBtn.onclick = () => {
      if (!confirmDiscard()) return;
      projOpen = {key: NEW, tab: "build"};
      renderProjectsPage(s);
    };
  }

  wireImageCheck(el);
  wireAvatarPickers(el);

  // Paste a repository URL and the three identity fields fill themselves. On input
  // rather than on a button, because a paste is the whole gesture — and left alone if
  // the URL is not one we recognise, so a half-typed value never clears what is there.
  const url = document.getElementById("p-url");
  if (url) {
    url.oninput = () => {
      const got = parseRepoURL(url.value);
      if (!got) return;
      document.getElementById("p-platform").value = got.platform;
      document.getElementById("p-owner").value = got.owner;
      document.getElementById("p-repo").value = got.repo;
    };
  }

  for (const b of el.querySelectorAll("[data-close-panel]")) {
    b.onclick = () => {
      if (!confirmDiscard()) return;
      projOpen = {key: null, tab: null};
      renderProjectsPage(s);
    };
  }

  // One expanded panel at a time, and clicking the open one closes it. A page of
  // expanded cards is the wall of fields this replaced.
  for (const b of el.querySelectorAll("[data-tab]")) {
    b.onclick = () => {
      if (!confirmDiscard()) return;
      const same = projOpen.key === b.dataset.key && projOpen.tab === b.dataset.tab;
      projOpen = same ? {key: null, tab: null} : {key: b.dataset.key, tab: b.dataset.tab};
      renderProjectsPage(s);
    };
  }

  for (const b of el.querySelectorAll("[data-save]")) {
    b.onclick = async () => {
      const key = b.dataset.save;
      const editing = key !== NEW;
      const p = editing ? s.projects.find(x => projectKey(x) === key) : null;
      if (editing && !p) return;

      const id = f => editing ? `p-${f}-${key}` : `p-${f}`;
      const target = editing ? key :
        `${val("p-platform")}/${val("p-owner")}/${val("p-repo")}`;
      if (!editing && (!val("p-platform") || !val("p-owner") || !val("p-repo"))) {
        alert("platform, owner and repository are all required");
        return;
      }
      // An image the daemon has already said it cannot resolve. Blocked here rather
      // than server-side, because a registry that is briefly unreachable must not lose
      // somebody's typing — only a definite no stops the save.
      const img = imageState[id("image")];
      if (img && img.checked && !img.found) {
        alert(`That container image cannot be found:\n\n${img.detail}\n\n` +
          `Fix it, or clear the field to use the server default.`);
        return;
      }

      await runProject(b, async () => {
        const out = await api("PUT", projectPath(target), {
          // Preserved rather than defaulted. This form is also the edit form, and a
          // save that silently re-enabled a project somebody deliberately disabled
          // would be a build nobody asked for.
          enabled: editing ? p.enabled : true,
          driver: val(id("driver")),
          build_dir: val(id("dir")),
          build_command: val(id("command")),
          build_output: val(id("output")),
          base_url: val(id("baseurl")),
          detect_script: val(id("detect")),
          image: val(id("image")),
          notes: val(id("notes")),
          display_name: val(id("name")),
          avatar: val(id("avatar")),
        });
        // Saved, so nothing is unsaved. Cleared before the scan, or the confirm-on-leave
        // guard fires on a form the server has already accepted.
        formDirty = false;

        // Close the panel and say so. Leaving it open was meant to keep somebody in
        // place for a second edit, and instead made a successful save look like nothing
        // had happened — the form it left on screen is indistinguishable from the form
        // that was there before the click.
        if (editing) {
          projOpen = {key: null, tab: null};
          projFlash = `Saved ${key.split("/").slice(1).join("/")}.`;
        }

        // A new project builds what is already open. Without this, adding a repository
        // does nothing visible until somebody pushes to it — and the reason for adding it
        // is usually that nobody has.
        if (!editing) {
          projOpen = {key: null, tab: null};
          try {
            const scan = await api("POST", `${projectPath(target)}/scan`);
            if (scan.error) {
              alert(`The project was saved, but nothing could be queued:\n\n${scan.error}`);
            } else if (scan.queued) {
              alert(`Saved. ${scan.queued} open pull request${scan.queued === 1 ? "" : "s"} ` +
                `queued for building — watch the dashboard.`);
            } else {
              alert("Saved. That repository has no open pull requests, so there is " +
                "nothing to build yet.");
            }
          } catch (e) {
            alert(`The project was saved, but the scan failed: ${e.message}`);
          }
        }
        return out;
      });
    };
  }

  for (const b of el.querySelectorAll("[data-toggle-enabled]")) {
    b.onclick = async () => {
      const p = s.projects.find(x => projectKey(x) === b.dataset.toggleEnabled);
      if (!p) return;
      await runProject(b, async () =>
        // Every other field is sent as it stands, because PUT is a whole-row upsert
        // and omitting one would clear it.
        api("PUT", projectPath(projectKey(p)), {
          enabled: !p.enabled,
          driver: p.driver, build_dir: p.build_dir, build_command: p.build_command,
          build_output: p.build_output, base_url: p.base_url,
          detect_script: p.detect_script, image: p.image, notes: p.notes,
        }));
    };
  }

  for (const b of el.querySelectorAll("[data-build]")) {
    b.onclick = async () => {
      const key = b.dataset.build;
      await runProject(b, async () => {
        const scan = await api("POST", `${projectPath(key)}/scan`);
        // The count is the whole answer: 3 says it worked, 0 with an error says the App
        // is not installed there, 0 without one says the repository has nothing open.
        projFlash = scan.error
          ? `Nothing queued: ${scan.error}`
          : scan.queued
            ? `Queued ${scan.queued} build${scan.queued === 1 ? "" : "s"} — watch the dashboard.`
            : "That repository has no open pull requests, so there is nothing to build.";
        return api("GET", "/api/projects");
      });
    };
  }

  for (const b of el.querySelectorAll("[data-del-project]")) {
    b.onclick = async () => {
      const key = b.dataset.delProject;
      if (!confirm(`Delete the project ${key}? Its existing previews are left alone.`)) return;
      await runProject(b, async () => {
        projOpen = {key: null, tab: null};
        return api("DELETE", projectPath(key));
      });
    };
  }

  for (const b of el.querySelectorAll("[data-add-secret]")) {
    b.onclick = async () => {
      const key = b.dataset.addSecret;
      const env = val(`s-env-${key}`), value = val(`s-val-${key}`);
      if (!env || !value) {
        alert("a name and a value are both required");
        return;
      }
      await runProject(b, async () =>
        api("PUT", `${projectPath(key)}/secrets/${encodeURIComponent(env)}`, {value}));
    };
  }

  for (const b of el.querySelectorAll("[data-del-secret]")) {
    b.onclick = async () => {
      const env = b.dataset.delSecret, key = b.dataset.key;
      // Confirmed because the value is not recoverable: nothing can read it back, so
      // removing it means finding the token again wherever it came from.
      if (!confirm(`Remove ${env} from ${key}? The value cannot be recovered.`)) return;
      await runProject(b, async () =>
        api("DELETE", `${projectPath(key)}/secrets/${encodeURIComponent(env)}`));
    };
  }
}

/* ── Wiring ───────────────────────────────────────────────────────────── */

function render() {
  renderCounters();
  renderProjects();
  renderList();
  renderEvents();
}

function applyStatus(d) {
  checkInstance(d.instance);
  ui.previews = d.previews || [];
  ui.events = d.events || [];
  ui.status = d;

  document.getElementById("exposer").textContent = `exposer: ${d.exposer}`;

  // While the daemon is recovering there are no workers, so a queued build cannot start.
  // Said out loud, because "Queued" with nothing happening is indistinguishable from a
  // stuck queue — which is exactly how it was reported, twice, both times a minute after a
  // restart.
  showStarting(d.starting);


  // A project whose last preview was torn down must not keep a stream open
  // behind a panel nobody can see. ui.open is a project name, so the test is
  // "does this project still have any preview at all" — a filter that merely
  // hides it is not grounds for closing the log somebody is reading.
  if (ui.open && !ui.previews.some(p => project(p) === ui.open)) {
    closeLog();
    ui.open = null;
  }

  render();
  openFromFragment();
}

// showStarting puts a banner above the list while the daemon is recovering.
//
// Not a spinner on the row: the row is correct — the build *is* queued. What is missing is
// that nothing can claim it yet, which is a property of the daemon and belongs where the
// daemon's own state is reported.
function showStarting(starting) {
  let el = document.getElementById("starting");
  if (!starting) {
    if (el) el.remove();
    return;
  }
  if (!el) {
    el = document.createElement("div");
    el.id = "starting";
    el.className = "notice warn";
    el.style.margin = "0 0 0.75rem";
    el.innerHTML = `<strong>Starting up.</strong> Restoring previews and clearing shares
      left by the previous run. Builds queue but do not start until this finishes —
      each share is a round trip to the exposer.`;
    document.querySelector(".wrap").prepend(el);
  }
}

// openFromFragment honours `#preview=<id>`, which is where a failed build's comment
// points.
//
// A fragment rather than a path: the daemon never receives it, so a preview id cannot
// reach an access log through somebody following the link from a pull request, and the
// page can act on it with no new route to serve.
//
// Once, and only after the first status arrives, because reveal() needs the preview to
// exist in ui.previews — and not again afterwards, or every status event would drag the
// page back to wherever the link pointed while somebody was reading something else.
let fragmentDone = false;
function openFromFragment() {
  if (fragmentDone) return;
  const m = location.hash.match(/^#preview=([A-Za-z0-9]+)$/);
  if (!m) {
    fragmentDone = true;
    return;
  }
  const p = ui.previews.find(x => x.preview_id === m[1]);
  if (!p) return; // Not here yet, or gone. Try again on the next status.
  fragmentDone = true;
  reveal(m[1], p.commit, null, p.state);
}

/* The switcher's own events.

   Bound once, here, rather than in renderProjects: that runs on every status tick, and
   rebinding a handler per tick is how a click ends up firing twice. */
document.getElementById("projpick-btn").onclick = () => {
  const open = !document.getElementById("projpick-panel").hidden;
  if (open) closePicker(); else openPicker();
};

document.getElementById("projpick-find").oninput = e => filterPicker(e.target.value);

document.getElementById("projpick-find").onkeydown = e => {
  if (e.key === "Escape") {
    closePicker();
    document.getElementById("projpick-btn").focus();
    return;
  }
  // Enter takes the first row still visible, so filtering and choosing is one gesture
  // for somebody who knows what they are looking for.
  if (e.key === "Enter") {
    const first = [...document.querySelectorAll("#projpick-list [data-pick-project]")]
      .find(r => !r.hidden);
    if (first) first.click();
  }
};

// Anywhere else closes it. A panel that floats over the page and stays open after a
// click somewhere else is a panel covering whatever you were trying to reach.
document.addEventListener("click", e => {
  if (document.getElementById("projpick-panel").hidden) return;
  if (!e.target.closest("#projpick")) closePicker();
});

let searchTimer = null;
document.getElementById("search").oninput = e => {
  const v = e.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  // Debounced: every keystroke otherwise rebuilds the list, and rebuilding the
  // list replaces the open log pane.
  searchTimer = setTimeout(() => { ui.query = v; render(); }, 120);
};

function connect() {
  const conn = document.getElementById("conn");
  const src = new EventSource("/events");

  src.onopen = () => { conn.textContent = "live"; conn.className = "live"; };
  src.addEventListener("status", e => {
    try { applyStatus(JSON.parse(e.data)); } catch (err) { /* keep the last good render */ }
  });
  // A dashboard that silently freezes is worse than one that admits it: the
  // numbers on screen would otherwise look current indefinitely. EventSource
  // reconnects by itself, so this only has to report.
  src.onerror = () => { conn.textContent = "reconnecting…"; conn.className = "stale"; };
}

// hideOperationsChrome strips the parts of the page that only make sense with a
// live status stream behind them.
//
// Shared by both admin pages, because leaving a project filter and a search box
// above a form that neither one filters is worse than leaving the page bare.
function hideOperationsChrome(label) {
  document.querySelector(".wrap").hidden = true;
  document.getElementById("counters").hidden = true;
  document.getElementById("projpick").hidden = true;
  document.getElementById("search").hidden = true;
  document.getElementById("conn").textContent = label;
}

if (isSetupPage) {
  // Only the setup panel. No status stream and no polling: this page has nothing
  // live on it, and an open EventSource per idle browser tab is a connection the
  // daemon holds for nothing.
  hideOperationsChrome("setup");
  setupEl().hidden = false;
  loadSetup();
} else if (isProjectsPage) {
  hideOperationsChrome("projects");
  document.getElementById("projects").hidden = false;
  loadProjects();
} else {
  connect();
  render();
  showAdminLinks();
  // Relative timestamps drift without a redraw, and the status stream is silent
  // when nothing changes — which is exactly when "2s ago" has become a lie.
  setInterval(() => { if (ui.previews.length) renderList(); }, 5000);
}

// showAdminLinks draws the Secrets and Projects links, and only for a request the
// daemon would accept a write from.
//
// The server decides, not the page: /api/admin runs the same isLocalRequest check
// the write endpoints run. A Host-header test here would be worthless — Host is
// whatever the client typed, so a tunnelled visitor sending "localhost" would pass
// it. Where the connection came from is the daemon's to know.
//
// Anything other than an outright yes leaves the links absent. Through the
// dashboard-only proxy this endpoint is not in the allowlist and the fetch 404s,
// which lands here as a failure and hides them.
async function showAdminLinks() {
  try {
    admin = await api("GET", "/api/admin");
  } catch {
    return;
  }
  const links = [];
  if (admin.projects) links.push(`<a class="control" href="/projects">Projects</a>`);
  if (admin.secrets) links.push(`<a class="control" href="/secrets">Secrets</a>`);
  if (admin.projects) {
    links.push(`<button class="control" id="cache-clear"
      title="Delete every preview's cached package downloads">Clear caches</button>`);
  }
  if (!links.length) return;

  const nav = document.getElementById("admin-nav");
  nav.innerHTML = links.join("");
  nav.hidden = false;
  wireClearCache(document.getElementById("cache-clear"));
}

// admin is what /api/admin last said. Absent until it answers, which is why every
// consumer treats a missing answer as "no".
let admin = {};

// The daemon instance this page loaded against, and the banner shown when it
// changes.
//
// This page is one embedded file with no cache busting, so a tab left open across a
// rebuild keeps running the code it loaded. That produced three false bug reports in
// one afternoon — a layout that had already moved, a filter that had already been
// fixed, a row that was already collapsed — each costing a diagnosis before somebody
// thought to reload.
//
// Not an automatic reload. The reader may be part-way through a log, or have a
// selection they are copying, and a page that reloads itself under them is worse
// than a stale one. It says so and waits.
let instance = null;

function checkInstance(seen) {
  if (!seen) return;
  if (instance === null) { instance = seen; return; }
  if (instance === seen || document.getElementById("stale")) return;

  const n = document.createElement("div");
  n.id = "stale";
  n.className = "notice warn";
  n.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;" +
    "z-index:9;margin:0;box-shadow:0 4px 16px rgba(0,0,0,0.2)";
  n.innerHTML = `<strong>The daemon restarted.</strong> This page is running older
    code, so what you see may not match what it does.
    <button class="btn" id="stale-go" style="margin-left:0.5rem">Reload</button>`;
  document.body.appendChild(n);
  document.getElementById("stale-go").onclick = () => location.reload();
}

// wireClearCache wires the one cache control, in the top bar.
//
// One button rather than one per row. Per row it appeared on every open row at once,
// which reads as part of looking at a log rather than as the rare repair it is — and
// a cache is deleted with its preview anyway, so the manual version exists only for
// the pull request whose next build has to work now.
//
// Confirmed, unlike the per-row version. It clears every preview's cache, so the
// next build of everything currently open pays for it, and that is not visible from
// the button.
function wireClearCache(btn) {
  if (!btn) return;

  btn.onclick = async () => {
    if (!confirm("Delete every preview's cached package downloads? " +
                 "The next build of each will re-download its dependencies.")) return;

    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const out = await api("DELETE", "/api/cache");
      const n = (out.cleared || []).length;
      btn.textContent = n ? `Cleared ${n}` : "Nothing cached";
    } catch (e) {
      btn.textContent = "Failed";
      btn.title = e.message;
    }
    // Back to a usable button. Long enough to read, short enough that the top bar
    // does not sit lying about its state.
    setTimeout(() => {
      btn.textContent = label;
      btn.disabled = false;
      btn.title = "Delete every preview's cached package downloads";
    }, 2500);
  };
}
</script>
</body>
