  // not, which is how somebody ends up typing a default back in by hand.
  const preset = (s.defaults.frameworks || []).find(
    f => f.id === (p ? (p.framework || "") : (s.defaults.framework || ""))) || {};

  return `<h3>${p ? `Settings for ${esc(projectLabel(p))}` : "New project"}</h3>
    <div class="grid-form">
      <div class="field-head">Identity</div>
      ${p ? "" : `
        ${field("url", "Repository URL",
          `<input class="control" id="p-url" placeholder="https://github.com/acme/docs">`,
          "Paste one and the three fields below fill themselves. They are what a " +
          "webhook is matched against, so they can also be typed.")}
        ${field("platform", "Platform", `<select class="control" id="p-platform">
          <option value="github">github</option>
          <option value="bitbucket">bitbucket</option>
          <option value="local">filesystem — a bare repository on this machine</option>
        </select>`)}
        ${field("owner", "Owner",
          `<input class="control" id="p-owner" placeholder="acme">`,
          "The organisation or workspace. For filesystem, whatever you file it under.")}
        ${field("repo", "Repository",
          `<input class="control" id="p-repo" placeholder="docs">`)}`}
      ${field("name", "Name",
        `<input class="control" id="${id("name")}" maxlength="120"
          value="${v("display_name")}" placeholder="${p ? esc(p.repo) : "the repository name"}">`,
        "What to call it on this page. Blank uses the repository name.")}
      ${field("avatar", "Badge", avatarField(p, id("avatar")),
        "One or two characters, or an emoji. Blank derives initials and a colour from " +
        "the name. A <code>data:</code> URI renders as an image — inlined, never " +
        "fetched, because this page asks the internet for nothing.")}

      <div class="field-head">Build <span class="field-note">— blank means the preset,
        or the repository, decides</span></div>
      ${field("framework", "Framework preset", frameworkSelect(s, p, id("framework")),
        "Fills the two fields below with what that generator uses. Leave them blank to " +
        "follow the preset, or type to override one. There is no install command: it " +
        "comes from the lockfile the repository committed, which knows which package " +
        "manager owns the tree." +
        `<div class="notice warn" id="framework-tool" hidden></div>`)}
      ${field("driver", "Driver", driverSelect(s, p, id("driver")), driverWhy(s))}
      ${field("image", "Container image", imagePicker(id("image"), v("image"), s),
        "Pick one or type your own — a private mirror is a normal answer. Needs node and " +
        "<code>git</code> if the build clones other repositories, which the " +
        "<code>-slim</code> images do not have; alpine's musl breaks dependencies that " +
        "ship prebuilt binaries.")}
      ${field("dir", "Build directory", text("dir", esc(preset.dir || "www")),
        "Where <code>package.json</code> lives, relative to the repository root. Blank " +
        "means the preset's directory, or the root if it names none.")}
      ${field("command", "Build command",
        text("command", esc(preset.build_command || s.defaults.build_command || "npm run build")),
        "Run by <code>sh -lc</code> inside the image, so pipes and <code>&amp;&amp;</code> " +
        "work and <code>bash</code>, <code>node</code> or <code>python</code> work if the " +
        "image has them.")}
      ${field("output", "Output directory", text("output", esc(preset.output || "build")),
        "Relative to the build directory.")}
      ${field("baseurl", "Base URL", text("baseurl", "/"),
        "Must start and end with a slash. Docusaurus bakes it in at build time, so " +
        "getting it wrong 404s every asset.")}
      ${field("detect", "Ignore-build script", text("detect", "ci/needs-build.sh"),
        "Executed directly, so its shebang decides the interpreter. Gets the changed " +
        "paths on stdin; exit 0 to build, 78 to skip. Blank uses path matching.")}
      ${field("timeout", "Build timeout", text("timeout", esc(s.defaults.timeout || "15m0s")),
        "How long one build of this project may run before it is killed. Blank uses the " +
        "server's <code>build.timeout</code>, shown above as the placeholder. A duration " +
        "with a unit — <code>45m</code>, <code>2h</code> — because a repository that " +
        "clones seven others is not a two-minute build and every other project should " +
        "not have to wait that long to be told it hung.")}

      ${scmCredentialFields(s, p, id)}

      <div class="field-head">Notes</div>
      ${field("notes", "Notes", `<textarea class="control" id="${id("notes")}"
        maxlength="5000" placeholder="Why this project is set up the way it is. Nothing
        reads this but the next person.">${v("notes")}</textarea>`)}
    </div>
    <div class="act formact">
      <!-- Primary, so which button commits is not a reading exercise. Cancel is beside
           it and says what it discards, because "Cancel" alone on a form somebody has
           been typing into for two minutes is not a promise anyone should have to
           guess at. -->
      <button class="btn primary" data-save="${p ? esc(projectKey(p)) : NEW}">${
        p ? "Save changes" : "Create project"}</button>
      <button class="btn" data-close-panel="1">Cancel${p ? " — discard edits" : ""}</button>
      ${p ? `<span class="grow"></span>
        <button class="btn" data-toggle-enabled="${esc(projectKey(p))}">${
          p.enabled ? "Disable" : "Enable"}</button>` : ""}
    </div>`;
}

// projectPath builds the API path for a project key, encoding each segment. The key
// is `platform/owner/repo` and every segment is validated server-side too, because a
// stray slash there produces a row no webhook delivery can ever match.
function projectPath(key) {
  const [platform, owner, repo] = key.split("/");
  return `/api/projects/${encodeURIComponent(platform)}` +
    `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
}

// AVATAR_MAX is the server's cap on an inlined badge, mirrored here so a file that will
// not fit is shrunk before it is sent rather than refused after.
const AVATAR_MAX = 16 * 1024;

// wireAvatarPickers turns the file input into a badge.
//
// The image is stored in the project row as a data: URI rather than as a file on disk.
// One binary in one sqlite row travels with the database, survives a restore, and needs
// no static route, no MIME sniffing on the way out, and no orphaned file when a project
// is deleted. The cost is a size cap, which is why anything large is rasterized first.
//
// SVG is kept as-is when it fits, because it is already small and stays sharp. Anything
// else — and any oversized SVG — is drawn onto a 64px canvas and exported as PNG, which
// takes a 2 MB photo to a few kilobytes. 64 is twice the rendered size, for a retina
// display, and nothing here is ever shown larger than a favicon.
function wireAvatarPickers(root) {
  for (const b of root.querySelectorAll("[data-pick]")) {
    const target = b.dataset.pick;
    const file = document.getElementById(`${target}-file`);
    b.onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files?.[0];
      if (!f) return;
      try {
        const value = await readAvatar(f);
        const input = document.getElementById(target);
        input.value = value;
        // The field was a text input until now if the project had no image. Re-render so
        // it becomes the image-plus-buttons form, with the new value in it.
        input.type = "hidden";
        b.textContent = "Replace";
        let shown = b.parentElement.querySelector(".ava-img img");
        if (!shown) {
          const span = document.createElement("span");
          span.className = "ava ava-img";
          span.innerHTML = `<img alt="" width="22" height="22">`;
          b.parentElement.insertBefore(span, b);
          shown = span.querySelector("img");
        }
        shown.src = value;
      } catch (e) {
        alert(`That image could not be used: ${e.message}`);
      }
    };
  }
  for (const b of root.querySelectorAll("[data-clearava]")) {
    b.onclick = () => {
      const input = document.getElementById(b.dataset.clearava);
      input.value = "";
      input.type = "text";
      b.parentElement.querySelector(".ava-img")?.remove();
      b.remove();
    };
  }
}

// readAvatar returns a data: URI small enough for the row.
function readAvatar(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("the file could not be read"));
    fr.onload = async () => {
      const raw = String(fr.result);
      if (file.type === "image/svg+xml" && raw.length <= AVATAR_MAX) {
        resolve(raw);
        return;
      }
      try {
        resolve(await rasterize(raw));
      } catch (e) {
        reject(e);
      }
    };
    fr.readAsDataURL(file);
  });
}

// rasterize draws a data URI onto a 64px canvas and returns a PNG data URI.
//
// Contain rather than cover, so a wide logo is letterboxed instead of cropped through
// the middle. Quality is stepped down only if the PNG is still too large, which for a
// 64px image effectively never happens.
function rasterize(dataURI) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error("that file is not an image this browser can draw"));
    img.onload = () => {
      const size = 64;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const scale = Math.min(size / img.width, size / img.height);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      ctx.drawImage(img, Math.round((size - w) / 2), Math.round((size - h) / 2), w, h);

      let out = c.toDataURL("image/png");
      if (out.length > AVATAR_MAX) out = c.toDataURL("image/jpeg", 0.8);
      if (out.length > AVATAR_MAX) {
        reject(new Error(`still ${Math.round(out.length / 1024)} KB after shrinking`));
        return;
      }
      resolve(out);
    };
    img.src = dataURI;
  });
}

// imageState is the last answer per image field, so save can refuse what the operator
// has already been told is wrong. Keyed by element id, because two forms can be open
// (a card's Build panel, and the add form) and each has its own field.
const imageState = {};

// wireImageCheck asks the daemon whether an image can be resolved, as it is typed.
//
// Debounced, because the registry round trip is a second or two and every keystroke of
// `node:24-bookworm-slim` would be a request. On blur as well as after the pause, since
// somebody who types and immediately clicks Save should not race the timer.
//
// A negative answer blocks the save. A build with an unresolvable image fails after the
// clone, minutes later, with docker's own "manifest unknown" in the middle of a log —
// and the operator's attention is here now.
function wireImageCheck(root) {
  for (const input of root.querySelectorAll(`[id$="image"], [id*="image-"]`)) {
    if (input.tagName !== "INPUT") continue;
    const out = document.getElementById(`${input.id}-check`);
    if (!out) continue;

    let timer = null;
    const check = async () => {
      const image = input.value.trim();
      delete imageState[input.id];
      if (!image) {
        // Blank is legal: it means the server default, which the daemon chose.
        out.className = "imgcheck";
        out.textContent = "";
        return;
      }
      out.className = "imgcheck";
      out.textContent = "checking…";
      try {
        const r = await api("POST", "/api/images/inspect", {image});
        imageState[input.id] = r;
        if (!r.checked) {
          out.className = "imgcheck";
          out.textContent = r.detail;
        } else if (r.found) {
          out.className = "imgcheck ok";
          out.textContent = r.local ? "found, already pulled" : "found in the registry";
        } else {
          out.className = "imgcheck bad";
          out.textContent = r.detail || "not found";
        }
      } catch (e) {
        // A failed check is not a failed image. Say so rather than blocking on it.
        imageState[input.id] = {checked: false};
        out.className = "imgcheck";
        out.textContent = `could not check: ${e.message}`;
      }
    };

    // The input is also the filter over the known-image list, which is why the panel
    // opens on focus rather than behind a separate control: there is one field, and
    // typing in it both narrows the list and sets the value.
    const panel = document.getElementById(`${input.id}-panel`);
    const showPanel = on => {
      if (!panel) return;
      panel.hidden = !on;
      input.setAttribute("aria-expanded", String(on));
    };
    const filterImages = () => {
      if (!panel) return;
      const needle = input.value.trim().toLowerCase();
      let shown = 0;
      for (const row of panel.querySelectorAll("[data-image]")) {
        const hit = !needle || row.dataset.image.toLowerCase().includes(needle);
        row.hidden = !hit;
        if (hit) shown++;
      }
      // Nothing matching is not an error here — the value is free text and a private
      // mirror will match nothing. The panel simply gets out of the way.
      showPanel(shown > 0);
    };

    input.onfocus = () => filterImages();
    input.oninput = () => {
      filterImages();
      clearTimeout(timer);
      timer = setTimeout(check, 600);
    };
    input.onchange = () => { clearTimeout(timer); check(); };
    input.onblur = () => {
      clearTimeout(timer);
      check();
      // Late enough for a click on a row to land first. A panel that closes on blur
      // closes before the click it was opened for.
      setTimeout(() => showPanel(false), 150);
    };
    input.onkeydown = e => {
      if (e.key === "Escape") showPanel(false);
      if (e.key === "Enter" && panel && !panel.hidden) {
        const first = [...panel.querySelectorAll("[data-image]")].find(r => !r.hidden);
        if (first) {
          e.preventDefault();
          first.click();
        }
      }
    };

    for (const row of panel?.querySelectorAll("[data-image]") || []) {
      row.onclick = () => {
        input.value = row.dataset.image;
        formDirty = true;
        showPanel(false);
        clearTimeout(timer);
        check();
      };
    }

    if (input.value.trim()) check();
  }
}

function wireProjectHandlers(s) {
  const el = document.getElementById("projects-body");
  const val = id => (document.getElementById(id)?.value || "").trim();

  // Any typing in an open panel makes it dirty. One listener on the container rather
  // than one per field, so a field added later is covered without anybody remembering.
  el.addEventListener("input", e => {
    if (e.target.closest(".panel, .pcard [data-save]")) formDirty = true;
  });

  const newBtn = document.getElementById("p-new");
  if (newBtn) {
    newBtn.onclick = () => {
      if (!confirmDiscard()) return;
      projOpen = {key: NEW, tab: "build"};
      renderProjectsPage(s);
    };
  }

  // Escape closes the new-project dialog, through the same discard guard the Cancel button
  // uses — a form with eleven fields in it must not vanish on a stray keypress.
  //
  // Deliberately no click-away. The boot report has one because it holds nothing; this
  // holds typing, and losing a half-filled form to a misplaced click is worse than having
  // to aim at Cancel.
  const modal = document.getElementById("p-new-modal");
  if (modal) {
    // Focus the first field, so the dialog is typeable without a click.
    document.getElementById("p-url")?.focus();
    modal.onkeydown = e => {
      if (e.key !== "Escape") return;
      if (!confirmDiscard()) return;
      projOpen = {key: null, tab: null};
      renderProjectsPage(s);
    };
  }

  wireImageCheck(el);
  wireAvatarPickers(el);

  // Paste a repository URL and the three identity fields fill themselves. On input
  // rather than on a button, because a paste is the whole gesture — and left alone if
  // the URL is not one we recognise, so a half-typed value never clears what is there.
  const url = document.getElementById("p-url");
  if (url) {
    url.oninput = () => {
      const got = parseRepoURL(url.value);
      if (!got) return;
      document.getElementById("p-platform").value = got.platform;
      document.getElementById("p-owner").value = got.owner;
      document.getElementById("p-repo").value = got.repo;
      // Setting .value from script fires no change event, so the credential block would
      // stay hidden for a Bitbucket URL that had just filled the form in.
      syncSCMFields();
    };
  }

  // And the select on its own, for somebody who picks the platform rather than pasting.
  const plat = document.getElementById("p-platform");
  if (plat) {
    plat.onchange = syncSCMFields;
    syncSCMFields();
  }

  // The framework preset drives the placeholders under it.
  const fw = el.querySelector("[data-framework]");
  if (fw) {
    fw.onchange = syncFramework;
    syncFramework();
  }

  // The credential block's own three controls.
  const priv = el.querySelector("[data-privtoggle]");
  if (priv) priv.onchange = () => updateSCMFlag(s);

  // Saving one credential on its own, without the form.
  //
  // Not through runProject, which re-renders on success and would close the form the button
  // is inside — and this is a field somebody pastes into and then presses Test beside. The
  // page's own copy of the state is updated so the chip and the placeholder catch up
  // without a round trip.
  for (const b of el.querySelectorAll("[data-set-scm]")) {
    b.onclick = async () => {
      const name = b.dataset.setScm, key = b.dataset.key;
      const field = document.getElementById(b.dataset.field);
      const value = field ? field.value.trim() : "";
      if (!value) {
        alert(`Paste a value for ${name} first. Nothing reads the stored one back, so ` +
          `there is nothing to edit — a save replaces it outright.`);
        return;
      }
      const label = b.textContent;
      b.disabled = true;
      b.textContent = "…";
      try {
        await api("PUT", `${projectPath(key)}/scm/${encodeURIComponent(name)}`, {value});
        field.value = "";
        const p = (s.projects || []).find(x => projectKey(x) === key);
        if (p) p.scm = [...new Set([...(p.scm || []), name])];
        updateSCMFlag(s);
        toast(`Stored ${name} for ${key.split("/").slice(1).join("/")}.`);
      } catch (e) {
        toast(e.message, "bad");
      } finally {
        b.disabled = false;
        b.textContent = label;
      }
    };
  }

  // Clearing one. An empty value is how the endpoint deletes, so this is the same route.
  // Clearing one credential, or the account pair as a unit. An empty value is how the
  // endpoint deletes, so this is the same route either way.
  for (const b of el.querySelectorAll("[data-clear-scm]")) {
    b.onclick = async () => {
      const names = b.dataset.clearScm.split(",");
      const key = b.dataset.key;
      if (!confirm(`Remove ${names.join(" and ")} from ${key}? The values cannot be ` +
          `recovered, and this repository falls back to the workspace-wide credential if ` +
          `there is one.`)) {
        return;
      }
      await runProject(b, async () => {
        // Sequentially, and the last answer is what the page renders: each write returns
        // the whole state, so the final one is the only current picture.
        let out;
        for (const name of names) {
          out = await api("PUT", `${projectPath(key)}/scm/${encodeURIComponent(name)}`,
            {value: ""});
        }
        return out;
      });
    };
  }

  for (const b of el.querySelectorAll("[data-close-panel]")) {
    b.onclick = () => {
      if (!confirmDiscard()) return;
      projOpen = {key: null, tab: null};
      renderProjectsPage(s);
    };
  }

  // One expanded panel at a time, and clicking the open one closes it. A page of
  // expanded cards is the wall of fields this replaced.
  for (const b of el.querySelectorAll("[data-tab]")) {
    b.onclick = () => {
      if (!confirmDiscard()) return;
      const same = projOpen.key === b.dataset.key && projOpen.tab === b.dataset.tab;
      projOpen = same ? {key: null, tab: null} : {key: b.dataset.key, tab: b.dataset.tab};
      renderProjectsPage(s);
    };
  }

  // The variables accordion, remembered per project. Not an accordion across cards:
  // collapsing the project you were reading in order to look at another one's tokens is
  // a worse trade here than on the credential page.
  wireExpanders(el);

  for (const d of el.querySelectorAll("[data-secrets]")) {
    d.ontoggle = () => {
      if (d.open) projSecretsOpen.add(d.dataset.secrets);
      else projSecretsOpen.delete(d.dataset.secrets);
    };
  }

  for (const b of el.querySelectorAll("[data-save]")) {
    b.onclick = async () => {
      const key = b.dataset.save;
      const editing = key !== NEW;
      const p = editing ? s.projects.find(x => projectKey(x) === key) : null;
      if (editing && !p) return;

      const id = f => editing ? `p-${f}-${key}` : `p-${f}`;
      const target = editing ? key :
        `${val("p-platform")}/${val("p-owner")}/${val("p-repo")}`;
      if (!editing && (!val("p-platform") || !val("p-owner") || !val("p-repo"))) {
        alert("platform, owner and repository are all required");
        return;
      }
      // An image the daemon has already said it cannot resolve. Blocked here rather
      // than server-side, because a registry that is briefly unreachable must not lose
      // somebody's typing — only a definite no stops the save.
      const img = imageState[id("image")];
      if (img && img.checked && !img.found) {
        alert(`That container image cannot be found:\n\n${img.detail}\n\n` +
          `Fix it, or clear the field to use the server default.`);
        return;
      }

      // A private repository with no credential is noted, not blocked.
      //
      // This was a confirm() — a modal asking permission to save something the operator had
      // just asked to save, whose only useful answer was OK. Marking a repository private
      // before pasting its token is the *normal order*: the project has to exist before it
      // has credential rows to fill in. So the save proceeds and the toast afterwards says
      // what is still needed.
      const priv = document.getElementById(id("private"));
      const needsToken = !!(priv && priv.checked) && !scmCredentialAvailable(s, p, id);

      await runProject(b, async () => {
        const out = await api("PUT", projectPath(target), {
          // Preserved rather than defaulted. This form is also the edit form, and a
          // save that silently re-enabled a project somebody deliberately disabled
          // would be a build nobody asked for.
          enabled: editing ? p.enabled : true,
          driver: val(id("driver")),
          build_dir: val(id("dir")),
          build_command: val(id("command")),
          build_output: val(id("output")),
          base_url: val(id("baseurl")),
          detect_script: val(id("detect")),
          timeout: val(id("timeout")),
          framework: val(id("framework")),
          private: !!(document.getElementById(id("private")) || {}).checked,
          image: val(id("image")),
          notes: val(id("notes")),
          display_name: val(id("name")),
          avatar: val(id("avatar")),
        });
        // The source-control credential, after the row and by its own route.
        //
        // Not a field on the project row: it is a secret, so it goes to the vault rather
        // than to sqlite, and it must not travel in a payload that is logged. Only the
        // boxes that were typed into are sent — an empty box means "leave what is stored
        // alone", because the alternative is that saving any other field on the form
        // silently clears the token.
        //
        // A failure here does not fail the save. The project row is already written by the
        // time this runs, so throwing would report "save failed" about a project that has
        // been saved — and the row is the part worth keeping: a project with no token is a
        // project that cannot clone yet, which is a fixable state, while a project that was
        // not created at all has to be typed in again.
        const credFailures = [];
        for (const [name, elID] of [["scm.access_token", id("scmtoken")]]) {
          const value = val(elID);
          if (!value) continue;
          try {
            await api("PUT", `${projectPath(target)}/scm/${encodeURIComponent(name)}`, {value});
          } catch (e) {
            credFailures.push(`${name}: ${e.message}`);
          }
        }
        if (credFailures.length) {
          toast(`Saved the project, but its credential was not stored — ` +
            credFailures.join("; "), "bad");
        }

        // Saved, so nothing is unsaved. Cleared before the scan, or the confirm-on-leave
        // guard fires on a form the server has already accepted.
        formDirty = false;

        // Close the panel and say so. Leaving it open was meant to keep somebody in
        // place for a second edit, and instead made a successful save look like nothing
        // had happened — the form it left on screen is indistinguishable from the form
        // that was there before the click.
        if (editing) {
          projOpen = {key: null, tab: null};
          projFlash = needsToken
            ? `Saved. ${key.split("/").slice(1).join("/")} is private with no credential — ` +
              `open it and paste an access token, then Test credential.`
            : `Saved ${key.split("/").slice(1).join("/")}.`;
        }

        // A new project builds what is already open. Without this, adding a repository
        // does nothing visible until somebody pushes to it — and the reason for adding it
        // is usually that nobody has.
        if (!editing) {
          projOpen = {key: null, tab: null};

          // A private repository with nothing to clone with: say what to do next, and the
          // card carries the same sentence until it is done.
          if (needsToken) {
            projFlash = `Created. It is private with no credential — press Edit and paste ` +
              `an access token before it can build.`;
            return out;
          }

          /* Toasts, not alerts, and the wording matters as much as the control.

             Every one of these was an alert() — a modal saying "The project was saved,
             but nothing could be queued", which reads as a refusal and has to be
             dismissed before the page underneath can be looked at. The project *was*
             saved; the scan is a convenience that runs afterwards, and the commonest
             reason it finds nothing is that the credential has not been pasted yet. That
             is a next step, not an error. */
          try {
            const scan = await api("POST", `${projectPath(target)}/scan`);
            if (scan.error) {
              // A missing credential is the ordinary case on a first save, so it gets a
              // sentence that says what to do rather than the raw platform error.
              const missing = /no Bitbucket credential|credential/i.test(scan.error);
              projFlash = missing
                ? `Saved. No builds queued yet — add an access token to this project, ` +
                  `then use Build now.`
                : `Saved, but nothing could be queued: ${scan.error}`;
            } else if (scan.queued) {
              projFlash = `Saved. ${scan.queued} open pull request${
                scan.queued === 1 ? "" : "s"} queued — watch the dashboard.`;
            } else {
              projFlash = "Saved. That repository has no open pull requests yet.";
            }
          } catch (e) {
            projFlash = `Saved, but the scan failed: ${e.message}`;
          }
        }
        return out;
      });
    };
  }

  for (const b of el.querySelectorAll("[data-toggle-enabled]")) {
    b.onclick = async () => {
      const p = s.projects.find(x => projectKey(x) === b.dataset.toggleEnabled);
      if (!p) return;
      await runProject(b, async () =>
        // Every other field is sent as it stands, because PUT is a whole-row upsert
        // and omitting one would clear it.
        api("PUT", projectPath(projectKey(p)), {
          enabled: !p.enabled,
          driver: p.driver, build_dir: p.build_dir, build_command: p.build_command,
          build_output: p.build_output, base_url: p.base_url,
          detect_script: p.detect_script, image: p.image, notes: p.notes,
        }));
    };
  }

  // No handler for a Build open PRs button any more — the button is gone. The scan itself
  // is not: adding a project still runs it, which is where it earns its place, and the
  // route is unchanged for anything calling the API.

  // The hostname prefix. Live example as it is typed, because "a" tells nobody what they
  // are about to get and `a-docs-main` is the string that ends up in a URL.
  const prefixBox = el.querySelector("#p-prefix");
  if (prefixBox) {
    const eg = el.querySelector("#p-prefix-eg");
    const show = () => {
      const v = prefixBox.value.trim().replace(/-+$/, "");
      eg.textContent = v ? `${v}-docs-main` : "docs-main";
    };
    prefixBox.oninput = show;
  }
  for (const b of el.querySelectorAll("[data-save-prefix]")) {
    b.onclick = async () => {
      const box = el.querySelector("#p-prefix");
      if (!box) return;
      await runProject(b, async () => {
        const st = await api("PUT", "/api/settings/prefix", {prefix: box.value});
        // Said out loud, because the alternative is somebody discovering it from a share
        // list a week later: nothing already published is renamed. Renaming in place would
        // mean withdrawing and recreating every share — minutes of 404s, and a comment on
        // every open pull request pointing at a URL that had moved.
        projFlash = "Saved. Previews already published keep their names until rebuilt.";
        return st;
      });
    };
  }

  // The branch preview: build it, or build it again. One handler for both, because the
  // request is identical — the server reads the repository's default branch either way, so
  // "start one" and "rebuild it" differ only in what the button said.
  for (const b of el.querySelectorAll("[data-branch]")) {
    b.onclick = async () => {
      const key = b.dataset.branch;
      await runProject(b, async () => {
        const r = await api("POST", `${projectPath(key)}/branch`, {});
        projFlash = r.error
          ? `Nothing queued: ${r.error}`
          : `Building ${r.branch} — watch the dashboard.`;
        return api("GET", "/api/projects");
      });
    };
  }

  // Linking: pick one from the dialog, then post it. The route un-ignores the number and
  // queues the build in one call — "build this" and "stop skipping this" are the same
  // request, so there is nothing to keep in step.
  for (const b of el.querySelectorAll("[data-relink]")) {
    b.onclick = async () => {
      const key = b.dataset.relink;
      const p = s.projects.find(x => projectKey(x) === key);
      if (!p) return;
      const number = await relinkPicker(p);
      if (!number) return;
      await runProject(b, async () => {
        const r = await api("POST", `${projectPath(key)}/link`, {number});
        // The daemon answers 200 with an error when the pull request is closed or gone,
        // which is a stale list rather than a broken installation.
        projFlash = r.error
          ? `Nothing queued: ${r.error}`
          : `Queued a build for #${number} — watch the dashboard.`;
        return api("GET", "/api/projects");
      });
    };
  }

  for (const b of el.querySelectorAll("[data-del-project]")) {
    b.onclick = async () => {
      const key = b.dataset.delProject;
      if (!confirm(`Delete the project ${key}? Its existing previews are left alone.`)) return;
      await runProject(b, async () => {
        projOpen = {key: null, tab: null};
        return api("DELETE", projectPath(key));
      });
    };
  }

  for (const b of el.querySelectorAll("[data-add-secret]")) {
    b.onclick = async () => {
      const key = b.dataset.addSecret;
      const env = val(`s-env-${key}`), value = val(`s-val-${key}`);
      if (!env || !value) {
        alert("a name and a value are both required");
        return;
      }
      await runProject(b, async () =>
        api("PUT", `${projectPath(key)}/secrets/${encodeURIComponent(env)}`, {value}));
    };
  }

  // Testing a project's source-control credential.
  //
  // Not through runProject, which re-renders the whole page on success — that would close
  // the form the button is inside, which is where somebody is about to fix the token if the
  // answer is bad. The result is a toast and the form stays put.
  for (const b of el.querySelectorAll("[data-test-scm]")) {
    b.onclick = async () => {
      const key = b.dataset.testScm;
      const label = b.textContent;
      b.disabled = true;
      b.textContent = "…";
      try {
        const out = await api("POST", `${projectPath(key)}/scm-test`);
        // Headline first, detail behind it: the server sends both, separated by a newline.
        const [headline, ...rest] = String(out.ok || "Works.").split("\n");
        toast(headline, "good", rest.join(" "));
      } catch (e) {
        // The platform's own message, which names the missing scope where this code
        // cannot. Long, so it gets the failure toast's longer life.
        toast(e.message, "bad");
      } finally {
        b.disabled = false;
        b.textContent = label;
      }
    };
  }

  // Replacing one variable's value, or overriding an inherited one. Same PUT as adding:
  // the endpoint is an upsert, so a name that already exists is a replacement and one
  // that does not is a new project-scoped variable — which is exactly what overriding a
  // server-wide value is.
  for (const b of el.querySelectorAll("[data-set-secret]")) {
    b.onclick = async () => {
      const env = b.dataset.setSecret, key = b.dataset.key;
      const field = document.getElementById(b.dataset.field);
      const value = field ? field.value : "";
      if (!value) {
        // Not a toast: an empty box is not a failed request, it is a button pressed
        // before anything was typed, and the answer belongs beside the box.
        alert(`Paste a value for ${env} first. Nothing can read the current one back, so ` +
          `there is nothing to edit — a save replaces it outright.`);
        return;
      }
      await runProject(b, async () =>
        api("PUT", `${projectPath(key)}/secrets/${encodeURIComponent(env)}`, {value}));
    };
  }

  for (const b of el.querySelectorAll("[data-del-secret]")) {
    b.onclick = async () => {
      const env = b.dataset.delSecret, key = b.dataset.key;
      // Confirmed because the value is not recoverable: nothing can read it back, so
      // removing it means finding the token again wherever it came from.
      if (!confirm(`Remove ${env} from ${key}? The value cannot be recovered.`)) return;
      await runProject(b, async () =>
        api("DELETE", `${projectPath(key)}/secrets/${encodeURIComponent(env)}`));
    };
  }
}

/* ── Wiring ───────────────────────────────────────────────────────────── */

function render() {
  renderCounters();
  renderProjects();
  renderList();
  renderEvents();
}

function applyStatus(d) {
  checkInstance(d.instance);
  ui.previews = d.previews || [];
  ui.events = d.events || [];
  ui.status = d;

  document.getElementById("exposer").textContent = `exposer: ${d.exposer}`;

  // The session, when there is one. The role comes from the payload because the cookie is
  // HttpOnly and the page cannot read it — and a "sign out" offered to somebody who never
  // signed in is a control that does nothing.
  const session = document.getElementById("session");
  if (session) {
    session.hidden = !d.role;
    if (d.role) {
      document.getElementById("session-role").textContent = `signed in as ${d.role}`;
    }
  }

  // While the daemon is recovering there are no workers, so a queued build cannot start.
  // Said out loud, because "Queued" with nothing happening is indistinguishable from a
  // stuck queue — which is exactly how it was reported, twice, both times a minute after a
  // restart.
  showStarting(d.starting, d.startup);
  // Only once the daemon says it has finished: while it is still recovering, the banner
  // above is the live account of the same thing and the footer would contradict it with a
  // duration from the previous run.
  if (!d.starting) renderBootLink(d);


  // A project whose last preview was torn down must not keep a stream open
  // behind a panel nobody can see. ui.open is a project name, so the test is
  // "does this project still have any preview at all" — a filter that merely
  // hides it is not grounds for closing the log somebody is reading.
  if (ui.open && !ui.previews.some(p => project(p) === ui.open)) {
    closeLog();
    ui.open = null;
  }

  render();
  openFromFragment();
}

// showStarting puts a banner above the list while the daemon is recovering.
//
// Not a spinner on the row: the row is correct — the build *is* queued. What is missing is
// that nothing can claim it yet, which is a property of the daemon and belongs where the
// daemon's own state is reported.
/* renderBootLink puts the startup report in the footer, and nothing on the screen.

   It used to open by itself, gated on an instance stamp in sessionStorage so a reload would
   not re-announce a restart from an hour ago. That machinery is gone with the auto-open:
   nothing appears unasked, so nothing has to remember whether it already has, and the report
   stays reachable for as long as the daemon runs rather than being spent on one load.

   The label carries the duration. A link reading "startup report" makes somebody open a
   dialog to learn a number that fits in the link. */
function renderBootLink(s) {
  const r = s && s.last_startup;
  const host = document.getElementById("boot-link");
  if (!host) return;
  if (!r || !r.instance) {
    host.hidden = true;
    return;
  }

  const btn = document.getElementById("boot-open");
  btn.textContent = `startup ${secs(r.seconds)}`;
  btn.title = "What the daemon did when it last started";
  btn.onclick = () => openBootReport(r);
  host.hidden = false;
}

/* openBootReport builds the dialog and shows it. Called from the footer link only. */
function openBootReport(r) {
  // Adopted versus created is the number worth reporting: adoption binds a listener to a
  // share that already exists, creating one is a controller round trip that answers in
  // ten to fifteen seconds. The difference between the two is the difference between a
  // restart nobody notices and four minutes of 404s.
  const adopted = (r.adopted_previews || 0) + (r.adopted_builds || 0);
  const created = (r.created_previews || 0) + (r.created_builds || 0);

  // No suppression rule here any more. It used to refuse to open for a startup under ten
  // seconds with nothing created — the right call for something that opened itself, and
  // wrong for something asked for: a reader who clicks the link wants the report, including
  // the one that says everything went well.

  const shares = adopted + created;
  // One row per fact, and only for facts that happened. A tile reading "0 created" is a
  // reader's problem to dismiss; its absence says the same thing and takes no space.
  const row = (k, v, cls) => v === "" ? "" :
    `<div class="boot-row"><dt>${esc(k)}</dt><dd${cls ? ` class="${cls}"` : ""}>${esc(v)}</dd></div>`;

  const rows = [
    row("Previews restored", String(r.previews || 0)),
    row("Build shares", String(r.adopted_builds + r.created_builds || 0)),
    row("Adopted", adopted ? `${adopted} — bound to shares that already existed` : "", "good"),
    row("Created", created ? `${created} — a controller round trip each` : "", "warn"),
    row("Cleared", r.orphans ? `${r.orphans} the database no longer claimed` : ""),
    row("Queued builds", r.pending ? String(r.pending) : "", "warn"),
  ].join("");

  // The headline is labelled. It was a bare "3s" above a sentence, and the one number
  // the report exists to give was read as decoration — "I didn't see a total time".
  document.getElementById("boot-body").innerHTML = `
    <div class="boot-hero">
      <div class="boot-hero-k">Startup took</div>
      <div class="boot-hero-v" id="boot-hero-v">${esc(secs(r.seconds))}</div>
      <div class="boot-hero-n">${
        shares === 0 ? "nothing to restore"
          : adopted && !created ? `all ${shares} shares adopted, none recreated`
          : created && !adopted ? `all ${shares} shares recreated — the slow path`
          : `${adopted} of ${shares} shares adopted`
      }</div>
    </div>
    <dl class="boot-rows">${rows}</dl>
    ${(r.items || []).length ? `<details class="boot-details">
      <summary>What it did · ${r.items.length} step${r.items.length === 1 ? "" : "s"}</summary>
      <div class="boot-list">${r.items.map(t => `<div>${esc(t)}</div>`).join("")}</div>
    </details>` : ""}`;

  const modal = document.getElementById("boot");
  modal.hidden = false;

  const close = () => { modal.hidden = true; };
  document.getElementById("boot-close").onclick = close;
  // Click-away and Escape, because a dialog with one button and no way out is a dialog
  // somebody has to aim at.
  modal.onclick = e => { if (e.target === modal) close(); };
  document.addEventListener("keydown", function esc(e) {
    if (e.key !== "Escape") return;
    close();
    document.removeEventListener("keydown", esc);
  });
}

// STAGES is every stage the daemon reports, in the order it runs them, so the banner
// can show what is finished and what is still to come. A stage the page does not know
// still renders — its note carries the text — it just gets no step of its own.
const STAGES = [
  ["reaping",   "Clear old shares"],
  ["restoring", "Restore previews"],
  ["history",   "Load history"],
];

function showStarting(starting, startup) {
  const wrap = document.querySelector(".wrap");
  let el = document.getElementById("starting");

  if (!starting) {
    if (el) el.remove();
    return;
  }

  // The page's own content stays on screen.
  //
  // Hiding it was tried, on the reasoning that during recovery the Open links point at
  // shares that do not exist yet and the feed is empty until backfill — so the content
  // contradicts the banner. What it actually produced was a dashboard whose entire
  // visible contents were one notice, which reads as a broken page rather than as a
  // careful one. The rows are true: they come from the database, and their state is
  // what it says. The dead-link window is a real problem and is a separate fix, listed
  // in TODO.md — it is not solved by showing nothing at all.
  if (!el) {
    el = document.createElement("div");
    el.id = "starting";
    el.className = "notice warn";
    // A sibling of .wrap, never a child of it.
    //
    // This banner used to be prepended into .wrap — which is a two-column grid, so the
    // banner became its first cell, the previews list was pushed into the 21rem rail
    // column, and the activity rail took the wide one. Every row in the list then
    // overlapped itself in a third of the width it was designed for, which read as
    // broken row CSS and is not: prepending into a grid shifts every sibling by one.
    wrap.parentNode.insertBefore(el, wrap);
  }

  const stage = startup && startup.stage ? startup.stage : "";
  const note = startup && startup.note ? startup.note : "Restoring previews.";
  const total = startup ? startup.total || 0 : 0;
  const done = startup ? startup.done || 0 : 0;

  // Counted stages get a determinate bar and "3 of 11"; uncounted ones get a bar with
  // no width, because a reap reports nothing until it returns and a bar creeping on a
  // timer would be inventing progress.
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  // The unit is named, because "7 of 13" against two previews invites the question of
  // what the thirteen are: one share per preview plus one per retained build.
  const count = total > 0
    ? `${done} of ${total}${stage === "restoring" ? " shares" : ""}`
    : "";

  // -1 for a stage this page has never heard of, which leaves every step pending
  // rather than marking them all complete.
  // Newest first, capped. The daemon sends up to forty and the interesting ones are the
  // last few — a banner that grows a forty-line list pushes the page it is describing off
  // the screen, which is the failure the hidden-content version had.
  const items = (startup && startup.items ? startup.items : [])
    .slice(-6).reverse()
    .map(t => `<div class="starting-item">${esc(t)}</div>`).join("");

  const at = STAGES.findIndex(s => s[0] === stage);
  const steps = STAGES.map(([key, label], i) => {
    const cls = at > i ? "step done" : at === i ? "step now" : "step";
    // The count goes inside the current step, not after the list.
    const n = at === i && count ? ` <span class="step-count">${esc(count)}</span>` : "";
    // The spinner is markup rather than a ::before, so it cannot inherit the pending
    // mark's sizing and cannot be lost to one unparseable colour function.
    const spin = at === i ? `<span class="spinner" aria-hidden="true"></span>` : "";
    return `<span class="${cls}">${spin}${esc(label)}${n}</span>`;
  }).join("");

  el.innerHTML = `<div class="starting-head">
      <strong>Starting up.</strong> ${esc(note)} Builds queue but do not start yet.
    </div>
    <div class="starting-steps">${steps}</div>
    ${items.length ? `<div class="starting-items">${items}</div>` : ""}
    <div class="starting-bar"${total > 0 ? "" : ` data-indeterminate="1"`}>
      <span style="width:${pct}%"></span>
    </div>`;
}

// openFromFragment honours `#preview=<id>`, which is where a failed build's comment
// points.
//
// A fragment rather than a path: the daemon never receives it, so a preview id cannot
// reach an access log through somebody following the link from a pull request, and the
// page can act on it with no new route to serve.
//
// Once, and only after the first status arrives, because reveal() needs the preview to
// exist in ui.previews — and not again afterwards, or every status event would drag the
// page back to wherever the link pointed while somebody was reading something else.
let fragmentDone = false;
function openFromFragment() {
  if (fragmentDone) return;
  const m = location.hash.match(/^#preview=([A-Za-z0-9]+)$/);
  if (!m) {
    fragmentDone = true;
    return;
  }
  const p = ui.previews.find(x => x.preview_id === m[1]);
  if (!p) return; // Not here yet, or gone. Try again on the next status.
  fragmentDone = true;
  reveal(m[1], p.commit, null, p.state);
}

/* The switcher's own events.

   Bound once, here, rather than in renderProjects: that runs on every status tick, and
   rebinding a handler per tick is how a click ends up firing twice. */
document.getElementById("projpick-btn").onclick = () => {
  const open = !document.getElementById("projpick-panel").hidden;
  if (open) closePicker(); else openPicker();
};

document.getElementById("projpick-find").oninput = e => filterPicker(e.target.value);

document.getElementById("projpick-find").onkeydown = e => {
  if (e.key === "Escape") {
    closePicker();
    document.getElementById("projpick-btn").focus();
    return;
  }
  // Enter takes the first row still visible, so filtering and choosing is one gesture
  // for somebody who knows what they are looking for.
  if (e.key === "Enter") {
    const first = [...document.querySelectorAll("#projpick-list [data-pick-project]")]
      .find(r => !r.hidden);
    if (first) first.click();
  }
};

// Anywhere else closes it. A panel that floats over the page and stays open after a
// click somewhere else is a panel covering whatever you were trying to reach.
document.addEventListener("click", e => {
  if (document.getElementById("projpick-panel").hidden) return;
  if (!e.target.closest("#projpick")) closePicker();
});

let searchTimer = null;
document.getElementById("search").oninput = e => {
  const v = e.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  // Debounced: every keystroke otherwise rebuilds the list, and rebuilding the
  // list replaces the open log pane.
  searchTimer = setTimeout(() => { ui.query = v; render(); }, 120);
};

function connect() {
  const conn = document.getElementById("conn");
  const src = new EventSource("/events");

  src.onopen = () => { conn.textContent = "live"; conn.className = "live"; };
  src.addEventListener("status", e => {
    try { applyStatus(JSON.parse(e.data)); } catch (err) { /* keep the last good render */ }
  });
  // A dashboard that silently freezes is worse than one that admits it: the
  // numbers on screen would otherwise look current indefinitely. EventSource
  // reconnects by itself, so this only has to report.
  //
  // Except when the reason it cannot connect is that the session ended. EventSource
  // exposes no status code, so an expired cookie and a stopped daemon are the same
  // event here — the page said "reconnecting…" forever while the answer was a 401 and
  // the fix was to sign in. Which happens on every restart, since the cookie is signed
  // with a per-process secret. So the error is probed once, and only a 401 redirects.
  src.onerror = () => {
    conn.textContent = "reconnecting…";
    conn.className = "stale";
    probeSession();
  };
}

/* probeSession asks whether the stream failed because the session is gone.
   Sent to /status rather than /readyz: /readyz answers without a login, so it can
   never return the 401 this is looking for. */
async function probeSession() {
  try {
    toLoginIf(await fetch("/status", {headers: {"Accept": "application/json"}}));
  } catch {
    // The daemon is unreachable, which is the other reason the stream failed and is
    // not something a login fixes. Leave "reconnecting…" up.
  }
}

/* toLoginIf sends the browser to the login page when the server says the session is
   not good, and reports whether it did.

   Every fetch on the page goes through this. Without it an expired session reads as a
   broken dashboard: the panels render their last good state, an action fails with
   "401 Unauthorized" in a corner, and nothing says the word "login". The server already
   redirects a navigation — this is the same answer for the requests that are not one.

   `next` is the path being viewed, not the path that 401'd: sending somebody back to
   /events or /api/projects after signing in is a blank page or a JSON dump. */
function toLoginIf(res) {
  if (!res || res.status !== 401) return false;
  const next = location.pathname + location.search;
  location.href = "/login?next=" + encodeURIComponent(next);
  return true;
}

// hideOperationsChrome strips the parts of the page that only make sense with a
// live status stream behind them.
//
// Shared by both admin pages, because leaving a project filter and a search box
// above a form that neither one filters is worse than leaving the page bare.
function hideOperationsChrome(label) {
  document.querySelector(".wrap").hidden = true;
  document.getElementById("counters").hidden = true;
  document.getElementById("projpick").hidden = true;
  document.getElementById("search").hidden = true;
  document.getElementById("conn").textContent = label;
}

if (isSetupPage) {
  // Only the setup panel. No status stream and no polling: this page has nothing
  // live on it, and an open EventSource per idle browser tab is a connection the
  // daemon holds for nothing.
  hideOperationsChrome("setup");
  setupEl().hidden = false;
  loadSetup();
} else if (isProjectsPage) {
  hideOperationsChrome("projects");
  document.getElementById("projects").hidden = false;
  loadProjects();
} else {
  connect();
  render();
  showAdminLinks();
  // Every second, not every five.
  //
  // Timestamps drift without a redraw and the status stream is silent when nothing
  // changes — which is exactly when "2s ago" has become a lie. Five seconds was
  // enough for an age that coarsens; it is not enough for a stopwatch, which is
  // read to answer "is this still moving" and answered it four times out of five
  // with a number that had not changed.
  //
  // Affordable because the row already repaints only on a changed signature: a
  // finished preview's coarse age is the same string on all five ticks, so this is
  // one string comparison per row per second and no DOM work at all. The running
  // row's signature does change every second, which is the entire point.
  //
  // The log pane is untouched by any of this. It is a live EventSource written to
  // as lines arrive — never on a poll — which is worth stating because a ticking
  // clock beside a log makes it look like the log is what is being polled.
  setInterval(() => { if (ui.previews.length) renderList(); }, 1000);
}

// showAdminLinks draws the Secrets and Projects links, and only for a request the
// daemon would accept a write from.
//
// The server decides, not the page: /api/admin runs the same isLocalRequest check
// the write endpoints run. A Host-header test here would be worthless — Host is
// whatever the client typed, so a tunnelled visitor sending "localhost" would pass
// it. Where the connection came from is the daemon's to know.
//
// Anything other than an outright yes leaves the links absent. Through the
// dashboard-only proxy this endpoint is not in the allowlist and the fetch 404s,
// which lands here as a failure and hides them.
async function showAdminLinks() {
  try {
    admin = await api("GET", "/api/admin");
  } catch {
    return;
  }
  const links = [];
  if (admin.projects) links.push(`<a class="control" href="/projects">Projects</a>`);
  if (admin.secrets) links.push(`<a class="control" href="/secrets">Secrets</a>`);
  if (admin.projects) {
    links.push(`<button class="control" id="cache-clear"
      title="Delete every preview's cached package downloads">Clear caches</button>`);
  }
  if (!links.length) return;

  const nav = document.getElementById("admin-nav");
  nav.innerHTML = links.join("");
  nav.hidden = false;
  wireClearCache(document.getElementById("cache-clear"));
}

// admin is what /api/admin last said. Absent until it answers, which is why every
// consumer treats a missing answer as "no".
let admin = {};

// The daemon instance this page loaded against, and the banner shown when it
// changes.
//
// This page is one embedded file with no cache busting, so a tab left open across a
// rebuild keeps running the code it loaded. That produced three false bug reports in
// one afternoon — a layout that had already moved, a filter that had already been
// fixed, a row that was already collapsed — each costing a diagnosis before somebody
// thought to reload.
//
// Not an automatic reload. The reader may be part-way through a log, or have a
// selection they are copying, and a page that reloads itself under them is worse
// than a stale one. It says so and waits.
let instance = null;

function checkInstance(seen) {
  if (!seen) return;
  if (instance === null) { instance = seen; return; }
  if (instance === seen || document.getElementById("stale")) return;

  const n = document.createElement("div");
  n.id = "stale";
  n.className = "notice warn";
  n.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;" +
    "z-index:9;margin:0;box-shadow:0 4px 16px rgba(0,0,0,0.2)";
  n.innerHTML = `<strong>The daemon restarted.</strong> This page is running older
    code, so what you see may not match what it does.
    <button class="btn" id="stale-go" style="margin-left:0.5rem">Reload</button>`;
  document.body.appendChild(n);
  document.getElementById("stale-go").onclick = () => location.reload();
}

// wireClearCache wires the one cache control, in the top bar.
//
// One button rather than one per row. Per row it appeared on every open row at once,
// which reads as part of looking at a log rather than as the rare repair it is — and
// a cache is deleted with its preview anyway, so the manual version exists only for
// the pull request whose next build has to work now.
//
// Confirmed, unlike the per-row version. It clears every preview's cache, so the
// next build of everything currently open pays for it, and that is not visible from
// the button.
function wireClearCache(btn) {
  if (!btn) return;

  btn.onclick = async () => {
    if (!confirm("Delete every preview's cached package downloads? " +
                 "The next build of each will re-download its dependencies.")) return;

    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const out = await api("DELETE", "/api/cache");
      const n = (out.cleared || []).length;
      btn.textContent = n ? `Cleared ${n}` : "Nothing cached";
    } catch (e) {
      btn.textContent = "Failed";
      btn.title = e.message;
    }
    // Back to a usable button. Long enough to read, short enough that the top bar
    // does not sit lying about its state.
    setTimeout(() => {
      btn.textContent = label;
      btn.disabled = false;
      btn.title = "Delete every preview's cached package downloads";
    }, 2500);
  };
}
</script>
</body>
</html>
