    const platform = val("p-platform"), owner = val("p-owner"), repo = val("p-repo");
    if (!platform || !owner || !repo) {
      alert("platform, owner and repository are all required");
      return;
    }
    const path = `/api/projects/${encodeURIComponent(platform)}` +
      `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
    await run(e.target, async () => {
      const out = await api("PUT", path, {
        enabled: true,
        driver: val("p-driver"),
        build_dir: val("p-dir"),
        build_command: val("p-command"),
        build_output: val("p-output"),
        base_url: val("p-baseurl"),
        detect_script: val("p-detect"),
        image: val("p-image"),
        notes: val("p-notes"),
      });
      renderProjectsPage(out);
      return out;
    });
  };

  document.getElementById("p-clear").onclick = () => {
    for (const id of Object.values(projectFields)) document.getElementById(id).value = "";
  };

  // Edit fills the form rather than opening a second one. The form is already the
  // full set of fields, and a PUT is an upsert, so "edit" and "add" are the same
  // request — two different UIs for one operation would drift.
  for (const b of document.querySelectorAll("[data-edit]")) {
    b.onclick = () => {
      const p = s.projects.find(x => projectKey(x) === b.dataset.edit);
      if (!p) return;
      for (const [field, id] of Object.entries(projectFields)) {
        document.getElementById(id).value = p[field] || "";
      }
      document.getElementById("project-form-title").textContent =
        `Editing ${p.owner}/${p.repo}`;
      document.getElementById("p-owner").scrollIntoView({block: "center"});
    };
  }

  for (const b of document.querySelectorAll("[data-del-project]")) {
    b.onclick = async () => {
      const key = b.dataset.delProject;
      if (!confirm(`Delete the project ${key}? Its existing previews are left alone.`)) return;
      const [platform, owner, repo] = key.split("/");
      const path = `/api/projects/${encodeURIComponent(platform)}` +
        `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
      await run(b, async () => {
        renderProjectsPage(await api("DELETE", path));
        return {};
      });
    };
  }

}

/* ── Wiring ───────────────────────────────────────────────────────────── */

function render() {
  renderCounters();
  renderProjects();
  renderList();
  renderEvents();
}

function applyStatus(d) {
  ui.previews = d.previews || [];
  ui.events = d.events || [];
  ui.status = d;

  document.getElementById("exposer").textContent = `exposer: ${d.exposer}`;


  // A project whose last preview was torn down must not keep a stream open
  // behind a panel nobody can see. ui.open is a project name, so the test is
  // "does this project still have any preview at all" — a filter that merely
  // hides it is not grounds for closing the log somebody is reading.
  if (ui.open && !ui.previews.some(p => project(p) === ui.open)) {
    closeLog();
    ui.open = null;
  }

  render();
}

document.getElementById("project").onchange = e => { ui.project = e.target.value; render(); };

let searchTimer = null;
document.getElementById("search").oninput = e => {
  const v = e.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  // Debounced: every keystroke otherwise rebuilds the list, and rebuilding the
  // list replaces the open log pane.
  searchTimer = setTimeout(() => { ui.query = v; render(); }, 120);
};

function connect() {
  const conn = document.getElementById("conn");
  const src = new EventSource("/events");

  src.onopen = () => { conn.textContent = "live"; conn.className = "live"; };
  src.addEventListener("status", e => {
    try { applyStatus(JSON.parse(e.data)); } catch (err) { /* keep the last good render */ }
  });
  // A dashboard that silently freezes is worse than one that admits it: the
  // numbers on screen would otherwise look current indefinitely. EventSource
  // reconnects by itself, so this only has to report.
  src.onerror = () => { conn.textContent = "reconnecting…"; conn.className = "stale"; };
}

// hideOperationsChrome strips the parts of the page that only make sense with a
// live status stream behind them.
//
// Shared by both admin pages, because leaving a project filter and a search box
// above a form that neither one filters is worse than leaving the page bare.
function hideOperationsChrome(label) {
  document.querySelector(".wrap").hidden = true;
  document.getElementById("counters").hidden = true;
  document.getElementById("project").hidden = true;
  document.getElementById("search").hidden = true;
  document.getElementById("conn").textContent = label;
}

if (isSetupPage) {
  // Only the setup panel. No status stream and no polling: this page has nothing
  // live on it, and an open EventSource per idle browser tab is a connection the
  // daemon holds for nothing.
  hideOperationsChrome("setup");
  setupEl().hidden = false;
  loadSetup();
} else if (isProjectsPage) {
  hideOperationsChrome("projects");
  document.getElementById("projects").hidden = false;
  loadProjects();
} else {
  connect();
  render();
  showAdminLinks();
  // Relative timestamps drift without a redraw, and the status stream is silent
  // when nothing changes — which is exactly when "2s ago" has become a lie.
  setInterval(() => { if (ui.previews.length) renderList(); }, 5000);
}

// showAdminLinks draws the Secrets and Projects links, and only for a request the
// daemon would accept a write from.
//
// The server decides, not the page: /api/admin runs the same isLocalRequest check
// the write endpoints run. A Host-header test here would be worthless — Host is
// whatever the client typed, so a tunnelled visitor sending "localhost" would pass
// it. Where the connection came from is the daemon's to know.
//
// Anything other than an outright yes leaves the links absent. Through the
// dashboard-only proxy this endpoint is not in the allowlist and the fetch 404s,
// which lands here as a failure and hides them.
async function showAdminLinks() {
  try {
    admin = await api("GET", "/api/admin");
  } catch {
    return;
  }
  const links = [];
  if (admin.projects) links.push(`<a class="control" href="/projects">Projects</a>`);
  if (admin.secrets) links.push(`<a class="control" href="/secrets">Secrets</a>`);
  if (admin.projects) {
    links.push(`<button class="control" id="cache-clear"
      title="Delete every preview's cached package downloads">Clear caches</button>`);
  }
  if (!links.length) return;

  const nav = document.getElementById("admin-nav");
  nav.innerHTML = links.join("");
  nav.hidden = false;
  wireClearCache(document.getElementById("cache-clear"));
}

// admin is what /api/admin last said. Absent until it answers, which is why every
// consumer treats a missing answer as "no".
let admin = {};

// wireClearCache wires the one cache control, in the top bar.
//
// One button rather than one per row. Per row it appeared on every open row at once,
// which reads as part of looking at a log rather than as the rare repair it is — and
// a cache is deleted with its preview anyway, so the manual version exists only for
// the pull request whose next build has to work now.
//
// Confirmed, unlike the per-row version. It clears every preview's cache, so the
// next build of everything currently open pays for it, and that is not visible from
// the button.
function wireClearCache(btn) {
  if (!btn) return;

  btn.onclick = async () => {
    if (!confirm("Delete every preview's cached package downloads? " +
                 "The next build of each will re-download its dependencies.")) return;

    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const out = await api("DELETE", "/api/cache");
      const n = (out.cleared || []).length;
      btn.textContent = n ? `Cleared ${n}` : "Nothing cached";
    } catch (e) {
      btn.textContent = "Failed";
      btn.title = e.message;
    }
    // Back to a usable button. Long enough to read, short enough that the top bar
    // does not sit lying about its state.
    setTimeout(() => {
      btn.textContent = label;
      btn.disabled = false;
      btn.title = "Delete every preview's cached package downloads";
    }, 2500);
  };
}
</script>
</body>
</html>
