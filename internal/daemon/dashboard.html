// Inline SVG rather than an icon font or an emoji. A font is a network request
// for two glyphs, and 📋 renders as a different picture on every platform and at
// a size nothing here controls.
//
// stroke=currentColor so both follow the button's colour in light and dark mode.
const ICON_COPY =
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
     <rect x="9" y="9" width="11" height="11" rx="2"></rect>
     <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
   </svg>`;

const ICON_CHECK =
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
     <path d="M20 6 9 17l-5-5"></path>
   </svg>`;

const ORDER = ["failed", "building", "queued", "ready"];

function matches(p) {
  if (ui.state && p.state !== ui.state) return false;
  if (ui.project && project(p) !== ui.project) return false;
  if (!ui.query) return true;
  const hay = `${project(p)} ${p.branch} #${p.number} ${p.name || ""}`.toLowerCase();
  return hay.includes(ui.query);
}

// One row per project rather than one per preview.
//
// A project with a dozen open pull requests produced a dozen rows that all said
// the same project name, and the list stopped being scannable at exactly the
// point it started being useful. The row now carries the project's newest
// preview and a count of everything else it has; the older ones are a dropdown
// inside, so they are one click away instead of permanently in the way.
//
// "Newest" is by state first, then time: a failure nobody has looked at is more
// interesting than a build that went green a minute later, and a project whose
// row says Ready while one of its branches is broken is a lie of omission.
/* inList decides what the previews list is *for*.

   Pull requests, and a branch preview only while it is doing something.

   A branch preview is permanent by design — it is the state of `main`, and it is meant to
   sit there answering. That makes it the one row nobody needs to look at: this list is a
   worklist, and a row that is always green and always present is furniture. It has a link
   on its project card, which is where somebody who wants `main` goes.

   Kept while queued or building, and that exception is not a compromise — it is what stops
   the removal creating a dead end. The log pane opens from a row, so with the row gone there
   would be nowhere to watch a branch build happen and nowhere for an activity entry to
   reveal. Live it appears, finished it steps out of the way.

   Number 0 is the branch preview; see model.PullRequest.IsBranch. */
const inList = p => p.number > 0 || isLive(p.state);

function groups() {
  const by = new Map();
  for (const p of ui.previews.filter(inList).filter(matches)) {
    const k = project(p);
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(p);
  }

  const rank = p => {
    const i = ORDER.indexOf(p.state);
    return i < 0 ? ORDER.length : i;
  };

  const out = [];
  for (const [name, list] of by) {
    list.sort((a, b) =>
      rank(a) - rank(b) || new Date(b.updated_at) - new Date(a.updated_at));

    const picked = list.find(p => p.preview_id === ui.pick[name]) || list[0];
    out.push({name, list, current: picked});
  }
  out.sort((a, b) => rank(a.current) - rank(b.current) || a.name.localeCompare(b.name));
  return out;
}

/* ── Counters ─────────────────────────────────────────────────────────── */

function renderCounters() {
  // Counted over the same set the list shows, not over every preview. A counter that
  // says four while the list holds three is the page arguing with itself, and the
  // reader has no way to tell which half is wrong.
  const counted = ui.previews.filter(inList);
  const by = k => counted.filter(p => p.state === k).length;
  const cells = [
    {label: "All",      n: counted.length,     key: null},
    {label: "Ready",    n: by("ready"),        key: "ready",    color: "var(--good)"},
    {label: "Building", n: by("building"),     key: "building", color: "var(--warning)"},
    {label: "Queued",   n: by("queued"),       key: "queued",   color: "var(--idle)"},
    {label: "Failed",   n: by("failed"),       key: "failed",   color: "var(--critical)"},
  ];

  const el = document.getElementById("counters");
  const sig = cells.map(c => `${c.key}:${c.n}:${ui.state === c.key}`).join("|");
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;

  el.innerHTML = cells.map((c, i) => `
    <button data-i="${i}" aria-pressed="${ui.state === c.key}" title="${esc(c.label)}">
      ${c.color ? `<span class="dot${c.key === "building" && c.n > 0 ? " work" : ""}"
                          style="--edge:${c.color}"></span>` : ""}
      <span class="n">${c.n}</span><span>${esc(c.label)}</span>
    </button>`).join("");

  for (const b of el.querySelectorAll("button")) {
    const c = cells[Number(b.dataset.i)];
    b.onclick = () => { ui.state = (ui.state === c.key) ? null : c.key; render(); };
  }
}

/* ── Project switcher ─────────────────────────────────────────────────────
   A trigger plus a filtered list, which is the shape this problem has: at a dozen
   projects a <select> is a scrolling menu of near-identical repository names, with no
   room for a badge and no way to type at it.

   Two sources join here. The previews say which projects have activity and how much;
   the status payload's `projects` say what each is called and what badge it carries. A
   project with no previews yet still appears, because "I added it and it is not in the
   list" is the question this page was answering wrongly an hour ago. */

// projectMeta maps a project name to its label and badge, from status.projects.
function projectMeta() {
  const out = new Map();
  for (const p of (ui.status?.projects || [])) {
    // The key is `<platform>:<owner>/<repo>`; the previews group by the repository name
    // alone, which is what `project()` returns.
    const repo = String(p.key || "").split("/").pop();
    if (repo) out.set(repo, p);
  }
  return out;
}

function renderProjects() {
  const counts = new Map();
  for (const p of ui.previews) {
    const k = project(p);
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const meta = projectMeta();
  // Every configured project, not only those with previews.
  for (const k of meta.keys()) if (!counts.has(k)) counts.set(k, 0);

  const names = [...counts.keys()].sort();
  const label = document.querySelector("#projpick-btn .pick-label");
  const current = names.includes(ui.project) ? ui.project : "";

  // The trigger shows the scope, with its badge when it has one.
  const m = current ? meta.get(current) : null;
  label.innerHTML = current
    ? `${m ? badgeHTML(m, current) : ""}<span>${esc(m?.label || current)}</span>`
    : `<span>All projects (${ui.previews.length})</span>`;
  label.classList.toggle("with-ava", Boolean(m));

  // The list is rebuilt only when something in it changed, so an open panel keeps its
  // filter text and its scroll position across a status tick.
  const sig = names.map(n => `${n}:${counts.get(n)}:${meta.get(n)?.avatar ? 1 : 0}`)
    .join("|") + `|${current}|${ui.previews.length}`;
  const list = document.getElementById("projpick-list");
  if (list.dataset.sig === sig) return;
  list.dataset.sig = sig;
  list.dataset.names = JSON.stringify(names);

  const rows = [
    `<button class="pick-row${current === "" ? " here" : ""}" data-pick-project=""
      role="option" aria-selected="${current === ""}">
      <span>All projects</span><span class="count">${ui.previews.length}</span></button>`,
  ];
  for (const n of names) {
    const pm = meta.get(n);
    rows.push(`<button class="pick-row${current === n ? " here" : ""}"
      data-pick-project="${esc(n)}" role="option" aria-selected="${current === n}">
      ${badgeHTML(pm, n)}<span>${esc(pm?.label || n)}</span>
      <span class="count">${counts.get(n) || ""}</span></button>`);
  }
  // The way to add one, where Vercel puts it and for the same reason: the moment you
  // discover a project is missing is while looking for it.
  rows.push(`<a class="pick-row add" href="/projects">+ New project</a>`);

  list.innerHTML = rows.join("");
  for (const b of list.querySelectorAll("[data-pick-project]")) {
    b.onclick = () => {
      ui.project = b.dataset.pickProject;
      closePicker();
      render();
    };
  }
}

// badgeHTML draws a project's badge for the switcher: the uploaded image when there is
// one, otherwise initials on a hue derived from the name — the same derivation the
// projects page uses, so a project looks the same in both places.
function badgeHTML(meta, name) {
  const avatar = meta?.avatar || "";
  if (avatar.startsWith("data:image/")) {
    return `<span class="ava ava-img"><img src="${esc(avatar)}" alt="" width="14" height="14"></span>`;
  }
  const label = avatar || monogram(meta?.label || name);
  let h = 0;
  for (const ch of (meta?.key || name)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<span class="ava" style="background:hsl(${h} 62% 88%);border-color:hsl(${h} 40% 74%)"
    aria-hidden="true">${esc(label)}</span>`;
}

function openPicker() {
  document.getElementById("projpick-panel").hidden = false;
  document.getElementById("projpick-btn").setAttribute("aria-expanded", "true");
  const find = document.getElementById("projpick-find");
  find.value = "";
  filterPicker("");
  find.focus();
}

function closePicker() {
  document.getElementById("projpick-panel").hidden = true;
  document.getElementById("projpick-btn").setAttribute("aria-expanded", "false");
}

// filterPicker hides rows that do not match, matching on both the label and the
// repository name — somebody typing "customer" should find a project called "Customer
// Connect" and somebody typing the repository name should find it too.
function filterPicker(q) {
  const needle = q.trim().toLowerCase();
  const list = document.getElementById("projpick-list");
  let shown = 0;
  for (const row of list.querySelectorAll("[data-pick-project]")) {
    const hay = `${row.textContent} ${row.dataset.pickProject}`.toLowerCase();
    const hit = !needle || hay.includes(needle);
    row.hidden = !hit;
    if (hit) shown++;
  }
  // "All projects" is not a match anybody means when they have typed something. Only
  // decremented when it was actually counted: unconditionally, a filter matching nothing
  // took the count to -1, which is truthy, so the "no match" message never appeared.
  const all = list.querySelector('[data-pick-project=""]');
  if (needle && all && !all.hidden) {
    all.hidden = true;
    shown--;
  }

  let empty = list.querySelector(".pick-empty");
  if (!shown) {
    if (!empty) {
      empty = document.createElement("div");
      empty.className = "pick-empty";
      list.prepend(empty);
    }
    empty.textContent = `No project matches “${q.trim()}”.`;
  } else if (empty) {
    empty.remove();
  }
}

/* ── Accordion ────────────────────────────────────────────────────────────
   Updated by key, not rebuilt.

   Setting innerHTML on the list every status tick destroyed and recreated the
   open log pane, which is what the flicker was: a few hundred lines of log
   thrown away and re-inserted twice a second. It also dropped hover and focus,
   and it meant the pane's event handlers had to be re-attached on a schedule
   rather than once. Rows are now created on first sight and mutated in place;
   the log pane is created once per opened preview and left alone. */

function renderList() {
  const gs = groups();
  const el = document.getElementById("list");

  document.getElementById("list-heading").textContent =
    ui.state || ui.project || ui.query
      ? `Projects (${gs.length}) — ${ui.previews.filter(matches).length} of ${ui.previews.length} previews`
      : `Projects (${gs.length})`;

  const empty = el.querySelector(".empty");
  if (gs.length === 0) {
    if (!empty) {
      const filtered = ui.state || ui.project || ui.query;
      el.innerHTML = `<div class="empty">
        ${filtered
          ? `Nothing matches.<br><br><button class="btn" id="clear">Clear filters</button>`
          : `No previews yet.<br><br>Push a branch to a repo made by <code>docpreview sim init</code>.`}
      </div>`;
      const c = document.getElementById("clear");
      if (c) c.onclick = clearFilters;
    }
    return;
  }
  if (empty) el.innerHTML = "";

  const wanted = new Set(gs.map(g => g.name));
  for (const item of [...el.children]) {
    if (!wanted.has(item.dataset.project)) item.remove();
  }

  let prev = null;
  for (const g of gs) {
    let item = el.querySelector(`.item[data-project="${CSS.escape(g.name)}"]`);
    if (!item) {
      item = document.createElement("div");
      item.className = "item";
      item.dataset.project = g.name;
      // The link is a sibling of the button, not inside it: an anchor nested in
      // a button is invalid, and clicking it would toggle the row as well as
      // follow the href.
      // Three siblings, not nested: an anchor inside a button is invalid markup, and
      // clicking one would both follow the href and toggle the row. The pull request link
      // sits between the head — whose last cell is the relative time — and Open, so the
      // reading order is what happened, when, where to discuss it, where to look at it.
      item.innerHTML = `<div class="row"><button class="head"></button>` +
        `<a class="go pr" data-role="row-pr"></a><a class="go"></a></div>`;
      item.querySelector(".head").onclick = () => toggle(g.name);
    }

    // Reordering is suspended while a row is expanded or the list has focus.
    //
    // groups() sorts by state, so a project that starts building climbs to the
    // top — under a reader who was mid-sentence in an expanded log. Moving a
    // DOM node also closes any <select> open inside it and drops focus, so a
    // background wave arriving while somebody had the preview dropdown open
    // shut it with no explanation.
    //
    // The sort is right when you arrive at the page and wrong the moment you
    // start using it. New rows are still appended, so nothing is hidden; the
    // order just stops rearranging itself under your hands.
    if (!frozen(el)) {
      const next = prev ? prev.nextSibling : el.firstChild;
      if (item !== next) el.insertBefore(item, next);
    } else if (!item.isConnected) {
      el.appendChild(item);
    }
    prev = item;

    // Set outside updateHead, and unconditionally.
    //
    // It used to live at the end of updateHead, past two early returns — and
    // one of them fires exactly when this matters. Clicking the row makes the
    // button the active element, the focus guard then skipped the whole
    // function, and the class never went on. `term()` selects `.item.open
    // .term`, so it found nothing, and the first expand of any row showed an
    // empty log until some other click moved focus and let the next render
    // through.
    //
    // A class that other code queries by is state, not markup. It does not
    // belong behind a repaint optimisation.
    item.classList.toggle("open", ui.open === g.name);
    // Same argument: a screen reader announcing "collapsed" on a row that just
    // expanded is a correctness bug, not a repaint.
    item.querySelector(".head").setAttribute("aria-expanded", String(ui.open === g.name));

    updateHead(item, g);
    updateBody(item, g);
  }
}

// frozen reports whether the list is being interacted with, and so must not be
// rearranged or have its markup replaced underneath.
//
// Two signals. Focus inside the list covers the open dropdown, the mid-tab
// keyboard user, and text selection. An expanded row covers the commonest case
// of all: reading a build log while the rest of the world keeps moving.
function frozen(el) {
  return ui.open !== null || el.contains(document.activeElement);
}

function updateHead(item, g) {
  const p = g.current;
  const s = state(p.state);

  // No per-state count chips on the row.
  //
  // They were three or four coloured pills saying how many of this project's previews were
  // ready, failed or building — beside a pill already naming the state of the one preview
  // the row is showing. Nobody acted on the numbers: the question a row answers is "what is
  // this branch doing", and the counts answered a question about a set the row does not
  // otherwise represent. Removed rather than moved; the state of each preview is on its own
  // line in the picker.

  // p.url is in the signature because the row now carries the link: a republish
  // that moves the URL without changing the state would otherwise leave the
  // anchor pointing at the old one.
  // The elapsed clock is deliberately part of the signature. It changes every second
  // for a running build, which is the point — and for every other row it is a fixed
  // finishing time, so a page of finished previews still rebuilds nothing.
  const sig = [p.preview_id, p.state, p.url, p.branch, p.number, rowWhen(p),
               ui.open === g.name].join("|");

  const head = item.querySelector(".head");
  if (head.dataset.sig === sig) return;

  // Replacing the markup of the element that currently has focus takes the
  // focus with it, which drops a keyboard user back to the top of the page
  // mid-navigation. The counts and the timestamp can wait until they look away.
  if (head === document.activeElement) return;

  head.dataset.sig = sig;

  head.style.setProperty("--edge", s.color);
  head.innerHTML = `
    <span class="caret">▶</span>
    <span class="who">
      <span class="proj">${esc(g.name)}</span>
      <span class="branch">${esc(p.branch)}</span><span class="num">#${p.number}</span>
    </span>
    <span class="grow"></span>
    <span class="pill${s.work ? " work" : s.spin ? " spin" : ""}" style="--edge:${s.color}">
      <span class="dot"></span>${esc(s.label)}
    </span>
    <span class="when${isLive(p.state) ? " ticking" : ""}">${rowWhen(p)}</span>`;

  updateRowPR(item.querySelector('[data-role="row-pr"]'), p);
  // The Open link is the *last* .go, since the pull request link shares the class to
  // share the look.
  const gos = item.querySelectorAll(".go");
  updateGoLink(gos[gos.length - 1], p);
}

// updateRowPR points the row's pull request link at the pull request.
//
// Hidden when there is none rather than greyed: the local platform has no web interface at
// all, which is not a state anybody can act on, and a permanently dead control between two
// live ones is worse than a gap.
function updateRowPR(a, p) {
  const url = safeURL(p.pr_url);
  if (!url) {
    a.hidden = true;
    return;
  }
  const platform = String(p.repo).split(":")[0];
  a.hidden = false;
  a.href = url;
  a.target = "_blank";
  a.rel = "noreferrer";
  // The platform's own mark, so which host a pull request is on is readable without
  // parsing the URL — which matters the moment one dashboard watches both.
  a.innerHTML = `${platformIcon(platform)}<span>#${p.number}</span>`;
  a.title = `Open pull request #${p.number} on ${platform}`;
}

/* Inline SVG, one path each, currentColor.

   Not an icon font and not an image: this page fetches nothing from the internet, and a
   remote logo would announce every open dashboard to whoever hosts it.

   GitHub's mark is the Octicon `mark-github` path, taken from github.com itself. The
   simple-icons version was here first and it does not survive being scaled up — its
   silhouette is drawn for 14px, and at 20 the ear and the tail read as artefacts.
   `overflow: visible` comes with the Octicon and matters: the path is drawn slightly
   outside the 24-unit box, so clipping it shaves the outline. */
const ICON_GITHUB = `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
  focusable="false" fill="currentColor" overflow="visible"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>`;
const ICON_BITBUCKET = `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
  fill="currentColor"><path d="M.8 1.1A.8.8 0 0 0 0 2l3.3 19.8c.1.5.5.8 1 .8h15.7c.4 0 .7-.3.8-.7l3.2-19.9a.8.8 0 0 0-.8-.9zm13.6 14.3H9.7L8.4 8.6h7.2z"/></svg>`;

function platformIcon(platform) {
  if (platform === "github") return ICON_GITHUB;
  if (platform === "bitbucket") return ICON_BITBUCKET;
  return "";
}

// The preview link belongs on the row, not inside the expanded panel: opening
// the site is the commonest thing anyone wants from a list of previews, and
// burying it behind a click to reveal a build log inverts that.
//
// It is only a link while the state is `ready`. Queued, building and failed
// have no URL at all, and a torn-down one has a URL that no longer answers —
// rendering either as live sends the reader to an error page. An anchor with no
// href is not a link, which is exactly the state wanted, and the tooltip says
// why.
// updateGoLink points a row's Open button at the preview.
//
// A URL, not a state, decides whether this is clickable. It used to require
// state === "ready", which greyed the button on every rebuild — but a rebuild does
// not withdraw anything: the previous build is still published and still serving,
// which is the whole point of building the new one beside it rather than in place.
// The button went grey exactly when somebody was most likely to be watching a
// build and wanting to look at what is live.
//
// A preview with no URL is a different case and still greys: nothing has ever been
// published for it, or it has been withdrawn.
function updateGoLink(a, p) {
  const url = safeURL(p.url);
  a.textContent = "Open ↗";
  if (url) {
    a.href = url;
    a.target = "_blank";
    a.rel = "noreferrer";
    // Says which build is behind the link when that is not the one on screen,
    // so a stale-looking page is explained rather than confusing.
    a.title = p.state === "ready"
      ? url
      : `${url} — still serving the last successful build while this one ${state(p.state).label.toLowerCase()}`;
  } else {
    a.removeAttribute("href");
    a.title = p.state === "ready"
      ? "this preview has no URL"
      : `nothing published yet — this preview is ${state(p.state).label.toLowerCase()}`;
  }
}

function updateBody(item, g) {
  const open = ui.open === g.name;
  let body = item.querySelector(".body");

  if (!open) {
    if (body) body.remove();
    return;
  }

  const fresh = !body;
  if (!body) {
    body = document.createElement("div");
    body.className = "body";
    body.innerHTML = `
      <!-- Above the log: what you are looking at. Below it: how you are looking at
           it. They used to share one bar, which put Following, Expand and Download
           a few pixels from the row's Open button — the one control here anybody
           reaches for often — so the cost of a misclick was landing on a different
           preview or losing your place in a live log.

           The selects stay on top because they are navigation and belong with the
           row's own controls. The view toggles move under the pane they act on,
           where nothing destructive is adjacent to them.

           No cache control in either: it was per row, which put the same button on
           every open row and made a rare repair look like part of reading a log. It
           lives once, in the top bar. -->
      <div class="logbar">
        <select class="control sm" data-role="pick" aria-label="Preview"></select>
        <select class="control sm" data-role="build" aria-label="Build"></select>
        <!-- The second Open. The row's Open goes to the branch share, which follows
             whatever built last; this one goes to the selected build's own share,
             pinned to its commit. One button could never be honest about both, which
             is why the log pane could say "build 85912e2 — not live" beside a button
             that went somewhere else entirely.

             Beside the build picker rather than in the footer, because it belongs to
             the selection immediately above it. -->
        <a class="btn" data-role="open-build" target="_blank" rel="noreferrer">Open build ↗</a>
        <span class="grow"></span>
      </div>
      <div class="logstate"></div>
      <div class="termwrap">
        <button class="copy" data-role="copy" type="button"
                title="Copy the whole log" aria-label="Copy the whole log"></button>
        <pre class="term"></pre>
      </div>
      <div class="logfoot">
        <button class="btn" data-role="follow" aria-pressed="true">Following</button>
        <button class="btn" data-role="tall" aria-pressed="false">Expand</button>
        <span class="grow"></span>
        <!-- Only while something is running. A permanently greyed Cancel is furniture,
             and one next to Download on a finished build is a misclick waiting to
             happen. Shown beside Download rather than in the top bar because it acts on
             the build whose log is on screen. -->
        <!-- Rebuild and Cancel are the same slot in two states, because the question
             "is something running" has one answer and each button is useless in the
             other case. -->
        <button class="btn" data-role="rebuild" hidden>Rebuild</button>
        <button class="btn danger" data-role="cancel" hidden>Cancel build</button>
        <!-- Unlink is the only control here that ends a preview rather than changing
             what it is doing, so it is last, and it is gated on /api/admin: a read-only
             dashboard must not offer a button that 403s. -->
        <button class="btn danger" data-role="unlink" hidden>Unlink</button>
        <a class="btn" data-role="download" download>Download</a>
      </div>`;
    item.appendChild(body);

    const copyBtn = body.querySelector('[data-role="copy"]');
    copyBtn.innerHTML = ICON_COPY;

    // Copies the log's text, not its HTML. The pane renders spans for command
    // lines, errors and redaction masks, so innerHTML would paste markup and
    // innerText is what somebody pasting into an issue actually wants — masks
    // included, since ***** is the truth about that line.
    copyBtn.onclick = async e => {
      const t = term();
      if (!t) return;
      const btn = e.currentTarget;
      try {
        await navigator.clipboard.writeText(t.innerText);
        btn.innerHTML = ICON_CHECK;
        btn.title = "Copied";
      } catch {
        // clipboard needs a secure context. http://127.0.0.1 qualifies, but not
        // every browser agrees and the dashboard is also reachable over a tunnel
        // — so fall back to selecting the pane and saying so in the tooltip,
        // since there is no room for words in an icon button.
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(t);
        sel.removeAllRanges();
        sel.addRange(range);
        btn.title = "Selected — press Ctrl+C";
      }
      setTimeout(() => {
        btn.innerHTML = ICON_COPY;
        btn.title = "Copy the whole log";
      }, 1500);
    };

    body.querySelector('[data-role="follow"]').onclick = () => setFollow(!ui.follow);
    body.querySelector('[data-role="tall"]').onclick = () => setTall(!ui.tall);
    const pick = body.querySelector('[data-role="pick"]');
    pick.onchange = e => {
      ui.pick[g.name] = e.target.value;
      openLog(e.target.value);
      render();
    };
    // Whatever arrived while the dropdown was open gets applied once it is not.
    pick.onblur = () => { if (pick.dataset.pending) render(); };

    // Choosing a build stops following. A reader who has deliberately gone back
    // to an earlier build does not want the live one scrolling in over it.
    // The live entry is the exception, and showBuild is where that is decided:
    // selecting the build that is running means "tail it", so that branch turns
    // following back on rather than inheriting the pause from the stored build
    // that was on screen a moment ago.
    const buildPick = body.querySelector('[data-role="build"]');
    buildPick.onchange = e => {
      const buildID = e.target.value;
      ui.build[g.current.preview_id] = buildID;
      showBuild(g.current.preview_id, buildID);
      updateOpenBuild(g.current.preview_id, buildID);
    };
    // Catch the picker up the moment the dropdown is released.
    //
    // updateBuildPicker refuses to rewrite this select while it has focus, because
    // rewriting one closes its open list under the pointer with no visible cause. The
    // cost is that a build which starts while the reader is holding the dropdown open
    // is missing from the list they are reading — they watch the build on the row,
    // look in the dropdown, and it is not there. Reloading the page was the only way
    // out, which is how this was reported. A blur re-render fixes it as they let go,
    // which is when they look; the one-second tick would do it eventually, and
    // "eventually" is what made it look broken.
    // render() rather than loadBuilds(id): the same round trip happens inside
    // updateBody, and going through render keeps this from depending on which preview
    // the closure captured when the row was first drawn.
    buildPick.onblur = () => render();
    body.querySelector(".term").addEventListener("scroll", () => {
      if (ui.autoScrolling) return;
      setFollow(atBottom());
    });
  }

  // Pin the selection on expand.
  //
  // Without this the picker had no stored choice and groups() re-derived it as
  // list[0] on every render — and that list is sorted by state, so a build
  // starting anywhere in the project made the new preview "first" and swapped
  // it into the dropdown under a reader who was part-way through a different
  // log. Opening a row is a choice; it should stick until the reader makes
  // another one, or closes the row.
  // Re-pinned rather than merely set, so a pin left pointing at a preview that
  // has since been torn down does not leave the selection floating again.
  // groups() already falls back to the newest when the pinned id is gone;
  // this makes that fallback stick.
  if (!g.list.some(p => p.preview_id === ui.pick[g.name])) {
    ui.pick[g.name] = g.current.preview_id;
  }

  updatePicker(body.querySelector('[data-role="pick"]'), g);

  // The build list changes when a build finishes, so refresh it on the render
  // that follows — cheap, and the alternative is a picker that never learns
  // about the build you are watching complete.
  loadBuilds(g.current.preview_id);

  const p = g.current;
  body.querySelector('[data-role="download"]').href =
    `/logs/${encodeURIComponent(p.preview_id)}/download`;

  // Cancel, only while this preview is actually building. The state comes from the same
  // status payload the row is drawn from, so the button appears and disappears with the
  // row's own pill rather than on its own schedule.
  // Reconnect when this preview starts building under a pane showing something else.
  //
  // The server does the load-bearing half: a stream opened while a build is queued waits
  // and announces it (Ingress.awaitLive), which is the Rebuild case and is deterministic.
  // This covers the other one — a *push* arriving while somebody has a finished build's
  // log open, where the stream closed at connect because nothing was coming yet.
  //
  // Guarded by the preview's own updated_at so it fires once per transition rather than on
  // every status tick: openLog's start event may arrive after the next tick, and a
  // condition that stayed true would reconnect in a loop.
  if (p.state === "building" && ui.logFor === p.preview_id && !ui.build[p.preview_id] &&
      ui.banner?.kind !== "live" && ui.reconnectedAt !== p.updated_at) {
    ui.reconnectedAt = p.updated_at;
    openLog(p.preview_id);
  }
  //
  // Queued counts as cancellable. A queued build has no context to cancel, so the daemon
  // takes it out of the queue instead — and a queue that cannot be emptied is the case
  // that matters most, since a build waiting behind a slow one is the reason somebody
  // wants to stop it.
  const building = p.state === "building" || p.state === "queued";
  const cancel = body.querySelector('[data-role="cancel"]');
  cancel.hidden = !building;
  cancel.textContent = p.state === "queued" ? "Cancel queued build" : "Cancel build";

  // Rebuild, when nothing is running. It queues the commit already on the row rather than
  // the branch tip: pushing is what builds the tip, and this is for the case a push cannot
  // fix — a bad cache entry, a timeout, an image since corrected, a project setting changed
  // under a preview nobody is pushing to.
  const rebuild = body.querySelector('[data-role="rebuild"]');
  rebuild.hidden = building;
  rebuild.title = p.commit
    ? `Build ${p.commit.slice(0, 7)} again`
    : "Build this preview's recorded commit again";
  rebuild.onclick = async () => {
    const label = rebuild.textContent;
    rebuild.disabled = true;
    rebuild.textContent = "…";
    try {
      await api("POST", `/api/builds/${encodeURIComponent(p.preview_id)}/rebuild`);
      // No alert on success: the row's own pill goes to Queued within a second, which is
      // better confirmation than a dialog to dismiss.

      // Move the pane to the live stream, and follow it.
      //
      // The selection is deliberately sticky — a reader part-way through an older build's
      // log must not be yanked to a newer one by a background event. But this is not a
      // background event: it is the reader asking for a build. Leaving the pin alone meant
      // Rebuild started a build that ran to completion while the pane showed a *different*
      // build's stored log and appeared to do nothing, which is exactly what it looked
      // like. An empty build id is the picker's value for "follow the live stream".
      ui.build[p.preview_id] = "";
      ui.pick[g.name] = p.preview_id;
      setFollow(true);
      openLog(p.preview_id);
      render();
    } catch (e) {
      toast(`Could not rebuild: ${e.message}`, "bad", e.message);
    } finally {
      rebuild.disabled = false;
      rebuild.textContent = label;
    }
  };
  // Unlink: remove this preview and stop rediscovering the pull request.
  //
  // Both halves matter and the confirmation says so. Removing alone is not what anybody
  // means by "I don't want this one" — the next delivery or the next project scan finds
  // the pull request again and builds it, which reads as the removal having failed.
  //
  // Hidden rather than greyed where the page cannot write. Every other control here acts
  // on a build; this one deletes a preview, its shares and its comment, and offering it
  // to a reader who will get a 403 teaches them to distrust the page.
  const unlink = body.querySelector('[data-role="unlink"]');
  unlink.hidden = !admin.projects;
  unlink.title = `Remove this preview and stop building ${p.branch} #${p.number}`;
  unlink.onclick = async () => {
    const yes = await ask({
      kind: "Unlink a pull request",
      what: `${p.branch} <span class="mono">#${p.number}</span>`,
      lede: `${esc(g.name)} — this pull request stops being built. A push, a webhook ` +
        `delivery and a project scan will all skip it.`,
      goes: [
        "The preview and its URL",
        "Every build's own URL",
        "Build logs and cached packages",
        "The comment on the pull request",
      ],
      keeps: [
        "The same URL, if you link it again",
        "A fresh comment on the next build",
        "Other pull requests on this repository",
        "The project, its settings and its webhook",
      ],
      note: `<b>Reversible.</b> Link it back from the Projects page — the card lists what ` +
        `it is not building, with a link beside each. The build history is the one thing ` +
        `that does not come back, so the first build after linking is a cold one.`,
      confirm: "Unlink",
    });
    if (!yes) return;
    const label = unlink.textContent;
    unlink.disabled = true;
    unlink.textContent = "…";
    try {
      await api("POST", `/api/builds/${encodeURIComponent(p.preview_id)}/unlink`);
      // The row goes away on the next status tick, which is the confirmation. The pane
      // is pinned to a preview that no longer exists, so let it go with the row.
      if (ui.logFor === p.preview_id) closeLog();
      render();
    } catch (e) {
      toast(`Could not unlink: ${e.message}`, "bad", e.message);
    } finally {
      unlink.disabled = false;
      unlink.textContent = label;
    }
  };

  cancel.onclick = async () => {
    const queued = p.state === "queued";
    const yes = await ask({
      kind: queued ? "Cancel a queued build" : "Cancel a running build",
      what: `${p.branch} <span class="mono">#${p.number}</span>`,
      lede: queued
        ? `${esc(g.name)} — this build has not started, so it is taken out of the queue.`
        : `${esc(g.name)} — the build is abandoned where it stands.`,
      goes: [
        queued ? "Its place in the queue" : "The work done so far",
        "Reported as failed on the pull request",
      ],
      keeps: [
        "The preview currently published",
        "Its URL, which keeps serving the last good build",
        "Rebuild, or a push, starts it again",
      ],
      note: `Nothing is deleted. This stops one build; the preview and everything about ` +
        `the pull request are untouched.`,
      confirm: queued ? "Cancel the build" : "Abandon the build",
    });
    if (!yes) return;
    const label = cancel.textContent;
    cancel.disabled = true;
    cancel.textContent = "…";
    try {
      const r = await api("POST", `/api/builds/${encodeURIComponent(p.preview_id)}/cancel`);
      // Not an error when nothing was running: this page can be a second out of date, and
      // a build that finished between the render and the click is not a failure.
      if (!r.cancelled) toast("That build had already finished.");
    } catch (e) {
      toast(`Could not cancel: ${e.message}`, "bad", e.message);
    } finally {
      cancel.disabled = false;
      cancel.textContent = label;
    }
  };

  // The pull request link lives on the row, not here — see updateRowPR.


  // The preview link lives on the row, not here. See updateGoLink.

  // Three cases, and the middle one is the bug this replaced.
  //
  // A filter that hides a project removes its row; clearing the filter builds a
  // fresh one, so the <pre> is new and empty. `ui.logFor` still names the same
  // preview, so the old test — reopen only when the preview changed — did
  // nothing, and the pane sat blank until you collapsed and reopened it. That
  // is what "no logs show" was.
  if (ui.logFor !== p.preview_id) {
    openLog(p.preview_id);
  } else if (fresh) {
    // Same preview, new element. Repaint from the buffer rather than
    // reconnecting, which would replay the whole log from the top.
    const t = body.querySelector(".term");
    t.innerHTML = ui.buffer;
    if (ui.follow) t.scrollTop = t.scrollHeight;

    // The banner is part of the pane and goes with it.
    if (ui.banner) banner(ui.banner.kind, ui.banner.text);

    // A stream that has already ended leaves nothing to reconnect to, but an
    // empty buffer with no stream means the log was never read.
    if (!ui.logSource && !ui.buffer) openLog(p.preview_id);
  }
}

function updatePicker(sel, g) {
  const sig = g.list.map(p => `${p.preview_id}:${p.state}:${pickerWhen(p)}`).join("|");

  // A <select> being rewritten while its dropdown is open closes it, with no
  // visible cause — you reach for an older preview, a build finishes somewhere
  // else, and the list vanishes out from under the pointer. There is no DOM
  // event for "the dropdown is open", but focus is a good enough proxy: a
  // select only opens when focused. Defer instead, and apply on the way out.
  if (document.activeElement === sel) {
    sel.dataset.pending = sig;
    return;
  }
  delete sel.dataset.pending;

  if (sel.dataset.sig !== sig) {
    sel.dataset.sig = sig;
    sel.innerHTML = g.list.map(p =>
      `<option value="${esc(p.preview_id)}">` +
      `${esc(p.branch)} · #${p.number} · ${esc(state(p.state).label)} · ${esc(pickerWhen(p))}` +
      `</option>`).join("");
  }
  sel.value = g.current.preview_id;
  sel.disabled = g.list.length < 2;
}

function clearFilters() {
  ui.state = null; ui.project = ""; ui.query = "";
  document.getElementById("search").value = "";
  render();
}

/* ── Log ──────────────────────────────────────────────────────────────── */

const term = () => document.querySelector(".item.open .term");

// banner labels the log pane: what you are looking at, and whether it is moving.
function banner(kind, text) {
  ui.banner = {kind, text};
  const el = document.querySelector(".item.open .logstate");
  if (el) {
    el.className = "logstate " + kind;
    el.textContent = text;
  }
}

// explainEmptyPane puts the reason there is nothing to read where the log would be.
//
// The alternative, which is what this replaces, is a banner in 0.72rem grey above an
// empty black terminal — and for a skipped build that is every signal except the useful
// one. The daemon already knows why it skipped; it tells the pull request. This shows the
// same sentence to whoever is looking at the dashboard instead.
//
// Also called for a log retention pruned, which is a different fact and says so: the
// build happened, its output is simply not kept any more.
function explainEmptyPane(previewID, commit, kind) {
  const t = term();
  if (!t) return;

  // The reason travels on the activity entry for that commit, and on the preview row
  // for its newest build. Prefer the entry: it is the one the reader clicked.
  const ev = (ui.events || []).find(e =>
    e.preview_id === previewID && e.commit === commit && e.message);
  const p = (ui.previews || []).find(x => x.preview_id === previewID);
  const why = ev?.message || (p && p.commit === commit ? p.reason : "") || "";

  const heads = {
    skipped: "This build was skipped, so there is no log.",
    queued: "Queued. Nothing has run yet.",
    building: "Building. Output will appear here as it is written.",
  };
  const head = heads[kind] || `No build log was kept for ${commit}.`;
  const tail = heads[kind]
    ? ""
    : `<span class="why">Logs are kept for <code>build.keep_logs</code>, which is shorter
       than the history in the activity rail — so an entry can outlive what it produced.</span>`;

  t.className = "term empty";
  // The reason is its own block. Concatenated onto the heading it read as one run-on
  // sentence: "This build was skipped, so there is no log.no documentation changes".
  t.innerHTML = `<strong>${esc(head)}</strong>` +
    (why ? `<div class="reason">${esc(why)}</div>` : "") + tail;
  ui.buffer = "";
}

// resetPane puts the terminal back to being a terminal.
function resetPane() {
  const t = term();
  if (!t) return;
  t.className = "term" + (ui.tall ? " tall" : "");
  t.innerHTML = "";
}

function toggle(name) {
  if (ui.open === name) {
    // Collapsing releases the pin, so reopening later lands on whatever is
    // newest then rather than on a preview chosen minutes ago.
    delete ui.pick[name];
    closeLog();
    ui.open = null;
    render();
    return;
  }
  closeLog();
  ui.open = name;
  ui.follow = true;
  render();
}

function closeLog() {
  if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
  ui.logFor = null;
  ui.buffer = "";
}

// liveBuild reports whether a build id names the build that is running right now.
//
// The picker's empty value is the ordinary way to say "follow the live stream", and
// index 0 taking that value is what makes it work. This asks the same question of an
// id, because every path into showBuild that resolves a build to its id can hand
// over the running one — and answering that with a download is answering with a file
// the build is still appending to. It shows the log as far as it had got and then
// never changes again, which is indistinguishable from a stream that died.
//
// Deliberately not "stream whenever something is running". `/logs/{preview}/stream`
// serves whichever build is *current*, not the build asked for, so following it for
// any other id would put one build's output on screen under another build's label —
// the exact confusion the per-build download exists to prevent. Only the newest
// build can be the live one: buildlog.Store.List is newest-first by mtime and the
// running build's log is the file being written to, so anything below index 0 is
// finished by construction.
//
// The state comes from the list rather than from the preview's own state, because a
// preview reads "building" for a build that superseded the one being looked at.
function liveBuild(previewID, buildID) {
  const builds = ui.builds[previewID] || [];
  return !!buildID && builds[0]?.build_id === buildID && isLive(builds[0].state);
}

// Exactly one stream is open at a time — the one behind the expanded row.
// Nothing is fetched for a collapsed project. Several at once would mean N
// server-sent-event connections from one tab, and browsers cap concurrent
// connections per origin, so the sixth would hang with no visible reason.
// showBuild renders one stored build's log, in place of the live stream.
//
// A download rather than a stream: a finished build is a file, and the stream
// endpoint always replays whichever build is current. Following is turned off
// because a reader who deliberately went back to an earlier build does not want
// the live one scrolling in over it.
async function showBuild(previewID, buildID) {
  if (!buildID || liveBuild(previewID, buildID)) {
    // Following goes back on, and this branch is the one place it must.
    //
    // Every other route through this function is a reader stepping back to a build
    // that has finished, which turns following off deliberately. Asking for the live
    // build is the opposite request — "show me what is happening" — and it used to
    // inherit the paused state left behind by whichever stored build was on screen
    // before it. The stream opened, the lines arrived, and the viewport never moved:
    // the log appeared to stop at the exact instant it was selected, with the rest
    // piling up below the fold. That is the whole of "the black log is NOT
    // updated/tailing properly", and it is why this is a separate concern from
    // opening the stream at all — tools/dashboardtest/logtail.mjs asserts both.
    setFollow(true);
    openLog(previewID);
    return;
  }

  if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
  ui.logFor = previewID;
  setFollow(false);
  banner("past", `build ${buildID} — not live`);

  const t = term();
  if (t) t.innerHTML = "";
  ui.buffer = "";

  try {
    const res = await fetch(
      `/logs/${encodeURIComponent(previewID)}/download/${encodeURIComponent(buildID)}`);
    if (toLoginIf(res)) return;
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const text = await res.text();
    for (const line of text.split("\n")) appendLog(line);
  } catch (e) {
    banner("none", `could not read build ${buildID}: ${e.message}`);
  }
}

// loadBuilds fetches the build list for a preview and repopulates the picker.
//
// Fetched on demand rather than folded into /status, because a status payload
// carrying every build of every preview would grow without bound on a busy
// repository and be re-sent on every state change.
async function loadBuilds(previewID) {
  try {
    const res = await fetch(`/logs/${encodeURIComponent(previewID)}`);
    if (toLoginIf(res) || !res.ok) return;
    const d = await res.json();
    ui.builds[previewID] = d.logs || [];
    updateBuildPicker(previewID);
  } catch { /* the picker stays as it was */ }
}

// updateBuildPicker rewrites the build dropdown for a preview.
function updateBuildPicker(previewID) {
  const sel = document.querySelector('.item.open [data-role="build"]');
  if (!sel) return;

  const builds = ui.builds[previewID] || [];
  // Deferred while open, for the same reason the preview picker is: rewriting a
  // select that is open closes it with no visible cause.
  if (document.activeElement === sel) return;

  // Shown from the first build, not the second.
  //
  // It was hidden below two entries on the reasoning that a one-item picker is
  // useless. That was wrong: the entry carries the outcome and the age, so with
  // one build it is not a picker at all, it is the only place the dashboard says
  // whether that build succeeded. Hiding it left a failed build with no visible
  // result beside the row.
  sel.hidden = builds.length === 0;
  if (builds.length === 0) return;

  // No separate "latest" row. The newest build *is* the latest, so a synthetic
  // entry above it said the same thing twice and made the list one longer than
  // the number of builds.
  //
  // It keeps the empty value, which is what means "follow the live stream" rather
  // than "download this file" — the newest build's log is still being written
  // while it runs, so reading it as a file would show a truncated copy that never
  // updates.
  const current = ui.build[previewID] || "";
  // How long each build took, beside its outcome. The relative age answers "when", and
  // "how long" is the other half of the question anybody asks after watching a package
  // install for four minutes — and it is the number that shows a cache going cold.
  sel.innerHTML = builds.map((b, i) =>
    `<option value="${i === 0 ? "" : esc(b.build_id)}">` +
    // A running build has no duration to report yet, so its age becomes the
    // stopwatch — "running · 04m 12s" — and the `took` clause appears once it has
    // actually taken something.
    `${buildIcon(b)} ${esc(buildLabel(b))} · ${esc(b.build_id)} · ` +
    // started_at, not mod_time: mod_time is the log file's, which advances with every
    // line the build writes, so a stopwatch driven from it would read a few seconds
    // old for the whole build.
    // No duration here. It was a third fact on every option — outcome, id, age, took —
    // and a picker of five builds became five unreadable lines. The banner under the
    // picker says how long the selected build took, where it costs no width.
    `${esc(isLive(b.state) ? elapsed(b.started_at || b.mod_time) : stamp(b.mod_time))}` +
    `</option>`).join("");
  sel.value = current;

  updateOpenBuild(previewID, current);
}

// updateOpenBuild points the second Open at the selected build's own share.
//
// Greyed rather than hidden when that build has none. Hidden, the control would
// come and go as the picker moved and read as a rendering fault; greyed with a
// reason reads as the fact it is. A build has no share of its own when it failed,
// when it predates per-build publishing, or when creating the share did not work —
// the branch share is the contract and this one is best effort.
function updateOpenBuild(previewID, buildID) {
  const a = document.querySelector('.item.open [data-role="open-build"]');
  if (!a) return;

  const builds = ui.builds[previewID] || [];
  // The empty value means "the newest build", which is what the picker uses for it
  // so the live stream stays selectable.
  const b = buildID ? builds.find(x => x.build_id === buildID) : builds[0];
  const url = safeURL(b && b.url);

  if (url) {
    a.href = url;
    a.title = url;
  } else {
    a.removeAttribute("href");
    a.title = b
      ? "this build has no URL of its own — open the branch instead"
      : "no build selected";
  }
}

// buildIcon and buildLabel describe how a build ended.
//
// The icons match the row states so one glance means the same thing in both
// places, and the word is there too — an emoji alone is unreadable to a screen
// reader and ambiguous at a glance between "failed" and "cancelled".
//
// A build with no recorded state predates the builds table or had its row pruned
// before its log. The log is still readable, so it is listed as unknown rather
// than hidden.
function buildIcon(b) {
  switch (b.state) {
    case "ready":    return "✅";
    case "failed":   return "❌";
    case "building": return "🔨";
    case "queued":   return "⏳";
    case "skipped":  return "⏭️";
    default:         return "•";
  }
}

function buildLabel(b) {
  switch (b.state) {
    case "ready":    return "succeeded";
    case "failed":   return "failed";
    case "building": return "running";
    case "queued":   return "queued";
    case "skipped":  return "skipped";
    default:         return "unknown";
  }
}

function openLog(previewID) {
  if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
  ui.logFor = previewID;
  ui.buffer = "";
  banner("none", "connecting…");

  // Back to being a terminal. Without this, opening a preview that has output after one
  // that had none leaves the pane in its prose styling and the first lines arrive in the
  // wrong font on the wrong background.
  resetPane();

  const src = new EventSource(`/logs/${encodeURIComponent(previewID)}/stream`);
  ui.logSource = src;

  // The server says up front whether this is a live build or a replay, and
  // which build the replay is. Without it a queued row showed a completed log
  // with nothing marking it as the previous build's — so the row said Queued
  // and the pane looked like it had already done the work.
  src.addEventListener("start", e => {
    let d = {};
    try { d = JSON.parse(e.data) || {}; } catch {}

    // Clear the pane on every start, not only the first.
    //
    // One connection can announce twice. Press Rebuild and the stream opens while the build
    // is still queued: the server replays the *previous* build, says done, then waits and
    // sends a second start when the new build begins. Without this, the new output appended
    // below the old log and its "— end of log —" line, so the pane showed two builds
    // spliced together under a banner that flipped halfway down. Which is what "not tailing
    // properly" looked like.
    //
    // Safe on the first start too: it arrives before any line, so there is nothing to lose.
    resetPane();
    ui.buffer = "";

    if (d.live) {
      banner("live", "streaming this build");
    } else {
      // The duration goes here rather than in the build picker's options, where it was
      // a third fact on every line and made the dropdown unreadable.
      banner("past", `previous build${d.build_id ? " · " + d.build_id : ""} — ` +
        `nothing is running${d.seconds ? ` · took ${secs(d.seconds)}` : ""}`);
    }
  });

  src.addEventListener("line", e => appendLog(e.data));
  src.addEventListener("done", e => {
    let d = {};
    try { d = JSON.parse(e.data) || {}; } catch {}

    if (d.reason) {
      // "no build log" and "log unreadable" arrive with no start event, so the banner is
      // still whatever the last preview left. Both the banner and the pane say it: the
      // banner is 0.72rem grey, and on its own above an empty black terminal it reads as
      // a page that failed to load rather than as an answer.
      banner("none", d.reason);
      const p = (ui.previews || []).find(x => x.preview_id === previewID);
      explainEmptyPane(previewID, p?.commit || "", p?.state === "skipped" ? "skipped" : "");
    } else if (!d.live) {
      appendLog("\n— end of log —");
    } else {
      // A build that finished while being watched. The banner said "live" a
      // moment ago and would keep saying it.
      banner("past", "this build finished");
      appendLog("\n— end of log —");
    }

    src.close();
    if (ui.logSource === src) ui.logSource = null;
  });
  // EventSource retries on its own; closing here stops it reconnecting to a
  // log that has already ended.
  src.onerror = () => { src.close(); if (ui.logSource === src) ui.logSource = null; };
}

// Only three cases, all structural rather than interpreting the tool's own
// output: the command being run, something that looks like an error, and a
// redaction — highlighted deliberately, so redaction is visibly happening
// rather than silently assumed.
function logLine(text) {
  const safe = esc(text);
  if (/^\$ /.test(text)) return `<span class="cmd">${safe}</span>`;
  if (/(^|\s)(ERR!|ERROR|error:|failed|FAIL)/.test(text)) return `<span class="err">${safe}</span>`;
  return safe.replace(/\*{5}/g, '<span class="mask">*****</span>');
}

// 40px of slack: a scroll position is fractional and a bottom test that demands
// equality is false as often as it is true.
function atBottom() {
  const t = term();
  return !t || t.scrollHeight - t.scrollTop - t.clientHeight < 40;
}

function setFollow(on) {
  ui.follow = on;
  const b = document.querySelector('.item.open [data-role="follow"]');
  if (b) {
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "Following" : "Paused";
  }
  const t = term();
  if (on && t) t.scrollTop = t.scrollHeight;
}

function setTall(on) {
  ui.tall = on;
  const b = document.querySelector('.item.open [data-role="tall"]');
  const t = term();
  if (b) {
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "Shrink" : "Expand";
  }
  if (t) {
    t.classList.toggle("tall", on);
    if (ui.follow) t.scrollTop = t.scrollHeight;
  }
}

function appendLog(text) {
  const html = logLine(text) + "\n";
  ui.buffer += html;

  const t = term();
  if (!t) return;
  // A line arriving into a pane that is currently an explanation — a build that was
  // skipped and is now being rebuilt — turns it back into a terminal first, or the output
  // lands under prose in the wrong font.
  if (t.classList.contains("empty")) {
    resetPane();
    ui.buffer = html;
  }
  t.insertAdjacentHTML("beforeend", html);

  if (!ui.follow) return;
  // Guard the scroll handler against our own write, which would otherwise read
  // as the reader scrolling and flip Following off mid-stream.
  ui.autoScrolling = true;
  t.scrollTop = t.scrollHeight;
  requestAnimationFrame(() => { ui.autoScrolling = false; });
}

/* ── Activity rail ────────────────────────────────────────────────────── */

// Only the kinds actually present get a button, and each carries its count.
// A row of five filters where four are always empty is four things to read and
// discount every time you look at the rail.
function renderFeedFilters(events) {
  const counts = new Map();
  for (const e of events) counts.set(e.kind, (counts.get(e.kind) || 0) + 1);

  const kinds = ORDER.filter(k => counts.has(k))
    .concat([...counts.keys()].filter(k => !ORDER.includes(k)).sort());

  const el = document.getElementById("feed-filters");
  const sig = kinds.map(k => `${k}:${counts.get(k)}`).join("|") + `|${ui.kind}`;
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;

  if (kinds.length === 0) { el.innerHTML = ""; return; }

  el.innerHTML =
    `<button data-k="" aria-pressed="${ui.kind === null}">All <span class="c">${events.length}</span></button>` +
    kinds.map(k => {
      const s = state(k);
      return `<button data-k="${esc(k)}" aria-pressed="${ui.kind === k}">` +
             `<span class="dot" style="--edge:${s.color}"></span>${esc(s.label)} ` +
             `<span class="c">${counts.get(k)}</span></button>`;
    }).join("");

  for (const b of el.querySelectorAll("button")) {
    b.onclick = () => {
      const k = b.dataset.k || null;
      ui.kind = (ui.kind === k) ? null : k;
      renderEvents();
    };
  }
}

// collapse drops the queued and building entries of an attempt that has finished.
//
// The feed records every state transition, so one build leaves "queued",
// "building" and "ready" behind. That reads wrong: a row saying **Queued** four
// minutes ago, with the same word and the same coloured dot a live queued row
// uses, looks like a job that is stuck. It is a fact about the past written in
// the present tense.
//
// So an attempt's non-terminal entries are dropped once that attempt reached a
// terminal state, and kept while it has not — a build actually queued or building
// right now still has its row, which is when that row is worth anything.
//
// Grouped by preview *and* commit, not by preview: two attempts of one pull
// request are two builds, and collapsing them together would hide the older one's
// outcome. Dropped rather than merged into one row with a duration, because the
// timestamps are the history and a synthesised row has no honest one.
//
// The kind filter bypasses this. Picking "queued" is asking for exactly what was
// hidden, and answering with nothing would be a filter that lies.
//
// One pass, newest first, which is the order the daemon sends. A non-terminal entry
// is dropped only when a *newer* terminal entry for the same attempt has already
// been seen. Collecting every terminal key up front instead — the first version of
// this — dropped a queued entry whose terminal entry was older, so re-running a
// commit that had already finished lost the row saying the new attempt was waiting.
// That row is the one thing somebody watching a rebuild is looking for.
function collapse(events) {
  // One row per attempt, showing where that attempt has got to. Not a history of
  // every state it passed through.
  //
  // This used to drop only the *non-terminal* entries of a settled attempt, which
  // left one row per terminal event — so a commit that failed and was then rebuilt
  // successfully kept both, and the feed grew a row every time anything was
  // re-attempted. Reported as "i don't want n entries for queued, building,
  // success|fail": the row is supposed to change from queued to building to its
  // outcome, in place.
  //
  // Newest wins, and the events arrive newest first, so the first entry seen for a
  // key is the one kept. That is also what makes the row appear to change state:
  // each poll replaces it with whatever is newest for the same attempt.
  //
  // Keyed by preview *and* commit, so two commits are two rows — which is the
  // distinction a reader actually wants, "which push was this". What it gives up is
  // the older outcomes of one commit rebuilt several times. Those are not lost: the
  // build picker on the row lists every attempt with its own log, which is the
  // surface built for that question. A feed that answered it too was answering it
  // worse and costing every other row its place.
  const seen = new Set();
  const out = [];
  for (const e of events) {
    const key = `${e.preview_id}|${e.commit}`;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(e);
  }
  return out;
}

function renderEvents() {
  const el = document.getElementById("events");

  // The top counters deliberately do not apply here. The feed is a history, and
  // narrowing it to "ready" would hide the queued and building rows that led
  // there — so it gets its own kind filter. The project filter and the search
  // box do apply, and expanding a project narrows the feed to it, which is what
  // makes the rail worth its width instead of scrolling past unrelated noise.
  const only = ui.open || ui.project;
  const scoped = (ui.events || []).filter(e => {
    if (only && project(e) !== only) return false;
    if (!ui.query) return true;
    return `${project(e)} ${e.branch} ${prLabel(e)}`.toLowerCase().includes(ui.query);
  })
    // Sorted by time here, rather than trusting the order the daemon sent.
    //
    // The feed is a ring buffer and its order is *insertion*, which is the same thing as time
    // only while every event arrives as it happens. It does not: the history is reloaded from
    // the builds table at startup, and a startup scan then appends builds of its own — so a
    // restart could put an event from 07:19 above one from 07:48, which is what was reported.
    //
    // Newest first, and collapse() below depends on that: it keeps the first entry it sees for
    // an attempt, so "first" has to mean "newest" or a row would settle on a stale state.
    .sort((a, b) => new Date(b.at) - new Date(a.at));

  document.getElementById("feed-scope").textContent = only ? only : "all projects";
  renderFeedFilters(scoped);

  const shown = ui.kind ? scoped.filter(e => e.kind === ui.kind) : collapse(scoped);

  if (shown.length === 0) {
    el.innerHTML = `<div class="empty">Nothing yet.</div>`;
    return;
  }

  // An entry is a button only while there is something left to show, and inert
  // text once there is not. A link that looks live and goes nowhere is worse than
  // one that never offered.
  //
  // The server decides. It used to be "does the preview still exist", checked here,
  // which was the right question only while a preview had exactly one build: now
  // retention prunes older builds, so an entry can name a live preview and a build
  // that is gone. Only the daemon knows what is still on disk — see markOpenable.
  //
  // The preview check stays as well, because an entry whose preview has been torn
  // down cannot be revealed no matter what the server says about its build.
  const reachable = e =>
    e.openable && e.preview_id && ui.previews.some(p => p.preview_id === e.preview_id);


  el.innerHTML = shown.map(e => {
    const s = state(e.kind);
    const go = reachable(e);

    // The commit, because it is what distinguishes one entry from the next.
    // Without it a branch built eight times produced eight rows reading
    // "docpreview#3 / next-fixes-3 — ready", identical apart from the clock, and
    // the one thing a reader wants — which push was this — was the one thing the
    // feed had and did not show.
    //
    // The message is gone from the row.
    //
    // It was kept whenever it said more than the label — "ready in 24s", a skip
    // reason, a failure summary — on the reasoning that those three are worth a
    // line. In practice the useful ones are rare and the row paid for them on every
    // entry: "nearly never useful", and it is the widest thing in a rail 21rem wide.
    //
    // Not deleted, moved: it is the row's tooltip, so the one entry in fifty where it
    // matters still has it, and a failure's real detail was never here anyway — that
    // is the build log, which is what clicking the entry opens.
    const detail = [
      // Not repeated when the label above already is the branch. A branch preview's
      // label is "@main", so the row read "docusaurus-shared@main main · c251f11" — the
      // same word twice, in a rail where width is the scarce thing. A pull request's
      // label is "#21" and its branch is new information, so that one stays.
      e.branch && e.branch !== prLabel(e).slice(1) ? `<code>${esc(e.branch)}</code>` : "",
      // The copy control sits on the commit rather than the row, because the commit
      // is what anybody wants out of here — a sha to paste into a terminal or a
      // message. Copying the whole row would give them the clock and the branch too
      // and make them edit it back down.
      e.commit
        ? `<code>${esc(e.commit)}</code><button class="evcopy" data-copy="${esc(e.commit)}"
             type="button" title="Copy ${esc(e.commit)}"
             aria-label="Copy commit ${esc(e.commit)}">${ICON_COPY}</button>`
        : "",
    ].filter(Boolean).join(" · ");

    const inner = `
      <div class="t">${clock(e.at)}</div>
      <div>
        <div class="l1">
          <span class="dot"></span>
          <span class="k">${esc(s.label)}</span>
          <span class="l2">${esc(project(e))}${esc(prLabel(e))}</span>
        </div>
        <div class="l2">${detail}</div>
      </div>`;

    const sel = ui.evPick === e.at ? " sel" : "";

    // A div with role=button, not a <button>.
    //
    // Two things a real button made impossible. Text inside one cannot be selected,
    // so the commit on screen could be read and not copied — and the commit is the
    // one string anybody wants out of this rail, to paste into a terminal or a
    // message. And a button cannot contain a button, so there was nowhere to put a
    // copy control.
    //
    // The cost is doing by hand what the element gave for free: role, tabindex, and
    // Enter/Space in the keydown handler below. Worth it for a rail whose whole
    // purpose is telling you which commit did what.
    // The message, where it costs no width. Dropped from the row above; a reader who
    // wants the one line in fifty that says something can hover for it.
    const note = e.message && e.message.toLowerCase() !== s.label.toLowerCase()
      ? e.message : "";

    if (!go) {
      return `<div class="ev${sel}" style="--edge:${s.color}"
                   title="${esc(note ? note + " — " : "")}nothing left to open, this build has been cleaned up">${inner}</div>`;
    }
    return `<div class="ev linked${sel}" role="button" tabindex="0"
                 style="--edge:${s.color}" data-id="${esc(e.preview_id)}"
                 data-commit="${esc(e.commit || "")}" data-at="${esc(e.at)}"
                 data-kind="${esc(e.kind)}" ${sel ? 'aria-current="true"' : ""}
                 title="${esc(note ? note + " — " : "")}Show this build's log">${inner}</div>`;
  }).join("");

  for (const b of el.querySelectorAll(".ev.linked")) {
    const open = () => reveal(b.dataset.id, b.dataset.commit, b.dataset.at, b.dataset.kind);
    b.onclick = ev => {
      // A click that landed on the copy button, or on a selection the reader is
      // making, is not a request to open anything.
      if (ev.target.closest(".evcopy")) return;
      if (!window.getSelection().isCollapsed) return;
      open();
    };
    // What role=button costs: the keyboard behaviour a real button had for free.
    b.onkeydown = ev => {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      ev.preventDefault();
      open();
    };
  }

  for (const c of el.querySelectorAll(".evcopy")) {
    c.innerHTML = ICON_COPY;
    c.onclick = async ev => {
      // Or the row underneath opens as well, which is not what reaching for a copy
      // button means.
      ev.stopPropagation();
      try {
        await navigator.clipboard.writeText(c.dataset.copy);
        c.innerHTML = ICON_CHECK;
        c.title = "Copied";
      } catch {
        // clipboard needs a secure context; http://127.0.0.1 qualifies but a
        // tunnelled http:// origin does not. Selecting the text still works, which
        // is why the row is no longer a button.
        c.title = "could not copy — select the text instead";
      }
      setTimeout(() => { c.innerHTML = ICON_COPY; c.title = `Copy ${c.dataset.copy}`; }, 1500);
    };
  }
}

// reveal opens the build an activity entry names.
//
// Clearing the filters first is the point of the whole thing: the entry you
// clicked may well be hidden by the state filter or the search box you set
// three minutes ago, and expanding a row that is not on screen looks like
// nothing happened at all.
//
// The commit matters as much as the preview, and used to be ignored. Every
// preview of one repository lands in a single group, so clicking an entry only
// changed which preview was picked inside a row that was usually already open —
// and clicking an entry for the preview already showing did nothing at all,
// while the button's own tooltip promised to open that build. Selecting the
// build the entry names is what the tooltip always said this did.
function reveal(previewID, commit, at, kind) {
  const p = ui.previews.find(x => x.preview_id === previewID);
  if (!p) return;

  const name = project(p);

  // Set before render, so the feed draws the mark in the same pass.
  ui.evPick = at || null;

  ui.state = null;
  ui.query = "";
  document.getElementById("search").value = "";
  // The project filter is left alone when it already admits this project, so
  // clicking within a project you deliberately narrowed to does not widen it.
  if (ui.project && ui.project !== name) ui.project = "";

  if (ui.open !== name) {
    closeLog();
    ui.open = name;
    ui.follow = true;
  }
  // Pin the preview the entry named, not whichever is newest.
  ui.pick[name] = previewID;

  render();

  const item = document.querySelector(`.item[data-project="${CSS.escape(name)}"]`);
  if (item) {
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    item.scrollIntoView({block: "nearest", behavior: still ? "auto" : "smooth"});
    // Always something visible, even when the click changed no state — the row was
    // already open on this preview and this build. Silence is indistinguishable
    // from a broken button.
    flash(item);
  }

  if (commit) selectBuildForCommit(previewID, commit, kind);
}

// selectBuildForCommit points the build picker at the build an activity entry names.
//
// Matched on the build id's suffix, because a build id is
// "<date>-<time>-<short sha>" and the event carries only the sha. The newest build
// takes the empty value rather than its own id: empty means "follow the live
// stream", and the newest build's log is still being written while it runs, so
// selecting it by id would read a truncated file that never updates.
//
// The list may not have arrived yet — it is fetched per preview — so this loads it
// rather than silently doing nothing on the first click of a row for a preview
// nobody has opened yet.
//
// Two ways there is no build to select, and they must not be treated alike.
//
// A build that is queued or running has no log file yet, and the live stream *is*
// that build — so that falls through to the stream, and clicking a building row
// shows the build running. Anything else with no log file has none to show: a
// skipped build never writes one, and an old one may have been pruned. Falling
// through there silently swapped in the newest build's log, so the picker moved
// while the pane did not change — which is precisely how this was reported. Say so
// instead.
async function selectBuildForCommit(previewID, commit, kind) {
  if (!ui.builds[previewID]) await loadBuilds(previewID);

  const builds = ui.builds[previewID] || [];
  const i = builds.findIndex(b => b.build_id.endsWith("-" + commit));

  if (i < 0) {
    if (kind === "queued" || kind === "building") {
      ui.build[previewID] = "";
      updateBuildPicker(previewID);
      showBuild(previewID, "");
      return;
    }
    // Nothing to show, and the pane must not keep implying otherwise. Cleared
    // rather than left alone: leaving the previous build on screen under a banner
    // about a different one is the most confusing of the three options.
    if (ui.logSource) { ui.logSource.close(); ui.logSource = null; }
    // The explanation goes in the pane, not only in the banner above an empty black
    // rectangle 15rem tall. For a skipped build the banner said "no build log", which is
    // true and is not the fact anybody wants.
    explainEmptyPane(previewID, commit, kind);
    banner("none", kind === "skipped" ? "skipped — nothing was built"
      : `no log kept for ${commit}`);
    return;
  }

  // The newest build takes the picker's empty value rather than its own id: empty
  // means "follow the live stream", and its log is still being written while it
  // runs, so selecting it by id would read a truncated file that never updates.
  const buildID = i === 0 ? "" : builds[i].build_id;
  ui.build[previewID] = buildID;
  updateBuildPicker(previewID);
  showBuild(previewID, buildID);
}

// flash marks an element as just-acted-on.
//
// The class is removed on animation end rather than by a timer, so a second click
// during the animation restarts it instead of being swallowed.
function flash(el) {
  el.classList.remove("flash");
  // Forces a reflow, without which removing and re-adding in one frame is a no-op
  // and a repeated click produces no animation at all.
  void el.offsetWidth;
  el.classList.add("flash");
  el.addEventListener("animationend", () => el.classList.remove("flash"), {once: true});
}

/* ── Setup panel ──────────────────────────────────────────────────────────
   The credential surface. It exists because the alternative was three terminal
   commands in the right order, and getting them wrong leaves a daemon that
   starts and cannot open its own vault.

   It never displays a value. The server has no endpoint that returns one. */

const setupEl = () => document.getElementById("setup");

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? {"Content-Type": "application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (toLoginIf(res)) return {};
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch {}
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

/* Which secret group is expanded — at most one, and none to begin with.

   An accordion rather than independent toggles: these are three lists of the same shape,
   and the question being answered is always "which kind am I looking at". Two open at
   once puts a credential and a build variable back on one screen, which is the thing the
   grouping exists to stop.

   Held outside renderSetup because the panel rebuilds its markup on every save, so state
   in the DOM does not survive an action taken inside it — collapse a group, save a token,
   and it springs open again.

   Not `<details name="...">`, which is the native accordion: it is recent enough that the
   jsdom harness does not implement it, so the behaviour would be untestable here and
   silently absent in an older browser. Nine lines of JavaScript work everywhere. */
let secOpen = null;

/* toggleExpand swaps a one-line value box for a multi-line one, and back.

   A PEM is thirty lines and does not fit in an input, and the credential page already
   special-cases `private_key` into a textarea by name — which only works for the keys this
   code knows about. This is the same affordance for every value field, including a
   project's own variables, where a certificate or a key is just as plausible.

   The element is replaced rather than a second one being rendered hidden beside it: two
   boxes for one value means deciding which is authoritative on every read, and the save
   handlers would each have to know. Replacing keeps one field with one id.

   An expanded box is **not masked**, because there is no multi-line masked control — a
   textarea has no type=password. The button says so, and it is the reason expanding is a
   deliberate action rather than the default. */
function toggleExpand(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;

  const wasArea = el.tagName === "TEXTAREA";
  const next = document.createElement(wasArea ? "input" : "textarea");
  next.id = id;
  next.className = el.className;
  next.value = el.value;
  next.autocomplete = "off";
  next.spellcheck = false;
  if (el.placeholder) next.placeholder = el.placeholder;
  if (wasArea) {
    next.type = "password";
  } else {
    next.rows = 8;
  }
