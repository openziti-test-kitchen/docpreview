<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docpreview</title>
<style>
/* Surfaces, ink and the status palette come from a validated set. Dark mode is
   stepped deliberately rather than inverted, because an inverted palette puts
   saturated hues on a dark surface where they vibrate. */
:root {
  --plane:    #f9f9f7;
  --surface:  #fcfcfb;
  --raised:   #ffffff;
  --ink:      #0b0b0b;
  --ink-2:    #52514e;
  --muted:    #898781;
  --hairline: #e1e0d9;
  --ring:     rgba(11,11,11,0.10);

  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;
  --idle:     #898781;

  --term-bg:  #14140f;
  --term-fg:  #d8d6cc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --plane:    #0d0d0d;
    --surface:  #1a1a19;
    --raised:   #222220;
    --ink:      #ffffff;
    --ink-2:    #c3c2b7;
    --hairline: #2c2c2a;
    --ring:     rgba(255,255,255,0.10);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 0 3rem;
  background: var(--plane); color: var(--ink);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
h1 { font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; font-weight: 650; }
h2 {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted); margin: 0 0 0.6rem; font-weight: 600;
}
h2 span { color: var(--ink-2); text-transform: none; letter-spacing: 0 }

/* ── Top bar ──────────────────────────────────────────────────────────────
   One horizontal strip instead of a grid of tiles. The counts are the same
   numbers; they just stop claiming a quarter of the first screen. */
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hairline);
}
.topbar .row {
  max-width: 96rem; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: 0.7rem 1.25rem;
}
.brand { display: flex; align-items: baseline; gap: 0.6rem; }
.brand .sub { color: var(--muted); font-size: 0.78rem; }
.grow { flex: 1 }

/* Segmented counters. A shared border and one radius on the ends reads as a
   single control — which it is: picking one deselects the others. */
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 0.8rem; line-height: 1;
  background: var(--surface); color: var(--ink-2);
  border: 0; border-left: 1px solid var(--ring);
  padding: 0.45rem 0.75rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.42rem; white-space: nowrap;
}
.seg button:first-child { border-left: 0 }
.seg button:hover { background: var(--raised) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--plane) }
.seg button[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px color-mix(in srgb, var(--plane) 35%, transparent) }
.seg .n { font-variant-numeric: tabular-nums; font-weight: 650 }
.seg .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--edge, var(--idle)); flex: none }
/* The Building counter turns while anything is building, so the fact that work
   is happening is visible without reading a number or finding the row. */
.seg .dot.work {
  width: 10px; height: 10px; box-sizing: border-box; background: none;
  border: 2px solid transparent;
  border-top-color: var(--edge, var(--idle));
  border-right-color: var(--edge, var(--idle));
  animation: spin 0.7s linear infinite;
}
/* Reduced motion slows the spin rather than stopping it.
   Stopping it left a static ring that is indistinguishable from a decorative
   dot, so the one thing the spinner exists to say — work is happening right
   now — was silently dropped for anyone with the setting on, including anyone
   who has it on without knowing. A 10px ring at two and a half seconds is a
   long way from the fast rotation the guidance is aimed at, and the state is
   also carried by a word and a colour for anyone who needs no motion at all. */
@media (prefers-reduced-motion: reduce) {
  .seg .dot.work { animation-duration: 2.4s }
}

.control {
  font: inherit; font-size: 0.82rem;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 8px;
  padding: 0.42rem 0.6rem;
}
.control:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px }
/* Secrets is a link to /secrets rather than a toggle, and an anchor is inline and
   underlined by default — both of which make it sit wrong beside the inputs. */
a.control { display: inline-block; text-decoration: none; line-height: normal }
/* A select rather than a chip per project: at three projects chips are nicer,
   at three hundred they are a wall. The search box beside it covers the case
   where you know the branch but not the project. */
select.control { max-width: 15rem }
input.control { width: 13rem }
input.control::placeholder { color: var(--muted) }

/* The admin links, present only on a local request — see showAdminLinks. Kept
   visually quieter than the filters beside them: they leave this page, and
   nothing on an operations screen should draw the eye toward a form for pasting
   a private key. */
.admin-nav { display: inline-flex; gap: 0.4rem }
.admin-nav .control { color: var(--muted); background: transparent; cursor: pointer }
.admin-nav .control:hover { color: var(--ink); background: var(--raised) }
.admin-nav .control:disabled { cursor: default; opacity: 0.6 }

/* ── Setup panel ────────────────────────────────────────────────────────── */
.setup { border-bottom: 1px solid var(--hairline); background: var(--surface) }
.setup-inner { max-width: 96rem; margin: 0 auto; padding: 1rem 1.25rem 1.25rem }

.sec {
  display: grid; grid-template-columns: minmax(0, 18rem) minmax(0, 1fr) auto;
  gap: 0.6rem; align-items: start;
  padding: 0.6rem 0; border-top: 1px solid var(--hairline);
}
.sec:first-of-type { border-top: 0 }
/* A collapsible group, drawn as a previews row.
   These are the same gesture — a caret, a bold label, quieter detail beside it, click to
   expand — so they are the same shape. The values below are `.item`/`.head`/`.who`'s,
   copied rather than shared because those are built from a grid of five columns for a
   preview's counts and pills, and this has two things in it. Copying three numbers is
   cheaper than making one rule serve both and having a change to a preview row silently
   move the credential page.

   <details> rather than a button and a hidden div, because the element already has the
   open/closed semantics, the keyboard behaviour and the accessible state. */
.secbox {
  border: 1px solid var(--ring); border-radius: 10px;
  background: var(--surface); overflow: hidden;
  margin-bottom: 1rem;
}
/* The stripe belongs to the whole group, not to its header.
   On the summary it stopped at the header's bottom edge, so an expanded section's rows
   hung off a three-pixel mark that had already ended — the colour said "this is a group"
   and then abandoned the group's contents. */
.secgroup-box {
  border-top: 1px solid var(--hairline);
  border-left: 3px solid var(--edge, var(--idle));
}
.secgroup-box:first-of-type { border-top: 0 }

/* A colour each, and they are not arbitrary: green is what the rows inside Build
   variables already use for their "set" and "build var" chips, so the stripe agrees with
   them. Credentials take the amber that means "handle carefully" elsewhere on this page,
   and the dead keys take the same grey as an idle preview. */
.secgroup-box[data-group="daemon"] { --edge: var(--serious) }
.secgroup-box[data-group="build"]  { --edge: var(--good) }
.secgroup-box[data-group="unused"] { --edge: var(--idle) }

/* Expanded, the whole section is washed with its own colour so the rows read as
   belonging to the heading above them rather than as a list that happens to follow it.
   Six percent: enough to group them, light enough that the row hairlines still show.

   The plain declaration first is the fallback. color-mix is unsupported in older
   engines, and an unparsed value drops its own declaration only — so this degrades to
   the flat raised surface instead of to nothing. */
.secgroup-box[open] {
  background: var(--raised);
  background: color-mix(in srgb, var(--edge) 6%, var(--surface));
}
.secgroup-box > summary {
  cursor: pointer; list-style: none;
  /* .head's own geometry: a 1.1rem caret column, then the label, then the badge. */
  display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto;
  align-items: center; gap: 0.75rem;
  padding: 0.62rem 0.9rem;
}
.secgroup-box > summary::-webkit-details-marker { display: none }
/* ▶ (U+25B6), not ▸ (U+25B8). The second one is named "black right-pointing SMALL
   triangle" and renders about half the size at the same font-size — which read as a
   shrunken caret next to the previews rows using the first. The size below is shared
   with .caret so the two lists keep matching. */
.secgroup-box > summary::before {
  content: "▶"; color: var(--muted); font-size: 0.85rem;
  transition: transform 0.12s ease;
}
.secgroup-box[open] > summary::before { transform: rotate(90deg) }
@media (prefers-reduced-motion: reduce) {
  .secgroup-box > summary::before { transition: none }
}
.secgroup-box > summary:hover { background: var(--raised) }
/* A shade stronger than the section it heads, so the header still reads as the header
   once everything below it is tinted too. */
.secgroup-box[open] > summary {
  background: var(--raised);
  background: color-mix(in srgb, var(--edge) 13%, var(--surface));
  border-bottom: 1px solid var(--hairline);
}
/* Same weight and size as `.who .proj`. */
.secgroup { font-weight: 600; font-size: 0.9rem; color: var(--ink) }
/* The count reads like a branch label does — monospace, quieter than the name. Anything
   *missing* uses the .flag off chip instead, which is loud on purpose. */
.secgroup-n {
  font: 12.5px/1.4 ui-monospace, Consolas, monospace; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
/* Inside the expanded group, indented to the label column so the rows line up under the
   name rather than under the caret. */
.secgroup-why {
  font-size: 0.76rem; color: var(--muted);
  margin: 0 0 0.5rem; padding: 0 0.9rem 0 2.75rem; max-width: 52rem;
}
.secgroup-box .sec { padding: 0.6rem 0.9rem 0.6rem 2.75rem }

/* The same control inside a project card. The card already provides the surrounding
   border and padding, so this one drops the outer margin and sits flush at the bottom of
   the card rather than floating in the middle of it. */
/* The credential block on the project form.
   A bordered, tinted panel rather than three more rows in the column, because what is in it
   goes to the vault and the fields around it go to a database row — and they were
   indistinguishable. Same green stripe as the credential page's build-variable group, for
   the same reason: a reader who has seen that page knows what this is. */
.credbox {
  border: 1px solid var(--ring); border-left: 3px solid var(--good);
  border-radius: 8px; padding: 0.5rem 0.8rem;
  background: var(--raised);
  background: color-mix(in srgb, var(--good) 5%, var(--surface));
  margin-bottom: 0.4rem;
}
/* Its rows line up with the form's fields rather than with /secrets': the label column
   there is 18rem, the form's is 10.5rem, and two label columns a few rows apart is what
   made these read as something bolted on. */
.credbox .sec {
  grid-template-columns: 10.5rem minmax(0, 1fr) auto;
  padding: 0.45rem 0; gap: 0.6rem;
}
.credbox .sec:first-of-type { border-top: 1px solid var(--hairline) }
.credbox .field { padding: 0.35rem 0 }
/* The masked boxes keep the monospace, raised look they have on the credential page: a
   token is not prose, and the shape is what says so at a glance. */
.credbox input[type=password], .credbox input[type=text], .credbox textarea {
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
}

.pcard-secrets { margin: 0.7rem 0 0 }
.pcard-secrets-body { padding: 0 0.9rem 0.8rem 2.75rem }
/* The chips and the add-form inside it are their own layout, so the .sec grid does not
   apply — but the indent should still line up with the summary's label. */
.pcard-secrets-body .grid-form { max-width: 44rem }
/* The first row inside a group loses its top border: the summary above it is already a
   separator, and two hairlines a line apart read as an empty row. */
.secgroup-box .sec:first-of-type { border-top: 0 }
.sec .name { font-weight: 600; font-size: 0.85rem }
.sec .key { font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: var(--muted) }
.sec .hint { font-size: 0.76rem; color: var(--muted); margin-top: 0.15rem }
/* A hint that runs under the whole row rather than inside the label column.
   In that column it wrapped to three lines inside 18rem while the width under the input
   sat empty, making every entry as tall as its longest sentence. */
.sec .hint.wide { grid-column: 1 / -1; margin-top: 0.3rem; max-width: 64rem }
/* The new-entry row: two labelled boxes on one line.
   Stacked, with a label over each, one entry was four lines tall and the Save button in
   the next grid cell lined up with the first label instead of with anything it acts on.
   Everything on one baseline fixes the height and the alignment together. */
.newline { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap }
.newline .lab {
  flex: none; font-size: 0.7rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
}
/* The name is bounded — a variable name is short — and the value takes what is left. */
.newline .nm { flex: 0 1 14rem; min-width: 8rem }
/* The value field and its expand button travel together, in every place a value is
   entered: the new-entry row and each existing variable's replace box. */
.valwrap { display: flex; align-items: flex-start; gap: 0.3rem; flex: 1 1 12rem; min-width: 0 }
.valwrap input, .valwrap textarea { flex: 1 1 auto; min-width: 0 }
/* Square-ish, so it reads as a control on the field rather than another action beside
   Save and Delete. */
.btn.icon {
  flex: none; padding: 0.2rem 0.4rem; line-height: 1.1;
  font-size: 0.8rem;
}
/* type=text is in the list because the new-entry row's Name box is one. Without it that
   field rendered as a bare browser input beside a styled value box. */
.sec textarea, .sec input[type=password], .sec input[type=text] {
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  width: 100%; background: var(--raised); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 6px; padding: 0.4rem 0.5rem;
  resize: vertical;
}
.sec textarea { min-height: 2.4rem }
.sec .act { display: flex; gap: 0.35rem; align-items: center }

/* Set or missing, at a glance. A setup screen is a checklist. */
.flag {
  font-size: 0.7rem; font-weight: 600; white-space: nowrap;
  border: 1px solid var(--ring); border-radius: 999px; padding: 0.08rem 0.45rem;
}
.flag.on  { color: var(--good) }
.flag.off { color: var(--critical) }
.flag.opt { color: var(--muted) }

.notice {
  font-size: 0.8rem; border: 1px solid var(--ring); border-left: 3px solid var(--edge, var(--muted));
  border-radius: 6px; padding: 0.6rem 0.75rem; margin-bottom: 0.9rem; color: var(--ink-2);
}
.notice.bad  { --edge: var(--critical) }
.notice.warn { --edge: var(--warning) }
.notice.ok   { --edge: var(--good) }
.notice code { font: 12px/1.5 ui-monospace, Consolas, monospace }
.notice p { margin: 0.4rem 0 0 }

/* ── Startup report ─────────────────────────────────────────────────────────
   A dialog rather than another banner. It is read once and dismissed, and a banner
   that has to be dismissed competes with the one that reports a build. */
.modal {
  position: fixed; inset: 0; z-index: 70;
  display: flex; align-items: center; justify-content: center;
  padding: 1.25rem; background: rgb(0 0 0 / 0.45);
}
/* The card clips; an inner element scrolls.
   With the scroll on the card itself the scrollbar is drawn at the card's edge, outside the
   rounded corners — a straight bar across a curve. Moving the overflow inside and clipping
   at the border radius puts the bar within the shape. */
.modal-card {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 12px;
  box-shadow: 0 24px 64px rgb(0 0 0 / 0.35);
  width: min(34rem, 100%);
  overflow: hidden;
}
.modal-body {
  padding: 1.1rem 1.2rem;
  max-height: 84vh; overflow-y: auto;
  /* Reserves the gutter so content does not shift sideways when the bar appears. */
  scrollbar-gutter: stable;
}
/* The project form needs the width its fields were designed for — a build command is a
   shell line and a container image is a registry path. 34rem turned both into boxes you
   have to scroll sideways to read. */
.modal-card.wide { width: min(64rem, 100%) }
/* A close control that stays put while the card scrolls.
   The row is sticky and carries the card's own background, so the button does not have
   form fields sliding under it. Negative margins pull it into the card's padding, which is
   where a close button belongs — the corner, not a row of its own. */
.modal-x-row {
  position: sticky; top: 0; z-index: 1;
  display: flex; justify-content: flex-end;
  margin: -1.1rem -1.2rem 0.2rem; padding: 0.35rem 0.5rem 0;
  background: var(--surface);
}
.modal-x {
  border: 0; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 1rem; line-height: 1;
  padding: 0.25rem 0.4rem; border-radius: 6px;
}
.modal-x:hover { color: var(--ink); background: var(--raised) }
.modal-x:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px }
/* The button that opens it, above the list rather than after it. The installation's
   hostname prefix shares the row: it is the other thing that belongs to the page rather
   than to any card. */
.projadd { margin: 0 0 0.8rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap }
.projadd .grow { flex: 1 }
/* Twelve characters is the cap, so the box is sized for twelve and no more — a field that
   stretches invites a sentence. */
.prefixbox {
  width: 6rem; padding: 0.15rem 0.35rem; font: inherit;
  border: 1px solid var(--ring); border-radius: 5px;
  background: var(--surface); color: var(--ink);
}
/* The dialog's own title is the quiet part: "Ready" is not news. The number is. */
.modal-card h3 {
  margin: 0; font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
}
/* The headline, labelled. A bare "3s" above a sentence was read as decoration and the
   one number the report exists to give went unseen — so the label sits above the value
   and the value is the largest thing in the dialog. */
.boot-hero { padding: 0.7rem 0 0.9rem }
.boot-hero-k {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); font-weight: 600;
}
.boot-hero-v {
  font-size: 2.4rem; line-height: 1.05; font-weight: 680; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.boot-hero-n { font-size: 0.8rem; color: var(--ink-2); margin-top: 0.2rem }
/* Label-and-value rows rather than a grid of tiles. The values are sentences —
   "11 — bound to shares that already existed" — and a tile is a box for a number. */
.boot-rows { margin: 0; border-top: 1px solid var(--hairline) }
.boot-row {
  display: flex; gap: 0.75rem; align-items: baseline;
  padding: 0.4rem 0; border-bottom: 1px solid var(--hairline);
}
.boot-row dt {
  flex: none; width: 9.5rem; font-size: 0.75rem; color: var(--muted);
}
.boot-row dd {
  margin: 0; font-size: 0.82rem; font-variant-numeric: tabular-nums;
}
.boot-row dd.good { color: var(--good) }
.boot-row dd.warn { color: var(--warning) }
/* Collapsed by default. Thirteen monospace lines is the bulk of the dialog and the
   least-read part of it: the counts above answer the question, and this is for when
   they do not. */
.boot-details { margin-top: 0.85rem }
.boot-details summary {
  cursor: pointer; font-size: 0.75rem; color: var(--ink-2);
  padding: 0.2rem 0;
}
.boot-details summary:hover { color: var(--ink) }
.boot-list {
  font: 11.5px/1.75 ui-monospace, Consolas, monospace; color: var(--ink-2);
  margin-top: 0.4rem; padding-left: 0.9rem;
  border-left: 2px solid var(--hairline);
  max-height: 14rem; overflow-y: auto;
}

/* ── The confirm dialog ─────────────────────────────────────────────────────
   `confirm()` was what stood here, and it was the wrong control twice over. It is
   drawn by the browser, so it cannot show the one thing worth showing — what is about
   to be deleted and what comes back — and it renders newlines as a wall of plain text
   that reads as a warning rather than as an answer.

   This dialog is the explanation *and* the decision. The question anybody asks before
   pressing Unlink is "what does this actually do, and can I undo it", so the answer is
   in front of them at the moment they ask it rather than in a document. */
.ask-what {
  font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em;
  margin: 0.45rem 0 0.15rem;
}
.ask-what .mono {
  font: 13px/1.5 ui-monospace, Consolas, monospace; color: var(--ink-2);
}
.ask-lede { font-size: 0.85rem; color: var(--ink-2); margin: 0 0 0.8rem }

/* Two columns, because the shape of the answer is a comparison: this goes, that comes
   back. One list of eight items with mixed marks made the reader classify each line
   themselves, which is the work the columns do for them. */
.ask-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem }
@media (max-width: 30rem) { .ask-cols { grid-template-columns: 1fr } }
.ask-col {
  border: 1px solid var(--ring); border-radius: 8px; padding: 0.55rem 0.65rem;
  border-top: 3px solid var(--edge, var(--ring)); background: var(--raised);
}
.ask-col h4 {
  margin: 0 0 0.35rem; font-size: 0.68rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
}
.ask-col ul { margin: 0; padding: 0; list-style: none }
.ask-col li {
  display: flex; gap: 0.4rem; align-items: baseline;
  font-size: 0.8rem; color: var(--ink-2); padding: 0.1rem 0;
}
/* The mark carries the meaning without colour, for the same reason the startup steps
   use one: a red list and a green list are the same list to a reader who cannot tell
   them apart. */
.ask-col li::before { content: "✕"; color: var(--critical); flex: none; font-size: 0.85em }
.ask-col.keeps li::before { content: "↺"; color: var(--good) }
.ask-note {
  font-size: 0.78rem; color: var(--muted); margin: 0.8rem 0 0;
  padding-top: 0.6rem; border-top: 1px solid var(--hairline);
}
.ask-note b { color: var(--ink-2); font-weight: 600 }
.ask-acts { display: flex; gap: 0.45rem; justify-content: flex-end; margin-top: 0.9rem }
/* The destructive button is filled, and it is not the one that has focus. A dialog that
   opens with the irreversible action focused turns a stray Return into the action. */
.btn.solid-danger {
  background: var(--critical); border-color: var(--critical); color: #fff;
}
.btn.solid-danger:hover { filter: brightness(1.08) }

/* ── Startup banner ─────────────────────────────────────────────────────────
   A sibling of .wrap rather than a child, so it must reproduce .wrap's own box:
   same max width, same 1.25rem gutter, or its left edge does not line up with the
   list it sits above. Sized by subtracting the gutter rather than by padding,
   because the padding here belongs to the notice's border. */
#starting {
  width: calc(100% - 2.5rem); max-width: calc(96rem - 2.5rem);
  margin: 1.25rem auto 0;
}
.starting-steps {
  display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem 0.55rem;
  margin: 0.55rem 0 0; font-size: 0.72rem;
}
/* Stages are text with a leading mark, not bordered pills.
   Pills were the first attempt and they were read as buttons — a rounded box with a
   border and a label is a button everywhere else on this page, so three of them in a
   row invited clicks that do nothing. Nothing here is interactive: it is a sentence
   about what the daemon is doing, so it is styled as one. The mark carries the state,
   which also survives being read without colour. */
.step { color: var(--muted); display: inline-flex; align-items: center; gap: 0.35rem }
.step::before { content: "○"; font-size: 0.85em }
.step.done { color: var(--ink-2) }
.step.done::before { content: "✓"; color: var(--good) }
/* The stage in progress spins, and that is the only moving thing in the banner.
   A checkmark and an empty circle say which stages are behind and ahead, but between
   them "the one in bold" was not obvious enough to find at a glance — and on a page
   where the complaint is that nothing appears to be happening, motion is the signal
   that answers it. */
.step.now {
  color: var(--ink); font-weight: 650;
  /* Its own line, so the stage being worked on is not one item in a row of three. */
  flex-basis: 100%;
}
/* No ::before for the current stage — it carries a real element instead, so the ring is
   not competing with the mark the other two states use. */
.step.now::before { content: none }
/* The ring is an element, not a pseudo-element, and its border avoids color-mix().
   Both were bugs in the first version: as a ::before it inherited the pending mark's
   font sizing, and `border: 2px solid color-mix(…)` is one declaration — an engine that
   cannot parse the colour drops the whole thing, leaving a 0.72em box with no border and
   nothing visible. Two flat colours cannot fail that way. */
.spinner {
  width: 0.8em; height: 0.8em; flex: none; border-radius: 50%;
  border: 2px solid var(--hairline);
  border-top-color: var(--warning);
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
/* With motion suppressed a still ring reads as the empty circle that means "not started",
   so the current stage becomes a filled dot instead. If you have reduced motion enabled
   at the OS level, this is what you get, and it is deliberate. */
@media (prefers-reduced-motion: reduce) {
  .spinner {
    width: auto; height: auto; border: 0; animation: none;
    color: var(--warning);
  }
  .spinner::after { content: "●" }
}
/* The count belongs to the stage it is counting, so it sits inside that step rather
   than after the row: "1 of 2" at the end of three stage names was read as counting
   the stages, of which there are three. */
.step .step-count { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 400 }
.starting-bar {
  height: 3px; margin-top: 0.55rem; border-radius: 999px;
  background: var(--hairline); overflow: hidden;
}
/* What it is actually doing, newest first. Monospace because these are share names, and
   a column of names in a proportional font is harder to scan for the one that changed. */
.starting-items {
  margin-top: 0.5rem; font: 11.5px/1.7 ui-monospace, Consolas, monospace;
  color: var(--muted);
}
/* The newest line is the one being read; the rest are there for context and fade back. */
.starting-item:first-child { color: var(--ink-2) }
.starting-bar span {
  display: block; height: 100%; background: var(--warning);
  transition: width 0.3s ease;
}
/* An uncounted stage gets a sliding sliver, not a full bar and not a 0%-wide one:
   the first says finished and the second says stuck, and the reap is neither. */
.starting-bar[data-indeterminate] span {
  width: 30% !important; animation: slide 1.4s ease-in-out infinite;
}
@keyframes slide {
  0% { transform: translateX(-100%) } 100% { transform: translateX(333%) }
}
@media (prefers-reduced-motion: reduce) {
  .starting-bar span { transition: none }
  /* With motion suppressed the sliver would sit still at the left and read as 30%
     complete, so the whole track is filled and dimmed instead: clearly "working",
     clearly not a measurement. */
  .starting-bar[data-indeterminate] span { animation: none; width: 100% !important; opacity: 0.35 }
}

/* ── Project switcher ───────────────────────────────────────────────────────
   A trigger and a panel, rather than a <select>: a select shows one line, cannot be
   typed into, and cannot carry a badge, so a dozen near-identical repository names
   become a scrolling menu nobody can aim at. */
.picker { position: relative }
.pick-trigger {
  display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer;
  max-width: 16rem;
}
.pick-trigger .pick-label {
  display: inline-flex; align-items: center; gap: 0.35rem; min-width: 0;
}
.pick-trigger .pick-label > span {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pick-trigger .pick-caret { color: var(--muted); flex: none }
.pick-trigger .ava { width: 1.1rem; height: 1.1rem; border-radius: 4px; font-size: 0.6rem }

.pick-panel {
  position: absolute; z-index: 40; top: calc(100% + 0.3rem); left: 0;
  width: 20rem; max-width: 90vw;
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  box-shadow: 0 12px 32px rgb(0 0 0 / 0.14);
  overflow: hidden;
}
.pick-search { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--hairline) }
.pick-search input {
  flex: 1; min-width: 0; font: inherit; font-size: 0.85rem;
  background: transparent; color: var(--ink); border: 0; outline: none;
}
.pick-search kbd {
  font: 10px/1.6 ui-monospace, Consolas, monospace; color: var(--muted);
  border: 1px solid var(--ring); border-radius: 4px; padding: 0 0.25rem;
}
/* Bounded, because the list is as long as somebody's project count and the panel
   floats over the page. */
.pick-list { max-height: 18rem; overflow: auto; padding: 0.25rem }
.pick-row {
  display: flex; align-items: center; gap: 0.5rem; width: 100%;
  padding: 0.4rem 0.45rem; border: 0; border-radius: 6px;
  background: transparent; color: var(--ink); font: inherit; font-size: 0.85rem;
  text-align: left; cursor: pointer; text-decoration: none;
}
.pick-row:hover, .pick-row.here { background: var(--raised) }
.pick-row.here { font-weight: 600 }
.pick-row .count { margin-left: auto; color: var(--muted); font-size: 0.75rem }
.pick-row.add { border-top: 1px solid var(--hairline); border-radius: 0; margin-top: 0.25rem;
  padding-top: 0.5rem; color: var(--ink-2) }
.pick-empty { padding: 0.7rem 0.5rem; color: var(--muted); font-size: 0.8rem }

/* The image field is the same panel, anchored under a text box that is also the filter.
   Full width of the field rather than a fixed 20rem, because image references are long
   and truncating the thing you are choosing between defeats the point. */
.imgpick { display: block }
.imgpick .pick-panel { width: 100%; top: calc(100% - 1.4rem) }
.imgpick .pick-row { font: 12px/1.5 ui-monospace, Consolas, monospace }
.imgpick .pick-row .count { font-family: inherit; font-size: 11px }

/* ── Projects ───────────────────────────────────────────────────────────── */

/* One card per project, because a project is a block of related facts and the
   three-column .sec grid squeezed them into a column narrow enough that a
   `·`-joined line wrapped mid-value — `output:` ending one line and `build`
   starting the next, which reads as a field called build. */
/* `pcard`, not `proj`, and that is not a style preference. `.proj` is already the
   project name inside a previews row (`renderRow`), so a `.proj` rule here put a
   bordered, padded box around the project name on the operations dashboard — a page
   this CSS was not written for and nobody was looking at while writing it.

   Second time this stylesheet has been bitten by a generic class name; see the note on
   `.row .go` above. One document, one namespace, no scoping by accident. */
.pcard {
  border: 1px solid var(--ring); border-radius: 8px; background: var(--surface);
  padding: 0.7rem 0.85rem; margin-bottom: 0.6rem;
}
.pcard-head { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap }
.pcard-head .name { font-weight: 600; font-size: 0.9rem }
.pcard-head .sub { font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: var(--muted) }
.pcard-head .grow { flex: 1 }
.pcard-off { opacity: 0.6 }

/* The default branch's permanent preview, first thing under the card's header.
   Carries the state colour on its left edge like a previews row, because it is one. */
.pcard-branch {
  display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap;
  margin: 0.5rem 0 0.1rem; padding: 0.35rem 0.55rem;
  border: 1px solid var(--ring); border-radius: 7px;
  border-left: 3px solid var(--edge, var(--idle));
  background: var(--raised);
}
.pcard-branch .grow { flex: 1 }
.pcard-branch .bname {
  font: 12.5px/1.5 ui-monospace, Consolas, monospace; font-weight: 650;
}
.pcard-branch .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--edge, var(--idle)) }
/* Nothing built yet is a quieter thing than a failure: no colour, because there is no state
   to report — only an offer. */
.pcard-branch.none { border-left-color: var(--hairline); background: none }

/* The strip that appears only when a project is skipping something. One line: a count and
   the way in. Tinted, because its presence is the signal — a project in this state is not
   building everything it looks like it is building. */
.pcard-links {
  display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
  margin-top: 0.45rem; padding: 0.4rem 0.5rem;
  border-radius: 7px;
  border-left: 3px solid var(--serious);
  background: color-mix(in srgb, var(--serious) 7%, transparent);
}
.pcard-links .grow { flex: 1 }
.pcard-links strong { color: var(--ink); font-variant-numeric: tabular-nums }

/* The picker's rows. A row is one choice, so the whole row is the control — a list of
   labels each with a small button beside it makes the reader aim. */
.picklist {
  display: flex; flex-direction: column; gap: 0.3rem;
  max-height: 21rem; overflow-y: auto; scrollbar-gutter: stable;
}
.pickrow {
  display: flex; align-items: center; gap: 0.5rem; width: 100%;
  font: inherit; color: inherit; text-align: left; cursor: pointer;
  border: 1px solid var(--ring); border-radius: 7px; background: var(--raised);
  border-left: 3px solid var(--serious);
  padding: 0.4rem 0.55rem;
}
.pickrow:hover { border-color: var(--ink-2) }
.pickrow:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px }
.pickrow .num { font-weight: 650 }
.pickrow .branch {
  font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pickrow .took { font-size: 0.75rem; color: var(--muted) }
/* The row is the button, so the thing that looks like one inside it must not also be
   clickable — it is a label saying what the row does. */
.pickrow .btn { pointer-events: none }

/* A badge, not a fetched image. Two characters or an emoji, on a colour derived from
   the name so it is stable without being stored. */
.ava {
  flex: none; width: 1.9rem; height: 1.9rem; border-radius: 7px;
  display: grid; place-items: center;
  font-size: 0.95rem; line-height: 1; font-weight: 600;
  border: 1px solid var(--ring); color: var(--ink);
}
/* An inlined logo gets no tinted background: it brings its own, and a derived hue
   behind it fights whatever the icon was designed against. */
.ava-img { background: none !important; border-color: var(--hairline) !important; overflow: hidden }
.ava-img img { display: block; width: 22px; height: 22px; object-fit: contain }

/* One property per line: label in a fixed left column, value beside it. Read down,
   not across.

   Three arrangements have been tried here. A `·`-joined line wrapped mid-value, so
   `output:` ended one line and `build` started the next and read as a field called
   build. Label-over-value in auto-filled columns fixed that and produced a row of
   four headings that reads as a table of one row. This is the third: a column of
   properties, which is what a card of settings is. */
.facts { margin: 0.5rem 0 0 }
.facts > div {
  display: grid; grid-template-columns: 9.5rem minmax(0, 1fr);
  gap: 0.5rem; padding: 0.12rem 0;
}
.facts dt { font-size: 0.74rem; color: var(--muted) }
.facts dd {
  margin: 0; font: 12px/1.45 ui-monospace, Consolas, monospace;
  color: var(--ink); overflow-wrap: anywhere;
}
.facts dd.inherit { font-family: inherit; font-size: 0.78rem; color: var(--muted) }
@media (max-width: 34rem) {
  /* Two columns of 9.5rem do not fit a phone, and a squeezed value column is the
     wrapping problem again. */
  .facts > div { grid-template-columns: minmax(0, 1fr) }
  .facts dt { margin-top: 0.3rem }
}

/* An environment variable is a name, a state and a way to remove it. Chips,
   because the set is small and the names are long. */
.envs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem }
.env {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font: 11.5px/1.6 ui-monospace, Consolas, monospace;
  border: 1px solid var(--ring); border-radius: 999px; padding: 0.05rem 0.2rem 0.05rem 0.5rem;
}
.env.inherited { color: var(--muted); padding-right: 0.5rem }
.env button {
  border: 0; background: none; color: var(--muted); cursor: pointer;
  font: inherit; padding: 0 0.25rem; border-radius: 999px;
}
.env button:hover { color: var(--critical) }

.panel { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--hairline) }
.panel h3 {
  margin: 0 0 0.4rem; font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); font-weight: 600;
}
/* A form is filled top to bottom, so it is one column of rows: label on the left,
   control on the right, capped at a readable width. Eleven fields across the full
   width of a monitor put seven of them on one line and turned a form into a
   spreadsheet — and the eye has to travel the whole screen between a label and the
   thing it labels. */
.grid-form { max-width: 52rem }
/* Wider where there is room. A build command is a shell line and a container image is a
   registry path — both routinely longer than 52rem shows, and a field you have to
   scroll horizontally to read is a field you cannot check. */
@media (min-width: 1000px) { .grid-form { max-width: 72rem } }
@media (min-width: 1400px) { .grid-form { max-width: 88rem } }
.field {
  display: grid; grid-template-columns: 10.5rem minmax(0, 1fr);
  gap: 0.6rem; align-items: center; padding: 0.22rem 0;
}
.field-note { text-transform: none; letter-spacing: 0; font-weight: 400 }
.backlink { margin: 0 0 0.5rem; font-size: 0.82rem }
.avafield { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap }
/* A checkbox and its wording on one line, so the box belongs to the sentence rather than
   sitting in the label column with the words in the control column. */
.inline { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem }
.inline input[type=checkbox] { margin: 0 }

/* Two mutually exclusive choices, as segmented buttons.
   A <select> with two options hides one behind a click and shows the other as a line of
   truncated text — and here both labels are worth reading, because they choose between two
   different identities. Radios underneath, so the keyboard and the form semantics are the
   browser's rather than reimplemented. */
.segchoice { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden }
.segchoice label {
  display: inline-flex; align-items: center; cursor: pointer;
  font-size: 0.8rem; padding: 0.35rem 0.7rem; color: var(--ink-2);
  border-left: 1px solid var(--hairline);
}
.segchoice label:first-child { border-left: 0 }
.segchoice input { position: absolute; opacity: 0; pointer-events: none }
.segchoice label:hover { background: var(--raised) }
.segchoice input:checked + span { color: var(--ink); font-weight: 600 }
.segchoice label:has(input:checked) { background: var(--raised) }
/* :has is recent enough to be worth a fallback that still distinguishes the two: the
   checked label's text goes bold and dark above regardless of whether the background
   applies. */
.segchoice input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px }

/* The form's own actions, set apart from the fields above them so the row that commits
   is not just more controls in a column of controls. */
.formact {
  margin-top: 0.8rem; padding-top: 0.7rem; border-top: 1px solid var(--hairline);
  max-width: 52rem;
}
.btn.primary {
  background: var(--ink); color: var(--plane); border-color: var(--ink); font-weight: 600;
}
.btn.primary:hover { opacity: 0.9 }
/* Destructive, and it borrows the failed colour rather than inventing one: red on this
   page already means a build that is not going to finish, which is what this makes. */
.btn.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, var(--ring)) }
.btn.danger:hover { border-color: var(--critical) }
/* Toasts. Fixed, so nothing in the document moves when one appears — a banner that pushes
   a list down is its own small confusion, and the list is what somebody is reading. */
#toasts {
  position: fixed; z-index: 60; top: 0.9rem; right: 0.9rem;
  display: flex; flex-direction: column; gap: 0.4rem;
  /* The host ignores the pointer so it never blocks the page behind it; each toast takes
     it back, because a message you cannot select is a message you have to retype into a
     search box. */
  pointer-events: none;
}
.toast {
  background: var(--ink); color: var(--plane);
  font-size: 0.82rem; font-weight: 500;
  padding: 0.5rem 0.75rem; border-radius: 8px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
  max-width: 22rem;
  pointer-events: auto; user-select: text; cursor: text;
  /* A platform error carries URLs and bracketed IPv6 addresses, which have no spaces to
     break at — so they were drawn straight through the rounded corner. `anywhere` breaks
     mid-token, which is the only option that keeps a 90-character address inside the box. */
  overflow-wrap: anywhere;
  /* And a cap, so one enormous error cannot fill the screen. */
  max-height: 40vh; overflow-y: auto;
  animation: toastin 140ms ease-out, fadeout 5s ease-in forwards;
}
@keyframes toastin { from { opacity: 0; transform: translateY(-0.4rem) } to { opacity: 1 } }
@keyframes fadeout { 0%, 82% { opacity: 1 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none } }
/* A failure toast reads as one, and its fade matches its own lifetime — the default
   animation is timed to the 5s removal, so a 9s toast styled with it would go
   invisible four seconds before it left the DOM and take clicks nowhere near it. */
.toast.bad {
  background: var(--critical); color: #fff;
  animation: toastin 140ms ease-out, fadeout 9s ease-in forwards;
}
/* Green for a confirmed success, because the one thing a test result has to convey before
   it is read is which of the two answers it is. */
.toast.good { background: var(--good); color: #fff }
/* A failure is the one worth copying — an error naming a scope or an address is going into
   a search or a ticket — so it says so and takes a click. */
.toast.bad { cursor: copy }
.toast .copied {
  display: block; margin-top: 0.3rem; font-size: 0.7rem; opacity: 0.85;
  text-transform: uppercase; letter-spacing: 0.06em;
}
/* Column 2, like .why. Without this it was a third child of a two-column grid, so it
   wrapped into the *label* column of the next row — docker's error rendered where a
   field name belongs, in 0.74rem, which is how "errors:" ended up looking like a
   label. */
.imgcheck { grid-column: 2; font-size: 0.78rem; margin-top: 0.3rem; color: var(--muted) }
.imgcheck.ok  { color: var(--good) }
/* A wrong image fails the build minutes later with docker's message buried in a log.
   It gets a box, because this is the one moment somebody is looking. */
.imgcheck.bad {
  color: var(--critical); font-weight: 600;
  border: 1px solid var(--critical); border-radius: 6px;
  padding: 0.3rem 0.45rem; background: color-mix(in srgb, var(--critical) 7%, transparent);
}
.field > label { font-size: 0.78rem; color: var(--ink-2) }
.field .why { grid-column: 2; font-size: 0.72rem; color: var(--muted); margin-top: -0.1rem }
.field textarea {
  font: inherit; font-size: 0.82rem; width: 100%; min-height: 4.5rem; resize: vertical;
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 6px; padding: 0.4rem 0.5rem;
}
.field-head {
  margin: 0.8rem 0 0.3rem; font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--muted); font-weight: 600;
}
.field-head:first-child { margin-top: 0 }
@media (max-width: 40rem) {
  .field { grid-template-columns: minmax(0, 1fr); gap: 0.15rem }
  .field .why { grid-column: 1 }
}

/* ── Layout ─────────────────────────────────────────────────────────────── */
.wrap {
  max-width: 96rem; margin: 0 auto; padding: 1.25rem;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem;
}
@media (min-width: 68rem) {
  .wrap { grid-template-columns: minmax(0, 1fr) 21rem; align-items: start; }
}

/* ── Accordion ──────────────────────────────────────────────────────────── */
.list {
  border: 1px solid var(--ring); border-radius: 10px;
  background: var(--surface); overflow: hidden;
}
.item { border-top: 1px solid var(--hairline) }
.item:first-child { border-top: 0 }

/* The row is the toggle plus the preview link, side by side. Separate elements
   because an anchor inside a button is invalid markup and would both navigate
   and toggle. */
.row { display: flex; align-items: stretch }
.row .head { flex: 1; min-width: 0 }

/* Scoped to .row on purpose. Unscoped, `.go:not([href])` also matched the
   activity rail's entry buttons — which have no href because they are buttons —
   and greyed the whole panel out at 0.3 opacity with pointer-events: none. A
   generic class name in a single stylesheet is a collision waiting for its
   second user. */
.row .go {
  display: flex; align-items: center; white-space: nowrap;
  font-size: 0.75rem; font-weight: 600; text-decoration: none;
  color: var(--ink-2); padding: 0 0.9rem 0 0.6rem;
  border-left: 1px solid var(--hairline);
}
.row .go[href]:hover { color: var(--ink); text-decoration: underline }
/* The pull request link borrows Open's look — same border-left, same padding — because
   they are the same kind of thing in the same strip. Quieter, because Open is what
   somebody reaches for from a list of previews and this is the secondary destination. */
.row .go.pr {
  color: var(--muted); font-weight: 500;
  /* Fixed width, sized for five digits, so Open starts at the same x on every row. Sized
     rather than shrink-to-fit because the content is a pull request number: #4 and #145
     differ by two characters, which moved Open two characters left on one row and made a
     column of them look ragged. Five digits covers a repository with 99999 pull requests;
     beyond that it grows rather than truncating, because a wrong number is worse than a
     misaligned one. */
  min-width: 5.6rem;
  /* Mark hard left, number hard right, rather than the pair centred together. Centring
     put the icon at a different x on every row, because it moved with the width of the
     number beside it — so a column of previews had a wandering column of logos. Pinned
     to the two edges of a fixed-width cell, both line up down the whole list. */
  justify-content: space-between;
  gap: 0.45rem;
  font-variant-numeric: tabular-nums;
}
.row .go.pr svg { flex: none; opacity: 0.75 }
.row .go.pr:hover svg { opacity: 1 }
.row .go.pr:hover { color: var(--ink-2) }
/* An anchor with no href is not a link, which is the wanted state before a
   build has produced anything. Styling follows from that fact rather than from
   a `disabled` attribute anchors ignore. */
.row .go:not([href]) { opacity: 0.3; cursor: default; pointer-events: none }

.head {
  width: 100%; font: inherit; color: inherit; text-align: left;
  background: transparent; border: 0; cursor: pointer;
  display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto auto auto;
  align-items: center; gap: 0.75rem;
  padding: 0.62rem 0.9rem;
  border-left: 3px solid var(--edge, var(--idle));
}

/* The per-state count chips that used to sit here are gone. They said how many of a
   project's previews were ready or failed, beside a pill already naming the state of the
   one preview the row shows — two answers to different questions in one line, and nobody
   acted on the second. The empty cell in the grid above is now the spacer. */
.row .head .grow { min-width: 0 }

/* ── Under 1000px ───────────────────────────────────────────────────────────
   The layout already stacks at 68rem and the header and toolbar already wrap, so
   nothing here is structural. What remains is everything sized for a mouse and a
   wide viewport: controls that assumed room beside each other, fixed-height panes
   that eat a phone screen, and a copy button positioned for a desktop scrollbar. */
@media (max-width: 62.5rem) {
  .wrap { padding: 0.75rem; gap: 0.75rem }
  .topbar .row { gap: 0.6rem; padding: 0.6rem 0.75rem }

  /* Full width, each on its own line. Side by side at this width they were two
     truncated controls instead of one usable one. */
  #projpick, .pick-trigger, input#search { width: 100%; max-width: none }
  /* The panel is anchored to the trigger, which is now full width, so it can be too. */
  .pick-panel { width: 100% }

  /* The counters scroll rather than wrap. Wrapping reflowed the header every time
     a build changed state, which moved everything under it while being read. */
  .seg {
    display: flex; width: 100%;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none }
  .seg button { flex: 1 0 auto; padding: 0.45rem 0.6rem }

  /* A phone gets a taller log because there is nothing beside it competing for
     the screen, and Expand becomes nearly the whole viewport. */
  pre.term { height: 20rem; font-size: 12px }
  pre.term.tall { height: 75vh }

  /* Touch has no hover, so the copy button would never appear. Show it always,
     make it a touch target, and move it clear of a narrow scrollbar. */
  .termwrap .copy {
    opacity: 1; pointer-events: auto;
    width: 2.25rem; height: 2.25rem;
    top: 0.4rem; right: 0.4rem;
  }
  .termwrap .copy svg { width: 1.1rem; height: 1.1rem }

  /* Selects take the row; the buttons share the next one. */
  .logbar select.control.sm { flex: 1 1 100%; max-width: none }
  .logbar .grow, .logfoot .grow { display: none }
  .logbar .btn, .logfoot .btn { flex: 1 1 auto; text-align: center }

  /* The go-to-preview link stops being a narrow column beside the row title and
     becomes a full-width tap target under it. */
  .row { flex-wrap: wrap }
  .row .head { flex: 1 1 100% }
  .row .go {
    flex: 1 1 100%; justify-content: center;
    border-left: 0; border-top: 1px solid var(--hairline);
    padding: 0.55rem 0.9rem;
  }
}
.head:hover { background: var(--raised) }
.head:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px }
.item.open .row { background: var(--raised) }

/* 0.85rem, matching the credential page's group caret. At 0.7rem this was a mark you
   had to look for to find the control it belongs to. */
.caret { color: var(--muted); transition: transform 0.12s ease; font-size: 0.85rem }
.item.open .caret { transform: rotate(90deg) }
@media (prefers-reduced-motion: reduce) { .caret { transition: none } }

.who { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0 }
.who .proj { font-weight: 600 }
.who .num { color: var(--muted); font-weight: 400 }
.who .branch {
  font: 12.5px/1.4 ui-monospace, Consolas, monospace; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.when { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums }
/* A running stopwatch is darker than a settled age. Same size and same tabular
   figures — it must not change width as it counts — just not the grey the page uses
   for things that have stopped mattering. */
.when.ticking { color: var(--ink-2) }

.pill {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.72rem; font-weight: 600; color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 999px;
  padding: 0.12rem 0.5rem 0.12rem 0.4rem; white-space: nowrap;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--edge, var(--idle)); flex: none }
/* Building gets a real spinner rather than a pulsing dot. A dot that fades is
   ambiguous — it reads as "stale" as easily as "working" — where rotation only
   means one thing. Queued keeps the pulse: it is waiting, not working, and the
   two states should not look identical.

   Drawn with a border rather than an SVG or a font: one element, no request,
   and it inherits the state colour it is already being given. */
.pill.spin .dot { animation: pulse 1.1s ease-in-out infinite }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.2 } }

.pill.work .dot {
  width: 11px; height: 11px; box-sizing: border-box;
  background: none;
  /* A transparent track and two lit sides: a 180° arc, which reads as motion
     at this size where a single lit side reads as a flicker.
     Deliberately not color-mix() for the track. --edge is set inline and its
     value is itself a var(), and color-mix does not reliably resolve that
     second indirection — when it fails the whole border declaration is
     dropped, leaving an 11px transparent box and no spinner at all. That is
     the bug this replaced. */
  border: 2px solid transparent;
  border-top-color: var(--edge, var(--idle));
  border-right-color: var(--edge, var(--idle));
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* Reduced motion keeps the distinction without the movement: the ring stays,
   it just stops turning. */
@media (prefers-reduced-motion: reduce) {
  .pill.spin .dot { animation: none }
  .pill.work .dot { animation-duration: 2.4s }
}

.body { padding: 0 0.9rem 0.9rem 1.55rem }
.reason {
  font-size: 0.78rem; color: var(--critical);
  padding: 0 0.9rem 0.6rem 1.55rem; overflow-wrap: anywhere;
}

.logbar {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  padding: 0 0 0.5rem;
}
.logbar .grow { flex: 1 }

/* The view controls, under the pane they act on. Separated from the row's Open
   button, which is the control anybody reaches for most and used to sit a few
   pixels away — see the markup for why that mattered. */
.logfoot {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  padding: 0.5rem 0 0;
}
.logfoot .grow { flex: 1 }
select.control.sm {
  font-size: 0.75rem; padding: 0.2rem 0.4rem; max-width: 24rem;
}
select.control.sm:disabled { opacity: 0.6 }
.btn {
  font: inherit; font-size: 0.75rem;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 6px;
  padding: 0.22rem 0.55rem; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--muted) }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink) }
a.btn:not([href]) { opacity: 0.45; cursor: default; pointer-events: none }

/* What the pane is showing, above the pane. A log with no label is assumed to
   belong to the row it is under, which is wrong for every state except
   building. */
.logstate {
  font-size: 0.72rem; padding: 0 0 0.4rem; color: var(--muted);
  display: flex; align-items: center; gap: 0.4rem;
}
.logstate:empty { display: none }
.logstate::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex: none;
}
.logstate.live { color: var(--good) }
.logstate.past { color: var(--muted) }
.logstate.none { color: var(--muted) }

/* The log is a fixed, modest height by default. The old page gave it 30rem
   whether or not anything was in it, which pushed everything else off screen.
   Tall is one click away for when you actually need it. */
pre.term {
  margin: 0; padding: 0.7rem 0.8rem;
  background: var(--term-bg); color: var(--term-fg);
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  border-radius: 8px;
  height: 15rem; overflow: auto;
  white-space: pre-wrap; word-break: break-word;
}
pre.term.tall { height: 34rem }

/* A pane with nothing to show does not get a 15rem black rectangle.

   A skipped build is the common case and the one that looked broken: the row said
   Skipped, a 0.72rem grey line said "no build log", and below it sat an empty terminal
   the size of the screen. Three signals, none of them the one that matters — *why* it was
   skipped, which the daemon knew all along and put in the pull request comment.

   Auto height and a light background, because this is prose rather than output. */
pre.term.empty {
  height: auto; min-height: 0; padding: 1.1rem 1rem;
  background: var(--raised); color: var(--ink-2);
  font: inherit; font-size: 0.84rem; white-space: normal;
  border: 1px solid var(--hairline);
}
pre.term.empty strong { color: var(--ink); display: block; margin-bottom: 0.25rem }
pre.term.empty .reason { color: var(--ink-2) }
pre.term.empty .why { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.45rem }

/* The copy button floats over the log rather than sitting in the toolbar.
   Reaching for it happens while reading the scrollback, so that is where it
   should be — and a log pane has no spare horizontal room in the bar above it.

   Hidden until the pointer is in the pane, or the button itself has keyboard
   focus. Permanently visible, it covers the first line of output. */
.termwrap { position: relative }
.termwrap .copy {
  position: absolute; top: 0.5rem;
  /* Clear of the scrollbar. At 0.75rem the button straddled the scrollbar gutter
     and looked like it belonged to the page rather than to the log. */
  right: 1.6rem;
  opacity: 0; pointer-events: none;
  transition: opacity 120ms ease;
  display: grid; place-items: center;
  width: 1.75rem; height: 1.75rem;
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 6px;
  padding: 0; cursor: pointer;
}
.termwrap .copy svg { width: 0.95rem; height: 0.95rem; display: block }
/* focus-within rather than :focus, so tabbing to it reveals it. */
.termwrap:hover .copy,
.termwrap:focus-within .copy { opacity: 1; pointer-events: auto }
.termwrap .copy:hover { border-color: var(--ink) }
pre.term .cmd { color: #9fd2ff }
pre.term .err { color: #ff9a8c }
pre.term .mask { color: var(--warning); font-weight: 700 }

/* ── Right rail ─────────────────────────────────────────────────────────── */
.rail { position: sticky; top: 4rem }
.rail .card {
  border: 1px solid var(--ring); border-radius: 10px;
  background: var(--surface); padding: 0.85rem;
}
/* Kind filters for the feed. Its own control rather than reusing the top
   counters: those count previews as they are now, these narrow a history, and
   a single filter driving both would mean picking Failed emptied the feed of
   the queued and building rows that led to the failure. */
.feed-filters {
  display: flex; gap: 0.3rem; flex-wrap: wrap;
  padding-bottom: 0.6rem; margin-bottom: 0.5rem;
  border-bottom: 1px solid var(--hairline);
}
.feed-filters button {
  font: inherit; font-size: 0.7rem; line-height: 1;
  display: inline-flex; align-items: center; gap: 0.28rem;
  background: var(--raised); color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 999px;
  padding: 0.22rem 0.5rem; cursor: pointer;
}
.feed-filters button:hover { border-color: var(--muted) }
.feed-filters button[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink) }
.feed-filters .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--edge, var(--idle)) }
.feed-filters .c { opacity: 0.6; font-variant-numeric: tabular-nums }

.feed { max-height: 30rem; overflow: auto; margin: -0.2rem -0.3rem 0; padding: 0 0.3rem }
.ev {
  display: grid; grid-template-columns: 3.6rem minmax(0, 1fr);
  gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--hairline);
  font-size: 0.79rem; align-items: baseline;
}
.ev:last-child { border-bottom: 0 }

/* Feedback for a click that changed nothing else. Every preview of one repository
   shares a project row, so clicking an activity entry for the preview already
   showing leaves the page identical — and silence is indistinguishable from a dead
   button. The outline is on the row rather than the entry because the row is what
   the click was about. */
@keyframes flash {
  from { box-shadow: inset 0 0 0 2px var(--ink) }
  to   { box-shadow: inset 0 0 0 2px transparent }
}
.item.flash { animation: flash 0.6s ease-out }
/* An animation is the whole mechanism here, so with motion suppressed the feedback
   has to be something static that still ends — a border that never clears would
   leave the row looking permanently selected. */
@media (prefers-reduced-motion: reduce) {
  .item.flash { animation: flash 0.6s steps(2, jump-none) }
}

/* An entry with something left to open. The affordance is the hover rather than a
   different shape, because a rail of twenty buttons reads as a menu rather than as
   a history. */
.ev.linked {
  cursor: pointer;
  margin: 0 -0.3rem; padding: 0.4rem 0.3rem; width: calc(100% + 0.6rem);
}
.ev.linked:hover { background: var(--raised) }
.ev.linked:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px }
.ev.linked:hover .k { text-decoration: underline }

/* Copy the commit. Hidden until the row is hovered or the button itself is
   focused: one of these per row, always visible, turns the rail into a column of
   icons and buries the history it exists to show. Kept reachable by keyboard —
   :focus-within covers tabbing to it. */
.evcopy {
  border: 0; background: none; padding: 0 0.15rem; margin-left: 0.1rem;
  color: var(--muted); cursor: pointer; vertical-align: -0.15em;
  opacity: 0; transition: opacity 0.1s;
}
.ev:hover .evcopy, .ev:focus-within .evcopy { opacity: 1 }
.evcopy:hover { color: var(--ink) }
.evcopy svg { width: 12px; height: 12px; display: block }
@media (hover: none) {
  /* No hover to reveal it on a touch screen. */
  .evcopy { opacity: 1 }
}

/* The entry whose build is on screen. Some clicks change nothing else — an entry
   naming the build already showing leaves the page identical — so this is the only
   confirmation those clicks can give. It also answers "which of these am I looking
   at", which the feed could not say before.

   A left bar in the entry's own state colour, rather than a background: the rail is
   dense, and a filled row at this size reads as a different kind of entry instead of
   as the selected one. */
.ev.sel { box-shadow: inset 3px 0 0 var(--edge, var(--ink)) }
.ev.sel .k { color: var(--ink) }
button.ev.sel { background: var(--raised) }

/* An entry with nothing left to open. Dimmed rather than removed: the history is
   the point of the rail, and a build that ran is worth knowing about after its
   artifacts have been pruned. Dimmed rather than merely non-clickable, because a
   row that looks identical to its clickable neighbours and does nothing is the
   thing this whole rail was reported for twice. */
div.ev { opacity: 0.55 }
div.ev .k { font-weight: 500 }
.ev .t {
  color: var(--muted); font: 11px/1.5 ui-monospace, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.ev .l1 { display: flex; align-items: baseline; gap: 0.35rem; min-width: 0 }
.ev .l1 .k { font-weight: 600; color: var(--ink-2); white-space: nowrap }
.ev .l1 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--edge, var(--idle)); flex: none }
.ev .l2 { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ev code { font: 11px/1.4 ui-monospace, Consolas, monospace }

.empty { padding: 2rem 1rem; text-align: center; color: var(--muted); font-size: 0.86rem }
.empty code { font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: var(--ink-2) }

footer {
  max-width: 96rem; margin: 1.5rem auto 0; padding: 0 1.25rem;
  color: var(--muted); font-size: 0.75rem;
}
.live { color: var(--good) } .stale { color: var(--critical) }
/* A button that reads as one of the footer's links, because it belongs to that row rather
   than to the page's controls. A <button> and not an <a>, since it navigates nowhere —
   an anchor with no href is unreachable by keyboard. */
.footlink {
  border: 0; background: none; padding: 0; cursor: pointer;
  font: inherit; color: inherit; text-decoration: underline;
  text-underline-offset: 2px;
}
.footlink:hover { color: var(--ink-2) }
.footlink:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
/* Who is signed in, and Sign out, in the top bar beside the admin links.
   The form is inline because a <form> is a block and would otherwise drop the button onto a
   line of its own for a control two words wide. */
.session { display: inline-flex; align-items: center; gap: 0.4rem }
.session form { display: inline; margin: 0 }
.session .who { font-size: 0.72rem; color: var(--muted) }

/* Last in the sheet, and !important, because `[hidden]` loses to any author rule
   that sets display — and .wrap sets grid. So `el.hidden = true` on it did nothing,
   and the previews and activity sections rendered under both admin pages with
   nothing in them: half a page of empty operations chrome below a form, which was
   most of why /projects read as noise.

   !important alone is enough in a browser. Last as well, because the DOM used by
   tools/dashboardtest/projects.mjs resolves the cascade by document order and would
   otherwise disagree with every real browser about whether this page is correct. */
[hidden] { display: none !important }
</style>
</head>
<body>

<div class="topbar">
  <div class="row">
    <div class="brand">
      <h1>docpreview</h1>
      <span class="sub" id="exposer">&nbsp;</span>
    </div>
    <div class="seg" id="counters"></div>
    <span class="grow"></span>
    <!-- The project scope is a searchable list, not a <select>.

         A select shows one line at a time, cannot be typed into, and cannot carry a
         badge — so at a dozen projects it becomes a scrolling menu of near-identical
         repository names. This is the shape Vercel uses for the same problem: a trigger
         showing the current scope, and a panel with a filter, the projects with their
         badges, and a way to add one. -->
    <div class="picker" id="projpick">
      <button class="control pick-trigger" id="projpick-btn" aria-haspopup="listbox"
        aria-expanded="false">
        <span class="pick-label">All projects</span>
        <span class="pick-caret" aria-hidden="true">⌄</span>
      </button>
      <div class="pick-panel" id="projpick-panel" hidden>
        <div class="pick-search">
          <input type="search" id="projpick-find" placeholder="Find project…"
            aria-label="Find project" autocomplete="off">
          <kbd>Esc</kbd>
        </div>
        <div class="pick-list" id="projpick-list" role="listbox"></div>
      </div>
    </div>
    <input class="control" id="search" type="search" placeholder="branch, PR, project…" aria-label="Filter">
    <!-- The admin links appear only for a request the daemon accepts writes from,
         and it answers that question itself: /api/admin is gated by the same
         isLocalRequest the write endpoints use, and is absent from the
         dashboard-only proxy's allowlist, so a tunnelled page's fetch 404s.

         Hiding a link is not a security boundary and is not doing any work as
         one — the gate is on the server, and typing /secrets from a tunnel still
         gets nowhere. This is about not offering an operator a control that will
         answer 403. -->
    <span class="admin-nav" id="admin-nav" hidden></span>

    <!-- Who is signed in, and the way out — in the header rather than the footer, where the
         first version put it and where nobody found it. Somebody on a shared or borrowed
         machine looking for "how do I sign out" looks at the top right.

         A form, because logging out is a POST: a GET would let any page on the internet sign
         an operator out with an <img> tag. Harmless as mischief, and the kind of thing that
         costs an afternoon to diagnose.

         Hidden when nothing is signed in, which is every installation with no viewer
         password — a sign-out offered to somebody who never signed in is a control that does
         nothing. -->
    <span class="session" id="session" hidden>
      <span class="who" id="session-role"></span>
      <form method="post" action="/logout"><button class="control">Sign out</button></form>
    </span>

  </div>
</div>

<!-- The secrets panel lives on /secrets, not here. A credential form permanently
     occupying the top of an operations dashboard invites pasting into it by
     reflex, and a separate address is something a proxy or an authentication
     layer can gate — a panel inside "/" is not.

     Same document either way, switched on pathname below. -->
<div class="setup" id="setup" hidden>
  <div class="setup-inner">
    <!-- The vault's path is a detail of where the daemon keeps its files, not
         something anyone acts on from here. It stays as a tooltip: findable
         when you are debugging, absent when you are not. -->
    <!-- The way out goes above the content, not below it. Below, it is past a form
         eleven fields long and past however many project cards exist, so on any real
         page it is off screen — a page with no visible way back reads as a dead end. -->
    <p class="backlink"><a href="/">← back to previews</a></p>
    <h2 id="setup-head">Secrets</h2>
    <div id="setup-body"></div>
  </div>
</div>

<!-- Projects, on /projects. Same arrangement as the secrets panel: one document,
     switched on pathname, so the styles and the fetch helper exist once. -->
<div class="setup" id="projects" hidden>
  <div class="setup-inner">
    <p class="backlink"><a href="/">← back to previews</a></p>
    <h2>Projects</h2>
    <div id="projects-body"></div>
  </div>
</div>

<div class="wrap">
  <div>
    <h2 id="list-heading">Previews</h2>
    <div class="list" id="list"></div>
  </div>

  <aside class="rail">
    <h2>Activity · <span id="feed-scope">all projects</span></h2>
    <div class="card">
      <div class="feed-filters" id="feed-filters"></div>
      <div class="feed" id="events"></div>
    </div>
  </aside>
</div>

<!-- The startup report, shown once when the daemon finishes recovering.
     Startup is the one event nobody can watch the middle of: it takes minutes, and
     anybody who arrives during it sees a banner and no detail. So the report is shown
     immediately after, once per process, and dismissed for good. -->
<div class="modal" id="boot" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="boot-title">
    <div class="modal-body">
      <h3 id="boot-title">Startup report</h3>
      <div id="boot-body"></div>
      <div class="act">
        <button class="btn primary" id="boot-close">Close</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <span id="conn" class="live">connecting…</span> ·
  <a href="/status">/status</a> · <a href="/pr">/pr</a>
  <!-- The startup report, on request rather than in the way.
       It used to open by itself on the first load after a restart, which was right when a
       restart took four and a half minutes and wrong the moment adoption made it three
       seconds: a dialog to dismiss to be told that nothing went wrong. As a footer link it
       is available for as long as the daemon runs, beside the other two things nobody needs
       until they need them — and the label carries the duration, so the number the report
       exists to give is readable without opening it. -->
  <span id="boot-link" hidden> · <button class="footlink" id="boot-open"></button></span>
  <!-- Who you are signed in as, and the way out. Hidden when no login was needed, which is
       every installation that has set no viewer password.

       A form rather than a link, because logging out is a POST: a GET would let any page on
       the internet sign an operator out with an <img> tag. Harmless as mischief, and the kind
       of thing that costs an afternoon to diagnose. -->
  <!-- The sign-out is in the header, not here. This footer is where it started and where
       nobody looked for it. -->
</footer>

<script>
"use strict";

const STATE = {
  ready:       {label: "Ready",    color: "var(--good)"},
  // work spins, spin pulses. Building is doing something; queued is waiting for
  // a worker, and the two must not look the same.
  building:    {label: "Building", color: "var(--warning)", work: true},
  queued:      {label: "Queued",   color: "var(--idle)",    spin: true},
  skipped:     {label: "Skipped",  color: "var(--idle)"},
  failed:      {label: "Failed",   color: "var(--critical)"},
  "torn-down": {label: "Removed",  color: "var(--idle)"},
  log:         {label: "Log",      color: "var(--idle)"},
};
const state = k => STATE[k] || {label: k || "unknown", color: "var(--idle)"};

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Escaping closes attribute breakout but not scheme abuse: `javascript:` and
// `data:` survive it intact. Preview URLs come from the exposer rather than
// from a pull request, so this is not reachable today — but the rule belongs
// with the render, not with an assumption about who writes the value.
const safeURL = u => /^https?:\/\//i.test(String(u ?? "")) ? String(u) : "";

const clock = iso => new Date(iso).toLocaleTimeString([], {hour12: false});

/* stamp is when something finished, written as a time that does not move.

   A finished build used to render its relative age, which under a minute counts up once a
   second — so a preview that had been ready for forty seconds looked like it was still being
   timed, beside a status line that said it took 1m 9s. Two numbers moving at once, one of
   them meaningless. The wall-clock time answers "when" and never changes, and the duration
   beside it answers "how long".

   Always dated, and always the same width. The first version dropped the date for anything
   built today, on the reasoning that most of the page is — but these sit in a right-aligned
   column, so one row reading "07:03:07" beside others reading "Jul 30 15:33:07" made that
   row's whole line shift. A column of timestamps has to be one width or it is not a column.
   Day padded for the same reason: "Jul 3" and "Jul 30" are different widths. */
const stamp = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const month = d.toLocaleDateString([], {month: "short"});
  const day = String(d.getDate()).padStart(2, "0");
  return `${month} ${day} ${d.toLocaleTimeString([], {hour12: false})}`;
};

/* LIVE_STATES are the ones where the timestamp is a stopwatch rather than an age.
   A finished build's "6m" is a fact that does not change; a running build's is the
   thing being watched. */
const LIVE_STATES = new Set(["building", "queued"]);
const isLive = s => LIVE_STATES.has(s);

/* elapsed renders a running duration in one fixed shape, zero-padded.
   `ago` is wrong for a build in flight, for two reasons that both showed up on the
   same screen. It coarsens: at 61 seconds it prints "1m" and then does not change
   for a minute, so the one number telling you the build is alive sits still while
   you watch it. And it changes width — "9s" to "10s" to "1m" — which makes a column
   of them jitter. Fixed-width minutes and seconds always move, once a second, and
   never reflow. */
const elapsed = iso => {
  const n = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 1000));
  const pad = v => String(v).padStart(2, "0");
  const h = Math.floor(n / 3600);
  const out = `${pad(Math.floor(n / 60) % 60)}m ${pad(n % 60)}s`;
  // Hours are prepended rather than folded into the minutes, because a configurable
  // timeout can exceed an hour and "72m 04s" is a number nobody reads at a glance.
  return h ? `${h}h ${out}` : out;
};

/* rowWhen picks between the two: a stopwatch while it runs, the finishing time once
   it is over. Only one of the two ticks, which is how the row says whether anything
   is happening without reading the words. */
const rowWhen = p => isLive(p.state) ? elapsed(p.updated_at) : stamp(p.updated_at);

/* pickerWhen is the same choice inside a sentence: "Building · 04m 12s" for one in
   flight, "Ready · 14:26:23" for one that finished. */
const pickerWhen = p => isLive(p.state) ? elapsed(p.updated_at) : stamp(p.updated_at);

/* secs renders a duration. Minutes and seconds rather than a bare count, because the
   numbers that matter here are a warm install at 40s and a cold one at 6m20s, and "380s"
   makes the reader do the division. */
const secs = n => {
  n = Math.max(0, Math.round(Number(n) || 0));
  if (n < 60) return `${n}s`;
  const m = Math.floor(n / 60);
  const s = n % 60;
  // Spaced, to match the stopwatch on the row. Two durations on one screen written
  // "10m14s" and "10m 14s" look like two different units.
  return s ? `${m}m ${s}s` : `${m}m`;
};

const project = p => String(p.repo || "").split("/").pop() || "unknown";

/* prLabel is what follows the project name: "#42", or "@main" for a branch preview.

   Number 0 is a branch preview — see model.PullRequest.IsBranch — and rendering it as "#0" read
   as a bug rather than as a branch, which is exactly what it was reported as. The Go side already
   spells these "repo@main" in every log line; this is the same rule on the page. */
const prLabel = p => p.number > 0 ? `#${p.number}` : `@${p.branch || "branch"}`;


const ui = {
  state: null,        // null means every state
  kind: null,         // activity-feed filter; null means every kind
  project: "",        // "" means every project
  query: "",          // free-text filter
  open: null,         // project name whose row is expanded
  pick: {},           // project -> preview id being looked at, when not the newest
  // preview id -> build id being read, when not the current one. Keyed by preview
  // rather than by project so switching previews and switching back does not
  // silently drop you onto a different build than the one you were reading.
  build: {},
  builds: {},         // preview id -> the build list last fetched for it
  // The timestamp of the activity entry that was clicked.
  //
  // Marked in the feed because there are clicks that change nothing else: every
  // preview of one repository shares a project row, so an entry naming the build
  // already showing leaves the page identical. Without a mark, those clicks are
  // indistinguishable from a dead button — which is how they were reported.
  //
  // Keyed on the timestamp, which is unique per entry, rather than on preview and
  // commit. An attempt that is still running has two entries — queued and building
  // — and keying on the attempt marked both, so clicking between them changed
  // nothing again. One entry marked means every click moves the mark.
  evPick: null,
  follow: true,
  tall: false,
  autoScrolling: false,
  shownOnce: null,      // a just-minted secret, rendered once and then dropped
  buffer: "",         // rendered log html, so a redraw need not replay the stream
  previews: [],
  events: [],
  status: {},
  logSource: null,
  logFor: null,       // preview id the open stream belongs to
  // The preview timestamp a reconnect was last done for, so it happens once per transition.
  // See updateBody.
  reconnectedAt: null,
};
