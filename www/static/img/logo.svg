<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="docpreview">
  <title>docpreview</title>
  <!--
    A page produced by a branch, and it came out green.

    Three shapes and nothing else, because this has to survive being a 16px favicon:
    the badge silhouette, a white page, a green node. The fold and the text lines
    disappear at that size and the mark still reads, which is the whole test — the
    Docusaurus dragon failed it by being a dragon.

    Colours are the theme's own (--nf-color-tertiary, -primary, -secondary), so the
    icon belongs to the same family as the site around it. The green is deliberately
    the green the dashboard already uses for a build that is ready.
  -->
  <defs>
    <linearGradient id="dp-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#035CE6"/>
      <stop offset="1" stop-color="#77C2FC"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#dp-badge)"/>

  <!-- The page, top-right corner turned back. The fold is a second shape over the
       first rather than a cut-out, because a cut-out shows the gradient through it
       and reads as a hole at small sizes. -->
  <path fill="#fff"
        d="M16 15.5A3.5 3.5 0 0 1 19.5 12H35l13 13v23.5a3.5 3.5 0 0 1-3.5 3.5h-25A3.5 3.5 0 0 1 16 48.5z"/>
  <path fill="#035CE6" fill-opacity=".22" d="M35 12l13 13H35z"/>

  <!-- Two lines of text: present when the mark is large, invisibly small when it is
       not, harmful never. -->
  <rect x="22" y="30" width="17" height="3.2" rx="1.6" fill="#035CE6" fill-opacity=".5"/>
  <rect x="22" y="37" width="11" height="3.2" rx="1.6" fill="#035CE6" fill-opacity=".3"/>

  <!-- The build node, ringed in the badge colour so it sits above the page rather
       than being printed on it. -->
  <circle cx="46" cy="46" r="11" fill="url(#dp-badge)"/>
  <circle cx="46" cy="46" r="7.5" fill="#4EDB3F"/>
</svg>
